FXT+='<h2 id="t-fl">Onglet FL Studio</h2>'+
'<h3 id="f-fl1">Prise en main</h3><p>Rôle des fenêtres, patterns et mixeur : manuel en ligne d’Image-Line.</p>'+SRC([['https://www.image-line.com/support/flstudio_online_manual/html/basics_workflow.htm','Image-Line : FL Studio basics, workflow']])+
'<h3 id="f-fl2">Channel Rack et mixeur</h3><p>Step Sequencer, pas, routage : manuel d’Image-Line.</p>'+SRC([['https://www.image-line.com/support/flstudio_online_manual/html/channelrack.htm','Image-Line : Channel Rack']])+
'<h3 id="f-fl3">Organiser un projet</h3><p>Couleur, regroupement, automation : MusicTech. Les conseils de nommage et de routage sont présentés comme une méthode, pas comme une règle officielle.</p>'+SRC([['https://www.musictech.net/tutorials/fl-studio-playlist-organisation/','MusicTech : organiser sa Playlist FL Studio']]);

/* ---------- MIXAGE & MASTERING ---------- */
var F_MX1=FD('f-mx1','Mixage : les outils'), F_MX2=FD('f-mx2','Mixage : niveaux et enregistrement'), F_MX3=FD('f-mx3','Mastering et plateformes');
TL('m41','Les outils du mixage',F_MX1,[
 ['Niveaux et panoramique','Selon iZotope, le réglage des <b>niveaux</b> consiste à monter ou baisser les éléments pour qu’ils sonnent de façon cohérente ; plus un élément est fort, plus il attire l’attention. Le <b>panoramique</b> est le placement horizontal (gauche/droite) des sons : il évite que des instruments dans la même zone de fréquences se masquent.'],
 ['Égaliseur, compresseur, espace','L’<b>égaliseur</b> renforce ou coupe des fréquences : c’est « le moyen le plus simple de façonner les pistes pour qu’elles s’emboîtent ». La <b>compression</b> fait partie des dynamiques, définies comme des processeurs qui changent le volume d’un son au fil du temps. La <b>réverbération</b> et le <b>delay</b> ajoutent de la profondeur et de l’espace.']],[
 ['Panoramique','À quoi sert le panoramique ?',['À placer les sons à gauche ou à droite','À changer le tempo','À accorder les instruments'],'iZotope : horizontal placement.'],
 ['Égaliseur','Que fait un égaliseur ?',['Il renforce ou coupe des fréquences','Il ajoute de la réverbération','Il enregistre la voix'],'Boost or cut specific frequencies.'],
 ['Réverb','Que créent la réverbération et le delay ?',['De la profondeur et de l’espace','Du bruit blanc','De la compression'],'Depth and space.'],
 ['Compression','La compression change…',['Le volume d’un son au fil du temps','La hauteur du son','Le nombre de pistes'],'Audio dynamics.']]);
TL('m42','Niveaux d’enregistrement',F_MX2,[
 ['Écrêtage et marge','D’après MusicRadar, l’<b>écrêtage numérique</b> se produit quand un signal tente de dépasser le niveau maximum (0 dBFS) : tout ce qui dépasse est tronqué, ce qui crée de la distorsion. La <b>marge</b> (headroom) est l’espace laissé sous ce maximum. Règle empirique citée : niveau moyen autour de <b>−18 dBFS</b>, avec des crêtes ne dépassant pas <b>−6 dBFS</b>.'],
 ['24 bits et master','L’enregistrement en 24 bits permet de garder des niveaux d’entrée bas tout en gardant une bonne précision. L’article insiste : « Do not, under any circumstances, let the master channel peak » (ne jamais laisser le canal master saturer) ; on garde quelques décibels de marge et on réserve la limitation au mastering. Amplifier plus tard un signal faible amplifie aussi son bruit.']],[
 ['0 dBFS','Que se passe-t-il au-delà de 0 dBFS ?',['Le signal est tronqué et distord','Le son devient plus clair','Rien'],'Digital clipping.'],
 ['Règle','Quelle règle empirique MusicRadar cite-t-il ?',['Moyenne autour de −18 dBFS, crêtes sous −6 dBFS','Toujours au maximum','Moyenne à 0 dBFS'],'Rule of thumb.'],
 ['Master','Que faut-il éviter sur le canal master ?',['Qu’il sature','Qu’il ait de la marge','Qu’il soit stéréo'],'Do not let the master peak.'],
 ['Bruit','Pourquoi enregistrer un signal trop faible pose-t-il problème ?',['L’amplifier plus tard amplifie aussi le bruit','Il est trop aigu','Il change de tonalité'],'Le rapport signal/bruit baisse.']]);
TL('m43','Mastering',F_MX3,[
 ['La dernière étape','D’après iZotope, le mastering est « la dernière étape de la production audio » : on peaufine un mixage terminé et on le prépare à la diffusion. Le mixage vient avant, en équilibrant les pistes ; le mastering écoute <b>l’ensemble en stéréo</b> pour affiner le résultat.'],
 ['Ce qu’il fait','Il règle le niveau sonore, façonne l’équilibre tonal avec l’égalisation, cherche une <b>écoute cohérente sur tout un album</b>, retire clics et bruits parasites et prépare le son pour des formats comme le vinyle, le streaming ou la radio.']],[
 ['Ordre','Qu’est-ce qui vient en premier ?',['Le mixage','Le mastering','Les deux en même temps'],'Mixing at the start of post-production.'],
 ['Mastering','Le mastering écoute…',['L’ensemble du morceau en stéréo','Chaque piste séparément','Seulement la voix'],'Stereo mixdown.'],
 ['Album','Que vise-t-il pour un album ?',['Une écoute cohérente','Des morceaux de durées égales','Un tempo unique'],'Consistent listening experience.'],
 ['Formats','Le mastering prépare aussi…',['Le son pour le streaming, le vinyle ou la radio','Les paroles','Le clavier'],'Distribution prep.']]);
TL('m44','Plateformes de diffusion',F_MX3,[
 ['Spotify : −14 LUFS','Selon le support de Spotify, la plateforme normalise le volume à <b>−14 dB LUFS</b> (norme ITU 1770). Les morceaux plus forts sont baissés sans distorsion ajoutée. Les morceaux plus faibles sont remontés, mais Spotify laisse 1 dB de marge pour les formats compressés : un morceau à −20 LUFS avec un pic réel à −5 dBFS est remonté seulement à −16 LUFS.'],
 ['Pic réel','Spotify recommande de garder le <b>pic réel</b> (true peak) sous −1 dB TP pour les formats avec perte. Si le master est plus fort que −14 LUFS, il faut garder le pic réel sous −2 dB.']],[
 ['Cible','Quelle valeur Spotify utilise-t-il pour normaliser ?',['−14 dB LUFS','0 dBFS','−30 LUFS'],'Spotify.'],
 ['Fort','Que devient un morceau plus fort que la cible ?',['Il est baissé sans distorsion ajoutée','Il est refusé','Il est accéléré'],'Negative gain.'],
 ['True peak','Pic réel recommandé pour les formats avec perte ?',['Sous −1 dB TP','Au-dessus de 0 dB','Peu importe'],'−1 dB TP max.'],
 ['Plus fort','Si le master est plus fort que −14 LUFS, le pic réel doit rester…',['Sous −2 dB','Sous +3 dB','À 0 dB'],'Spotify : −2 dB.']]);
A('mxc1','Atelier : niveaux d’enregistrement',[CI(F_MX2,'Niveaux d’enregistrement','Applique les repères de la fiche.'),
 CH('Le niveau moyen',F_MX2,'Quel est le <b>niveau moyen</b> conseillé comme règle empirique par MusicRadar ?',['−18 dBFS','0 dBFS','−1 dBFS'],[0],'Règle empirique.'),
 CH('Les crêtes',F_MX2,'Quel est le niveau <b>maximal des crêtes</b> de cette règle ?',['−6 dBFS','+6 dBFS','0 dBFS'],[0],'Peaks no higher than −6 dBFS.'),
 CH('Bons réflexes',F_MX2,'Coche les <b>bons réflexes</b> d’enregistrement :',['Garder de la marge','Laisser le master saturer','Éviter de dépasser 0 dBFS','Monter un signal faible après coup'],[0,2],'Voir la fiche.',true)]);
A('mxc2','Atelier : ta chaîne de mix',[CI(F_MX1,'Ta chaîne de mix','Associe chaque besoin à l’outil indiqué dans la fiche.'),
 CH('Placer un instrument',F_MX1,'Tu veux placer une guitare à <b>gauche</b> dans l’image stéréo. Quel outil ?',['Panoramique','Égaliseur','Compression'],[0],'Placement horizontal.'),
 CH('Couper des fréquences',F_MX1,'Tu veux <b>couper</b> des fréquences gênantes. Quel outil ?',['Égaliseur','Panoramique','Réverbération'],[0],'Boost or cut.'),
 CH('Ajouter de l’espace',F_MX1,'Tu veux ajouter de la <b>profondeur</b>. Quels effets ?',['Réverbération','Delay','Panoramique','Égaliseur'],[0,1],'Depth and space.',true)]);
A('mxc3','Atelier : ton master pour Spotify',[CI(F_MX3,'Ton master pour Spotify','Choisis les valeurs données par le support de Spotify.'),
 CH('Cible de volume',F_MX3,'Quelle est la cible de normalisation de Spotify ?',['−14 LUFS','−6 LUFS','−23 LUFS'],[0],'Spotify support.'),
 CH('Pic réel',F_MX3,'Ton master est <b>plus fort que −14 LUFS</b>. Où garder le pic réel ?',['Sous −2 dB TP','Sous −1 dB TP seulement','À 0 dB TP'],[0],'Voir la fiche.')]);

FXT+='<h2 id="t-mixage">Onglet Mixage et mastering</h2>'+
'<h3 id="f-mx1">Les outils du mixage</h3><p>Niveaux, panoramique, égalisation, compression, réverbération : iZotope, « How to mix music ».</p>'+SRC([['https://www.izotope.com/en/learn/how-to-mix-music','iZotope : how to mix music']])+
'<h3 id="f-mx2">Niveaux et enregistrement</h3><p>Écrêtage, marge, −18 dBFS et −6 dBFS : MusicRadar, guide de la marge et des niveaux.</p>'+SRC([['https://www.musicradar.com/news/beginners-guide-headroom-levels','MusicRadar : beginner’s guide to headroom and levels']])+
'<h3 id="f-mx3">Mastering et plateformes</h3><p>Définition du mastering : iZotope. Normalisation à −14 LUFS et pic réel : support Spotify pour les artistes. D’autres plateformes ont d’autres cibles : vérifie leur documentation.</p>'+SRC([['https://www.izotope.com/learn/what-is-mastering','iZotope : what is mastering'],['https://support.spotify.com/artists/article/loudness-normalization/','Spotify : loudness normalization']]);

/* ---------- SYNTHÉ ---------- */
var F_SY1=FD('f-sy1','Synthé : anatomie'), F_SY2=FD('f-sy2','Synthé : tes instruments');
TL('s11','Oscillateur et filtre',F_SY1,[
 ['Soustraire des fréquences','Dans la synthèse soustractive, selon Roland, « les sons sont créés en soustrayant des fréquences indésirables » : on part d’un son riche et on en enlève. L’<b>oscillateur</b> génère le signal répétitif dans une forme d’onde choisie. <b>Sinus</b> : lisse et doux. <b>Dent de scie</b> : brillant et bourdonnant, bon pour basses et leads. <b>Carré</b> : creux et nasal. <b>Triangle</b> : entre le carré et le sinus.'],
 ['Le filtre','Le <b>filtre</b> façonne le son en retirant des fréquences. <b>Passe-bas</b> : laisse passer les graves et coupe les aigus. <b>Passe-haut</b> : l’inverse. La <b>fréquence de coupure</b> fixe où le filtrage commence ; la <b>pente</b> se mesure en dB par octave ; la <b>résonance</b> renforce les fréquences autour de la coupure.']],[
 ['Dent de scie','Quelle forme d’onde est brillante et bourdonnante ?',['La dent de scie','Le sinus','Aucune'],'Roland : sawtooth.'],
 ['Passe-bas','Un filtre passe-bas…',['Laisse passer les graves et coupe les aigus','Coupe les graves','Ajoute de la réverbération'],'Low-pass.'],
 ['Coupure','Que fixe la fréquence de coupure ?',['Où le filtrage commence','Le tempo','Le nombre de notes'],'Cutoff.'],
 ['Résonance','Que fait la résonance ?',['Elle renforce les fréquences près de la coupure','Elle supprime les harmoniques','Elle accorde le synthé'],'Resonance boosts near cutoff.']]);
TL('s12','Enveloppe et LFO',F_SY1,[
 ['ADSR','L’<b>enveloppe</b> contrôle l’évolution du son dans le temps : <b>A</b>ttack, <b>D</b>ecay, <b>S</b>ustain, <b>R</b>elease. Elle s’applique surtout au volume, mais aussi au filtre ou à la hauteur. Une batterie a une attaque rapide, peu de sustain et un release court ; un violon a une attaque plus lente, un long sustain et une extinction progressive.'],
 ['LFO','Un <b>LFO</b> est un oscillateur si lent qu’on ne l’entend pas : il module d’autres paramètres au lieu de créer une note. Sa <b>vitesse</b> (rate) fixe sa fréquence, sa <b>profondeur</b> (depth) son effet. Cibles courantes : hauteur (vibrato), volume (trémolo), coupure du filtre (wah, wobble).']],[
 ['ADSR','Que signifie le A d’ADSR ?',['Attack','Amplitude','Arpège'],'Attack, Decay, Sustain, Release.'],
 ['Batterie','Quelle enveloppe pour un son de batterie ?',['Attaque rapide, peu de sustain, release court','Attaque lente, long sustain','Aucune enveloppe'],'Roland.'],
 ['LFO','Qu’est-ce qu’un LFO ?',['Un oscillateur lent qui module des paramètres','Un filtre passe-haut','Un type d’effet de réverbération'],'Low frequency oscillator.'],
 ['Vibrato','Un LFO sur la hauteur donne…',['Un vibrato','Un trémolo','Un écho'],'Pitch = vibrato ; volume = trémolo.']]);
TL('s21','Surge XT',F_SY2,[
 ['Un synthé libre','Selon son manuel, Surge XT est un synthétiseur hybride libre et open source, publié à l’origine comme « Surge » par Claes Johanson en septembre 2018 et maintenu depuis par le Surge Synth Team.'],
 ['Sa structure','Chaque patch contient <b>deux scènes (A et B)</b> et une section d’effets. Chaque scène a <b>trois oscillateurs</b>, plus un oscillateur de bruit, et <b>deux filtres</b>. Les enveloppes de filtre et d’amplitude ont des étages ADSR. Surge XT compte <b>12 LFO</b> au total et 16 unités d’effets : tu retrouves les modules de la leçon précédente.']],[
 ['Scènes','Combien de scènes par patch ?',['Deux (A et B)','Une','Quatre'],'Manuel Surge XT.'],
 ['Oscillateurs','Combien d’oscillateurs par scène ?',['Trois','Un','Douze'],'Plus un oscillateur de bruit.'],
 ['LFO','Combien de LFO au total ?',['12','2','16'],'Six LFO de voix et six de scène.'],
 ['Licence','Surge XT est…',['Libre et open source','Payant uniquement','Disponible seulement sur matériel'],'Manuel Surge XT.']]);
TL('s22','Helm',F_SY2,[
 ['Un synthé polyphonique','D’après son dépôt, Helm (de Matt Tytel) est « un synthé polyphonique libre avec beaucoup de modulation », sous licence GPL-3.0. Il fonctionne comme programme autonome et comme plugin LV2, VST, AU ou AAX.'],
 ['Ses modules','Il propose 32 voix de polyphonie, deux oscillateurs avec modulation croisée et jusqu’à 15 oscillateurs en unisson chacun, un filtre 12 ou 24 dB passe-bas/bande/passe-haut, un séquenceur pas à pas, un arpégiateur simple et des effets (filtre à formants, stutter, delay, distorsion, réverbération). Le dépôt est archivé depuis le 8 février 2025 et en lecture seule.']],[
 ['Polyphonie','Combien de voix de polyphonie pour Helm ?',['32','4','128'],'32 voice polyphony.'],
 ['Oscillateurs','Combien d’oscillateurs en unisson au maximum ?',['15 par oscillateur','3','1'],'Up to 15 unison oscillators each.'],
 ['Licence','Quelle licence ?',['GPL-3.0','Propriétaire','Aucune'],'Dépôt GitHub.'],
 ['Statut','Quel est le statut du dépôt ?',['Archivé, en lecture seule','En développement actif','Supprimé'],'Archived on Feb 8, 2025.']]);
TL('s23','TyrellN6',F_SY2,[
 ['Un synthé u-he','Selon son guide d’utilisation, TyrellN6 est développé par u-he : Urs Heckmann a conçu les concepts et le code, le concept Tyrell vient de Peter Grandl et Mic Irmer. Il est né d’un projet de synthé matériel du magazine Amazona, dont les lecteurs avaient façonné la liste des fonctions ; quand une collaboration avec Behringer a calé, Amazona a demandé une version logicielle à u-he.'],
 ['Sa structure','<b>Deux oscillateurs</b> principaux, plus un sous-oscillateur une octave sous l’OSC 1, un bruit et un modulateur en anneau. Un filtre multimode auto-oscillant (LP/HP et BP, pentes de 12, 24 ou 36 dB/oct). <b>Deux enveloppes</b> à quatre étages, <b>deux LFO</b> identiques, une matrice de modulation à deux emplacements et un chorus (Classic, Dramatic, Ensemble). La polyphonie est fixée à <b>8 voix</b>.']],[
 ['Développeur','Qui développe TyrellN6 ?',['u-he','Behringer','Image-Line'],'Guide d’utilisation.'],
 ['Oscillateurs','Combien d’oscillateurs principaux ?',['Deux','Un','Six'],'Plus un sous-oscillateur, un bruit et un modulateur en anneau.'],
 ['Polyphonie','Quelle est la polyphonie ?',['8 voix, fixe','32 voix','Illimitée'],'« fixed at 8 voices ».'],
 ['Pentes','Quelles pentes de filtre propose-t-il ?',['12, 24 ou 36 dB/oct','Seulement 6 dB/oct','Aucune'],'Selon le guide.']]);
A('syc1','Atelier : crée un son',[CI(F_SY1,'Crée un son','Choisis les réglages qui correspondent aux descriptions de Roland.'),
 CH('Une basse brillante',F_SY1,'Tu veux un son <b>brillant et bourdonnant</b> pour une basse ou un lead. Quelle forme d’onde ?',['Sinus','Dent de scie','Triangle'],[1],'Sawtooth.'),
 CH('Adoucir',F_SY1,'Tu veux <b>couper les aigus</b> pour adoucir le son. Quel filtre ?',['Passe-bas','Passe-haut'],[0],'Low-pass.'),
 CH('Un son de batterie',F_SY1,'Quelle enveloppe pour un son de <b>batterie</b> ?',['Attaque rapide, peu de sustain, release court','Attaque lente, long sustain'],[0],'Roland.'),
 CH('Le wobble',F_SY1,'Tu veux un <b>wobble</b>. Que module ton LFO ?',['La coupure du filtre','Rien'],[0],'Wah ou wobble.')]);
A('syc2','Atelier : ta mélodie de synthé',[CI(F_SY1,'Ta mélodie de synthé','Compose une courte mélodie à jouer avec ta forme d’onde préférée.'),NOTESB('Un motif',F_SY1,gPent({min:4,max:6,ends:true,brief:'Compose un motif de <b>4 à 6 notes</b> dans la <b>pentatonique mineure de %R</b>.'}))]);

var F_CH1=FD('f-ch1','Chant : types de voix'), F_CH2=FD('f-ch2','Chant : santé vocale'), F_CH3=FD('f-ch3','Chant : cris et voix extrêmes');
TL('c11','Types de voix',F_CH1,[
 ['Les catégories','D’après Lumen Learning (cours d’appréciation musicale), les femmes sont généralement réparties en trois groupes : <b>soprano, mezzo-soprano et contralto</b> ; les hommes en quatre : <b>contre-ténor, ténor, baryton et basse</b>. Dans un chœur SATB : soprano (voix aiguë), alto (voix féminine grave), ténor (voix masculine aiguë adulte), basse (voix masculine grave adulte).'],
 ['La tessiture','Les tessitures sont regroupées en types qui se chevauchent et couvrent chacun environ <b>deux octaves</b>. Le cours donne notamment : soprano à partir du Do central sur environ deux octaves ; mezzo-soprano à partir du La sous le Do central ; alto à partir du Fa sous le Do central. Les valeurs exactes varient selon les sources : le meilleur repère reste de tester ta voix avec un clavier.']],[
 ['SATB','Que signifie le T de SATB ?',['Ténor','Triangle','Tonique'],'Soprano, alto, ténor, basse.'],
 ['Hommes','Combien de groupes pour les voix d’hommes, selon le cours ?',['Quatre','Deux','Six'],'Contre-ténor, ténor, baryton, basse.'],
 ['Étendue','Quelle est l’étendue approximative de chaque type de voix ?',['Environ deux octaves','Une seule note','Dix octaves'],'Overlapping types, about two octaves.'],
 ['Soprano','Un soprano commence…',['Au Do central, sur environ deux octaves','Au La grave sous le piano','À l’aigu extrême'],'Selon le cours.']]);
TL('c21','Prendre soin de sa voix',F_CH2,[
 ['Les conseils du Mount Sinai','Le centre voix du Mount Sinai recommande : boire <b>2 à 4 litres d’eau par jour</b> ; s’échauffer et récupérer avec des exercices comme les « resonant humming » et les trilles ; faire de courtes pauses vocales de <b>15 à 30 minutes</b> pendant un usage intense ; dormir 7 à 8 heures par nuit.'],
 ['À éviter','Limiter les cris, les cris excessifs et les longues conversations ; réduire le raclement de gorge et la toux ; éviter les lieux bruyants. Quand on est malade, parler ou chanter augmente le risque de blessure : consulter l’équipe voix. Certains médicaments (antihistaminiques) peuvent assécher les cordes vocales.']],[
 ['Eau','Combien d’eau par jour recommande le Mount Sinai ?',['2 à 4 litres','Un verre','10 litres'],'Pour une santé vocale optimale.'],
 ['Pause','Quelle durée de pause vocale pendant un usage intense ?',['15 à 30 minutes','Aucune','Une semaine'],'Short vocal rests.'],
 ['Sommeil','Combien d’heures de sommeil ?',['7 à 8','2 à 3','12'],'Sleep.'],
 ['Maladie','Quand on est malade, il faut…',['Consulter, car voix et maladie augmentent le risque de blessure','Chanter plus fort','Éviter toute eau'],'Voicing while ill raises the risk.']]);
TL('c31','Cris et voix saturées',F_CH3,[
 ['Une étude sur le deathcore','En 2024, des chercheurs de l’Université de l’Utah ont étudié le chanteur de deathcore Will Ramos (Lorna Shore) avec des enregistrements de haute qualité, une caméra interne, l’électromyographie et l’IRM dynamique. Les vibrations concernent les cordes vocales et des structures cartilagineuses qui, normalement, s’ouvrent pour respirer et se ferment pour émettre un son.'],
 ['Ce qu’on peut dire (et pas)','Dans cette étude, la santé vocale du chanteur a été jugée « fantastique » par les scientifiques présents et confirmée par l’IRM ; il a estimé sa fatigue vocale à « peut-être 2 » sur 10. Il s’agit d’<b>un seul chanteur</b> : on ne peut pas en conclure qu’une technique est sans risque pour tout le monde. Pour t’y mettre, vois un professeur de chant et arrête-toi si tu as mal ou si ta voix s’enroue (voir la leçon sur la santé vocale).']],[
 ['Étude','Qui a mené l’étude citée ?',['Des chercheurs de l’Université de l’Utah','Un fabricant de micros','Une école de batterie'],'Université de l’Utah.'],
 ['Méthodes','Quelle technique d’imagerie a été utilisée ?',['L’IRM dynamique','La radiographie classique','Le sonar'],'Dynamic MRI.'],
 ['Limites','Que peut-on conclure d’une étude sur un seul chanteur ?',['Rien de général sur la sécurité pour tous','Que tout le monde peut crier','Que l’eau est inutile'],'Un seul cas.'],
 ['Conseil','Que faire avant de pratiquer des cris ?',['Voir un professeur de chant et s’arrêter en cas de douleur','Crier fort tout de suite','Ne pas s’échauffer'],'Prudence.']]);
A('chc1','Atelier : ta tessiture',[CI(F_CH1,'Ta tessiture','Applique ce que dit la fiche sur les types de voix.'),
 CH('Les quatre voix du chœur',F_CH1,'Coche les <b>quatre voix</b> du chœur SATB :',['Soprano','Alto','Ténor','Basse','Baryton'],[0,1,2,3],'Soprano, alto, ténor, basse.',true),
 CH('Voix d’hommes',F_CH1,'Coche les <b>voix d’hommes</b> citées par le cours :',['Contre-ténor','Ténor','Baryton','Basse','Mezzo-soprano'],[0,1,2,3],'Quatre groupes.',true)]);
A('chc2','Atelier : ta routine vocale',[CI(F_CH2,'Ta routine vocale','Compose une routine qui respecte les conseils du Mount Sinai.'),
 CH('Les bonnes habitudes',F_CH2,'Coche les habitudes <b>recommandées</b> :',['Boire 2 à 4 litres d’eau par jour','Dormir 7 à 8 heures','Racler la gorge souvent','Courtes pauses vocales de 15 à 30 minutes','Crier sans limite'],[0,1,3],'Voir la fiche.',true)]);

FXT+='<h2 id="t-chant">Onglet Chant</h2>'+
'<h3 id="f-ch1">Types de voix</h3><p>Catégories et étendues : Lumen Learning, cours d’appréciation musicale. Les chiffres de tessiture diffèrent d’une source à l’autre.</p>'+SRC([['https://courses.lumenlearning.com/suny-musicappreciationtheory/chapter/introduction/','Lumen Learning : vocal types and ranges']])+
'<h3 id="f-ch2">Santé vocale</h3><p>Conseils d’hygiène vocale : Mount Sinai, Grabscheid Voice and Swallowing Center.</p>'+SRC([['https://www.mountsinai.org/locations/grabscheid-voice-swallowing-center/our-services/professional-performance-voice-care/tips','Mount Sinai : tips for caring for your voice']])+

var F_JE1=FD('f-je1','Jembé : l’instrument'), F_JE2=FD('f-je2','Jembé : les trois sons');
TL('j11','Un tambour d’Afrique de l’Ouest',F_JE1,[
 ['Origine','Selon le wiki de l’Université de Colombie-Britannique, le jembé vient du peuple <b>malinké</b> d’Afrique de l’Ouest. Son nom, en bambara, signifie « tout le monde se rassemble ». La date exacte d’origine est incertaine, faute de traces écrites.'],
 ['Fabrication','Le fût est sculpté dans du bois dur ; les Malinké utilisaient traditionnellement le bois de Lengel, spirituellement important. La peau est de la chèvre, tendue par des anneaux et des cordes. Une tension inégale produit des sons indésirables.']],[
 ['Peuple','De quel peuple le jembé vient-il ?',['Les Malinké','Les Vikings','Les Incas'],'UBC.'],
 ['Nom','Que signifie son nom en bambara ?',['Tout le monde se rassemble','Tambour sacré','Rythme rapide'],'D’après la source.'],
 ['Peau','De quoi est faite la peau ?',['De chèvre','De nylon','De métal'],'Goatskin.'],
 ['Date','Peut-on dater précisément son origine ?',['Non, elle est incertaine','Oui, en 1900','Oui, en 1500'],'Peu de traces écrites.']]);
TL('j21','Basse, ton et slap',F_JE2,[
 ['Trois sons de base','La <b>basse</b> se joue avec la paume et les doigts à plat, au centre de la peau : un son grave (environ 65–80 Hz selon la source). Le <b>ton</b> se joue près du bord, doigts serrés, sans la paume : un son médium-aigu (environ 300–420 Hz selon la taille). Le <b>slap</b> se joue au centre avec une partie de la paume, doigts écartés et relâchés : un son aigu (environ 700–1000 Hz).'],
 ['Les combiner','Les joueurs expérimentés combinent ces trois sons pour créer des rythmes complexes. Les rythmes varient selon les occasions (cérémonies, initiations, mariages), et beaucoup viennent des chants, des battements de mains et des danses des femmes, adaptés ensuite au tambour par les hommes.']],[
 ['Basse','Où joue-t-on la basse ?',['Au centre, paume et doigts à plat','Sur le bord, doigts serrés','Sur le fût'],'UBC.'],
 ['Ton','Où joue-t-on le ton ?',['Près du bord, doigts serrés','Au centre avec la paume','Sous le tambour'],'UBC.'],
 ['Slap','Le slap est un son…',['Aigu','Grave','Muet'],'Environ 700–1000 Hz.'],
 ['Origines','D’où viennent beaucoup de rythmes ?',['Des chants, battements de mains et danses des femmes','Des fanfares militaires','Des boîtes à rythmes'],'UBC.']]);
A('jec1','Atelier : ton rythme de jembé',[CI(F_JE2,'Ton rythme de jembé','Exercice didactique : trois lignes (basse, ton, slap) sur 16 pas. Ce n’est pas un rythme traditionnel, mais une façon de t’entraîner à combiner les trois sons.'),
 BEATB('Combine les trois sons',F_JE2,{rows:['Basse','Ton','Slap'],vars:[{brief:'Compose un motif sur <b>16 pas</b> qui combine les <b>trois sons</b>.',cons:[{t:'Une basse sur le pas 1',f:function(s){return s[0][0]}},{t:'Au moins 2 frappes de ton',f:function(s){return cnt(s[1])>=2}},{t:'Au moins 1 slap',f:function(s){return cnt(s[2])>=1}}],hint:'Pose d’abord la basse sur le premier temps, puis ajoute le ton et le slap.',example:[[0,8],[4,12],[14]],exampleText:'basse sur 1 et 9, ton sur 5 et 13, slap sur 15.'}]})]);
A('jec2','Atelier : reconnais les sons',[CI(F_JE1,'Reconnais les sons','Associe chaque geste au bon son.'),
 CH('Le geste de la basse',F_JE2,'Paume et doigts à plat au centre : quel son ?',['Basse','Ton','Slap'],[0],'Voir la fiche.'),
 CH('Le geste du ton',F_JE2,'Près du bord, doigts serrés, sans la paume : quel son ?',['Basse','Ton','Slap'],[1],'Voir la fiche.'),
 CH('Le geste du slap',F_JE2,'Au centre, doigts écartés et relâchés : quel son ?',['Basse','Ton','Slap'],[2],'Voir la fiche.')]);

var F_GM=FD('f-gu4','Guitare : modèles et marques'), F_GX=FD('f-gu5','Guitare : modifier'), F_FP=FD('f-fl4','FL Studio : Piano roll'), F_FM=FD('f-fl5','FL Studio : mixeur et automation'), F_FE=FD('f-fl6','FL Studio : exporter'),

TL('g51','Telecaster et Les Paul',F_GM,[
 ['La première solid body de série','Selon Britannica, la <b>Fender Telecaster</b> est la « première guitare électrique à corps plein produite en série ». Elle est attribuée à Leo Fender ; elle a aussi porté le nom de Broadcaster, ou « Tele ». Le site ne donne pas d’année, faute de source lue pour cela.'],
 ['Gibson Les Paul','D’après Wikipédia, la <b>Gibson Les Paul</b> est vendue dès <b>1952</b> par Gibson. Elle a été conçue par le directeur d’usine John Huis et son équipe, avec l’avis du guitariste Les Paul. Son corps est en acajou massif avec une table en érable sculptée, avec une seule découpe. Elle reçoit au départ deux micros P-90 ; des <b>humbuckers</b> sont ajoutés en 1957. Sa longueur de diapason est de 24,75 pouces (628,65 mm).']],[
 ['Telecaster','Que dit Britannica de la Telecaster ?',['Première guitare électrique à corps plein produite en série','Première guitare acoustique','Première basse'],'Britannica.'],
 ['Année','En quelle année la Les Paul est-elle vendue pour la première fois ?',['1952','1927','1990'],'Wikipédia.'],
 ['Micros','Quels micros la Les Paul avait-elle au départ ?',['Deux P-90','Des humbuckers','Un seul micro piézo'],'Humbuckers ajoutés en 1957.'],
 ['Corps','Comment est construit le corps de la Les Paul ?',['Acajou massif avec table en érable sculptée','Pin creux','Plastique moulé'],'Wikipédia.']]);
TL('g52','Fender et Gibson',F_GM,[
 ['Deux marques','Les trois guitares vues dans cet onglet viennent de deux fabricants : <b>Fender</b> (Stratocaster 1954, Telecaster) et <b>Gibson</b> (Les Paul 1952). Ta propre guitare est une Fender, ce qui te donne un point de comparaison avec la Les Paul.'],
 ['Comparer','Compare ce que les sources disent : la Les Paul a un corps en acajou avec une table en érable sculptée, deux P-90 puis des humbuckers ; la Telecaster est présentée comme la première guitare à corps plein de série. Pour d’autres marques (Ibanez, PRS, etc.), ce site n’a pas encore de source écrite fiable : n’hésite pas à m’en envoyer.']],[
 ['Fabricant','Qui fabrique la Stratocaster ?',['Fender','Gibson','Yamaha'],'Britannica : Leo Fender.'],
 ['Fabricant','Qui fabrique la Les Paul ?',['Gibson','Fender','Martin'],'Wikipédia.'],
 ['Humbuckers','Quand des humbuckers ont-ils été ajoutés à la Les Paul ?',['1957','1952','1954'],'Wikipédia.'],
 ['Limites','Pourquoi ce site ne présente-t-il pas toutes les marques ?',['Il n’a pas encore de source écrite fiable pour les autres','Elles n’existent plus','Elles sont identiques'],'Seules les sources lues sont utilisées.']]);
/* ---------- Guitare : modifier ---------- */
TL('g61','Les modifications courantes',F_GX,[
 ['Pièces et réglages','Selon PMT, parmi les modifications courantes : des <b>mécaniques</b> de remplacement pour améliorer la tenue d’accord ; limer légèrement le <b>sillet</b> pour baisser les cordes (action et justesse) ; régler l’<b>intonation</b> en avançant ou reculant les chevalets pour que la guitare soit juste sur tout le manche ; frotter de la <b>mine de crayon</b> dans les encoches du sillet pour que les cordes glissent ; changer le <b>diamètre des cordes</b> (plus fines ou plus grosses) selon son jeu.'],
 ['Électronique et confort','Autres idées citées : remplacer les <b>micros</b> (humbuckers, micros actifs), poser un <b>blindage</b> en ruban métallique (foil tape) dans la cavité pour réduire le bruit, des <b>straplocks</b> pour tenir la sangle, changer le <b>pickguard</b>, remplacer un vibrato inutilisé par un chevalet fixe pour plus de résonance, ou diviser un humbucker (<i>coil splitting</i>), idéalement fait par un technicien.']],[
 ['Mécaniques','À quoi servent des mécaniques de remplacement ?',['À améliorer la tenue d’accord','À changer la couleur','À augmenter le volume'],'PMT.'],
 ['Graphite','Que fait la mine de crayon dans les encoches du sillet ?',['Les cordes glissent mieux et l’accord tient','Elle colore le manche','Elle remplace les cordes'],'PMT.'],
 ['Intonation','Comment règle-t-on l’intonation ?',['En avançant ou reculant les chevalets','En changeant le pickguard','En baissant l’ampli'],'PMT.'],
 ['Blindage','Que réduit un blindage en ruban métallique (foil tape) ?',['Le bruit et le bourdonnement','Le poids','Le prix'],'PMT et StewMac.']]);
TL('g62','Mods, réglages et prudence',F_GX,[
 ['Mod ou réglage ?','StewMac distingue les modifications (changer des micros, un manche, des chevalets) des <b>réglages</b> : courbure du manche (relief), <b>action</b> (hauteur des cordes au chevalet) et hauteur des micros (distance entre cordes et pôles). Des outils de réglage permettent de corriger les frisements.'],
 ['Petites interventions','StewMac cite aussi : arrondir les extrémités rugueuses des frettes, nettoyer un contacteur qui grésille avec un nettoyant contact, utiliser un bon jeu de tournevis pour ne pas abîmer les vis. Pour les interventions délicates (comme diviser un humbucker), PMT conseille un technicien, et un <b>réglage professionnel</b> par un luthier pour l’accord, l’intonation et le manche.']],[
 ['Action','Qu’est-ce que l’action ?',['La hauteur des cordes au chevalet','Le volume de l’ampli','Le nombre de frettes'],'StewMac.'],
 ['Relief','Que règle-t-on avec le réglage du manche ?',['Sa courbure (relief)','Sa couleur','Son poids'],'StewMac.'],
 ['Grésillement','Que corrige un nettoyant contact ?',['Un contacteur qui grésille','Une corde cassée','Un sillet usé'],'StewMac.'],
 ['Technicien','Quelle intervention PMT conseille-t-il de confier à un technicien ?',['Diviser un humbucker (coil splitting)','Changer les cordes','Frotter du crayon'],'PMT.']]);
A('gc4','Atelier : reconnais les marques',[CI(F_GM,'Reconnais les marques','Associe chaque fait à la bonne guitare, d’après les sources.'),
 CH('Corps plein de série',F_GM,'Quelle guitare est décrite comme la <b>première guitare électrique à corps plein produite en série</b> ?',['Telecaster','Les Paul','Stratocaster'],[0],'Britannica.'),
 CH('Table en érable',F_GM,'Quelle guitare a un corps en <b>acajou avec une table en érable sculptée</b> ?',['Telecaster','Les Paul','Stratocaster'],[1],'Wikipédia.'),
 CH('Vrai ou faux',F_GM,'Coche les affirmations <b>vraies</b> :',['La Les Paul est sortie en 1952','La Stratocaster date de 1954','La Les Paul a toujours eu des humbuckers','Leo Fender a créé la Stratocaster'],[0,1,3],'Voir la fiche.',true)]);
A('gc5','Atelier : choisis ta modification',[CI(F_GX,'Choisis ta modification','Pour chaque objectif, choisis l’intervention citée par les sources.'),

/* ---------- FL Studio ---------- */
TL('fl31','Le Piano roll',F_FP,[
 ['Une grille notes × temps','Selon le manuel d’Image-Line, dans le Piano roll « la hauteur est sur l’axe vertical et le temps sur l’axe horizontal ». Il envoie les notes et l’automation à l’instrument du Channel. Outils principaux : <b>Draw</b> (P) ajoute et déplace une note ; <b>Paint</b> (B) peint plusieurs notes, utile pour construire des accords ; <b>Delete</b> (D) ; <b>Select</b> (E) ; <b>Slice</b> (C) coupe des notes ; <b>Mute</b> (T) coupe le son des notes.'],
 ['Snap','Le <b>snap</b> règle la taille des divisions fines de la grille. Maintenir Alt le contourne temporairement. C’est le même principe que la grille de 16 pas du Step Sequencer : une division régulière du temps.']],[
 ['Axes','Que montre l’axe vertical du Piano roll ?',['La hauteur des notes','Le temps','Le volume'],'Manuel Image-Line.'],
 ['Paint','À quoi sert l’outil Paint ?',['À peindre plusieurs notes, par exemple pour des accords','À effacer','À exporter'],'Raccourci B.'],
 ['Snap','Que règle le snap ?',['La taille des divisions de la grille','Le tempo','La tonalité'],'Manuel.'],
 ['Alt','Que fait la touche Alt avec le snap ?',['Elle le contourne temporairement','Elle l’active définitivement','Elle ferme le Piano roll'],'Manuel.']]);
TL('fl32','Gamme, propriétés et notes fantômes',F_FP,[
 ['Surligner une gamme','Un clic droit sur l’icône « Snap to scale » permet de choisir une tonalité et une gamme : les notes de la gamme sont surlignées dans la grille. FL Studio ne cale pas automatiquement les notes sur la gamme à moins que tu les modifies. Tu peux ainsi utiliser les gammes vues dans la Théorie pour composer.'],
 ['Propriétés et ghost notes','Un double-clic sur une note ouvre ses propriétés : panoramique, vélocité, vélocité de relâchement, coupure et résonance du filtre. Les <b>ghost notes</b> montrent les notes des autres Channels du même pattern (blocs pleins) et des patterns qui se chevauchent (blocs vides), pour s’y référer quand tu écris une mélodie.']],[
 ['Gamme','Que fait « Snap to scale » ?',['Il surligne les notes d’une gamme choisie','Il joue la gamme','Il supprime les notes hors gamme'],'Manuel.'],
 ['Auto','FL Studio cale-t-il automatiquement les notes sur la gamme ?',['Non, seulement quand tu les modifies','Oui, toujours','Jamais, c’est impossible'],'Manuel.'],
 ['Vélocité','Où règle-t-on la vélocité d’une note ?',['Dans ses propriétés ou l’Event Editor','Dans le Playlist','Dans l’export'],'Manuel.'],
 ['Ghost','Que montrent les ghost notes ?',['Les notes d’autres Channels ou patterns, en référence','Les notes effacées','Les notes du tempo'],'Manuel.']]);
TL('fl41','Le mixeur en détail',F_FM,[
 ['Pistes et effets','Selon le manuel : il y a <b>500 pistes d’insert</b>, plus une piste « Current » pour des outils comme Edison et Wave Candy. <b>Chaque piste a 10 emplacements d’effets</b>. Le niveau (fader) est appliqué <b>après</b> les effets. Par défaut, l’audio est routé vers la piste <b>Master</b>, « l’endroit normal pour charger des effets de mastering et régler les niveaux finaux avant le rendu ».'],
 ['Sends, solo, mute','Toute piste d’insert peut servir de piste d’envoi (<b>send</b>) via les interrupteurs Send. Par défaut, les sends sont post-fader. Clic gauche : couper/rétablir une piste ; clic droit : solo. Le panoramique place le son dans le champ stéréo.']],[
 ['Pistes','Combien de pistes d’insert dans le mixeur ?',['500','16','8'],'Manuel Image-Line.'],
 ['Emplacements','Combien d’emplacements d’effets par piste ?',['10','2','100'],'Manuel.'],
 ['Fader','Le fader est appliqué…',['Après les effets','Avant les effets','Seulement sur le Master'],'Manuel.'],
 ['Send','Que sert à faire un send ?',['Envoyer l’audio d’une piste vers une autre piste','Exporter en MP3','Changer le tempo'],'Manuel.']]);
TL('fl42','Les clips d’automation',F_FM,[
 ['Faire bouger un réglage','Selon le manuel, les clips d’automation « déplacent (automatisent) des contrôles liés » sur l’interface de FL Studio ou des plugins. Ils peuvent piloter des contrôles natifs, des plugins Image-Line et des plugins VST/AU. Un clip peut alimenter plusieurs contrôles et plusieurs clips peuvent être liés à un seul contrôle.'],
 ['Les créer','Sur un contrôle natif : clic droit, puis « Create automation clip ». Pour un plugin VST/AU : « Last tweaked » du menu Tools, ou via le Browser. Les données apparaissent comme une courbe dans la Playlist. Sans sélection de plage, le clip couvre toute la chanson.']],[
 ['Rôle','À quoi servent les clips d’automation ?',['À faire bouger un réglage dans le temps','À enregistrer la voix','À exporter en WAV'],'Manuel.'],
 ['Création','Comment en créer un sur un contrôle natif ?',['Clic droit puis Create automation clip','Double-clic sur la Playlist','Il faut un plugin payant'],'Manuel.'],
 ['VST','Peut-on automatiser un plugin VST ?',['Oui','Non, jamais','Seulement les plugins natifs'],'VST/AU possibles.'],
 ['Portée','Sans sélection de plage, le clip couvre…',['Toute la chanson','Une seule mesure','Rien'],'Manuel.']]);
TL('fl51','Formats d’export',F_FE,[
 ['Sauver, ce n’est pas exporter','D’après le manuel : le projet <b>.flp</b> se sauve avec File > Save ; l’export audio n’est pas nécessaire pour le reprendre plus tard. Le <b>WAV</b> est « un format sans perte, préféré pour manipuler l’audio en production » (16, 24 ou 32 bits flottants). Le <b>MP3</b> est un format avec perte (320 kbps au maximum) et ajoute un petit silence au début. Le <b>FLAC</b> est sans perte et typiquement 20 à 30 % plus petit que le WAV. L’<b>OGG</b> est avec perte (450 kbps au maximum).'],
 ['Le MIDI','Le <b>MIDI</b> (.mid) contient les notes et l’automation, pas de l’audio : « MIDI is not an audio format ». À exporter seulement pour utiliser les notes dans un autre logiciel.']],[
 ['Projet','Faut-il exporter en audio pour reprendre son projet plus tard ?',['Non, on sauve le projet avec File > Save','Oui, toujours en MP3','Oui, en MIDI'],'Manuel.'],
 ['WAV','Le WAV est…',['Sans perte','Avec perte','Un format de notes'],'Lossless.'],
 ['MIDI','Qu’est-ce que le MIDI ?',['Des notes et de l’automation, pas de l’audio','Un format audio','Un effet'],'Manuel.'],
 ['FLAC','Le FLAC est typiquement…',['20 à 30 % plus petit que le WAV','Deux fois plus gros','Identique à l’MP3'],'Manuel.']]);
TL('fl52','Options de rendu',F_FE,[
 ['Queue et dither','L’option <b>Tail</b> règle les résonances qui dépassent la fin du morceau : « Leave remainder » (par défaut) prolonge le rendu, « Wrap remainder » les ramène au début (boucles sans coupure), « Cut remainder » arrête au dernier repère. Le <b>dithering</b> concerne le WAV 16 bits et le MP3 : il doit être appliqué « une seule fois », au rendu final, et ajoute un léger souffle.'],
 ['Qualité et pistes séparées','L’option de <b>qualité</b> règle la précision (les réglages par défaut sont généralement sûrs ; Sinc est plus lent, à utiliser si tu entends de l’aliasing). « Split mixer tracks » exporte chaque piste du mixeur en WAV séparé (pas de FLAC, MP3 ou OGG).']],[
 ['Dither','Combien de fois appliquer le dithering ?',['Une seule, au rendu final','À chaque piste','Jamais, il est obligatoire'],'Manuel.'],
 ['Tail','Quelle option sert aux boucles sans coupure ?',['Wrap remainder','Cut remainder','Leave remainder'],'Manuel.'],
 ['Split','Quel format pour « Split mixer tracks » ?',['WAV','MP3','OGG'],'Manuel.'],
 ['Qualité','Quand utiliser le réglage Sinc ?',['Si tu entends de l’aliasing','Toujours','Jamais'],'Plus lent.']]);
A('flc3','Atelier : ta mélodie au Piano roll',[CI(F_FP,'Ta mélodie au Piano roll','Compose une mélodie comme tu la poserais dans la grille du Piano roll, dans une gamme choisie.'),NOTESB('Une mélodie',F_FP,gPent({min:4,max:6,ends:true,brief:'Compose une mélodie de <b>4 à 6 notes</b> dans la <b>pentatonique mineure de %R</b>.'})),
 CH('Les outils',F_FP,'Quel outil sert à <b>peindre plusieurs notes</b> pour construire des accords ?',['Paint','Delete','Mute'],[0],'Raccourci B.')]);
A('flc4','Atelier : ton mixeur',[CI(F_FM,'Ton mixeur','Applique les chiffres et règles du manuel.'),
 CH('Emplacements d’effets',F_FM,'Combien d’<b>emplacements d’effets</b> par piste ?',['10','2','500'],[0],'Manuel.'),
 CH('Effets de mastering',F_FM,'Où charge-t-on normalement des effets de mastering ?',['Sur la piste Master','Sur chaque piste d’insert','Dans le Piano roll'],[0],'Manuel.'),
 CH('Clic droit',F_FM,'Quelles actions du manuel sont <b>vraies</b> ?',['Clic gauche : couper une piste','Clic droit : solo','Clic gauche : solo','Clic droit : couper'],[0,1],'Voir la fiche.',true)]);
A('flc5','Atelier : ton export',[CI(F_FE,'Ton export','Choisis le bon format selon l’usage, d’après le manuel.'),
 CH('Production',F_FE,'Quel format le manuel dit-il <b>préféré en production</b> ?',['WAV','MP3','MIDI'],[0],'Lossless.'),
 CH('Notes dans un autre logiciel',F_FE,'Tu veux passer tes notes à un autre logiciel. Quel format ?',['MIDI','WAV','MP3'],[0],'Not an audio format.'),
 CH('Boucle sans coupure',F_FE,'Tu exportes une boucle. Quelle option de queue ?',['Wrap remainder','Cut remainder'],[0],'Manuel.')]);

/* ---------- Mixage ---------- */
TL('m51','Les plages de fréquences',F_MQ,[
 ['De 20 Hz à 20 kHz','Selon Audient : <b>sub-bass 20–60 Hz</b> (on le sent autant qu’on l’entend) ; <b>basses 60–250 Hz</b> (poids et solidité, surtout basse et grosse caisse) ; <b>bas-médiums 250–500 Hz</b> (un excès donne un son « boxy » ; beaucoup de voix y ont leur fondamentale, donc un mix encombré devient boueux) ; <b>médiums 500 Hz–2 kHz</b> (le cœur des notes et des mélodies).'],
 ['Aigus','<b>Médiums aigus 2–4 kHz</b> : consonnes de la voix, attaque de caisse claire et de charleston ; l’oreille y est la plus sensible. <b>Présence 5–6 kHz</b> : définition et brillance, c’est aussi là que se manifeste la sibilance. <b>Brillance/air 6–20 kHz</b> : éclat et aération ; trop d’aigus fatigue.']],[
 ['Sub','Quelle plage correspond au sub-bass (Audient) ?',['20–60 Hz','2–4 kHz','500 Hz–2 kHz'],'Audient.'],
 ['Boxy','Quel excès donne un son « boxy » ?',['Les bas-médiums (250–500 Hz)','Le sub-bass','L’air'],'Audient.'],
 ['Consonnes','Où résident les consonnes de la voix ?',['2–4 kHz','20–60 Hz','10–20 kHz'],'Audient.'],
 ['Sibilance','Dans quelle plage la sibilance se manifeste-t-elle ?',['La présence, 5–6 kHz','Le sub-bass','Les bas-médiums'],'Audient.']]);
TL('m52','Utiliser l’égaliseur',F_MQ,[
 ['Couper pour faire de la place','Audient conseille de garder le sub-bass propre en filtrant (passe-haut) les autres sons qui ne le requièrent pas. Trop de basses peut noyer un mix ; trop peu le rend maigre. Un excès de médiums peut sonner « nasillard » (honky), et trop peu cassant.'],
 ['Une méthode, pas une règle','Les plages de fréquences sont des repères, pas des réglages à copier : chaque source est différente. Écoute le morceau entier et ajuste un peu à la fois. iZotope rappelle que l’égaliseur est « le moyen le plus simple de façonner les pistes pour qu’elles s’emboîtent ».']],[
 ['Passe-haut','Que fait un filtre passe-haut sur une piste ?',['Il retire les graves dont elle n’a pas besoin','Il retire les aigus','Il ajoute de la réverbération'],'Audient.'],
 ['Basses','Que provoque trop peu de basses ?',['Un son maigre','Un son boueux','Rien'],'Audient.'],
 ['Repères','Les plages de fréquences sont…',['Des repères à adapter','Des réglages obligatoires','Valables pour tous les sons de la même façon'],'Chaque source est différente.'],
 ['Rôle','Pourquoi égaliser, selon iZotope ?',['Pour que les pistes s’emboîtent','Pour changer le tempo','Pour compresser'],'iZotope.']]);
TL('m61','Les réglages du compresseur',F_MC,[
 ['Seuil et ratio','Selon FabFilter : le <b>seuil</b> (threshold) est « le niveau au-dessus duquel la réduction de gain commence ». Le <b>ratio</b> règle l’ampleur de cette réduction (rapport entrée/sortie). À 4:1, un signal qui dépasse le seuil de 4 dB ne dépasse plus que de 1 dB en sortie.'],
 ['Attack et release','L’<b>attack</b> détermine la vitesse à laquelle le compresseur réagit au signal d’entrée ; le <b>release</b> détermine la vitesse à laquelle il revient au gain d’origine après la compression.']],[
 ['Seuil','Que définit le seuil ?',['Le niveau au-dessus duquel la réduction commence','Le tempo','La tonalité'],'FabFilter.'],
 ['Ratio','À 4:1, un dépassement de 4 dB donne en sortie…',['1 dB','4 dB','0 dB'],'FabFilter.'],
 ['Attack','Que détermine l’attack ?',['La vitesse de réaction du compresseur','Le volume final','Le panoramique'],'FabFilter.'],
 ['Release','Que détermine le release ?',['La vitesse de retour au gain d’origine','Le tempo','Le nombre de pistes'],'FabFilter.']]);
A('mxc4','Atelier : reconnais les plages',[CI(F_MQ,'Reconnais les plages','Associe chaque caractéristique à sa plage de fréquences (Audient).'),
 CH('Voix et consonnes',F_MQ,'Où se trouvent les <b>consonnes de la voix</b> ?',['2–4 kHz','20–60 Hz','250–500 Hz'],[0],'Audient.'),
 CH('Son boueux',F_MQ,'Où un excès rend-il le son <b>boxy</b> ?',['250–500 Hz','5–6 kHz','20–60 Hz'],[0],'Audient.'),
 CH('Plages vraies',F_MQ,'Coche les associations <b>vraies</b> :',['Basses : 60–250 Hz','Sub-bass : 20–60 Hz','Air : 250–500 Hz','Présence : 5–6 kHz'],[0,1,3],'Voir la fiche.',true)]);
A('mxc5','Atelier : ton compresseur',[CI(F_MC,'Ton compresseur','Calcule avec la définition du ratio : un signal dépasse le seuil de X dB, la sortie dépasse de X divisé par le ratio.'),
 CH('Ratio 4:1',F_MC,'Ratio <b>4:1</b>. Le signal dépasse le seuil de <b>8 dB</b>. De combien dépasse-t-il en sortie ?',['2 dB','4 dB','8 dB'],[0],'8 divisé par 4.'),
 CH('Ratio 2:1',F_MC,'Ratio <b>2:1</b>. Le signal dépasse le seuil de <b>6 dB</b>. De combien dépasse-t-il en sortie ?',['3 dB','2 dB','6 dB'],[0],'6 divisé par 2.'),
 CH('Réglages',F_MC,'Quels réglages sont <b>définis par FabFilter</b> ?',['Threshold','Ratio','Attack','Release'],[0,1,2,3],'Tous.',true)]);

FXT+='<h2 id="t-mixage2">Onglet Mixage et mastering (suite)</h2>'+
'<h3 id="f-mx4">Égalisation</h3><p>Plages de fréquences : Audient, « Frequency ranges explained ». Rôle de l’égaliseur : iZotope.</p>'+SRC([['https://audient.com/tutorial/frequency-ranges-explained/','Audient : frequency ranges explained'],['https://www.izotope.com/en/learn/how-to-mix-music','iZotope : how to mix music']])+

var F_PL=FD('f-fl7','FL Studio : Playlist'), F_ED=FD('f-fl8','FL Studio : Edison'), F_FX=FD('f-fl9','FL Studio : effets natifs'),
 F_SC=FD('f-mx6','Mixage : sidechain'), F_RV=FD('f-mx7','Mixage : réverbération'), F_LM=FD('f-mx8','Mastering : limiteur'), F_RF=FD('f-mx9','Mixage : pistes de référence');

/* ---------- FL Studio : Playlist ---------- */
TL('fl61','Pistes et clips',F_PL,[
 ['Trois types de clips','Selon le manuel d’Image-Line, les pistes de clips de la <b>Playlist</b> peuvent contenir des <b>clips de pattern</b> (notes MIDI et/ou automation d’événements), des <b>clips audio</b> (enregistrements, que tu peux découper, redimensionner et étirer) et des <b>clips d’automation</b>. On peut les superposer.'],
 ['Pistes et mixeur','« Les pistes de clips ne sont pas liées aux pistes du mixeur » : c’est le routage du Channel Rack vers le mixeur qui décide quelles pistes du mixeur jouent. Le « Track Mode » relie un Channel, une piste de Playlist et une piste de mixeur en piste d’instrument ou piste audio ; on peut aussi grouper des pistes pour les couper ou les solo ensemble.']],[
 ['Clips','Quels types de clips la Playlist peut-elle contenir ?',['Pattern, audio et automation','Seulement des patterns','Seulement de l’audio'],'Manuel Image-Line.'],
 ['Audio','Que peut-on faire avec un clip audio ?',['Le découper, le redimensionner et l’étirer','Rien','Seulement le muter'],'Manuel.'],
 ['Liaison','Les pistes de clips sont-elles liées aux pistes du mixeur ?',['Non, c’est le routage du Channel Rack qui décide','Oui, toujours une pour une','Seulement pour l’audio'],'Manuel.'],
 ['Groupes','Que permet le regroupement de pistes ?',['Les couper ou les solo ensemble','Les exporter en MP3','Changer le tempo'],'Manuel.']]);
TL('fl62','Marqueurs, snap et arrangements',F_PL,[
 ['Marqueurs et snap','Les <b>marqueurs de temps</b> (Alt+T) servent à nommer des sections, régler des mesures, poser des points de saut ou sélectionner des zones. Le marqueur « Song loop » définit le point de répétition. Le <b>snap</b> contrôle comment les clips se déplacent et se calent sur la grille ; maintenir Alt le règle temporairement sur « none ».'],
 ['Arrangements','Les <b>arrangements</b> sont des dispositions alternatives des clips, pour gérer des versions d’un projet (cloner, renommer, supprimer, fusionner). Ils partagent le Channel Rack et le mixeur : changer un Channel ou un réglage de mixeur affecte tous les arrangements.']],[
 ['Marqueur','À quoi sert le marqueur « Song loop » ?',['À définir le point de répétition','À exporter','À changer la tonalité'],'Manuel.'],
 ['Alt','Que fait Alt avec le snap dans la Playlist ?',['Il le règle temporairement sur « none »','Il le verrouille','Il supprime la grille'],'Manuel.'],
 ['Arrangements','Que sont les arrangements ?',['Des dispositions alternatives de clips','Des effets','Des plugins'],'Manuel.'],
 ['Partage','Que partagent les arrangements ?',['Le Channel Rack et le mixeur','Les clips','Rien'],'Manuel.']]);
A('flc6','Atelier : ta Playlist',[CI(F_PL,'Ta Playlist','Choisis les bons réflexes selon le manuel.'),
 CH('Clips',F_PL,'Coche les types de clips que la Playlist peut contenir :',['Pattern','Audio','Automation','Partition imprimée'],[0,1,2],'Voir la fiche.',true),
 CH('Versions',F_PL,'Tu veux garder plusieurs versions d’un projet. Que utilises-tu ?',['Les arrangements','Les marqueurs','Le Piano roll'],[0],'Manuel.'),
 CH('Boucle',F_PL,'Quel marqueur définit le point de répétition ?',['Song loop','Une section','Un tempo'],[0],'Manuel.')]);
/* ---------- FL Studio : Edison ---------- */
TL('fl71','Edison : enregistrer et éditer',F_ED,[
 ['Un outil intégré','Selon le manuel, Edison est « un outil d’édition et d’enregistrement audio entièrement intégré ». Il se charge dans un emplacement d’effet du mixeur et peut enregistrer ou lire l’audio à cet endroit. Il travaille en RAM : il est conçu pour des samples ou de petits morceaux, pas pour des heures d’enregistrement.'],
 ['Le charger','Pour <b>éditer</b> : sélectionne une piste de mixeur et presse Ctrl+E (premier emplacement libre). Pour <b>enregistrer</b> : Shift+E, Edison est prêt à enregistrer avec « Record on play » activé. Les éditions convertissent le son en 32 bits flottants. Tu peux envoyer le résultat dans la Playlist ou un Channel sampler.']],[
 ['Rôle','Qu’est-ce qu’Edison ?',['Un outil d’édition et d’enregistrement audio','Un synthétiseur','Un effet de réverbération'],'Manuel.'],
 ['Édition','Quel raccourci charge Edison pour éditer ?',['Ctrl+E','Shift+E','Alt+T'],'Manuel.'],
 ['Enregistrement','Quel raccourci charge Edison prêt à enregistrer ?',['Shift+E','Ctrl+E','Alt+E'],'Manuel.'],
 ['Limites','Edison est conçu pour…',['Des samples ou de petits morceaux','Des heures d’enregistrement','Uniquement du MIDI'],'Il travaille en RAM.']]);
A('flc7','Atelier : ton enregistrement',[CI(F_ED,'Ton enregistrement','Choisis la bonne manipulation, d’après le manuel.'),
 CH('Enregistrer',F_ED,'Tu veux <b>enregistrer</b> un son sur une piste de mixeur. Quel raccourci ?',['Shift+E','Ctrl+E'],[0],'Manuel.'),
 CH('Éditer',F_ED,'Tu veux <b>éditer</b> un son. Quel raccourci ?',['Ctrl+E','Shift+E'],[0],'Manuel.'),
 CH('Bon usage',F_ED,'Edison convient à…',['Un sample ou un petit morceau','Un album entier','Des heures d’audio en direct'],[0],'En RAM.')]);
/* ---------- FL Studio : effets natifs ---------- */
TL('fl81','Fruity Parametric EQ 2',F_FX,[
 ['Un égaliseur à 7 bandes','Selon le manuel, c’est « un égaliseur paramétrique avancé à 7 bandes » ; deux instances sur une même piste donnent 14 bandes. Types de bande : passe-bas, passe-bande, passe-haut, notch, shelf grave, peaking et shelf aigu. Chaque bande a sa fréquence (FREQ), sa largeur (BW) et des interrupteurs mute/solo ; un gain global règle le niveau.'],
 ['Pentes et analyseur','Les filtres ont des pentes de 12, 24, 36 ou 48 dB/octave. Le plugin offre des modes IIR standard et phase linéaire, une option « Band solo on shift » pour trouver une fréquence, et un analyseur de spectre (histogramme et heatmap). Les plages de fréquences vues dans l’unité Égalisation te disent où chercher.']],[
 ['Bandes','Combien de bandes a Fruity Parametric EQ 2 ?',['7','2','31'],'Manuel Image-Line.'],
 ['Deux','Deux instances sur la même piste donnent…',['14 bandes','7 bandes','21 bandes'],'Manuel.'],
 ['Types','Quel type de bande n’existe PAS dans la liste ?',['Compresseur','Notch','Passe-haut'],'Types de filtres uniquement.'],
 ['Solo','À quoi sert « Band solo on shift » ?',['À trouver une fréquence cible','À exporter','À créer une automation'],'Manuel.']]);
TL('fl82','Fruity Limiter',F_FX,[
 ['Trois fonctions en un','Fruity Limiter est un compresseur, limiteur et noise gate à bande unique, avec sidechain. Onglet COMP : <b>Gain</b> (rattrapage après compression), <b>Threshold</b> (niveau au-dessus duquel le signal est compressé), <b>Ratio</b>, <b>Attack</b> et <b>Release</b> : tu connais déjà ces notions grâce à l’unité Compression.'],
 ['Limiteur et sidechain','Onglet LIMIT : le <b>Ceiling</b> « règle le niveau au-dessus duquel le signal est limité ». Le <b>sidechain</b> permet à une autre piste de mixeur de contrôler l’enveloppe de compression. Le noise gate ouvre quand l’entrée dépasse le seuil (Threshold) et se ferme selon le Release.']],[
 ['Fonctions','Quelles fonctions réunit Fruity Limiter ?',['Compresseur, limiteur et noise gate','Réverbération et delay','Synthèse et sampling'],'Manuel.'],
 ['Ceiling','Que règle le Ceiling ?',['Le niveau au-dessus duquel le signal est limité','Le tempo','La tonalité'],'Manuel.'],
 ['Sidechain','Que permet le sidechain ?',['Qu’une autre piste contrôle la compression','De charger un instrument','D’exporter en MP3'],'Manuel.'],
 ['Gate','Quand le noise gate s’ouvre-t-il ?',['Quand l’entrée dépasse le seuil','Quand la piste est mutée','Toujours'],'Manuel.']]);
A('flc8','Atelier : tes effets',[CI(F_FX,'Tes effets','Choisis le bon effet natif pour chaque besoin.'),
 CH('Corriger les fréquences',F_FX,'Tu veux <b>couper ou renforcer des fréquences</b>. Quel plugin natif ?',['Fruity Parametric EQ 2','Fruity Limiter','Edison'],[0],'Manuel.'),
 CH('Limiter les crêtes',F_FX,'Tu veux <b>limiter les crêtes</b>. Quel plugin natif ?',['Fruity Limiter','Fruity Parametric EQ 2','Edison'],[0],'Manuel.'),
 CH('Vrai ou faux',F_FX,'Coche les affirmations <b>vraies</b> :',['Fruity Parametric EQ 2 a 7 bandes','Fruity Limiter a un sidechain','Fruity Limiter est un synthétiseur','Edison est un égaliseur'],[0,1],'Voir la fiche.',true)]);

/* ---------- Mixage ---------- */
TL('m71','La réverbération',F_RV,[
 ['Une ambiance artificielle','Selon LANDR, la réverbération est « la persistance (decay) d’un son qui rebondit sur les surfaces d’un espace acoustique ». En production, c’est un effet qui crée une ambiance artificielle. Le <b>decay time</b> règle la durée de la queue de réverb : plus long pour de grands espaces, plus court pour de petites pièces. Le <b>pre-delay</b> ajoute un court délai avant le début de la réverb, ce qui laisse de la place au son sec.'],
 ['La mettre sur un envoi','Méthode en 4 étapes (LANDR) : créer un envoi et un retour auxiliaire ; insérer la réverb sur le retour avec un mélange à <b>100 % wet</b> ; monter le niveau d’envoi de chaque source voulue ; ajuster les réglages. Cela « permet de mélanger l’effet sans changer le niveau du son non traité ». Dans FL Studio, un envoi se fait avec les interrupteurs Send d’une piste d’insert.']],[
 ['Définition','Qu’est-ce que la réverbération ?',['La persistance d’un son dans un espace','Une compression','Un filtre'],'LANDR.'],
 ['Decay','Que règle le decay time ?',['La durée de la queue de réverb','Le volume','La tonalité'],'LANDR.'],
 ['Pre-delay','Que fait le pre-delay ?',['Il retarde le début de la réverb','Il supprime la réverb','Il change la hauteur'],'LANDR.'],
 ['Retour','Quel mélange régler sur un retour de réverb ?',['100 % wet','0 % wet','50 % wet obligatoire'],'LANDR.']]);
TL('m81','Le sidechain',F_SC,[
 ['Une piste en pilote une autre','Selon iZotope, la compression sidechain est « quand le niveau d’un instrument ou d’un son déclenche un compresseur » qui contrôle un autre son. Le signal de la deuxième piste (le sidechain) alimente l’entrée du compresseur, qui baisse alors le niveau de la première tant que la piste sidechain est active.'],
 ['Kick et basse','Exemple classique : la basse est « sidechainée » sur la grosse caisse, qui baisse le volume de la basse quand la grosse caisse frappe. La basse laisse la place à la grosse caisse, qui a moins de concurrence dans les graves. Autres usages : le ducking (musique qui baisse quand quelqu’un parle), un effet créatif où un piano pulse avant l’entrée de la grosse caisse.']],[
 ['Définition','Que fait la compression sidechain ?',['Un son déclenche le compresseur d’un autre','Elle compresse le master seulement','Elle ajoute de la réverb'],'iZotope.'],
 ['Kick/basse','Dans l’exemple kick/basse, que baisse-t-on ?',['Le volume de la basse','Le volume de la grosse caisse','Le tempo'],'iZotope.'],
 ['But','Pourquoi sidechainer la basse sur la grosse caisse ?',['Pour que la grosse caisse ait moins de concurrence dans les graves','Pour changer de tonalité','Pour accélérer'],'iZotope.'],
 ['Ducking','Comment appelle-t-on aussi cette technique ?',['Un ducker (ducking)','Un limiteur','Un filtre'],'iZotope.']]);
TL('m91','Le limiteur',F_LM,[
 ['Attraper les crêtes','Selon iZotope, un limiteur « attrape les crêtes les plus hautes » d’une source pour qu’elles ne dépassent pas un niveau fixé ; on s’en sert souvent pour augmenter le volume perçu sans écrêtage. Les limiteurs « brickwall » fonctionnent avec des ratios infiniment élevés. Le <b>ceiling</b> est le niveau maximum autorisé : les ingénieurs le placent « typiquement entre −1,0 et −0,1 dBFS ». Avec une commande de <b>threshold</b>, plus on la baisse, plus le son devient fort.'],
 ['En mastering, avec prudence','Le limiteur se place le plus souvent à la toute fin de la chaîne de mastering, traditionnellement avec « pas plus de 2 dB environ » de réduction de gain. Pousser trop fort peut ajouter de la distorsion audible (3 dB ou plus de réduction peut produire de lourds artefacts). Un limiteur ne protège pas toujours de l’écrêtage (pics inter-échantillons) : un mode true-peak peut être utile.']],[
 ['Rôle','Que fait un limiteur ?',['Il attrape les crêtes les plus hautes','Il ajoute de la réverb','Il change la tonalité'],'iZotope.'],
 ['Ceiling','Où place-t-on typiquement le ceiling ?',['Entre −1,0 et −0,1 dBFS','À +3 dBFS','À −20 dBFS'],'iZotope.'],
 ['Place','Où se place le limiteur dans la chaîne de mastering ?',['À la toute fin','Au tout début','Entre deux pistes seulement'],'iZotope.'],
 ['Excès','Que peut provoquer un limiteur poussé trop fort ?',['De la distorsion audible','Un tempo plus lent','Rien'],'iZotope.']]);
TL('m101','Les pistes de référence',F_RF,[
 ['Un morceau professionnel comme repère','Selon iZotope, une piste de référence est « une chanson produite professionnellement par un autre artiste » qui montre comment tu veux que ta musique sonne. Pour comparer : gain-stage ta session, envoie le morceau de référence sur un bus « REFERENCE » et tes pistes sur un bus « MIX », puis passe de l’un à l’autre.'],
 ['Égaliser les niveaux','Il faut <b>ramener le niveau de la référence au niveau de ton mix</b> : un morceau déjà mixé et masterisé sonne plus fort. En mixage, compare l’équilibre des instruments, le volume de la voix, la balance de la basse et de la grosse caisse, les effets. En mastering, compare largeur, dynamique, équilibre tonal et volume. Écoute d’abord ton master seul pour ne pas perdre ce qui rend ta musique unique.']],[
 ['Définition','Qu’est-ce qu’une piste de référence ?',['Un morceau professionnel d’un autre artiste','Un enregistrement de ta voix','Un métronome'],'iZotope.'],
 ['Niveau','Que faut-il faire avant de comparer ?',['Ramener la référence au niveau de ton mix','Monter la référence','Supprimer ton mix'],'iZotope.'],
 ['Comparer','Que compare-t-on en mixage ?',['Équilibre des instruments, voix, basse/grosse caisse, effets','Le prix du logiciel','La couleur de la pochette'],'iZotope.'],
 ['Écoute','Pourquoi écouter d’abord ton master seul ?',['Pour garder ce qui rend ta musique unique','Pour gagner du temps','Pour le limiter'],'iZotope.']]);
A('mxc6','Atelier : ton sidechain',[CI(F_SC,'Ton sidechain','Applique la définition d’iZotope.'),
 CH('Qui déclenche ?',F_SC,'Tu sidechaines la <b>basse sur la grosse caisse</b>. Quel son déclenche le compresseur ?',['La grosse caisse','La basse','Le master'],[0],'iZotope.'),
 CH('Qui baisse ?',F_SC,'Dans ce cas, quel son voit son volume baisser ?',['La basse','La grosse caisse'],[0],'iZotope.'),
 CH('Usages cités',F_SC,'Coche les usages <b>cités par iZotope</b> :',['Ducking de musique sous la voix','Basse sidechainée sur la grosse caisse','Piano qui pulse avant la grosse caisse','Remplacer le limiteur'],[0,1,2],'Voir la fiche.',true)]);
A('mxc7','Atelier : ta réverb',[CI(F_RV,'Ta réverb','Applique la méthode de LANDR.'),
 CH('Petite pièce',F_RV,'Tu veux évoquer une <b>petite pièce</b>. Quel decay time ?',['Plus court','Plus long'],[0],'LANDR.'),
 CH('Sur un retour',F_RV,'Quel mélange sur le <b>retour auxiliaire</b> ?',['100 % wet','0 % wet'],[0],'LANDR.'),
 CH('Les étapes',F_RV,'Coche les étapes de la méthode :',['Créer un envoi et un retour','Insérer la réverb sur le retour','Monter le niveau d’envoi des sources','Mettre la réverb sur le master seulement'],[0,1,2],'Voir la fiche.',true)]);
A('mxc8','Atelier : ton limiteur',[CI(F_LM,'Ton limiteur','Choisis les valeurs indiquées par iZotope.'),
 CH('Le ceiling',F_LM,'Où placer le ceiling (valeurs typiques) ?',['Entre −1,0 et −0,1 dBFS','À +3 dBFS','À −30 dBFS'],[0],'iZotope.'),
 CH('Réduction traditionnelle',F_LM,'En mastering traditionnel, la réduction de gain est…',['D’environ 2 dB au plus','D’au moins 10 dB','De 30 dB'],[0],'iZotope.'),
 CH('Position',F_LM,'Où se place-t-il dans la chaîne ?',['À la toute fin','Au début'],[0],'iZotope.')]);
A('mxc9','Atelier : ta référence',[CI(F_RF,'Ta référence','Applique la méthode d’iZotope.'),
 CH('Niveau',F_RF,'La référence sonne plus fort que ton mix. Que fais-tu ?',['Je baisse la référence au niveau du mix','Je monte mon mix à fond'],[0],'iZotope.'),
 CH('Pistes à comparer',F_RF,'Coche ce qu’on compare <b>en mixage</b> :',['Équilibre des instruments','Volume de la voix','Balance basse/grosse caisse','Prix de la référence'],[0,1,2],'Voir la fiche.',true)]);

var F_CR=FD('f-fl10','FL Studio : Channel Rack'), F_DL3=FD('f-fl11','FL Studio : Fruity Delay 3 et Reeverb 2'), F_MAX=FD('f-fl12','FL Studio : Maximus'),
 F_DLY=FD('f-mx10','Mixage : delay'), F_PC=FD('f-mx11','Mixage : compression parallèle'), F_DS=FD('f-mx12','Mixage : sibilance'),
 F_MS=FD('f-mx13','Mixage : mid/side'), F_SAT=FD('f-mx14','Mixage : saturation'), F_LUF=FD('f-mx15','Mastering : LUFS et true peak');

/* ---------- FL Studio ---------- */
TL('fl101','Le Channel Rack et le séquenceur pas à pas',F_CR,[
 ['Les pas','Selon le manuel d’Image-Line, chaque pas du séquenceur est une <b>double-croche</b>. Clic gauche : active un pas ; clic droit : le désactive. La grille par défaut fait 4 temps × 4 mesures (16 pas) et peut aller jusqu’à <b>512 pas</b>. Un pas n’a pas de « note off » : pour finir une note, on utilise un pas ultérieur à vélocité zéro, ou le Piano roll.'],
 ['Boutons de canal et graph editor','Clic gauche sur le bouton d’un canal : ouvre ses réglages et l’interface du plugin. Ctrl + clic gauche : écoute le son sans ouvrir l’instrument. Clic droit : menu (Piano roll, Graph editor…). Le <b>Graph editor</b> (Ctrl+K) édite des valeurs par pas : hauteur, vélocité, panoramique, Mod X/Y, etc. Pour les mélodies, le manuel recommande le Piano roll.'],
 ['Swing et routage','Le <b>swing global</b> (0 à 100 %) agit sur tous les canaux et touche un pas sur deux ; le swing de canal est un multiplicateur par canal (0 % = pas de swing pour lui). Pour router un canal vers le mixeur : Alt+M affiche les sélecteurs, puis on glisse verticalement. Un nouveau canal va par défaut sur la piste Master (« --- »). Tous les patterns partagent les mêmes instruments du Channel Rack.']],[
 ['Pas','À quelle durée correspond un pas du séquenceur ?',['Une double-croche','Une ronde','Une blanche'],'Manuel Image-Line.'],
 ['Grille','Quelle est la grille par défaut ?',['16 pas (4 temps × 4 mesures)','8 pas','64 pas'],'Manuel.'],
 ['Graph editor','Quel raccourci ouvre le Graph editor ?',['Ctrl+K','Ctrl+Z','Alt+F4'],'Manuel.'],
 ['Swing','Quand le swing est-il actif sur un canal ?',['Quand le swing global ET celui du canal sont au-dessus de 0 %','Seulement si le canal est muet','Jamais sur la batterie'],'Manuel.'],
 ['Routage','Où va un nouveau canal d’instrument par défaut ?',['Sur la piste Master','Sur la piste 1','Nulle part'],'Manuel.']]);
TL('fl111','Fruity Delay 3 et Fruity Reeverb 2',F_DL3,[
 ['Fruity Delay 3','Selon le manuel d’Image-Line, c’est un delay de style « analogique », dont le temps peut être automatisé et qui se <b>synchronise au tempo</b> du projet. Sans sync, le temps va de 1 à 1000 ms ; avec sync, de 1/48 de pas à 16 pas (1 mesure). Les modèles : Mono, Stereo, Ping pong et Off. Le <b>Feedback</b> règle la part d’écho renvoyée à l’entrée ; un filtre (Cutoff, Res) dans la boucle filtre chaque écho davantage. Le réglage <b>Tone</b> filtre la sortie wet : un passe-haut peut réduire un delay boueux.'],
 ['Fruity Reeverb 2','Il simule la réverbération d’espaces acoustiques réels, avec des queues jusqu’à 20 secondes. <b>L.CUT</b> atténue les graves avant la réverb (moins de grondement). <b>H.CUT</b> retire des aigus (pièce plus sourde). <b>DELAY</b> est le pré-délai. <b>SIZE</b> : taille de la pièce, à accorder au decay. <b>DIFF</b> : densité des réflexions. <b>DEC</b> : temps pour descendre à −60 dB. Sur une piste d’envoi : <b>Dry à 0 %</b> et <b>Wet à 100 %</b>.']],[
 ['Sync','Que fait le Tempo Sync de Fruity Delay 3 ?',['Il verrouille les échos sur le tempo du projet','Il change la tonalité','Il coupe les aigus'],'Manuel.'],
 ['Temps','Sans Tempo Sync, quelle plage de temps ?',['1 à 1000 ms','1 à 10 ms','1 à 10 s'],'Manuel.'],
 ['Tone','Que peut faire un passe-haut sur la sortie wet ?',['Réduire un delay boueux','Ajouter de la réverb','Accélérer le tempo'],'Manuel.'],
 ['Envoi','Quels réglages Dry/Wet sur une piste d’envoi de Reeverb 2 ?',['Dry 0 %, Wet 100 %','Dry 100 %, Wet 0 %','Dry 50 %, Wet 50 % obligatoire'],'Manuel.'],
 ['L.CUT','À quoi sert L.CUT ?',['Atténuer les graves avant la réverb','Allonger la queue','Changer la taille de la pièce'],'Manuel.']]);
TL('fl121','Maximus',F_MAX,[
 ['Un maximiseur multibande','Selon le manuel, <b>Maximus</b> est un maximiseur multibande (Producer Edition et plus). Il peut aussi servir de compresseur, limiteur, noise gate, expander, ducker et de-esser. Il a <b>trois bandes</b> (High, Mid, Low) aux limites réglables, et <b>quatre</b> limiteurs/compresseurs : un par bande plus un Master large bande. Chacun peut être contourné.'],
 ['Master et usages','Une section Master large bande permet, avec un mixage sans problème de phase, la compression parallèle et « New York ». Le manuel le recommande comme <b>dernier effet de la piste Master</b> pour un master final. Autres options : séparation stéréo par bande, filtrage de séparation IIR ou à phase linéaire, deux types de saturation par bande.']],[
 ['Bandes','Combien de bandes (HML) a Maximus ?',['Trois','Une','Dix'],'Manuel Image-Line.'],
 ['Master','Où le manuel recommande-t-il de le placer pour un master final ?',['En dernier effet de la piste Master','Sur chaque instrument','Avant l’EQ de chaque piste'],'Manuel.'],
 ['Rôles','Quels rôles peut-il aussi remplir ?',['Compresseur, limiteur, gate, expander, ducker, de-esser','Seulement une réverb','Seulement un synthé'],'Manuel.'],
 ['Parallèle','Que permet la section Master avec les bandes ?',['La compression parallèle et New York','De changer la tonalité','D’enregistrer la voix'],'Manuel.']]);
A('flc10','Atelier : ton Channel Rack',[CI(F_CR,'Ton Channel Rack','Applique le manuel.'),
 CH('Un pas',F_CR,'Combien de pas pour une mesure de 4 temps avec des doubles-croches ?',['16','4','32'],[0],'4 temps × 4 doubles-croches.'),
 CH('Écouter',F_CR,'Comment écouter un son sans ouvrir l’instrument ?',['Ctrl + clic gauche','Clic droit','Double-clic'],[0],'Manuel.'),
 CH('Graph editor',F_CR,'Que peut-on éditer dans le Graph editor ?',['Vélocité, panoramique, hauteur par pas','Seulement le titre','Le tempo global'],[0],'Manuel.')]);
A('flc11','Atelier : ton delay et ta réverb',[CI(F_DL3,'Ton delay et ta réverb','Choisis les réglages décrits.'),
 CH('Sync',F_DL3,'Tu veux des échos calés sur le tempo. Quel réglage ?',['Tempo Sync activé','Tempo Sync désactivé'],[0],'Manuel.'),
 CH('Envoi',F_DL3,'Reeverb 2 sur une piste d’envoi :',['Dry 0 %, Wet 100 %','Dry 100 %, Wet 0 %'],[0],'Manuel.'),
 CH('Netteté',F_DL3,'Coche ce qui aide à garder une réverb ou un delay moins boueux :',['L.CUT sur Reeverb 2','Passe-haut via Tone sur Delay 3','Monter le Feedback à fond','Passe-bas sur le master'],[0,1],'Voir la fiche.',true)]);

TL('m111','Le delay',F_DLY,[
 ['Une copie retardée','Selon Splice, un delay stocke le son dans une mémoire tampon et le rejoue plus tard ; ce décalage est le <b>delay time</b>, exprimé en <b>ms</b> ou en <b>divisions de temps</b>. Exemple : un clap avec 200 ms de delay se répète 200 ms plus tard.'],
 ['Feedback, mix et sync','Le <b>feedback</b> est la part de la sortie renvoyée à l’entrée : plus il est haut, plus il y a d’échos, mais « trop de feedback peut créer une boucle totale ». Le <b>mix</b> équilibre le son sec (dry) et retardé (wet) ; sur un envoi auxiliaire, on le règle à 100 %. Le <b>tempo sync</b> cale les répétitions sur le BPM du projet. Le ping-pong (échos qui alternent entre gauche et droite) est cité par Splice comme couleur stéréo large, mais l’article ne détaille pas son fonctionnement ; le manuel de FL Studio liste « Ping pong » parmi les modèles de Fruity Delay 3.']],[
 ['Principe','Que fait un delay ?',['Il rejoue le son plus tard','Il baisse les aigus','Il compresse'],'Splice.'],
 ['Feedback','Que règle le feedback ?',['La part du son retardé renvoyée à l’entrée','Le volume du master','La tonalité'],'Splice.'],
 ['Sync','À quoi sert le tempo sync ?',['Caler les répétitions sur le BPM','Changer la hauteur','Réduire les graves'],'Splice.'],
 ['Envoi','Quel mix sur un envoi auxiliaire ?',['100 % wet','0 % wet','Toujours 50 %'],'Splice.'],
 ['Excès','Risque d’un feedback trop haut ?',['Une boucle de feedback totale','Rien','Un tempo plus lent'],'Splice.']]);
TL('m121','La compression parallèle',F_PC,[
 ['Mélanger sec et compressé','Selon Wikipédia, la compression parallèle (aussi « compression New York ») combine un signal non traité (ou peu compressé) avec une copie <b>fortement compressée</b> du même signal. C’est une forme de compression « vers le haut » : elle <b>remonte les sons faibles</b> au lieu d’abaisser les crêtes.'],
 ['Ce qu’elle apporte','Elle réduit la dynamique en relevant les passages faibles, ajoute du détail audible, <b>conserve les transitoires rapides</b> et accepte des ratios élevés, car l’effet est moins audible qu’un limiteur. Elle peut « épaissir » un mix si l’attaque et le release sont bien réglés. En numérique, les deux chemins doivent avoir le même nombre d’étapes pour rester alignés dans le temps (sinon : filtrage en peigne, problèmes de phase).']],[
 ['Principe','Que combine la compression parallèle ?',['Le son sec et une copie très compressée','Deux sons différents','Deux masters'],'Wikipédia.'],
 ['Nom','Quel autre nom porte-t-elle ?',['Compression New York','Compression sidechain','Compression multibande'],'Wikipédia.'],
 ['Effet','Que fait-elle sur les sons faibles ?',['Elle les remonte','Elle les supprime','Elle les décale'],'Wikipédia.'],
 ['Transitoires','Que conserve-t-elle ?',['Les transitoires rapides','Rien','Seulement les graves'],'Wikipédia.'],
 ['Alignement','Pourquoi garder le même nombre d’étapes sur les deux chemins ?',['Pour rester alignés dans le temps','Pour économiser du CPU','Pour changer de tonalité'],'Wikipédia.']]);
TL('m131','Sibilance et de-esser',F_DS,[
 ['Les « s » agressifs','Selon Sound On Sound, la sibilance est constituée des sons « s » et « sh » trop durs. L’énergie sibilante se situe surtout vers <b>3 à 6 kHz</b>. Les voix féminines ont souvent des « s » plus aigus que les voix masculines. Prévention à l’enregistrement : micro moins sensible à cette zone (condensateur plus plat, dynamique ou ruban), placement du micro, contrôle des niveaux (une distorsion sur les « s » forts empire tout).'],
 ['Corriger au mixage','Premier essai : une coupe EQ statique, avec un analyseur de fréquences ; attention à une voix plus terne et à l’intelligibilité. Un <b>de-esser</b> est essentiellement « un compresseur avec un filtre de sidechain » n’agissant que sur la sibilance. Version pleine bande : baisse tout le signal ; version split-band : seulement au-dessus d’une fréquence de croisement. On règle le de-essing <b>après</b> EQ, compression ou saturation, car elles peuvent changer le résultat. Évite de trop traiter et compare avec une référence.']],[
 ['Zone','Où se situe surtout l’énergie sibilante ?',['Vers 3 à 6 kHz','Vers 50 Hz','Vers 200 Hz'],'Sound On Sound.'],
 ['De-esser','Un de-esser est essentiellement…',['Un compresseur avec un filtre de sidechain','Une réverb','Un delay'],'Sound On Sound.'],
 ['Split-band','Que fait un de-esser split-band ?',['Il baisse seulement au-dessus d’une fréquence de croisement','Il baisse tout le signal','Il supprime les graves'],'Sound On Sound.'],
 ['Ordre','Quand régler le de-essing ?',['Après EQ, compression et saturation','Avant d’enregistrer','Jamais'],'Sound On Sound.'],
 ['Risque','Risque d’une coupe EQ de sibilance ?',['Une voix plus terne','Un tempo plus lent','Rien'],'Sound On Sound.']]);
TL('m141','Mid/side et largeur stéréo',F_MS,[
 ['Deux canaux : mid et side','Selon iZotope, le mid/side (somme/différence) représente le stéréo avec deux canaux : <b>Mid = L + R</b> et <b>Side = L − R</b>. Pour revenir : L = Mid + Side ; R = Mid − Side. Un son uniquement dans le mid est au centre. Seuls les sons exactement au centre disparaissent complètement du side.'],
 ['Largeur et mono','Pour <b>élargir</b> : monter le side ou baisser le mid ; pour rétrécir : l’inverse. Un passe-haut sur le side (l’article utilise 100 Hz) garde les graves <b>au centre</b>. Pièges : trop de contenu dans le side nuit à la compatibilité <b>mono</b> ; trop élargir peut enterrer la voix du centre ; un EQ qui n’est pas à phase linéaire sur le side peut déplacer des sons. Compare le mix en mono avec et sans traitement.']],[
 ['Mid','Comment se calcule le mid ?',['L + R','L − R','L × R'],'iZotope.'],
 ['Side','Comment se calcule le side ?',['L − R','L + R','R seul'],'iZotope.'],
 ['Graves','Que fait un passe-haut sur le side ?',['Il garde les graves au centre','Il supprime les aigus','Il ajoute de la réverb'],'iZotope.'],
 ['Élargir','Comment élargir l’image ?',['Monter le side ou baisser le mid','Baisser le side','Monter le tempo'],'iZotope.'],
 ['Mono','Quel risque avec trop de side ?',['Une mauvaise compatibilité mono','Un tempo plus lent','Aucun'],'iZotope.']]);
TL('m151','Saturation et distorsion',F_SAT,[
 ['Ajouter des harmoniques','Selon MusicRadar, la distorsion change le signal, souvent par surcharge de circuits : les crêtes sont aplaties et le son <b>ajoute des harmoniques</b> (multiples entiers de la fréquence d’entrée). Les harmoniques d’ordre pair sont généralement perçues comme agréables (style lampes), les impaires et inharmoniques plutôt comme désagréables.'],
 ['Saturation, bitcrusher, écrêtage','La <b>saturation</b> vient de la bande magnétique, qui atteint un point où elle ne peut plus enregistrer davantage ; c’est une distorsion et une compression non linéaires, utilisée en subtil pour donner du punch, faire « coller » les éléments et agrandir un mix. Le <b>bitcrushing</b> réduit volontairement la précision numérique (profondeur de bits ou fréquence d’échantillonnage). L’<b>écrêtage</b> numérique est « soudain et agressif » ; la surcharge analogique est plus progressive.']],[
 ['Harmoniques','Qu’ajoute la distorsion ?',['Des harmoniques','Du silence','Un tempo'],'MusicRadar.'],
 ['Pair','Les harmoniques d’ordre pair sont généralement…',['Perçues comme agréables','Perçues comme désagréables','Inaudibles'],'MusicRadar.'],
 ['Origine','D’où vient la saturation ?',['De la bande magnétique','D’un micro','D’un synthé'],'MusicRadar.'],
 ['Bitcrusher','Que fait un bitcrusher ?',['Il réduit la précision numérique','Il ajoute des graves','Il allonge le decay'],'MusicRadar.'],
 ['Écrêtage','Comment l’écrêtage numérique est-il décrit ?',['Soudain et agressif','Toujours doux','Inexistant'],'MusicRadar.']]);
TL('m161','LUFS et true peak',F_LUF,[
 ['Mesurer la sonie','Selon iZotope, <b>LUFS</b> (loudness units full scale) mesure la sonie relativement à l’échelle numérique pleine. 1 LU = 1 dB de changement de niveau, mais les fréquences sont pondérées pour mieux coller à l’oreille (pondération K). Trois fenêtres : <b>momentary</b> (400 ms), <b>short-term</b> (moyenne sur 3 secondes) et <b>integrated</b> (moyenne sur tout le morceau).'],
 ['True peak et streaming','Le <b>true peak</b> estime la crête analogique en suréchantillonnant par 4 ; il peut dépasser la crête d’échantillon. La plupart des services de streaming normalisent vers environ <b>−14 LUFS</b> integrated (sans toujours relever les morceaux plus faibles). Certains recommandent un true peak maximum de −1 ou −2 dBTP. L’<b>LRA</b> mesure la plage de sonie.']],[
 ['LUFS','Que mesure le LUFS ?',['La sonie perçue','La hauteur','Le tempo'],'iZotope.'],
 ['Momentary','Quelle fenêtre pour « momentary » ?',['400 ms','3 secondes','Tout le morceau'],'iZotope.'],
 ['Integrated','Que couvre « integrated » ?',['Le morceau entier','Une seconde','Un seul pic'],'iZotope.'],
 ['Streaming','Vers quel niveau la plupart des services normalisent-ils ?',['Environ −14 LUFS','Environ 0 LUFS','Environ −40 LUFS'],'iZotope.'],
 ['True peak','Que estime le true peak ?',['La crête analogique en sortie de convertisseur','Le tempo','La largeur stéréo'],'iZotope.']]);
