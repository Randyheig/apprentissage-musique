<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Musique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Concept : une appli de leçons courtes. Un parcours par unité (bannière violette, nœuds en zigzag), un écran = une idée. */
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --tint:#F3F0FA; --line:#E3DFEE; --line-deep:#CFC9E0;
  --fg:#1B1930; --muted:#615C7A;
  --accent:#5340D0; --accent-deep:#34269B; --accent-ink:#FFFFFF; --accent-soft:#E9E5FA; --on-accent-soft:rgba(255,255,255,.22);
  --good:#17804D; --good-soft:#DDF3E6; --bad:#B8342E; --bad-soft:#FBE3E0;
  --gold:#EAC352; --gold-deep:#B3922F; --gold-ink:#3A2C06;
  --kw:#FFFFFF; --kfg:#1B1930; --kline:#B9B3CF; --kb:#2A2740; --kbfg:#F1EFFA; --press:#D9D2F7;
  --keygood:#17804D; --keybad:#B8342E; --tgt:#DCD5F8; --given:#E6E3EF;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121D; --surface:#1E1B2C; --tint:#252238; --line:#383453; --line-deep:#4A4568;
    --fg:#F1EFFA; --muted:#A9A4C2;
    --accent:#8F7DFF; --accent-deep:#5442C9; --accent-ink:#120F26; --accent-soft:#2F2A52; --on-accent-soft:rgba(18,15,38,.16);
    --good:#5FD28F; --good-soft:#18362A; --bad:#FF8C84; --bad-soft:#41211F;
    --kw:#ECE9F7; --kfg:#1B1930; --kline:#6A6585; --kb:#0C0A14; --kbfg:#F1EFFA; --press:#C9C0F5; --tgt:#B9ADF7; --given:#C4C0D4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121D; --surface:#1E1B2C; --tint:#252238; --line:#383453; --line-deep:#4A4568;
  --fg:#F1EFFA; --muted:#A9A4C2;
  --accent:#8F7DFF; --accent-deep:#5442C9; --accent-ink:#120F26; --accent-soft:#2F2A52; --on-accent-soft:rgba(18,15,38,.16);
  --good:#5FD28F; --good-soft:#18362A; --bad:#FF8C84; --bad-soft:#41211F;
  --kw:#ECE9F7; --kfg:#1B1930; --kline:#6A6585; --kb:#0C0A14; --kbfg:#F1EFFA; --press:#C9C0F5; --tgt:#B9ADF7; --given:#C4C0D4;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:8px; padding-bottom:48px;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.app{max-width:720px; margin:0 auto}
.top{display:flex; align-items:center; justify-content:space-between; padding:14px 0 6px}
.brand{display:flex; align-items:center; gap:10px; font:800 1.4rem/1 var(--font-display)}
.brand svg{width:32px; height:32px}
.logo-bg{fill:var(--accent)} .logo-fg{fill:var(--accent-ink)} .logo-st{fill:none; stroke:var(--accent-ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.tag{font:700 .72rem var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1.5px solid var(--line); border-radius:99px; padding:4px 10px}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:10px 2px 14px; scrollbar-width:thin}
.tab{flex:none; font:700 .95rem var(--font-body); border:2px solid var(--line); background:var(--surface); color:var(--fg); padding:9px 16px; border-radius:99px; cursor:pointer; box-shadow:0 3px 0 var(--line); white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 var(--accent-deep)}
.tab.ghost{border-style:dashed; color:var(--muted); box-shadow:none; cursor:default; background:transparent}
.eyebrow{margin:18px 0 0; font:800 .75rem var(--font-body); letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
h1.page{font:800 clamp(2rem,6vw,2.7rem)/1.05 var(--font-display); margin:.15em 0 .3em; text-wrap:balance}
.lede{color:var(--muted); max-width:60ch; margin:0}
.card{border:2px solid var(--line); background:var(--surface); border-radius:20px; padding:18px; margin-top:16px}
.card h2{font:800 1.15rem var(--font-display); margin:0 0 8px}
ul.plain{margin:0; padding-left:1.15em} ul.plain li{margin:.2em 0}
.chips{display:flex; flex-wrap:wrap; gap:8px; list-style:none; padding:0; margin:0}
.chipx{background:var(--accent-soft); border-radius:14px; padding:6px 12px; font-size:.92rem; font-weight:700}
.status{margin-top:18px; color:var(--muted); font-size:.95rem}
.linkbtn{background:none; border:0; color:var(--accent); font:700 .95rem var(--font-body); text-decoration:underline dotted; text-underline-offset:4px; cursor:pointer; padding:6px 2px}
.btn{font:800 1rem var(--font-body); letter-spacing:.05em; text-transform:uppercase; border:0; border-radius:16px; padding:14px 22px; background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 0 var(--accent-deep); cursor:pointer; transition:transform .08s,box-shadow .08s; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:active:not([disabled]){transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep)}
.btn[disabled]{background:var(--line); color:var(--muted); box-shadow:0 4px 0 var(--line-deep); cursor:not-allowed}
.btn.ghost{background:var(--surface); color:var(--accent); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); padding:11px 18px}
.btn.small{padding:9px 14px; font-size:.85rem}
.btn.wide{width:100%}
.row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:12px}

/* Parcours */
.modhead{margin-bottom:6px}
.unit{margin-top:30px}
.ubanner{background:var(--accent); color:var(--accent-ink); border-radius:24px; padding:16px 18px 18px; box-shadow:0 5px 0 var(--accent-deep); display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start}
.ubanner .ue{margin:0; font:800 .72rem var(--font-body); letter-spacing:.1em; text-transform:uppercase; opacity:.85}
.ubanner h2{margin:2px 0 2px; font:800 1.7rem/1.1 var(--font-display)}
.ubanner p.ud{margin:0 0 10px; opacity:.95}
.glyph{width:62px; height:62px; border-radius:18px; background:var(--on-accent-soft); display:grid; place-items:center; font:800 1.7rem var(--font-display)}
.uchip{display:inline-flex; align-items:center; gap:8px; border:0; background:var(--on-accent-soft); color:inherit; border-radius:99px; padding:7px 14px 7px 10px; font:800 .95rem var(--font-body); cursor:pointer}
.uchip svg{width:18px; height:18px; flex:none}
.uchip .chev{transition:transform .2s}
.uchip[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.path{list-style:none; margin:0; padding:30px 0 6px; display:flex; flex-direction:column; gap:22px}
.path li{display:flex; justify-content:center}
.node{display:flex; flex-direction:column; align-items:center; text-align:center; width:min(250px,72vw); background:none; border:0; cursor:pointer; color:var(--fg); transform:translateX(var(--dx,0px)); padding:0}
.disc{width:78px; height:78px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 7px 0 var(--accent-deep); transition:transform .08s,box-shadow .08s}
.disc svg{width:34px; height:34px}
.node.k-quiz .disc{border-radius:26px}
.node.done .disc{background:var(--gold); color:var(--gold-ink); box-shadow:0 7px 0 var(--gold-deep)}
.node:active .disc{transform:translateY(5px); box-shadow:0 2px 0 var(--accent-deep)}
.node.done:active .disc{box-shadow:0 2px 0 var(--gold-deep)}
.nt{font:800 1.05rem/1.2 var(--font-body); margin-top:16px}
.ns{font-weight:700; color:var(--muted); font-size:.9rem}
.mods{list-style:none; padding:0; margin:14px 0 0; display:grid; gap:10px}
.mod{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; border:2px solid var(--line); background:var(--surface); border-radius:18px; padding:14px; opacity:.85}
.num{width:38px; height:38px; border-radius:12px; background:var(--line); color:var(--muted); display:grid; place-items:center; font:800 1.15rem var(--font-display)}
.mod h3{margin:0; font:800 1.1rem/1.2 var(--font-display); color:var(--muted)}
.mod p{margin:.2em 0 0; color:var(--muted); font-size:.92rem}
.soon{font:700 .72rem var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1.5px solid var(--line); border-radius:99px; padding:3px 9px; align-self:center; white-space:nowrap}
.next-h{margin:34px 0 0; font:800 1.3rem var(--font-display)}
.resume{position:fixed; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:10; border-radius:99px; padding:14px 22px 14px 18px}
.resume svg{width:20px; height:20px}
.pbottom{height:84px}

/* Leçon */
.lesson{position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.lhead{display:flex; align-items:center; gap:14px; padding-top:12px; padding-bottom:8px; max-width:720px; width:100%; margin:0 auto}
.icon{width:44px; height:44px; border:0; background:none; color:var(--muted); border-radius:12px; cursor:pointer; display:grid; place-items:center; flex:none}
.track{flex:1; height:16px; border-radius:99px; background:var(--line); overflow:hidden}
.fill{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease}
.count{font:800 .95rem var(--font-body); color:var(--muted); min-width:3.2ch; text-align:right; font-variant-numeric:tabular-nums}
.lbody{flex:1; overflow-y:auto; padding-top:8px; padding-bottom:28px}
.lwrap{max-width:672px; margin:0 auto}
.lesson h2{font:800 clamp(1.7rem,5.5vw,2.3rem)/1.1 var(--font-display); margin:.5em 0 .4em; text-wrap:balance}
.lead{font-size:1.1rem; margin:0 0 .8em}
.hl{color:var(--accent); font-weight:800}
.tip{background:var(--tint); border:2px solid var(--line); border-radius:16px; padding:12px 14px; margin:16px 0}
.lfoot{border-top:2px solid var(--line); background:var(--bg); padding-top:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.lfoot.good{background:var(--good-soft); border-top-color:var(--good)}
.lfoot.bad{background:var(--bad-soft); border-top-color:var(--bad)}
.lfoot-in{max-width:672px; margin:0 auto; display:grid; gap:10px}
.fb{margin:0; font-weight:700}
.fb:empty{display:none}
.lfoot.good .fb{color:var(--good)} .lfoot.bad .fb{color:var(--bad)}
.fiche{margin:24px 0 0; color:var(--muted); font-size:.92rem}
.opts{display:grid; gap:12px; margin-top:18px}
.opt{width:100%; text-align:left; font:700 1.1rem var(--font-body); color:var(--fg); background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 3px 0 var(--accent)}
.opt.good{border-color:var(--good); background:var(--good-soft); color:var(--good); box-shadow:0 3px 0 var(--good)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad); box-shadow:0 3px 0 var(--bad)}
.notes{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin:18px 0}
.nchip{border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 0; display:grid; gap:2px; justify-items:center; cursor:pointer; box-shadow:0 3px 0 var(--line); color:var(--fg); min-width:0}
.nchip .fr{font:800 1.1rem/1.1 var(--font-display)}
.nchip .en{font:800 .95rem var(--font-body); color:var(--accent)}
.nchip.on{border-color:var(--accent); background:var(--accent-soft)}
.demo{display:flex; flex-wrap:wrap; gap:10px; margin:12px 0}
.seg{display:inline-flex; flex-wrap:wrap; border:2px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); margin:6px 0 4px}
.seg button{border:0; background:none; padding:9px 16px; font:800 .9rem var(--font-body); color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.octrow{display:grid; grid-template-columns:8.5em 1fr 4.6em; gap:10px; align-items:center; width:100%; border:2px solid var(--line); background:var(--surface); border-radius:16px; padding:12px; margin-bottom:10px; cursor:pointer; color:var(--fg); box-shadow:0 3px 0 var(--line); text-align:left; font:700 .98rem var(--font-body)}
.octrow.on{border-color:var(--accent); background:var(--accent-soft)}
.o-bar{height:12px; background:var(--line); border-radius:99px; overflow:hidden}
.o-bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.o-hz{text-align:right; font-variant-numeric:tabular-nums}
.score{font:800 4.5rem/1 var(--font-display); color:var(--accent); margin:.2em 0}

/* Clavier */
.kbwrap{margin:18px 0 6px}
.kb{position:relative; display:flex; height:clamp(150px,42vw,210px); user-select:none; -webkit-user-select:none; touch-action:manipulation}
.wk{flex:1; min-width:0; border:1.5px solid var(--kline); background:var(--kw); color:var(--kfg); border-radius:0 0 10px 10px; margin:0 1px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:0 0 10px; gap:2px; cursor:pointer; font:700 .85rem var(--font-body)}
.wk .l1{font-weight:800; font-size:.95rem}
.wk .l2{font-size:.78rem; opacity:.8}
.bk{position:absolute; top:0; height:60%; background:var(--kb); color:var(--kbfg); border:0; border-radius:0 0 8px 8px; z-index:2; cursor:pointer; display:flex; align-items:flex-end; justify-content:center; padding:0 0 6px; font:700 .62rem var(--font-body); box-shadow:0 3px 0 rgba(0,0,0,.25)}
.wk.on{background:var(--press)}
.bk.on{background:var(--accent); color:var(--accent-ink)}
.wk.pick{background:var(--press); border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.bk.pick{background:var(--accent); color:var(--accent-ink)}
.wk.good,.bk.good{background:var(--keygood); color:#fff; border-color:var(--keygood)}
.wk.bad,.bk.bad{background:var(--keybad); color:#fff; border-color:var(--keybad)}
.kbstatus{margin:8px 0 0; min-height:1.6em; font-weight:700; color:var(--muted)}

/* Manche */
.fbwrap{margin:18px 0 6px}
.fretb{display:grid; gap:0; border-radius:12px; overflow:hidden; border:2px solid var(--line); background:var(--surface)}
.frow{display:grid; grid-template-columns:2.6rem repeat(var(--n),minmax(0,1fr)); align-items:stretch}
.sname{display:grid; place-items:center; font:800 .85rem var(--font-body); color:var(--muted); background:var(--tint)}
.cell{height:40px; border:0; border-left:3px solid var(--line-deep); background-color:transparent; background-image:linear-gradient(var(--muted),var(--muted)); background-size:100% 2px; background-position:center; background-repeat:no-repeat; color:var(--fg); cursor:pointer; padding:0; font:800 .72rem var(--font-body); min-width:0}
.cell.open{border-left:0; border-right:5px solid var(--fg)}
.cell span{background:var(--surface); padding:1px 4px; border-radius:6px}
.cell.on{background-color:var(--accent-soft)}
.cell.pick{background-color:var(--accent); color:var(--accent-ink)}
.cell.pick span{background:transparent}
.cell.good{background-color:var(--keygood); color:#fff}
.cell.bad{background-color:var(--keybad); color:#fff}
.cell.good span,.cell.bad span{background:transparent}

/* Exercices variés */
.pool{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
.pchip{border:2px solid var(--line); background:var(--surface); color:var(--fg); border-radius:14px; padding:10px 14px; font:800 1rem var(--font-body); cursor:pointer; box-shadow:0 3px 0 var(--line)}
.pchip.good{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.pchip.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.tray{min-height:60px; border:2px dashed var(--line-deep); border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center}
.tray:empty::before{content:'Touche les éléments dans le bon ordre'; color:var(--muted); font-weight:700; padding:0 6px}
.match{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.mcol{display:grid; gap:10px; align-content:start}
.mbtn{position:relative; text-align:center; font:800 1rem var(--font-body); color:var(--fg); background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:12px 30px 12px 10px; cursor:pointer; box-shadow:0 3px 0 var(--line); min-width:0; overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 3px 0 var(--accent)}
.mbtn.good{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.mbtn.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.bd{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font:800 .75rem/20px var(--font-body); font-style:normal; text-align:center}
.wk.tgt,.bk.tgt{box-shadow:inset 0 0 0 3px var(--accent)}
.bk.tgt{background:var(--accent)}
.wk.tgt{background:var(--tgt)}
.wk.given{background:var(--given)}
.bk.given{background:var(--kb)}
.wk.tgt .l1,.wk.given .l1{color:#1B1930}
.bk.tgt{color:var(--accent-ink)}
.wk.tgt.pick{background:var(--accent); box-shadow:inset 0 0 0 3px var(--accent-deep)}
.wk.tgt.pick .l1{color:var(--accent-ink)}
.bk.tgt.pick{background:var(--accent-deep); box-shadow:0 0 0 3px var(--accent)}
.counter{font-weight:800; color:var(--muted); margin:8px 0 0}
/* Suivi */
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:18px}
.tile{border:2px solid var(--line); background:var(--surface); border-radius:18px; padding:12px 10px; text-align:center}
.tile b{display:block; font:800 2rem/1 var(--font-display); color:var(--accent)}
.tile span{font-size:.82rem; font-weight:700; color:var(--muted)}
.mrow{margin:14px 0 0}
.mtop{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.mtop b{font-weight:800}
.mlvl{font:800 .78rem var(--font-body); color:var(--muted)}
.mbar{height:14px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px}
.mbar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}
.mbar i.ok{background:var(--good)}
.msub{font-size:.82rem; color:var(--muted); margin-top:3px}
.calnav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.calnav strong{font:800 1.15rem var(--font-display); text-transform:capitalize}
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.cal .wd{text-align:center; font:800 .72rem var(--font-body); color:var(--muted); padding:2px 0}
.cd{aspect-ratio:1; border-radius:12px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font:700 .9rem var(--font-body); color:var(--fg); padding:0}
.cd.empty{border:0; background:none}
.cd.l1{background:var(--accent-soft); border-color:var(--accent-soft)}
.cd.l2{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.cd.l3{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff}
.cd.today{outline:3px solid var(--fg); outline-offset:1px}
.legend{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:12px; font-size:.82rem; color:var(--muted); font-weight:700}
.legend i{display:inline-block; width:14px; height:14px; border-radius:5px; vertical-align:-2px; margin-right:4px; border:2px solid var(--line)}
/* Rythme */
.bpmrow{display:flex; align-items:center; justify-content:center; gap:18px; margin:6px 0 4px}
.bpmbox{text-align:center; min-width:6.5rem}
.bpmbox b{display:block; font:800 4rem/1 var(--font-display); color:var(--accent); font-variant-numeric:tabular-nums}
.bpmbox span{font:800 .8rem var(--font-body); letter-spacing:.1em; color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--accent); height:32px; margin:8px 0}
.dots{display:flex; gap:12px; justify-content:center; margin:18px 0 8px; flex-wrap:wrap}
.dot{width:22px; height:22px; border-radius:50%; background:var(--line); transition:transform .08s,background .08s}
.dot.on{background:var(--accent); transform:scale(1.35)}
.dot.a{box-shadow:0 0 0 3px var(--line-deep)}
.inst{margin:14px 0 6px; font:800 .78rem var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.sgrid{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px}
.rc{height:44px; border:2px solid var(--line); background:var(--surface); border-radius:12px; color:var(--muted); font:800 .78rem var(--font-body); cursor:pointer; padding:0; min-width:0}
.rc.beat{border-color:var(--line-deep)}
.rc.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rc.ph{outline:3px solid var(--fg); outline-offset:1px}
.rc.good{background:var(--good); border-color:var(--good); color:#fff}
.rc.bad{background:var(--bad); border-color:var(--bad); color:#fff}
.rc.miss{border-color:var(--bad); color:var(--bad)}
.rmsg{margin:12px 0 0; font-weight:700; min-height:1.5em}
.rmsg.good{color:var(--good)} .rmsg.bad{color:var(--bad)}
/* Fiche */
.sheet{position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:2px solid var(--line); padding-top:8px; padding-bottom:8px}
.sheet-head strong{font:800 1.15rem var(--font-display)}
.sheet-body{flex:1; overflow-y:auto; padding-top:8px; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.doc{max-width:65ch; margin:0 auto}
.doc h3{font:800 1.4rem/1.15 var(--font-display); margin:1.4em 0 .3em}
.doc p{margin:.5em 0}
.doc a{color:var(--accent); overflow-wrap:anywhere}
.doc ol{padding-left:1.2em}
.doc .note{background:var(--tint); border:2px solid var(--line); border-radius:14px; padding:10px 14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
<style>html{color-scheme:light dark}body{margin:0}</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-bg" width="32" height="32" rx="9"/><path class="logo-st" d="M12 21V9l10-2v12"/><circle class="logo-fg" cx="10" cy="22" r="3"/><circle class="logo-fg" cx="20" cy="20" r="3"/></svg>
      <span>Atelier Musique</span>
    </div>
    <span class="tag">Maquette</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sujets" id="tabs"></nav>
  <main id="panels"></main>
</div>

<div class="lesson" id="lesson" hidden role="dialog" aria-modal="true" aria-label="Leçon">
  <div class="lhead gut">
    <button type="button" class="icon" id="lclose" aria-label="Fermer"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button>
    <div class="track" id="track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuenow="0"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">0/0</span>
  </div>
  <div class="lbody"><div class="lwrap gut" id="stage"></div></div>
  <div class="lfoot" id="lfoot"><div class="lfoot-in gut"><p class="fb" id="fb" aria-live="polite"></p><button type="button" class="btn wide" id="next">Continuer</button></div></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Fiche de théorie">
  <div class="sheet-head gut"><strong>Fiche de théorie · Les bases</strong><button type="button" class="icon" id="sclose" aria-label="Fermer la fiche"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button></div>
  <div class="sheet-body gut"><div class="doc" id="doc"></div></div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function h(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- Notes ---------- */
var FRS=['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
var FRF=['Do','Ré♭','Ré','Mi♭','Mi','Fa','Sol♭','Sol','La♭','La','Si♭','Si'];
var ENS=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
var ENF=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
var BLACK=[1,3,6,8,10], WHITE=[0,2,4,5,7,9,11];
function oct(m){return Math.floor(m/12)-1}
function freq(m){return 440*Math.pow(2,(m-69)/12)}
var PLAY='<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5v13l11-6.5z" fill="currentColor"/></svg>';
var STD=[40,45,50,55,59,64];
var HSD=STD.map(function(m){return m-1});
var DROPD=[38,45,50,55,59,64];

/* ---------- Son ---------- */
var ctx=null, timers=[];
function ac(){
  if(!ctx){var A=window.AudioContext||window.webkitAudioContext; if(!A) return null; ctx=new A();}
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
function tone(m,delay,dur){
  try{
    var c=ac(); if(!c) return;
    delay=delay||0; dur=dur||0.9;
    var t=c.currentTime+delay+0.01, g=c.createGain(), o=c.createOscillator();
    o.type='triangle'; o.frequency.value=freq(m);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){while(timers.length) clearTimeout(timers.pop())}
function seq(notes,gap,onNote){
  notes.forEach(function(m,i){ tone(m,i*gap/1000,0.8); later(function(){onNote&&onNote(m,i)},i*gap); });
}

/* ---------- Progression (confort par visiteur) ---------- */
var KEY='atelier-musique:v2';
var S={done:{},best:{}};
try{var raw=JSON.parse(localStorage.getItem(KEY)||'null'); if(raw&&raw.done&&raw.best) S=raw}catch(e){}
S.stats=S.stats||{}; S.days=S.days||{};
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dkey(d){function p(n){return (n<10?'0':'')+n} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function touchDay(){var k=dkey(new Date()); S.days[k]=(S.days[k]||0)+1; saveS()}
function record(id,ok){var st=S.stats[id]||(S.stats[id]={r:[],n:0}); st.r.push(ok?1:0); if(st.r.length>10) st.r.shift(); st.n++; saveS()}

/* ---------- Clavier ---------- */
function keyboard(o){
  o=Object.assign({lo:60,hi:72,mode:'both',black:true,offset:0,onPress:null,blank:false},o||{});
  var wrap=h('<div class="kbwrap"></div>');
  var kb=h('<div class="kb" role="group" aria-label="Clavier de piano"></div>');
  var status=h('<p class="kbstatus" aria-live="polite">Touche une note pour l’entendre.</p>');
  wrap.append(kb,status);
  var totalW=0,m,wc=0,keys={};
  for(m=o.lo;m<=o.hi;m++){ if(BLACK.indexOf(m%12)<0) totalW++; }
  var unit=100/totalW;
  function setStatus(n){
    var pc=n%12, isB=BLACK.indexOf(pc)>=0, num=o.mode==='oct'?String(oct(n)+o.offset):'';
    status.textContent=isB ? FRS[pc]+' / '+FRF[pc]+'  ·  '+ENS[pc]+num+' / '+ENF[pc]+num : FRS[pc]+'  ·  '+ENS[pc]+num;
  }
  function flash(n,ms){var k=keys[n]; if(!k) return; k.classList.add('on'); later(function(){k.classList.remove('on')},ms||420)}
  function mark(n,cls){if(keys[n]) keys[n].classList.add(cls)}
  function unmark(n,cls){if(keys[n]) keys[n].classList.remove(cls)}
  function relabel(off){
    o.offset=off;
    Object.keys(keys).forEach(function(k){
      var l=keys[k].querySelector('.l1'); if(l) l.textContent=ENS[k%12]+(oct(+k)+off);
    });
  }
  function build(n){
    var pc=n%12, isB=BLACK.indexOf(pc)>=0;
    var b=document.createElement('button'); b.type='button'; b.className=isB?'bk':'wk'; b.dataset.m=n;
    b.setAttribute('aria-label', o.blank ? 'Touche' : (isB ? FRS[pc]+' ou '+FRF[pc] : FRS[pc]));
    if(isB){
      b.style.left=((wc-0.3)*unit)+'%'; b.style.width=(0.6*unit)+'%';
      if(!o.blank && o.black && o.mode==='both') b.innerHTML='<span>'+FRS[pc]+'</span>';
    }else{
      wc++;
      if(o.blank){} else if(o.mode==='both') b.innerHTML='<span class="l1">'+FRS[pc]+'</span><span class="l2">'+ENS[pc]+'</span>';
      else b.innerHTML='<span class="l1">'+ENS[pc]+(oct(n)+o.offset)+'</span>';
    }
    b.addEventListener('click',function(){ tone(n); flash(n,260); if(!o.blank) setStatus(n); if(o.onPress) o.onPress(n); });
    keys[n]=b; kb.append(b);
  }
  for(m=o.lo;m<=o.hi;m++) build(m);
  return {el:wrap,keys:keys,flash:flash,mark:mark,unmark:unmark,relabel:relabel};
}

/* ---------- Manche de guitare (cordes : 0 = grave, 5 = aiguë) ---------- */
function fretboard(o){
  o=Object.assign({tuning:STD,frets:8,labels:false,flats:false,onPress:null,quiet:false},o||{});
  var names=o.flats?FRF:FRS;
  var wrap=h('<div class="fbwrap"></div>');
  var grid=h('<div class="fretb" role="group" aria-label="Manche de guitare" style="--n:'+(o.frets+1)+'"></div>');
  var status=h('<p class="kbstatus" aria-live="polite">Touche une case pour l’entendre.</p>');
  wrap.append(grid,status);
  var cells={};
  function build(s,f,row){
    var m=o.tuning[s]+f;
    var b=h('<button type="button" class="cell'+(f===0?' open':'')+'" aria-label="Corde '+(6-s)+', case '+f+'">'+(o.labels?'<span>'+names[m%12]+'</span>':'')+'</button>');
    b.addEventListener('click',function(){
      tone(m); flash(s,f,260);
      if(!o.quiet) status.textContent='Corde de '+names[o.tuning[s]%12]+', case '+f+'  ·  '+names[m%12];
      if(o.onPress) o.onPress(s,f);
    });
    cells[s+'-'+f]=b; row.append(b);
  }
  for(var s=5;s>=0;s--){
    var row=h('<div class="frow"></div>');
    row.append(h('<span class="sname">'+names[o.tuning[s]%12]+'</span>'));
    for(var f=0;f<=o.frets;f++) build(s,f,row);
    grid.append(row);
  }
  function flash(s,f,ms){var c=cells[s+'-'+f]; if(!c) return; c.classList.add('on'); later(function(){c.classList.remove('on')},ms||420)}
  function mark(s,f,cls){var c=cells[s+'-'+f]; if(c) c.classList.add(cls)}
  function unmark(s,f,cls){var c=cells[s+'-'+f]; if(c) c.classList.remove(cls)}
  return {el:wrap,flash:flash,mark:mark,unmark:unmark};
}

/* ---------- Fabriques d’étapes ---------- */
var F_NOMS={id:'f-noms',label:'Les sept noms de notes'};
var F_CLAV={id:'f-clavier',label:'Dièses, bémols et clavier'};
var F_ALTER={id:'f-alter',label:'Dièse, bémol, bécarre'};
var F_TONS={id:'f-tons',label:'Ton et demi-ton'};
var F_MANCHE={id:'f-manche',label:'Le manche et les accordages'};
var F_OCT={id:'f-octave',label:'Octaves et fréquences'};
var F_NUM={id:'f-nommer',label:'Numéroter les octaves'};

function learn(fiche,render){return {graded:false,fiche:fiche,render:render}}
function quizStep(c){
  return {graded:true,fiche:c.fiche,render:function(root,api){
    root.innerHTML='<h2>'+(c.title||'Question')+'</h2><p class="lead">'+c.q+'</p>';
    if(c.extra) c.extra(root);
    var box=h('<div class="opts"></div>'); root.append(box);
    var locked=false, btns=[];
    shuffle(c.options.map(function(t,i){return {t:t,ok:i===c.answer}})).forEach(function(it){
      var b=h('<button type="button" class="opt" aria-pressed="false">'+it.t+'</button>');
      btns.push({b:b,ok:it.ok});
      b.addEventListener('click',function(){
        if(locked) return;
        btns.forEach(function(x){x.b.classList.remove('sel'); x.b.setAttribute('aria-pressed','false')});
        b.classList.add('sel'); b.setAttribute('aria-pressed','true');
        api.select(function(){
          locked=true; b.classList.remove('sel');
          b.classList.add(it.ok?'good':'bad');
          if(!it.ok) btns.forEach(function(x){if(x.ok) x.b.classList.add('good')});
          api.done(it.ok,c.explain);
        });
      });
      box.append(b);
    });
  }};
}
function Q(title,q,options,answer,explain,fiche){return quizStep({title:title,q:q,options:options,answer:answer,explain:explain,fiche:fiche})}
function K(title,q,accept,explain,fiche,black){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var locked=false, picked=null, k;
    k=keyboard({mode:'both',black:black!==false,onPress:function(n){
      if(locked) return;
      if(picked!==null) k.unmark(picked,'pick');
      picked=n; k.mark(n,'pick');
      api.select(function(){
        locked=true; k.unmark(n,'pick');
        var ok=accept.indexOf(n)>=0;
        k.mark(n,ok?'good':'bad'); if(!ok) k.mark(accept[0],'good');
        api.done(ok,explain);
      });
    }});
    root.append(k.el);
  }};
}
function FR(title,q,accept,explain,fiche,tuning,flats){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var locked=false, picked=null, fbd;
    fbd=fretboard({tuning:tuning||STD,flats:!!flats,frets:8,onPress:function(s,f){
      if(locked) return;
      if(picked) fbd.unmark(picked.s,picked.f,'pick');
      picked={s:s,f:f}; fbd.mark(s,f,'pick');
      api.select(function(){
        locked=true; fbd.unmark(s,f,'pick');
        var ok=(s===accept.s&&f===accept.f);
        fbd.mark(s,f,ok?'good':'bad'); if(!ok) fbd.mark(accept.s,accept.f,'good');
        api.done(ok,explain);
      });
    }});
    root.append(fbd.el);
  }};
}

function playBtn(root,notes,gap,label){
  var row=h('<div class="demo"></div>');
  var b=h('<button type="button" class="btn ghost">'+PLAY+' '+(label||'Écouter')+'</button>');
  b.addEventListener('click',function(){seq(notes,gap||800)});
  row.append(b); root.append(row);
}
function EAR(title,q,notes,options,answer,explain,fiche,gap){
  return quizStep({title:title,q:q,options:options,answer:answer,explain:explain,fiche:fiche,
    extra:function(root){playBtn(root,notes,gap||800,'Écouter les deux notes')}});
}
function FRN(title,q,s,f,options,answer,explain,fiche,tuning,flats){
  return quizStep({title:title,q:q,options:options,answer:answer,explain:explain,fiche:fiche,
    extra:function(root){var fbd=fretboard({tuning:tuning||STD,flats:!!flats,frets:8,quiet:true}); fbd.mark(s,f,'pick'); root.append(fbd.el)}});
}
/* Clavier vide : place les noms sur les touches repérées */
function NAME(title,q,targets,pool,given,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var locked=false, active=null, got={}, k, chips=h('<div class="pool"></div>');
    function put(m,name,cls){var key=k.keys[m]; key.innerHTML=BLACK.indexOf(m%12)>=0?'<span>'+name+'</span>':'<span class="l1">'+name+'</span>'; if(cls) key.classList.add(cls)}
    function firstFree(){for(var i=0;i<targets.length;i++) if(got[targets[i].m]===undefined) return targets[i].m; return null}
    function setActive(m){if(active!==null) k.unmark(active,'pick'); active=m; if(m!==null) k.mark(m,'pick')}
    k=keyboard({mode:'both',blank:true,onPress:function(n){
      if(locked) return;
      if(targets.some(function(t){return t.m===n})) setActive(n);
    }});
    targets.forEach(function(t){k.mark(t.m,'tgt')});
    Object.keys(given||{}).forEach(function(m){put(+m,given[m],'given')});
    pool.forEach(function(name){
      var b=h('<button type="button" class="pchip">'+name+'</button>');
      b.addEventListener('click',function(){
        if(locked) return;
        var m=active!==null?active:firstFree(); if(m===null) return;
        got[m]=name; put(m,name); setActive(null);
        var f=firstFree();
        if(f!==null){setActive(f); api.unselect()}
        else api.select(validate);
      });
      chips.append(b);
    });
    function validate(){
      locked=true; setActive(null);
      var ok=true;
      targets.forEach(function(t){
        var good=t.ok.indexOf(got[t.m])>=0; k.unmark(t.m,'tgt'); k.mark(t.m,good?'good':'bad');
        if(!good){ok=false; put(t.m,t.ok[0])}
      });
      api.done(ok,'Réponses : '+targets.map(function(t){return t.ok[0]}).join(', ')+'.');
    }
    root.append(k.el,chips);
    k.el.querySelector('.kbstatus').textContent='Choisis le nom de la touche entourée.';
    setActive(firstFree());
  }};
}
/* Associer : relie chaque élément de gauche à celui de droite */
function MATCH(title,q,pairs,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var n=pairs.length, order=shuffle(pairs.map(function(p,i){return i})), link={}, sel=null, locked=false, Lb=[], Rb=[];
    var grid=h('<div class="match"></div>'), cl=h('<div class="mcol"></div>'), cr=h('<div class="mcol"></div>');
    grid.append(cl,cr); root.append(grid);
    function rightOf(r){for(var i in link) if(link[i]===r) return +i; return -1}
    function paint(){
      pairs.forEach(function(p,i){Lb[i].innerHTML=p[0]+(link[i]!==undefined?'<i class="bd">'+(i+1)+'</i>':''); Lb[i].classList.toggle('sel',sel===i)});
      order.forEach(function(r,j){var li=rightOf(r); Rb[j].innerHTML=pairs[r][1]+(li>=0?'<i class="bd">'+(li+1)+'</i>':'')});
    }
    pairs.forEach(function(p,i){
      var b=h('<button type="button" class="mbtn"></button>'); Lb[i]=b; cl.append(b);
      b.addEventListener('click',function(){
        if(locked) return;
        if(link[i]!==undefined){delete link[i]; api.unselect()}
        sel=(sel===i)?null:i; paint();
      });
    });
    order.forEach(function(r,j){
      var b=h('<button type="button" class="mbtn"></button>'); Rb[j]=b; cr.append(b);
      b.addEventListener('click',function(){
        if(locked||sel===null) return;
        var old=rightOf(r); if(old>=0) delete link[old];
        link[sel]=r; sel=null; paint();
        if(Object.keys(link).length===n) api.select(check); else api.unselect();
      });
    });
    function check(){
      locked=true; var ok=true;
      pairs.forEach(function(p,i){
        var good=link[i]===i; if(!good) ok=false;
        Lb[i].classList.add(good?'good':'bad');
        Rb[order.indexOf(link[i])].classList.add(good?'good':'bad');
      });
      api.done(ok,pairs.map(function(p){return p[0]+' = '+p[1]}).join(' ; ')+'.');
    }
    paint();
  }};
}
/* Remettre dans l'ordre */
function ORDER(title,q,items,explain,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var pool, tray=[], locked=false, trayEl=h('<div class="tray"></div>'), poolEl=h('<div class="pool"></div>');
    do{pool=shuffle(items.map(function(t,i){return i}))}while(items.length>1&&pool.every(function(v,i){return v===i}));
    function paint(){
      trayEl.innerHTML=''; poolEl.innerHTML='';
      tray.forEach(function(idx,pos){
        var b=h('<button type="button" class="pchip">'+items[idx]+'</button>');
        b.addEventListener('click',function(){if(locked) return; tray.splice(pos,1); paint(); api.unselect()});
        trayEl.append(b);
      });
      pool.forEach(function(idx){
        if(tray.indexOf(idx)>=0) return;
        var b=h('<button type="button" class="pchip">'+items[idx]+'</button>');
        b.addEventListener('click',function(){if(locked) return; tray.push(idx); paint(); if(tray.length===items.length) api.select(check)});
        poolEl.append(b);
      });
    }
    function check(){
      locked=true; var ok=true;
      trayEl.querySelectorAll('.pchip').forEach(function(b,i){var good=tray[i]===i; if(!good) ok=false; b.classList.add(good?'good':'bad')});
      api.done(ok,explain+' Ordre : '+items.join(' → ')+'.');
    }
    root.append(trayEl,poolEl); paint();
  }};
}
/* Escalier : clique les touches dans l'ordre demandé */
function STAIRS(title,q,seqNotes,explain,fiche,black){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var picks=[], locked=false, k, cnt=h('<p class="counter"></p>'), reset=h('<button type="button" class="btn ghost small">Effacer</button>');
    function upd(){
      cnt.textContent='Touches jouées : '+picks.length+'/'+seqNotes.length;
      if(picks.length===seqNotes.length) api.select(check); else api.unselect();
    }
    k=keyboard({mode:'both',black:black!==false,onPress:function(n){
      if(locked||picks.length>=seqNotes.length) return;
      picks.push(n); k.mark(n,'pick'); upd();
    }});
    reset.addEventListener('click',function(){
      if(locked) return;
      picks.forEach(function(m){k.unmark(m,'pick')}); picks=[]; upd();
    });
    function check(){
      locked=true; var ok=true;
      picks.forEach(function(m,i){var good=m===seqNotes[i]; if(!good) ok=false; k.unmark(m,'pick'); k.mark(m,good?'good':'bad')});
      if(!ok) seqNotes.forEach(function(m){if(picks.indexOf(m)<0) k.mark(m,'good')});
      api.done(ok,explain);
    }
    var row=h('<div class="row"></div>'); row.append(reset);
    root.append(k.el,cnt,row); upd();
  }};
}

    var wrong=shuffle(FRS.concat(FRF).filter(function(n){return n!==to&&n!==from&&n!==E[1]&&n!==E[2]&&n.indexOf('♯')+n.indexOf('♭')>-2})).slice(0,2);
    return {title:'Do ou C ?',q:'Quelle note est la <span class="hl">même touche</span> que <span class="hl">'+from+'</span> ?',options:[to].concat(wrong),answer:0,explain:E[1]+' et '+E[2]+' désignent la même touche noire.',fiche:F_CLAV};

    options:names(arr,pcs),answer:0,explain:FRS[pc]+' = '+ENS[pc]+'.'};
}

/* ---------- Rythme : moteur audio précis, métronome, séquenceur, défi ---------- */
var BPM=90;
var eng={t:null,timers:[],onStop:null};
function stopEngine(){
  if(eng.t){clearInterval(eng.t); eng.t=null}
  eng.timers.forEach(clearTimeout); eng.timers=[];
  if(eng.onStop){var f=eng.onStop; eng.onStop=null; f()}
}
function runEngine(o){
  stopEngine();
  var c=ac(); if(!c) return;
  eng.onStop=o.onStop||null;
  var i=0, next=c.currentTime+0.08;
  function later2(fn,t){eng.timers.push(setTimeout(fn,Math.max(0,(t-c.currentTime)*1000))); if(eng.timers.length>64) eng.timers.shift()}
  eng.t=setInterval(function(){
    while(next<c.currentTime+0.12){
      if(o.max!=null && i>=o.max){
        clearInterval(eng.t); eng.t=null;
        later2(stopEngine,next+0.1); return;
      }
      o.tick(i,next);
      (function(ii,tt){ if(o.ui) later2(function(){o.ui(ii)},tt) })(i,next);
      next+=o.interval(); i++;
    }
  },25);
}
function env(t,type,f0,f1,g,d){
  var c=ctx, o=c.createOscillator(), gn=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+d*0.6);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t+d+0.02);
}
function clickAt(t,k){
  if(k==='a') env(t,'square',1500,0,0.2,0.05);
  else if(k==='m') env(t,'square',1200,0,0.17,0.05);
  else if(k==='n') env(t,'square',1000,0,0.14,0.05);

var lesson=$('#lesson'), stage=$('#stage'), fill=$('#fill'), countEl=$('#count'), next=$('#next'), fb=$('#fb'), foot=$('#lfoot'), track=$('#track');
var L=null;
function setProgress(n){fill.style.width=(L.n?n/L.n*100:0)+'%'; countEl.textContent=n+'/'+L.n; track.setAttribute('aria-valuenow',String(n)); track.setAttribute('aria-valuemax',String(L.n))}
function startNode(id){
  stopEngine();
  var nd=NODES[id], steps, retry;
  if(!nd) return;
  if(nd.kind==='quiz'){steps=quizSteps(id); retry=false}
  else if(nd.kind==='game'){steps=gameSteps(id); retry=false}
  else {steps=LESSONS[id].steps; retry=true}
  L={id:id,kind:nd.kind,steps:steps,retry:retry,n:steps.length,total:steps.filter(function(s){return s.graded}).length,
     queue:steps.map(function(s,i){return i}),pos:0,score:0,passed:0,tried:{},phase:'steps',validate:null,answered:false};
  lesson.hidden=false; document.body.style.overflow='hidden';
  renderStep();
}
function renderStep(){
  clearTimers();
  var cur=L.queue[L.pos], s=L.steps[cur], retry=!!L.tried[cur];
  setProgress(L.passed); foot.className='lfoot'; fb.textContent=''; next.textContent=s.graded?'Valider':'Continuer'; next.disabled=!!s.graded;
  L.validate=null; L.answered=false;
  stage.innerHTML=''; var root=h('<div class="step"></div>'); stage.append(root);
  var answered=false;
  var api={select:function(fn){
    if(answered) return;
    L.validate=fn; next.disabled=false;
  },unselect:function(){
    if(answered) return;
    L.validate=null; next.disabled=true;
  },done:function(ok,msg){
    if(answered) return; answered=true; L.answered=true; L.validate=null;
    var first=!L.tried[cur]; L.tried[cur]=true;
    if(first&&s.fiche) record(s.fiche.id,ok);
    touchDay();
    if(ok){ if(first) L.score++; L.passed++; setProgress(L.passed); }
    else if(L.retry){ L.queue.push(cur); }
    else { L.passed++; setProgress(L.passed); }
    foot.className='lfoot '+(ok?'good':'bad');
    fb.textContent=ok ? 'Bien joué ! '+msg : 'Pas tout à fait. '+msg;
    next.textContent='Continuer'; next.disabled=false;
    try{next.focus({preventScroll:true})}catch(e){}
  }};
  s.render(root,api);
  if(retry) root.insertAdjacentHTML('afterbegin','<p class="eyebrow">Question à refaire</p>');
  if(s.fiche) root.append(h('<p class="fiche">Fiche de théorie : <button type="button" class="linkbtn" data-f="'+s.fiche.id+'">'+s.fiche.label+'</button></p>'));
  document.querySelector('.lbody').scrollTop=0;
}
function showResults(){
  clearTimers(); L.phase='results'; L.passed=L.n; setProgress(L.n);
  var big, lead, title;
  S.done[L.id]=true;
  if(L.kind==='quiz'){
    var pct=Math.round(100*L.score/L.total);
    S.best[L.id]=Math.max(pct,S.best[L.id]||0);
    title='Quiz terminé'; big=pct+' %';
    lead=(pct>=80?'Quiz réussi. ':'Seuil de réussite : 80 %. Relis les leçons de l’unité, puis retente. ')+'Meilleur score : '+S.best[L.id]+' %.';
  }else if(L.kind==='game'){
    S.best[L.id]=Math.max(L.score,S.best[L.id]||0);
    title='Exercice terminé'; big=L.score+'/'+L.total;
    lead='Record : '+S.best[L.id]+'/'+L.total+'.';
  }else{
    title=L.kind==='project'?'Application terminée':'Leçon terminée'; big=L.score+'/'+L.total;
    lead='Réponses justes du premier coup. '+(L.score===L.total?'Aucune erreur.':'Relis la fiche de théorie si besoin, puis refais la leçon pour améliorer ton score.');
  }
  saveS();
  foot.className='lfoot good'; fb.textContent=''; next.disabled=false; next.textContent='Retour au parcours';
  stage.innerHTML='<h2>'+title+'</h2>'+(L.total?'<div class="score">'+big+'</div>':'')+'<p class="lead">'+lead+'</p>'+
    '<div class="row"><button type="button" class="btn ghost" id="redo">Refaire</button><button type="button" class="linkbtn" data-f="f-noms">Ouvrir la fiche de théorie</button></div>';
  var id=L.id; stage.querySelector('#redo').addEventListener('click',function(){startNode(id)});
}
function closeLesson(){
  clearTimers(); lesson.hidden=true; document.body.style.overflow='';
  renderTheory(); renderSuivi();
}
next.addEventListener('click',function(){
  if(!L) return;
  if(L.phase==='results'){closeLesson(); return}
  var g=L.steps[L.queue[L.pos]].graded;
  if(g && !L.answered){ if(L.validate) L.validate(); return }
  if(!g){L.passed++; touchDay()}

});

var FICHE=''+
'<h3 id="f-noms">Les sept noms de notes</h3>'+
'<p>Deux écritures coexistent. Le système syllabique (Do, Ré, Mi, Fa, Sol, La, Si) est employé en France, en Italie, en Espagne et dans de nombreux autres pays. Le système alphabétique (C, D, E, F, G, A, B) est celui du monde anglophone.</p>'+
'<p><b>Correspondance :</b> Do = C, Ré = D, Mi = E, Fa = F, Sol = G, La = A, Si = B.</p>'+
'<p>Dans les pays germaniques, notre Si s’écrit H et la lettre B désigne le Si bémol.</p>'+
'<h3 id="f-clavier">Dièses, bémols et clavier</h3>'+
'<p>Une octave contient 12 notes : 7 naturelles (touches blanches) et 5 altérées (touches noires). Une touche noire prend le nom de sa voisine : dièse (♯) en partant de la touche blanche à gauche, bémol (♭) en partant de celle à droite.</p>'+
'<p>Sur un instrument accordé en tempérament égal, comme le piano, une même touche noire porte deux noms : Do♯ et Ré♭ désignent la même hauteur.</p>'+
'<h3 id="f-alter">Dièse, bémol, bécarre</h3>'+
'<p>Le dièse (♯) monte une note d’un demi-ton, le bémol (♭) la descend d’un demi-ton, le bécarre (♮) annule une altération.</p>'+
'<p>Deux notes qui sonnent pareil au piano mais s’écrivent différemment sont dites enharmoniques. Exemples : Do♯ et Ré♭, mais aussi Mi♯ et Fa, Si♯ et Do, Fa♭ et Mi, Do♭ et Si.</p>'+
'<h3 id="f-tons">Ton et demi-ton</h3>'+
'<p>Le demi-ton est le plus petit intervalle du système tempéré. Exemples : mi-fa, si-do, sol♯-la, ré-mi♭. Un ton vaut deux demi-tons.</p>'+
'<p class="note">Entre Mi et Fa, comme entre Si et Do, il n’y a pas de touche noire : ces paires sont distantes d’un demi-ton.</p>'+
'<h3 id="f-manche">Le manche et les accordages</h3>'+
'<p>Sur une guitare, passer d’une case à la suivante monte la note d’un demi-ton.</p>'+
'<p><b>Accordage standard</b> (de la corde grave à la plus aiguë) : E2, A2, D3, G3, B3, E4, soit Mi La Ré Sol Si Mi.</p>'+
'<p><b>Half-step down</b> (accordage en Mi♭) : toutes les cordes descendent d’un demi-ton, soit E♭2, A♭2, D♭3, G♭3, B♭3, E♭4.</p>'+
'<p><b>Drop D</b> : seule la corde grave descend d’un ton entier, de Mi à Ré (D2). Les autres cordes ne changent pas.</p>'+
'<h3 id="f-octave">Octaves et fréquences</h3>'+
'<p>Deux notes qui portent le même nom à une octave d’écart ont des fréquences dans le rapport 2 : 220, 440 et 880 Hz pour La3, La4 et La5.</p>'+
'<p>En tempérament égal, l’octave est découpée en 12 demi-tons identiques. Chaque demi-ton multiplie la fréquence par la racine douzième de 2, soit environ 1,0595.</p>'+
'<p>Le La4 à 440 Hz est la référence d’accordage. L’American Standards Association l’a recommandé en 1936, l’ISO l’a repris en 1955 puis normalisé en 1975 (ISO 16). En Europe continentale, on accorde souvent entre 440 et 444 Hz.</p>'+
'<h3 id="f-nommer">Numéroter les octaves</h3>'+
'<p>Dans la notation scientifique (ou internationale), on écrit la lettre suivie d’un numéro d’octave. Le numéro change à chaque Do : le Si juste en dessous de C4 est donc B3.</p>'+
'<p><b>Repères :</b> Do central = C4 ≈ 261,63 Hz = note MIDI 60. La4 = note MIDI 69 = 440 Hz. La note la plus grave d’un piano standard est La0 (27,5 Hz). La corde de Mi grave d’une guitare en accordage standard sonne un Mi2 (E2), environ 82,4 Hz.</p>'+
'<p><b>Les conventions varient.</b> Certains logiciels et claviers (Yamaha, GarageBand) appellent le Do central C3. FL Studio numérote les octaves de 0 à 10 et l’affiche C5. C’est la même note MIDI, seul le nom change. Une note de guitare E2 s’y affiche donc E3.</p>'+
'<p class="note">Les règles de base sont stables. Les conventions des logiciels peuvent évoluer : pour un réglage précis, recoupe avec la source citée.</p>'+
'<h3>Sources</h3>'+
'<ol>'+
'<li><a href="https://www.guichetdusavoir.org/question/voir/68357" target="_blank" rel="noopener">Guichet du Savoir : notation syllabique et alphabétique</a></li>'+
'<li><a href="https://en.wikipedia.org/wiki/Musical_note" target="_blank" rel="noopener">Wikipedia : Musical note (noms de notes selon les pays, altérations)</a></li>'+
'<li><a href="https://www.universalis.fr/encyclopedie/gamme/2-guy-d-arezzo-et-la-gamme/" target="_blank" rel="noopener">Encyclopædia Universalis : la gamme (correspondance lettres, demi-ton)</a></li>'+
'<li><a href="https://human.libretexts.org/Bookshelves/Music/Music_Theory/Understanding_Basic_Music_Theory_(Schmidt-Jones)/01%3A_Notation_-_Pitch/1.05%3A_Enharmonic_Spelling" target="_blank" rel="noopener">LibreTexts, Understanding Basic Music Theory : enharmonie</a></li>'+
'<li><a href="https://muted.io/guitar-tuning-chart" target="_blank" rel="noopener">Muted.io : tableau des accordages de guitare (standard, half-step down, drop D)</a></li>'+
'<li><a href="https://www.fender.com/articles/play/alternate-tuning-drop-d" target="_blank" rel="noopener">Fender : accordage drop D</a></li>'+
'<li><a href="https://www.cs.cmu.edu/~15322/book/ch04/01.html" target="_blank" rel="noopener">Carnegie Mellon, cours de musique par ordinateur : hauteurs et octaves</a></li>'+
'<li><a href="https://en.wikipedia.org/wiki/A440_(pitch_standard)" target="_blank" rel="noopener">Wikipedia : A440 (pitch standard)</a></li>'+
'<li><a href="https://en.wikipedia.org/wiki/Scientific_pitch_notation" target="_blank" rel="noopener">Wikipedia : Scientific pitch notation</a></li>'+
'<li><a href="https://en.wikipedia.org/wiki/C_(musical_note)" target="_blank" rel="noopener">Wikipedia : C (musical note), Do central</a></li>'+
'<li><a href="https://flutopedia.com/octave_notation.htm" target="_blank" rel="noopener">Flutopedia : notation des octaves, numéros MIDI et touches de piano</a></li>'+

/* ---------- Onglets ---------- */
var TABS=[
  {id:'histoire',label:'Histoire'},{id:'theorie',label:'Théorie'},{id:'guitare',label:'Guitare'},{id:'fl-studio',label:'FL Studio'},
  {id:'mixage',label:'Mixage & mastering'},{id:'synthe',label:'Synthé'},{id:'chant',label:'Chant'},{id:'jembe',label:'Jembé'},{id:'rythme',label:'Rythme'},{id:'suivi',label:'Suivi'}
];
var INFO={
  histoire:{h:'Histoire de la musique',intro:'Niveau de départ : quelques bases. Des épisodes courts pour situer les œuvres, les genres et les artistes.',
    items:['Compositeurs et grandes œuvres','Innovations','Apparition des genres','Place des artistes','Inégalités']},
  guitare:{h:'Guitare',intro:'Tu joues déjà. Cet onglet comble le côté théorique, sur ta Stratocaster comme sur ton électro-acoustique.',
    items:['Notes sur le manche','Accords','Accordages','Les différentes guitares et marques','Fonctionnement des micros','Modifier une guitare'],
    gearTitle:'Ton matériel',gear:['Fender Stratocaster électrique','Fender électro-acoustique','6 cordes','Accordages : standard, half-step down, drop D']},
  'fl-studio':{h:'FL Studio',intro:'Tu enregistres et tu crées des sons. On passe à une organisation de projet propre et à une vraie maîtrise des plugins.',
    items:['Prise en main depuis zéro','Organiser un projet de manière professionnelle','Plugins et VST natifs','Plugins et VST ajoutés'],
    gearTitle:'Ton installation',gear:['FL Studio, Producer Edition','Instruments : BBC Symphony Orchestra, FLEX, Helm, SINE Player, Splice INSTRUMENT, SSDSampler5, Surge XT, TyrellN6','Effets : AmpliTube 5, Denoiser Classic, Fresh Air, LALA, TAL-Bitcrusher 2, Vinyl']},
  mixage:{h:'Mixage et mastering',intro:'Tu pars presque de zéro. On construit une méthode pas à pas.',
    items:['Mixer et masteriser pour un rendu professionnel','Adapter le rendu selon les plateformes de publication','Gérer les entrées de vrais instruments ou de voix']},
  synthe:{h:'Synthétiseur',intro:'Tu as déjà utilisé des synthés. On relie les réglages à la théorie, sur tes propres instruments.',
    items:['Créer n’importe quel son','Utiliser les modules fournis','Connaître les différences entre synthétiseurs','Relier la pratique à la théorie'],
    gearTitle:'Tes synthés',gear:['FLEX','Helm','Surge XT','TyrellN6']},
  chant:{h:'Chant',intro:'Tu apprends en autodidacte. On ajoute la théorie et on traite les différents types de cris, avec les précautions qui protègent la voix.',
    items:['Les différentes techniques et comment les pratiquer','Reconnaître sa tessiture','Les différents types de cris']},
  jembe:{h:'Jembé',intro:'Tu ne lis pas la partition. On part de la pulsation et des rythmes, puis d’une notation simple. Le module Rythme et lecture de la Théorie sert de base.',
    items:['Bases des rythmes','Comment en jouer']}
};
function infoHTML(t){
  var d=INFO[t.id];
  return '<p class="eyebrow">'+t.label+'</p><h1 class="page">'+d.h+'</h1><p class="lede">'+d.intro+'</p>'+
    '<div class="card"><h2>Au programme</h2><ul class="plain">'+d.items.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul></div>'+
    (d.gear?'<div class="card"><h2>'+d.gearTitle+'</h2><ul class="chips">'+d.gear.map(function(g){return '<li class="chipx">'+g+'</li>'}).join('')+'</ul></div>':'')+
    '<p class="status">Cet onglet sera construit après la Théorie, dans le même format d’unités et de leçons courtes.</p>';
}
var nav=$('#tabs'), main=$('#panels');
TABS.forEach(function(t){
  var b=h('<button type="button" class="tab" role="tab" id="tab-'+t.id+'" aria-controls="p-'+t.id+'" aria-selected="false">'+t.label+'</button>');
  b.addEventListener('click',function(){ try{location.hash=t.id}catch(e){} show(t.id) });
  nav.append(b);
  var p=h('<section class="panel" role="tabpanel" id="p-'+t.id+'" aria-labelledby="tab-'+t.id+'" hidden></section>');
  if(t.id!=='theorie'&&t.id!=='suivi'&&t.id!=='rythme') p.innerHTML=infoHTML(t);
  main.append(p);
});
nav.append(h('<span class="tab ghost" aria-hidden="true">+ Autres sujets plus tard</span>'));
function show(id){
  if(!TABS.some(function(t){return t.id===id})) id='theorie';
  if(id!=='rythme') stopEngine();
  TABS.forEach(function(t){
    var on=t.id===id;
    $('#tab-'+t.id).setAttribute('aria-selected',String(on));
    $('#p-'+t.id).hidden=!on;
  });
}
window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
renderTheory(); renderSuivi(); renderRythme();
show(location.hash.slice(1));
})();
</script>

</body>
</html>
