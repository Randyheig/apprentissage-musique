TL('fl131','Le canal Sampler',F_SMP,[
 ['Charger et couper un sample','Selon le manuel d’Image-Line, on glisse un sample du navigateur vers le Channel Rack (sur la Playlist, cela crée un clip audio). <b>Sample Start</b> coupe le début, <b>Length</b> redéfinit la fin ; <b>Start Offset</b> décale le départ sans toucher aux données et peut être automatisé. Des points de boucle (Loop Start/End) permettent de boucler tant qu’une note est tenue, avec un mode « ping pong ». Sans enveloppe de volume active, les samples continuent à jouer après le relâchement de la note.'],
 ['Hauteur, durée et déclic','<b>PITCH</b> change la hauteur sans changer la durée ; <b>MUL</b> multiplie la durée ; <b>TIME</b> fixe la durée. Modes temps réel : <i>Resample</i> (la hauteur suit la vitesse, comme une bande), <i>Stretch</i> (hauteur et timing conservés), <i>Stretch pro</i> (ajoute le décalage de formants). Modes Elastique hors ligne : <i>e3</i>, <i>Slice stretch</i> (boucles de batterie) etc. Le <b>declicking</b> réduit les clics au début/fin d’un sample ; par défaut, un fondu de sortie de 10 ms. Les outils précalculés (Reverse, Normalize…) sont appliqués aux données du sample, pas en temps réel.']],[
 ['Playlist','Que crée un sample déposé sur la Playlist ?',['Un clip audio','Un pattern','Un canal d’automation'],'Manuel Image-Line.'],
 ['Start Offset','Que fait Start Offset ?',['Il décale le départ sans couper les données','Il supprime le sample','Il change la tonalité du projet'],'Manuel.'],
 ['Resample','Que fait le mode Resample ?',['La hauteur change avec la vitesse, comme sur une bande','Il garde la hauteur identique','Il ajoute de la réverb'],'Manuel.'],
 ['Declicking','À quoi sert le declicking ?',['À réduire les clics au début ou à la fin d’un sample','À accélérer le sample','À baisser le tempo'],'Manuel.'],
 ['Précalculé','Les outils précalculés (Reverse, Normalize…) agissent…',['Sur les données du sample, pas en temps réel','Seulement en temps réel','Sur le master'],'Manuel.']]);
TL('fl141','FPC, ta boîte à rythmes',F_FPC,[
 ['Un sampler en pads','Selon le manuel, <b>FPC</b> est une boîte à rythmes logicielle inspirée de l’Akai MPC : un sampler multicouche sensible à la vélocité. Chaque patch a <b>32 pads</b> en deux banques (A et B) de 16. On clique un pad pour le sélectionner et charger ses couches ; clic droit pour le jouer sans changer la sélection. Chaque pad a une note MIDI racine et une octave qui le déclenchent, réglables à la main, par « Learn » ou en auto-mappant une banque.'],
 ['Couches, groupes et kits','Chaque pad peut contenir plusieurs samples couvrant chacun une plage de vélocité ; des modes aléatoires (Cycle, Random…) choisissent la couche. Les réglages <b>CUT</b> et <b>BY</b> permettent à un pad d’arrêter un autre (un charleston fermé coupe un ouvert). Les kits se sauvent en presets .fst et s’exportent en pads, WAV, SFZ ou DirectWave.']],[
 ['Pads','Combien de pads par patch FPC ?',['32 (deux banques de 16)','8','128'],'Manuel Image-Line.'],
 ['Modèle','De quel appareil FPC s’inspire-t-il ?',['L’Akai MPC','Le Moog','Le Theremin'],'Manuel.'],
 ['Cut','À quoi servent CUT et BY ?',['À ce qu’un pad arrête un autre (charleston fermé/ouvert)','À changer de tonalité','À exporter'],'Manuel.'],
 ['Couches','Que couvre chaque couche d’un pad ?',['Une plage de vélocité','Une tonalité','Un tempo'],'Manuel.']]);
TL('fl151','Patcher',F_PAT,[
 ['Chaîner instruments et effets','Selon le manuel, <b>Patcher</b> est un « wrapper » (instrument ou effet) qui chaîne instruments et effets, réutilisable dans d’autres projets. Dans l’onglet Map, les plugins sont des nœuds : on tire un lien d’une sortie vers une entrée compatible. Les modules d’une même colonne traitent en <b>parallèle</b>, ceux des colonnes suivantes en <b>série</b>. Liens colorés : audio (jaune), paramètres (rouge), événements (vert).'],
 ['Surface de contrôle','Un onglet Control Surface offre boutons, curseurs, cases et claviers temps réel, que l’on relie aux paramètres des plugins. On peut sauvegarder ses chaînes favorites en presets et « patcheriser » un plugin existant en glissant Patcher dessus avec Maj.']],[
 ['Définition','Qu’est-ce que Patcher ?',['Un wrapper qui chaîne instruments et effets','Un synthé unique','Un enregistreur'],'Manuel Image-Line.'],
 ['Colonnes','Comment traitent les modules d’une même colonne ?',['En parallèle','En série','Pas du tout'],'Manuel.'],
 ['Liens','Quelle couleur pour les liens audio ?',['Jaune','Rouge','Vert'],'Manuel.'],
 ['Surface','À quoi sert la Control Surface ?',['À créer des contrôles liés aux paramètres des plugins','À exporter en MP3','À régler le tempo'],'Manuel.']]);
TL('fl161','Enregistrer de l’audio',F_REC,[
 ['Entrée et armement','Selon le manuel, l’enregistrement audio demande l’édition Producer ou supérieure. Sous Windows, choisis un pilote <b>ASIO</b> (les pilotes du fabricant sont recommandés plutôt que FL Studio ASIO, qui peut ajouter de la latence). Chaque piste de mixeur prend une entrée stéréo ; pour une source mono, choisis dans la liste mono. <b>N’enregistre pas sur la piste Master</b> : utilise une piste libre. Choisir une entrée arme la piste ; Play enregistre, Stop termine, et le résultat apparaît comme clip audio en mode Song. Le niveau d’enregistrement est contrôlé par l’interface audio.'],
 ['Écoute, latence, boucle','Monitoring : Off, When armed ou On. Pour une faible latence, utilise l’écoute directe de ton interface et coupe le monitoring interne, ou baisse la taille de buffer. La <b>compensation de latence</b> (Disk Recording) retire le retard dû au buffer. Le bouton d’enregistrement en un clic crée une piste audio et démarre après un décompte de 4 clics. Edison enregistre en RAM (environ 20 Mo par minute) ; au-delà de 15 minutes, enregistre dans la Playlist. Pour enregistrer en boucle, utilise « Loop record » ; une mesure d’amorce évite les accrocs des premières millisecondes.']],[
 ['Édition','Quelle édition faut-il pour enregistrer de l’audio ?',['Producer ou supérieure','Fruity','Aucune'],'Manuel Image-Line.'],
 ['Piste','Sur quelle piste ne faut-il pas enregistrer ?',['Le Master','Une piste libre','Une piste d’insert'],'Manuel.'],
 ['Niveau','Qui contrôle le niveau d’enregistrement ?',['L’interface audio','Le Channel Rack','Le tempo'],'Manuel.'],
 ['Latence','Que fait la compensation de latence ?',['Elle retire le retard dû au buffer des enregistrements','Elle change le tempo','Elle ajoute de la réverb'],'Manuel.'],
 ['Décompte','Combien de clics dans le décompte de l’enregistrement en un clic ?',['4','1','16'],'Manuel.']]);

TL('m161v','Mixer une voix',F_VOX,[
 ['Un ordre de travail','Selon LANDR : 1) <b>nettoyer</b> (choisir les meilleures prises, retirer clics et bruits, corriger la hauteur si besoin) ; 2) <b>compresser</b> : lisser les niveaux par automation avant les compresseurs, puis compression en série (un compresseur rapide, puis un plus lent et plus doux) ; 3) <b>égaliser</b> ; 4) <b>de-esser</b> ; 5) <b>réverb et delay</b> ; 6) <b>équilibrer</b> avec le morceau en automatisant les niveaux ou les effets lors des refrains et montées.'],
 ['Les zones de fréquences citées','LANDR propose : passe-haut si le grave est « nuageux » ; couper environ <b>150–350 Hz</b> pour réduire la boue ; couper <b>3,5–7 kHz</b> si c’est agressif ; accentuer <b>800 Hz–2,5 kHz</b> pour la puissance et <b>8–12 kHz</b> pour l’air. Les effets vont sur des retours auxiliaires réglés à <b>100 % wet</b>, mélangés depuis le mixeur.']],[
 ['Début','Quelle est la première étape citée ?',['Nettoyer les prises','Ajouter de la réverb','Exporter'],'LANDR.'],
 ['Boue','Quelle zone couper pour réduire la boue d’une voix ?',['Environ 150–350 Hz','Environ 8–12 kHz','Environ 20 kHz'],'LANDR.'],
 ['Air','Quelle zone accentuer pour l’air ?',['8–12 kHz','150–350 Hz','50 Hz'],'LANDR.'],
 ['Effets','Comment placer réverb et delay ?',['Sur des retours auxiliaires à 100 % wet','Sur le master seulement','Directement à 0 % wet'],'LANDR.'],
 ['Compression','Quelle approche de compression est citée ?',['En série : un compresseur rapide puis un plus lent','Un seul limiteur','Aucune'],'LANDR.']]);
TL('m171','Mixer la batterie',F_DRM,[
 ['Objectifs et ordre','Selon MusicRadar, les objectifs sont la séparation des éléments et un son puissant ; les outils : EQ, gates et compresseurs. <b>Grosse caisse</b> : gate pour couper les fuites, passe-bas des sub-graves excessifs (low cut), poids dans le grave, « clic » dans l’aigu, couper les médiums « boîteux », compresser. <b>Caisse claire</b> : gate sur les deux micros sans couper les notes fantômes, passe-haut raide, corps et claquement, compression du micro du dessus. <b>Charleston</b> : passe-haut, gate, un peu d’air, niveau plus bas, légèrement décalé.'],
 ['Overheads, room et panoramique','<b>Overheads</b> : shelf aigu pour la brillance des cymbales. <b>Micros de pièce (room)</b> : panoramique gauche/droite, passe-haut, niveau modéré (trop, et la batterie perd son focus). Si deux micros de caisse claire sonnent creux, l’un est peut-être en opposition de phase : inverse la polarité. Panoramique : grosse caisse et caisse claire au centre, charleston légèrement de côté, toms répartis sans aller trop large. Le bus batterie reçoit des coupes douces et une compression de nivellement légère, avec mélange en parallèle.']],[
 ['Centre','Quels éléments reste-t-on au centre ?',['Grosse caisse et caisse claire','Charleston seulement','Toms seulement'],'MusicRadar.'],
 ['Phase','Si deux micros de caisse claire sonnent creux, que faire ?',['Inverser la polarité de l’un','Les couper tous deux','Monter le master'],'MusicRadar.'],
 ['Room','Que faire du niveau des micros de pièce ?',['Le garder modeste','Le monter au maximum','Les supprimer toujours'],'MusicRadar.'],
 ['Gate','À quoi sert le gate sur la grosse caisse ?',['À couper les fuites des autres éléments','À allonger la note','À ajouter de la réverb'],'MusicRadar.'],
 ['Bus','Quel traitement sur le bus batterie ?',['Coupes douces et compression de nivellement légère','Aucun jamais','Un delay de 1 s'],'MusicRadar.']]);
TL('m181','Basse et grosse caisse',F_BAS,[
 ['Ne pas se disputer le grave','Selon Sonarworks, commence par l’<b>arrangement</b> : kick et basse peuvent jouer ensemble ou alterner, mais leur énergie grave ne doit pas se gêner. En EQ : sur la grosse caisse, renforcer une bande étroite vers <b>50 Hz</b> et couper doucement <b>100–250 Hz</b> ; sur la basse, faire l’inverse. Couper la « boîte » de la grosse caisse vers 300–600 Hz. Pousser la basse vers 900 Hz–1,5 kHz l’aide à percer dans un mix dense. Garder kick et basse au <b>centre, en mono</b>.'],
 ['Sidechain, dynamique, basse DI','Compresseur sur la basse piloté par la grosse caisse : la basse baisse brièvement à chaque coup (attaque et release rapides). Un EQ dynamique peut n’atténuer la basse que quand elle chevauche le kick. Attaque lente (au-delà d’environ 30 ms) pour garder les transitoires. Sound On Sound, pour une basse en DI : passe-haut vers 30 Hz (le Mi grave d’une 4 cordes est à 41 Hz) ; compression de départ 2:1 avec 4–5 dB de réduction au plus, attaque 10–20 ms ; la DI sert plutôt de complément sous le son d’ampli.']],[
 ['Arrangement','Par où commence-t-on selon Sonarworks ?',['Par l’arrangement','Par le mastering','Par la réverb'],'Sonarworks.'],
 ['Kick','Quelle bande renforcer sur la grosse caisse ?',['Étroite, vers 50 Hz','Large, vers 10 kHz','Vers 2 kHz'],'Sonarworks.'],
 ['Mono','Où placer kick et basse ?',['Au centre, en mono','Très larges','Sur les côtés'],'Sonarworks.'],
 ['Sidechain','Dans le sidechain kick/basse, qu’est-ce qui baisse ?',['La basse','La grosse caisse','Le master'],'Sonarworks.'],
 ['Mi grave','À quelle fréquence est le Mi grave d’une basse à 4 cordes ?',['41 Hz','100 Hz','1 kHz'],'Sound On Sound.']]);
TL('m191','Vérifier sur différents supports',F_PLB,[
 ['Chaque support colore le son','Selon iZotope, chaque système colore le son : compare avec des pistes de référence. <b>Enceintes de studio</b> : ton point d’ancrage. <b>Casque</b> : repère les petits détails (consonnes dures, queues de réverb bizarres), mais il peut tromper sur le stéréo et le grave (souvent trop peu de basses, ce qui tente de les monter). <b>Écouteurs</b> : graves renforcés et médiums creusés par conception ; si la voix reste claire, le mix est bon.'],
 ['Voiture, téléphone, mono','<b>Voiture</b> : le grave est le test principal (kick et basse restent-ils distincts ? le kick traîne-t-il ?). <b>Salon, barre de son, radio</b> : ramènent le stéréo vers le mono et testent le repli. <b>Haut-parleur de téléphone</b> : retire presque tout le sub et écrase le stéréo ; il met en évidence la dureté ou la matité des médiums aigus. La <b>compatibilité mono</b> compte, car beaucoup d’auditeurs sont loin des enceintes. Sound On Sound ajoute : une petite enceinte sert à juger le <b>niveau</b> (la voix dans le mix), pas la tonalité.']],[
 ['Casque','Le casque peut tromper sur…',['Le stéréo et le grave','Le tempo','La tonalité'],'iZotope.'],
 ['Écouteurs','Comment sont typiquement les écouteurs ?',['Graves renforcés, médiums creusés','Parfaitement plats','Sans grave'],'iZotope.'],
 ['Voiture','Quel est le test principal en voiture ?',['Le grave','Le charleston','Le tempo'],'iZotope.'],
 ['Téléphone','Que fait un haut-parleur de téléphone ?',['Il retire presque tout le sub et écrase le stéréo','Il amplifie les graves','Il ajoute de la réverb'],'iZotope.'],
 ['Petite enceinte','À quoi sert une petite enceinte selon Sound On Sound ?',['À juger le niveau, pas la tonalité grave','À juger le sub','À régler le tempo'],'Sound On Sound.']]);
TL('m201','Plateformes : Spotify, YouTube, SoundCloud…',F_PLT,[
 ['Spotify','Selon le support Spotify : le niveau par défaut (« Normal ») est <b>−14 LUFS</b> ; « Loud » −11 ; « Quiet » −19. Recommandation : cibler −14 LUFS integrated ; pour les formats avec perte (Ogg Vorbis, AAC), garder le true peak sous <b>−1 dB TP</b> ; si ton master est plus fort que −14 LUFS, le garder sous <b>−2 dB TP</b>. Un morceau plus fort est baissé (sans distorsion) ; un morceau plus faible est monté, en laissant 1 dB de marge. La normalisation s’applique à tous les formats, y compris lossless ; le lecteur web et les appareils tiers ne l’utilisent pas.'],
 ['Les autres plateformes','Selon iZotope : Apple Music −16 LUFS ; YouTube −14 (toujours actif, les morceaux faibles ne sont pas remontés) ; Amazon Music −14 ; Tidal −14 (par album) ; Deezer −15 ; <b>SoundCloud : pas de normalisation et pas de flux lossless</b>, donc un master à part peut se justifier. Selon Mastering The Mix, SoundCloud transcode en MP3 128 kbps : les pistes à crêtes élevées peuvent saturer. Conseils d’iZotope : tu n’as pas à coller à la cible pour être bien entendu ; privilégie la musique plutôt qu’un standard ; fais confiance à tes oreilles.']],[
 ['Spotify','Quel est le niveau Spotify par défaut ?',['−14 LUFS','−11 LUFS','−19 LUFS'],'Support Spotify.'],
 ['True peak','Quel true peak max recommandé par Spotify pour les formats avec perte ?',['Sous −1 dB TP','Au-dessus de 0','−30 dB TP'],'Support Spotify.'],
 ['SoundCloud','Que fait SoundCloud côté normalisation ?',['Rien : pas de normalisation','−14 LUFS','−16 LUFS'],'iZotope.'],
 ['Apple','Quelle cible pour Apple Music ?',['−16 LUFS','−14 LUFS','−8 LUFS'],'iZotope.'],
 ['Deezer','Quelle cible pour Deezer ?',['−15 LUFS','−14 LUFS','−16 LUFS'],'iZotope.']]);

TL('fl171','Créer et utiliser des templates',F_TPL,[
 ['Démarrer d’un modèle','Selon le menu File du manuel d’Image-Line, <b>New from template</b> propose des sous-menus (Genre, Minimal, Other, Utility). Le template <b>par défaut</b> se choisit dans les General Settings. <b>Save as template</b> enregistre le projet courant dans la liste des templates. Tu peux aussi sauver un template à la main dans ton dossier de données utilisateur, sous « FL Studio\\Projects\\Templates ». Image-Line précise que FL Studio 20 a changé l’emplacement des templates personnalisés.'],
 ['Versions et sauvegardes','<b>Save new version</b> (Ctrl+N) enregistre une copie au nom unique (MonProjet_2, puis _3) sans toucher à l’original. Les <b>projets récents</b> (Alt+1 à 0) listent les 10 derniers ouverts. L’<b>autosave</b> local se règle dans File Settings > Backup ; « Revert to last backup » recharge la dernière sauvegarde. Raccourcis d’export : Ctrl+R (wave), Maj+Ctrl+R (mp3/ogg), Maj+Ctrl+M (MIDI).']],[
 ['Template','Que fait « Save as template » ?',['Il enregistre le projet courant dans la liste des templates','Il exporte en MP3','Il efface le projet'],'Manuel Image-Line.'],
 ['Défaut','Où choisit-on le template par défaut ?',['Dans les General Settings','Dans le Piano roll','Dans le Mixer'],'Manuel.'],
 ['Version','Que fait « Save new version » (Ctrl+N) ?',['Il enregistre une copie au nom unique','Il écrase l’original','Il ferme FL Studio'],'Manuel.'],
 ['Récents','Quels raccourcis ouvrent les projets récents ?',['Alt+1 à 0','Ctrl+1 à 0','F1 à F10'],'Manuel.'],
 ['Export','Quel raccourci exporte en wave ?',['Ctrl+R','Ctrl+W','Maj+Ctrl+M'],'Manuel.']]);
TL('fl181','Les raccourcis essentiels',F_SHC,[
 ['Général, Playlist, Piano roll','Selon le manuel : <b>Ctrl+Z</b> annule/rétablit ; <b>Espace</b> lance/arrête la lecture ; <b>Ctrl+S</b> sauvegarde ; <b>Ctrl+T</b> transforme le clavier de l’ordinateur en clavier de piano (les raccourcis à une touche ne marchent que si cette option est désactivée) ; <b>F7</b> ouvre le Piano roll ; <b>Échap</b> ferme une fenêtre. Playlist : <b>E</b> sélection, <b>B</b> pinceau, <b>D</b> suppression, Ctrl+C/Ctrl+V. Piano roll : <b>P</b> crayon, <b>Alt+Q</b> quantifier, <b>Ctrl+Haut/Bas</b> transpose d’une octave.'],
 ['Channel Rack, Mixeur, Navigateur, souris','Channel Rack : <b>Alt+C</b> clone les canaux sélectionnés ; <b>Alt+Haut/Bas</b> les déplace ; <b>Ctrl+1…0</b> met en solo les dix premiers canaux. Mixeur : <b>S</b> solo, <b>F2</b> renomme la piste. Navigateur : <b>Entrée</b> remplace le canal par l’élément ; <b>Maj+Haut/Bas</b> parcourt avec aperçu. Souris : <b>Alt + clic droit</b> sur la Playlist écoute un clip ; <b>Maj + clic gauche</b> clone la sélection ; <b>Alt + molette</b> dans le Piano roll change une propriété de la note.']],[
 ['Piano roll','Quelle touche ouvre le Piano roll ?',['F7','F9','Échap'],'Manuel.'],
 ['Crayon','Quelle touche active le crayon dans le Piano roll ?',['P','B','D'],'Manuel.'],
 ['Cloner','Quel raccourci clone les canaux sélectionnés ?',['Alt+C','Ctrl+C','Maj+C'],'Manuel.'],
 ['Solo','Quelle touche met en solo la piste de mixeur courante ?',['S','F2','E'],'Manuel.'],
 ['Clavier','Que fait Ctrl+T ?',['Le clavier de l’ordinateur devient un clavier de piano','Il exporte','Il ouvre le mixeur'],'Manuel.']]);
TL('fl191','Gagner du temps au quotidien',F_TIP,[
 ['Astuces de MusicRadar','Cet article a été écrit pour FL Studio 12 : les menus peuvent différer. Tu peux <b>insérer du temps</b> dans un morceau : Ctrl + glisser sur la règle de la Playlist pour choisir une zone, puis, Ctrl maintenu, Insert (avec Alt en plus pour décaler tous les clips). Touches de fonction : <b>F5</b> Playlist, <b>F6</b> Step Sequencer, <b>F7</b> Piano roll, <b>F8</b> navigateur de samples, <b>F9</b> Mixeur. Pour <b>superposer des sons</b> : une piste Layer, puis « Set children » avec les canaux choisis.'],
 ['Clips, zoom, automation','« <b>Make unique</b> » modifie un clip sans toucher à ses copies (pour l’audio : « Make unique as sample »). Les touches 1 à 5 donnent des zooms prédéfinis ; Ctrl + molette zoome horizontalement, Alt + molette défile verticalement. Clic droit sur un paramètre : « Create automation clip ». Si tu as joué un riff sans enregistrer : Tools > « Dump score log to selected pattern » récupère le MIDI joué récemment.']],[
 ['Touche F9','Quelle touche ouvre le Mixeur ?',['F9','F5','F7'],'MusicRadar.'],

TL('s31','Le vocabulaire du synthé',F_SV,[
 ['Oscillateur, filtre, amplificateur','Selon Yamaha : l’<b>oscillateur</b> génère la forme d’onde de base (VCO sur un synthé analogique) ; formes courantes : sinus, triangle, carré/pulse, dent de scie. Le <b>filtre</b> (VCF) façonne le timbre en réduisant certaines fréquences : <b>passe-bas</b> (coupe au-dessus de la fréquence de coupure), <b>passe-haut</b> (en dessous), <b>passe-bande</b> (autour). Le <b>cutoff</b> est le point où le filtre commence à agir ; la <b>résonance</b> renforce les fréquences proches du cutoff. Le VCA est l’amplificateur qui contrôle le volume.'],
 ['LFO, polyphonie, glide, arpège','Le <b>LFO</b> est un oscillateur sous 20 Hz utilisé pour moduler : sur la hauteur, il donne un vibrato ; sur l’amplitude, un trémolo ; sur le filtre, souvent un effet « wah ». <b>Polyphonie</b> : un synthé monophonique joue une note à la fois, duophonique deux, polyphonique trois ou plus. Le <b>portamento (glide)</b> glisse d’une note à l’autre. L’<b>arpégiateur</b> rejoue automatiquement les notes tenues dans un ordre répété.']],[
 ['VCO','Comment s’appelle l’oscillateur sur un synthé analogique ?',['VCO','VCA','VCF'],'Yamaha.'],
 ['Passe-bas','Que fait un filtre passe-bas ?',['Il coupe au-dessus de la fréquence de coupure','Il coupe en dessous','Il ne laisse que le centre'],'Yamaha.'],
 ['Résonance','Que fait la résonance ?',['Elle renforce les fréquences proches du cutoff','Elle ralentit le tempo','Elle ajoute un delay'],'Yamaha.'],
 ['LFO','Un LFO sur la hauteur donne…',['Un vibrato','Un trémolo','Un wah'],'Yamaha.'],
 ['Poly','Un synthé polyphonique joue…',['Trois notes ou plus à la fois','Une seule note','Aucune note'],'Yamaha.']]);
TL('s41','La modulation',F_SM,[
 ['Source, destination, quantité','Selon MusicRadar, la <b>modulation</b> est un changement dans le temps : une <b>source</b>, un <b>paramètre cible</b> et une <b>quantité</b> qui règle l’effet. Sources : le <b>LFO</b> (tourne en continu, très lentement), l’<b>enveloppe</b> (déclenchée à chaque note), la <b>vélocité</b> (propriété MIDI, souvent liée au niveau et au cutoff), la <b>molette de modulation</b> (message MIDI, souvent routé via une matrice de modulation). Destinations : hauteur de l’oscillateur, cutoff et résonance, position dans la wavetable, volume et panoramique, paramètres d’effets.'],
 ['Réglages de LFO et enveloppe','Un LFO a une <b>vitesse</b> (en Hz ou synchronisée au tempo de la DAW), une <b>profondeur</b>, une <b>forme d’onde</b> (dont des formes en marches et l’échantillonneur-bloqueur aléatoire) et parfois un <b>fade-in</b>. Une enveloppe ADSR : <b>Attack</b> (le niveau monte après l’appui), <b>Decay</b> (il descend), <b>Sustain</b> (il tient jusqu’au relâchement), <b>Release</b> (il s’éteint après le relâchement). Certaines ajoutent Hold ou Delay.']],[
 ['Trois éléments','Quels sont les trois éléments d’une modulation ?',['Source, cible, quantité','Hauteur, tempo, volume','Attack, Decay, Release'],'MusicRadar.'],
 ['Enveloppe','Quand une enveloppe est-elle déclenchée ?',['À chaque note jouée','En continu','Jamais'],'MusicRadar.'],
 ['Profondeur','Que règle la profondeur d’un LFO ?',['À quelle distance il déplace sa cible','Son nom','Le tempo du projet'],'MusicRadar.'],
 ['Release','Que fait la Release ?',['Le niveau s’éteint après le relâchement','Le niveau monte à l’appui','Le niveau tient'],'MusicRadar.'],
 ['Destination','Laquelle est une destination courante ?',['Le cutoff du filtre','Le nom du fichier','La couleur'],'MusicRadar.']]);
TL('s51','Les types de synthèse',F_ST,[
 ['Soustractive, échantillons, wavetable','Selon MusicRadar : la synthèse <b>analogique (soustractive)</b> part d’une onde riche en harmoniques puis filtre ; elle donne basses épaisses et leads tranchants, mais imite mal les instruments acoustiques. Un synthé <b>à échantillons (ROMpler)</b> filtre et module de grandes collections d’échantillons ; il sert aux instruments acoustiques comme aux textures abstraites. La <b>wavetable</b> enchaîne de très courts fragments d’ondes et les module : basses numériques piquantes, nappes évolutives.'],
 ['Additive, FM, modélisation physique','La synthèse <b>additive</b> construit le son à partir de nombreuses ondes sinusoïdales, l’inverse de la soustractive ; elle donne des timbres torsadés et texturés. La <b>FM</b> crée des sons par une modulation complexe d’ondes simples : tons précis et percussifs (marimbas boisés, cloches cristallines), programmation exigeante. La <b>modélisation physique</b> simule mathématiquement les composants d’un instrument acoustique (percussions, cordes pincées) ; elle demande beaucoup de CPU.']],[
 ['Soustractive','Comment fonctionne la synthèse soustractive ?',['On part d’une onde riche et on filtre','On additionne des sinus','On simule un tambour'],'MusicRadar.'],
 ['Additive','La synthèse additive est…',['L’inverse de la soustractive : beaucoup de sinus','Un filtre','Un échantillonneur'],'MusicRadar.'],
 ['FM','La FM est connue pour…',['Des tons précis et percussifs comme les cloches','Des basses boueuses seulement','Aucun son'],'MusicRadar.'],
 ['Wavetable','La wavetable enchaîne…',['De très courts fragments d’ondes','Des sinus uniquement','Des enregistrements de voix'],'MusicRadar.'],
 ['Physique','Que simule la modélisation physique ?',['Les composants d’un instrument acoustique','Un amplificateur','Une salle'],'MusicRadar.']]);
TL('s61','Synthés célèbres (1)',F_SF,[
 ['Pionniers analogiques','Selon B&H Explora : le <b>Minimoog</b> (Moog, 1970) est monophonique et le premier synthé vendu en magasin, avec une molette de pitch bend. Le <b>ARP 2600</b> (1971) est semi-modulaire, avec patch points et réverbération à ressort intégrée. L’<b>EMS VCS 3 « Putney »</b> (1969) remplace les câbles par une matrice à broches. Le <b>Buchla 100</b> (années 1960) est un modulaire expérimental avec plaques tactiles et séquenceurs.'],
 ['Polyphonique analogique','Le <b>Sequential Prophet-5</b> (1977) est le premier synthé polyphonique avec mémoire programmable pour sauver des presets. L’<b>Oberheim OB-Xa</b> (1980) : polyphonique avec split, layering et 120 presets sur cassettes. Le <b>Roland Jupiter-8</b> (1981) : 8 voix, soustractif, modes split et unison.']],[
 ['Minimoog','Quelle particularité pour le Minimoog ?',['Premier synthé vendu en magasin','Premier sampler','Premier synthé FM'],'B&H.'],
 ['Prophet','Quelle innovation pour le Prophet-5 ?',['Mémoire programmable pour presets','La FM','Le vocodeur'],'B&H.'],
 ['VCS 3','Qu’est-ce qui remplace les câbles sur le VCS 3 ?',['Une matrice à broches','Un clavier MIDI','Rien'],'B&H.'],
 ['Jupiter','Combien de voix pour le Jupiter-8 ?',['8','2','16'],'B&H.'],
 ['ARP','Que contient l’ARP 2600 ?',['Des patch points et une réverb à ressort','Un écran','Un séquenceur à cassette'],'B&H.']]);
TL('s62','Synthés célèbres (2)',F_SF,[
 ['Numérique et échantillonnage','Selon B&H : le <b>Fairlight CMI</b> (1979) est un synthé/sampler/workstation numérique précoce avec édition de forme d’onde au stylo optique. Le <b>PPG Wave</b> (Wolfgang Palm, 1981) est le premier synthé à wavetable à succès commercial. Le <b>Yamaha DX7</b> (1983) est un synthé numérique abordable et best-seller, qui a popularisé la synthèse FM.'],
 ['Où les entend-on ?','B&H cite par exemple : « Running Up That Hill » (Fairlight), « Take On Me » (PPG Wave), « When Doves Cry » et la basse de « Never Gonna Give You Up » (DX7), « Purple Rain » (OB-Xa), « Everything in Its Right Place » (Prophet-5), « Thriller » (Jupiter-8).']],[
 ['DX7','Quelle synthèse le DX7 a-t-il popularisée ?',['La FM','La wavetable','L’additive'],'B&H.'],
 ['PPG','Que représente le PPG Wave ?',['Le premier synthé wavetable à succès','Le premier sampler','Le premier modulaire'],'B&H.'],
 ['Fairlight','Que permet le Fairlight CMI ?',['L’édition de forme d’onde au stylo optique','Le MIDI','Le vibrato'],'B&H.'],
 ['Take On Me','Quel synthé B&H cite-t-il pour « Take On Me » ?',['PPG Wave','Minimoog','OB-Xa'],'B&H.']]);
TL('s71','Une histoire du synthé',F_SH,[
 ['Années 1960–1980','Selon Sound On Sound : à la fin des années 1960, John Chowning (Stanford) mène à la synthèse FM (1967). L’EMS VCS3 (Royaume-Uni) est produit de 1968 à 1994 ; l’ARP 2600 (États-Unis) de 1971 à 1981. En 1975, une modification de Tom Oberheim ajoute la duophonie et un vibrato retardé aux ARP 2600 de série.'],
 ['MIDI et synthèse numérique','<b>1983</b> : arrivée du MIDI ; Yamaha sort le DX7 (FM, 16 voix). Le Casio CZ101 (1985) emploie la distorsion de phase (PD) ; le Roland D50 (1987) la synthèse LA ; le Korg M1 (1988) est le synthé le plus vendu de l’article ; le Korg Wavestation (1990) la synthèse vectorielle. En 1987, Yamaha rachète Sequential.']],[
 ['MIDI','Quelle année voit l’arrivée du MIDI selon l’article ?',['1983','1967','1990'],'Sound On Sound.'],
 ['Chowning','Qui mène à la FM en 1967 ?',['John Chowning','Tom Oberheim','Chris Huggett'],'Sound On Sound.'],
 ['M1','Quel synthé est le plus vendu de l’article ?',['Korg M1','Casio CZ101','Roland D50'],'Sound On Sound.'],
 ['CZ101','Quelle synthèse emploie le Casio CZ101 ?',['La distorsion de phase','La FM','La synthèse vectorielle'],'Sound On Sound.']]);

TL('c41','Posture et placement',F_CP,[
 ['Aligner le corps','Selon la Musicians Institute : tête droite, poitrine et épaules hautes, abdomen plat, mains détendues, genoux non verrouillés. Selon Wikipédia (pédagogie vocale), un bon alignement permet au mécanisme respiratoire de fonctionner efficacement : une poitrine affaissée limite la capacité pulmonaire, une paroi abdominale tendue gêne le diaphragme ; l’alignement réduit les tensions inutiles.'],
 ['Mâchoire, lèvres, volume','Ne serre pas les lèvres, ne projette pas la mâchoire en avant : forme les voyelles avec la langue sans perturber le reste de la bouche. Trouve le <b>volume</b> qui convient à ta voix : trop doux ou trop fort peut causer des cassures ou des notes trop basses. Autre conseil : le « speak-sing » — ta voix est plus détendue en parlant, pars de là pour aller vers le chant.']],[
 ['Genoux','Que faire des genoux ?',['Ne pas les verrouiller','Les verrouiller','Les plier à fond'],'Musicians Institute.'],
 ['Mâchoire','Que ne faut-il pas faire avec la mâchoire ?',['La projeter en avant','La détendre','Parler'],'Musicians Institute.'],
 ['Volume','Pourquoi trouver son volume ?',['Trop doux ou trop fort peut causer des cassures','Pour économiser l’électricité','Pour le tempo'],'Musicians Institute.'],
 ['Poitrine','Qu’est-ce qui limite la capacité pulmonaire ?',['Une poitrine affaissée','Un genou plié','Une chemise'],'Wikipédia.']]);
TL('c51','La respiration',F_CB,[
 ['Quatre temps','Selon Wikipédia, le souffle du chanteur a quatre phases : <b>inspiration</b>, <b>suspension</b> (mise en place des contrôles), <b>expiration contrôlée</b> (phonation) et <b>récupération</b>. Les contrôles à l’expiration sont particulièrement importants. Le soutien du souffle est une relation dynamique entre les muscles de l’inspiration et ceux de l’expiration. Le diaphragme est le muscle sous les poumons : respire vers lui et entraîne-le avec des exercices.'],
 ['Exercices','Selon la Musicians Institute : <b>le livre</b> (allongé, un livre léger sur le ventre : inspire par le nez pour le faire monter, expire lentement en pinçant les lèvres, en contrôlant la descente pendant 5 à 10 secondes) ; <b>« shhh »</b> (expire sur un « shhh » régulier aussi longtemps que possible) ; <b>paille</b> (fredonne ou chante des gammes à travers une paille) ; <b>messa di voce</b> (note tenue qui part très doucement, gonfle jusqu’au plus fort, puis redescend sans que la hauteur vacille) ; <b>staccato</b> sur « ee » (notes courtes avec un jet d’air bref et contrôlé).']],[
 ['Phases','Combien de phases a le souffle du chanteur ?',['Quatre','Deux','Dix'],'Wikipédia.'],
 ['Livre','Dans l’exercice du livre, l’expiration dure…',['5 à 10 secondes','1 seconde','1 minute'],'Musicians Institute.'],
 ['Messa di voce','Que fait la messa di voce ?',['Partir doux, gonfler, redescendre sans vaciller','Chanter le plus fort possible','Parler'],'Musicians Institute.'],
 ['Paille','Que fait-on avec la paille ?',['On fredonne ou on chante à travers','On boit','On la plie'],'Musicians Institute.'],
 ['Soutien','Le soutien du souffle est…',['Une relation dynamique entre muscles d’inspiration et d’expiration','Un muscle unique','Un instrument'],'Wikipédia.']]);
TL('c61','Échauffements et retour au calme',F_CW,[
 ['Échauffer la voix','Selon la Musicians Institute, prévois <b>au moins 10 à 15 minutes</b>. <b>Lip trill</b> : souffle à travers les lèvres détendues pour les faire vibrer (« moteur de bateau »), puis ajoute la voix et glisse sur ta tessiture ; si les lèvres ne vibrent pas, presse doucement deux doigts sur les joues. <b>Siren</b> : glisse d’une note confortable vers une note plus aiguë et reviens, sur « oo » ou « ee », en commençant par de petits glissés (environ une quinte) puis plus larges. <b>Mmm-Ah</b> : fredonne « Mmm », puis ouvre sur « Ah » en gardant la même résonance avant.'],
 ['Après avoir chanté','Le <b>retour au calme</b> protège la voix : reprends tes exercices d’échauffement, en finissant par un fredonnement ou des exercices plus légers. L’<b>« yawn-sigh »</b> (bâillement-soupir) et le fredonnement sont aussi cités comme échauffements simples.']],[
 ['Durée','Quelle durée d’échauffement minimale ?',['10 à 15 minutes','30 secondes','3 heures'],'Musicians Institute.'],
 ['Lip trill','Que fait-on dans un lip trill ?',['On fait vibrer les lèvres en soufflant','On serre les dents','On chante très fort'],'Musicians Institute.'],
 ['Siren','Comment commencer les glissés ?',['Par de petits glissés, environ une quinte','Par l’extrême aigu','Sans voix'],'Musicians Institute.'],
 ['Retour au calme','Comment finir une séance ?',['Reprendre les exercices et finir par un fredonnement','Crier','Boire glacé'],'Musicians Institute.']]);
TL('c71','Les registres',F_CRG,[
 ['Quatre registres','Selon Wikipédia, la pathologie de la parole reconnaît quatre registres : <b>fry</b>, <b>modal</b>, <b>falsetto</b> et <b>sifflet</b> ; beaucoup de professeurs de chant utilisent les mêmes. Les registres viennent de la fonction du larynx : les cordes vocales peuvent produire plusieurs modes de vibration, chacun sur une plage de hauteurs. Des moines médiévaux décrivaient trois registres : poitrine, gorge et tête ; leur « tête » est plus proche du falsetto actuel.'],
 ['Le passaggio','« Le changement net ou la cassure entre registres s’appelle un <b>passaggio</b> » (aussi ponticello). Certains professeurs cherchent à fondre les registres pour cacher le passage ; d’autres voient dans ces cassures le signe d’un réglage laryngé statique.']],[
 ['Nombre','Combien de registres la pathologie de la parole reconnaît-elle ?',['Quatre','Deux','Sept'],'Wikipédia.'],
 ['Passaggio','Qu’est-ce que le passaggio ?',['La cassure entre registres','Un exercice de souffle','Un micro'],'Wikipédia.'],
 ['Médiéval','Quels trois registres décrivaient les moines médiévaux ?',['Poitrine, gorge, tête','Fry, modal, sifflet','Soprano, alto, ténor'],'Wikipédia.'],

TL('c81','Résonance et tessiture',F_CRS,[
 ['Où résonne la voix','Selon Wikipédia : les principaux résonateurs sont le <b>larynx</b>, le <b>pharynx</b> et la <b>cavité buccale</b> ; la cavité nasale contribue surtout aux consonnes et voyelles nasales. Les sensations dans les sinus sont des vibrations sympathiques : elles résultent d’une résonance efficace, elles ne la causent pas. Facteur d’espace : la bouche s’ouvre généralement plus quand la hauteur monte, la gorge est détendue, sensation décrite comme « le début d’un bâillement ».'],
 ['Tessiture et progression','La plupart des professeurs établissent de bonnes habitudes dans la <b>tessiture</b> la plus confortable, puis élargissent la tessiture progressivement ; ils supposent une voix moyenne jusqu’à preuve du contraire et commencent au milieu de la voix.']],[
 ['Résonateurs','Quels sont les principaux résonateurs ?',['Larynx, pharynx, cavité buccale','Genoux','Pieds'],'Wikipédia.'],
 ['Sinus','Les sensations dans les sinus…',['Résultent d’une bonne résonance','La causent','Sont dangereuses'],'Wikipédia.'],
 ['Bouche','Quand la hauteur monte, la bouche…',['S’ouvre généralement plus','Se ferme','Ne bouge pas'],'Wikipédia.'],
 ['Tessiture','Par où commencer pour élargir la tessiture ?',['Par le milieu, confortable','Par l’extrême aigu','Par le grave extrême'],'Wikipédia.']]);

/* ================= JEMBÉ ================= */
TL('j31','Histoire et diffusion du jembé',F_JH,[
 ['Mali et Guinée','Selon le guide de Charry (Wesleyan), les traditions centrales du jembé viennent du Mali et de la Guinée et semblent d’origine maninka/susu, entre Kankan (Guinée) et Bamako (Mali), le pays mandé. Des forgerons héréditaires, les <b>numu</b> (familles Camara, Doumbia, Kante), sont étroitement liés à l’instrument et sculptent les corps en bois. Pays frontaliers à forte présence : Sénégal, Côte d’Ivoire, Burkina Faso.'],
 ['Vers le reste du monde','Le jembé atteint des publics hors d’Afrique de l’Ouest dans les années 1950 grâce aux tournées des <b>Ballets Africains</b>, dirigés par Fodeba Keita. Aux États-Unis, Ladji Camara, ancien des Ballets Africains, forme une génération de joueurs à partir des années 1960. L’intérêt explose à la fin des années 1980 : nombreux disques, troupes nationales en tournée, professeurs de plus en plus nombreux.']],[
 ['Région','D’où viennent les traditions centrales du jembé ?',['Du Mali et de la Guinée','Du Brésil','De Chine'],'Charry.'],
 ['Numu','Qui sont les numu ?',['Des forgerons héréditaires liés à l’instrument','Des chanteurs','Des danseurs'],'Charry.'],
 ['Ballets','Quelle troupe fait connaître le jembé dans les années 1950 ?',['Les Ballets Africains','Le London Symphony Orchestra','Les Ramones'],'Charry.'],
 ['Camara','Qui forme des joueurs aux États-Unis dès les années 1960 ?',['Ladji Camara','Fodeba Keita','Jelly Roll Morton'],'Charry.']]);
TL('j41','L’ensemble : jembé et dundun',F_JE,[
 ['Les rôles','Selon Charry, le jembé joue à la fois le <b>solo</b> et l’<b>accompagnement</b>. Un ensemble minimal comprend un jembé d’accompagnement et un jembé soliste ; des jembés supplémentaires doublent souvent les parties. Les <b>dundun</b> sont de grands tambours à deux peaux, qui identifient généralement la pièce ; un ensemble en utilise deux ou trois : le <b>dundun</b> (grand), le <b>sangba</b> (moyen) et le <b>kenkeni</b> (le plus petit).'],
 ['Combinaisons','Combinaisons courantes : deux jembés avec deux dundun, ou trois jembés avec trois dundun. Dans les communautés xasonke, seuls les <b>jeli</b> (musiciens héréditaires) jouent le dundun, la cloche tenue haut de la main gauche.']],[
 ['Solo','Quel rôle joue le jembé ?',['Solo et accompagnement','Seulement la basse','Seulement la danse'],'Charry.'],
 ['Plus petit','Quel est le plus petit dundun typique ?',['Le kenkeni','Le dundunba','Le sangba'],'Charry.'],
 ['Identifier','Que fait généralement le dundun ?',['Identifier la pièce','Chanter','Danser'],'Charry.'],
 ['Xasonke','Chez les Xasonke, qui joue le dundun ?',['Les jeli','Tout le monde','Les enfants seulement'],'Charry.']]);
TL('j51','Les motifs d’accompagnement',F_JP,[
 ['Deux motifs fondamentaux','Selon Charry, il y a trois frappes de base : <b>slap, ton, basse</b>. Deux motifs d’accompagnement fondamentaux sont cités (les points sont des silences) : <b>slap . . slap slap . ton ton</b>, et <b>slap . ton slap . basse</b>. En Guinée, la dernière basse est souvent un silence.'],
 ['Pas de syllabes universelles','Au Mali et en Guinée, il n’existe pas de système de syllabes largement partagé pour nommer les frappes : les syllabes des professeurs servent à transmettre le rythme, pas le type de frappe.']],[
 ['Frappes','Quelles sont les trois frappes de base ?',['Slap, ton, basse','Do, ré, mi','Kick, snare, hat'],'Charry.'],
 ['Silences','Dans les motifs cités, que signifient les points ?',['Des silences','Des basses','Des slaps'],'Charry.'],
 ['Guinée','En Guinée, que devient souvent la dernière basse ?',['Un silence','Un slap','Un ton'],'Charry.'],
 ['Syllabes','Au Mali et en Guinée, les syllabes des professeurs servent à…',['Transmettre le rythme','Nommer chaque frappe','Accorder l’instrument'],'Charry.']]);
TL('j61','Les rythmes traditionnels',F_JR,[
 ['Quelques rythmes cités','Selon Charry : <b>Dundunba</b> est répandu, honore les hommes braves et fait partie des plus enregistrés. <b>Soli</b> (Maninka de Guinée) accompagne circoncisions et excisions. <b>Kassa</b> accompagne les travaux de culture des champs. <b>Jeli don</b> et <b>Woloso don</b> honorent respectivement les jeli et une classe d’esclaves.'],
 ['Origines','<b>Dansa</b> (Xasonke, Mali), <b>Sunu</b> (Bamana, Mali) et <b>Kuku</b> (forêt du sud de la Guinée, populaire en Guinée mais pas au Mali). Les Maninka maliens de Bamako nomment les rythmes du nord d’après le groupe (Bamana, Dogon, Peulh) ; les Maninka guinéens de Conakry jouent des rythmes de forêt et de côte (Baga, Temne).']],[
 ['Dundunba','Que fait honneur Dundunba ?',['Les hommes braves','Les récoltes','La pluie'],'Charry.'],
 ['Soli','Pour quelles occasions joue-t-on Soli ?',['Circoncisions et excisions','Travaux des champs','Matchs'],'Charry.'],
 ['Kassa','À quoi est lié Kassa ?',['À la culture des champs','Aux mariages seulement','Au sport'],'Charry.'],
 ['Kuku','Où Kuku est-il populaire ?',['En Guinée, pas au Mali','Au Mali, pas en Guinée','Aux deux pareillement'],'Charry.']]);
TL('j71','Contextes de jeu',F_JC,[
 ['Pour danser','Selon Charry, la musique de jembé est « pour danser », pas pour écouter. Lors des événements de village, qui durent des heures, la plupart des présents dansent : danse rapide et intense, alternée avec des sections plus lentes où les invités chantent, souvent menés par une <b>jeli muso</b>. Occasions : circoncisions, excisions, mariages, travaux des champs, rituels de la société Komo.'],
 ['Ballets et concerts','Les <b>ballets</b> sont très chorégraphiés, avec de nombreux danseurs à l’unisson et des rythmes enchaînés rapidement. Les <b>ensembles de concert</b> mettent l’accent sur l’arrangement et les solistes, souvent sans danseurs.']],[
 ['But','À quoi sert surtout la musique de jembé ?',['À danser','À écouter seulement','À l’église'],'Charry.'],
 ['Village','Que font la plupart des gens lors des événements de village ?',['Ils dansent','Ils dorment','Ils comptent'],'Charry.'],
 ['Ballets','Les ballets sont…',['Très chorégraphiés','Improvisés sans danse','Silencieux'],'Charry.'],
 ['Concert','Que privilégient les ensembles de concert ?',['L’arrangement et les solistes','Les danseurs','Le silence'],'Charry.']]);

A('jec5','Atelier : motifs',[CI(F_JP,'Tes motifs','Applique ce que dit Charry.'),

/* =================== SERUM, MASSIVE, SCREAM/GROWL, RAP, CONSTRUCTION DU JEMBÉ =================== */
var F_SER=FD('f-sy8','Synthé : Serum'), F_MAS=FD('f-sy9','Synthé : Massive'), F_SCR=FD('f-ch9','Chant : scream et growl'), F_RAP=FD('f-ch10','Chant : enregistrer le rap'), F_JB=FD('f-je8','Jembé : construction');
TL('s81','Serum (Xfer Records)',F_SER,[
 ['Oscillateurs et wavetables','Selon LANDR, Serum a <b>deux oscillateurs wavetable</b>, plus un oscillateur <b>sub</b> et un générateur de <b>bruit</b>. On choisit les formes d’onde dans un menu (formes analogiques classiques, dossiers Digital, Spectral, Vowel). <b>WT Pos</b> déplace le point de lecture dans la wavetable et fait une bonne cible de modulation. L’éditeur de wavetable permet de dessiner, définir et importer ses propres tables.'],
 ['Warp et unison','Le <b>warp</b> change la forme globale d’une onde : les modes Bend+ et Bend− la déforment, et le warp peut imiter la synchronisation d’oscillateurs et la FM. L’<b>unison</b> multiplie les voix de chaque oscillateur jusqu’à 16 : leads et nappes épais et désaccordés, mais beaucoup de CPU.'],
 ['Filtre, modulation, effets','Le filtre offre bien plus que passe-bas, passe-bande et passe-haut : modes Multi avec contrôle de morphing, menus Flanges et Misc (peigne, flanger, passe-tout). Il peut être affecté aux oscillateurs, au bruit ou au sub séparément. Modulation : glisser-déposer une source sur une destination, ou matrice de modulation ; <b>trois enveloppes</b>, <b>quatre LFO</b>, vélocité, keytracking. Un LFO sans boucle sert d’enveloppe supplémentaire ; <b>Chaos</b> est une source aléatoire à assigner à la main. Dix effets : Hyper/Dimension, Distortion, Flanger, Phaser, Chorus, Delay, Compressor, Reverb, EQ, Filter ; tous réordonnables, et chaque paramètre peut être modulé.']],[
 ['Oscillateurs','Combien d’oscillateurs wavetable a Serum ?',['Deux','Trois','Un'],'LANDR.'],
 ['WT Pos','Que fait WT Pos ?',['Il déplace le point de lecture dans la wavetable','Il règle le tempo','Il active l’unison'],'LANDR.'],
 ['Unison','Jusqu’à combien de voix l’unison multiplie-t-il chaque oscillateur ?',['16','4','128'],'LANDR.'],
 ['LFO','Quel est le nombre de LFO de Serum ?',['Quatre','Un','Dix'],'LANDR.'],
 ['Éditeur','L’éditeur de wavetable permet…',['De dessiner et d’importer ses tables','Seulement d’écouter les tables','De changer le tempo'],'LANDR.']]);
TL('s91','Massive (Native Instruments)',F_MAS,[
 ['Section oscillateurs','Selon le manuel de Native Instruments : <b>trois oscillateurs wavetable</b>, <b>un oscillateur de modulation</b>, un générateur de bruit et une section de feedback. Une table contient de 2 à 128 formes d’onde ou plus ; <b>Wt-Position</b> règle la position verticale dans la table et fait passer d’une forme à l’autre (par exemple de l’impulsion à la dent de scie). Chaque oscillateur a un potentiomètre Amp (niveau) et un fader F1-F2 qui répartit la sortie entre les filtres 1 et 2.'],
 ['Intensity et oscillateur de modulation','Le rôle d’<b>Intensity</b> dépend du mode : en <b>Spectrum</b> (par défaut), il réduit les harmoniques aigus, comme un passe-bas ; en modes <b>Bend</b>, il change la vitesse de lecture de la table ; en <b>Formant</b>, il transpose les formants. L’oscillateur de modulation produit des sinusoïdes dans le registre audible (suit la hauteur par défaut) et alimente la modulation en <b>anneau</b> (bandes latérales, sons métalliques ou de cloche), la modulation de <b>phase</b> (équivalent sonore de la FM) et celle de Wt-Position, ainsi que la FM du filtre.']],[
 ['Oscillateurs','Massive comporte…',['Trois oscillateurs wavetable','Deux oscillateurs wavetable','Un seul oscillateur'],'Manuel NI.'],
 ['Spectrum','En mode Spectrum, Intensity…',['Réduit les harmoniques aigus','Transpose les formants','Change le tempo'],'Manuel NI.'],
 ['Phase','La modulation de phase équivaut sonorement à…',['La FM','Un delay','Un compresseur'],'Manuel NI.'],
 ['Anneau','La modulation en anneau produit…',['Des bandes latérales, sons métalliques ou de cloche','Du silence','Un vibrato'],'Manuel NI.']]);
A('syc7','Atelier : Serum et Massive',[CI(F_SER,'Serum et Massive','Compare les deux synthés d’après leurs descriptions.'),
 CH('Serum',F_SER,'Combien de LFO dans Serum ?',['Quatre','Deux'],[0],'LANDR.'),
 CH('Massive',F_MAS,'Combien d’oscillateurs wavetable dans Massive ?',['Trois','Quatre'],[0],'Manuel NI.'),
 CH('Effets Serum',F_SER,'Coche les effets de Serum cités :',['Reverb','Chorus','Compressor','Vocoder'],[0,1,2],'Voir la fiche.',true)]);

TL('c91','Scream, growl et false cords',F_SCR,[
 ['Trois grandes familles','Selon MasterClass, on distingue : les <b>screams</b>, qui utilisent les vraies cordes vocales et sont les plus dures pour la voix ; les <b>growls</b>, plus gutturaux et un peu plus doux pour les cordes ; les <b>false cords</b> (fausses cordes), qui produisent un bourdonnement venu des muscles thyroaryténoïdiens supérieurs, plus profond dans la gorge, et sont les moins sévères.'],
 ['Sept types de scream','MasterClass en décrit sept : <b>fry scream</b> (respirations profondes du diaphragme, son humide, vocal fry) ; <b>inhale scream</b> (inspiration continue, son granuleux) ; <b>kvlt scream</b> (cri aigu et bourdonnant, typique du black metal) ; <b>low growl</b> (très grave, parfois proche du grognement, dur avec des paroles) ; <b>mid-range growl</b> (souffle profond, bandes vestibulaires ; une bonne diction garde les paroles intelligibles) ; <b>pig squeal</b> (aigu, courant en deathcore) ; <b>tunnel throat scream</b> (son creux, langue contre l’arrière des dents du bas).'],
 ['Souffle et sécurité','« Le scream repose beaucoup sur la respiration » : remplir le diaphragme, puis pousser l’air sur un « ah » chuchoté. Côté santé : manger et boire 1 à 2 h avant l’échauffement, éviter les aliments lourds ou acides, les boissons grasses ou gazeuses et la caféine (qui resserre les cordes), garder boissons tièdes ou à température ambiante, s’échauffer surtout sur des voyelles, et faire des séances courtes et fréquentes avec des pauses pour limiter fatigue, lésions et enrouement.']],[
 ['Famille','Quelle famille est la moins sévère pour la voix ?',['Les false cords','Les screams','Aucune différence'],'MasterClass.'],
 ['Fry','Le fry scream repose sur…',['Des respirations profondes du diaphragme','Une inspiration continue','La langue contre les dents du bas'],'MasterClass.'],
 ['Kvlt','Le kvlt scream s’entend surtout…',['En black metal','En jazz','En musique baroque'],'MasterClass.'],
 ['Pig squeal','Le pig squeal est courant en…',['Deathcore','Bossa nova','Musique de chambre'],'MasterClass.'],
 ['Caféine','Pourquoi éviter la caféine avant de chanter ?',['Elle resserre les cordes vocales','Elle baisse le tempo','Elle masque la voix'],'MasterClass.'],
 ['Séances','Quel type de séance est conseillé ?',['Courtes et fréquentes, avec pauses','Une longue séance sans pause','Seulement la nuit'],'MasterClass.']]);
TL('c101','Enregistrer et traiter une voix rap',F_RAP,[
 ['Prise de son','Selon Soundtrap : les micros à condensateur conviennent mieux au chant, les <b>dynamiques</b> au rap. Place un <b>filtre anti-pop</b> à environ six pouces (≈ 15 cm) du micro pour réduire les « P » et « B ». Enregistre à sec, sans réverbération de pièce (placard, couverture épaisse).'],
 ['Prises, doubles, ad-libs','On enregistre de courtes sections, ou plusieurs versions de chaque ligne, puis on assemble les meilleurs morceaux : c’est le <b>comping</b>. Un <b>double</b> est une répétition superposée d’une ligne, souvent en fin de mesure ou sur une punchline. Les <b>ad-libs</b> sont des couches improvisées, enregistrées sur une seconde piste en écoutant la voix terminée.'],
 ['Traitement','Compression : pour garder la voix régulière et en avant, avec un ratio élevé ; ajuste attaque et relâchement. EQ : coupe sous 90-100 Hz environ pour retirer le flou, retire avant d’ajouter, et ne boost que de « quelques décibels » dans l’aigu. Reverb : queue de moins de 500 ms. Delay : synchronisé au tempo, mixé sous la voix. Utilise reverb et delay avec parcimonie. Traitement parallèle : mélanger signal sec et traité (distorsion, compression).']],[
 ['Micro','Quel micro convient au rap d’après Soundtrap ?',['Dynamique','Aucun','Seulement à ruban'],'Soundtrap.'],
 ['Anti-pop','À quelle distance placer le filtre anti-pop ?',['Environ 15 cm','Contre la bouche','À 3 m'],'Soundtrap.'],

TL('j81','Construction du jembé',F_JB,[
 ['Matériaux et forme','Selon la notice du Grinnell College et la fiche du Metropolitan Museum : le jembé traditionnel est <b>sculpté dans un seul tronc</b>, de préférence de <b>lenke</b> (un bois pâle). C’est un tambour en <b>calice</b> : un fût tubulaire ouvert aux deux bouts, la grande ouverture couverte par la peau, la petite laissée ouverte. La peau est de <b>chèvre</b>, trempée avant la pose. Fer, anneaux entourés de tissu et corde complètent l’ensemble.'],
 ['Montage et accord','La peau mouillée est tendue sur le fût, ses bords repliés sur un <b>premier anneau de fer</b>. Un <b>deuxième anneau</b> à boucles se pose dessus ; un <b>troisième</b>, plus petit, coulisse sur le bas du fût (contre-cerceau). Une longue corde zigzague entre les anneaux du haut et du bas ; après séchage, on la resserre à plusieurs reprises. Le jembé traditionnel n’a <b>pas de mécanisme d’accord</b> : la tension est réglée à la fabrication, et on peut seulement chauffer la peau près d’un feu pour la tendre et monter la hauteur. Certains modèles modernes ont des vis de tension.'],
 ['Qui le fabrique, et quelles mesures ?','Les artisans <b>numu</b> (forgerons héréditaires) le fabriquent et en jouent traditionnellement, chez les Maninka et Susu de la région mandé. Mesures d’exemples : le jembé du Met (20e s.) mesure 69,3 cm de long, fût de 49,7 cm, diamètre de peau 39 cm. Une des notices Grinnell cite 24,2 pouces de haut (≈ 61 cm) et une peau de 12,3 pouces (≈ 31 cm). Ce sont des <b>exemples de musée</b>, pas une norme : les sources consultées ne donnent pas de dimensions « standard ».']],[
 ['Bois','Dans quoi le jembé traditionnel est-il sculpté ?',['Un seul tronc, de préférence de lenke','Plusieurs planches collées','Du métal'],'Grinnell, Met.'],
 ['Peau','Quelle peau couvre la grande ouverture ?',['De chèvre, trempée avant la pose','De vache sèche','Plastique'],'Grinnell.'],
 ['Anneaux','Combien d’anneaux de fer ou de cerclage compte le montage décrit par le Met ?',['Trois','Un','Sept'],'Met.'],
 ['Accord','Comment hausser la hauteur d’un jembé traditionnel ?',['Chauffer la peau près d’un feu','Tourner une vis','Changer de bois'],'Grinnell.'],
 ['Artisans','Qui fabrique traditionnellement le jembé ?',['Les numu (forgerons héréditaires)','Les musiciens de cour','Les marchands'],'Grinnell.'],
 ['Mesures','Les dimensions citées sont…',['Des exemples de musée, pas une norme','Une norme officielle','Les mêmes pour tous'],'Met, Grinnell.']]);
A('jec6','Atelier : construction',[CI(F_JB,'Construction','Reconstitue le montage.'),
 CH('Ouverture',F_JB,'Quelle ouverture reçoit la peau ?',['La grande','La petite'],[0],'Grinnell.'),
 CH('Tension',F_JB,'Qu’est-ce qui maintient la peau sous tension ?',['Une corde zigzaguant entre les anneaux','Des clous'],[0],'Met.'),
 CH('Éléments',F_JB,'Coche les éléments cités :',['Fût monobloc','Peau de chèvre','Anneaux de fer','Pédale d’accord'],[0,1,2],'Voir la fiche.',true)]);

var F_GB=FD('f-gu6','Guitare : bases du jeu'), F_GS=FD('f-gu7','Guitare : grattage et changements'), F_GBR=FD('f-gu8','Guitare : barrés et power chords'), F_GP=FD('f-gu9','Guitare : pentatonique mineure'), F_GT=FD('f-gu10','Guitare : techniques de jeu'), F_GE=FD('f-gu11','Guitare : bien s’entraîner');
var GW='https://www.guitarworld.com/lessons/your-first-guitar-lesson-everything-you-need-to-know-to-start-playing-now';
TL('g71','Accordage, tablature et accords ouverts',F_GB,[
 ['Accorder la guitare','Selon Guitar World : les cordes, de la plus grosse à la plus fine, sont <b>E, A, D, G, B, E</b>. Serrer la clé d’une corde monte sa hauteur, la desserrer la baisse. Utilise un accordeur électronique et accorde <b>à chaque séance</b>. Méthode à l’oreille : la <b>5e case du mi grave</b> doit sonner comme la corde de <b>la à vide</b> ; on répète ainsi pour chaque corde, sauf le si, qu’on accorde sur la <b>4e case du sol</b>. Près de l’accord, on entend un battement qui ralentit puis s’arrête.'],
 ['Lire tablature et diagrammes','En tablature, les <b>six lignes sont les cordes</b> : la ligne du bas est le mi grave (le plus gros), celle du haut le mi aigu. Les <b>chiffres</b> indiquent la case à presser ; des chiffres superposés se jouent ensemble. Les diagrammes d’accords montrent quelles cordes et quelles cases presser et où poser les doigts.'],
 ['Premiers accords','Guitar World présente les accords majeurs <b>La, Mi, Ré</b> et mineurs <b>Mi m, La m, Ré m</b>. Un accord majeur sonne clair, un mineur plus sombre ; le mineur s’écrit avec un « m » minuscule. Pose les doigts près des cases, mais pas dessus, appuie avec le bout des doigts pour ne pas étouffer les cordes voisines, puis joue chaque corde pour vérifier qu’elle sonne. Les bouts des doigts peuvent faire mal au début : cela passe avec la pratique.']],[
 ['Cordes','Quel est l’ordre des cordes, de la plus grosse à la plus fine ?',['E A D G B E','A E D G B E','E B G D A E'],'Guitar World.'],
 ['Méthode','Où presser le mi grave pour le comparer au la à vide ?',['À la 5e case','À la 12e case','À la 1re case'],'Guitar World.'],
 ['Si','Comment accorde-t-on la corde de si avec cette méthode ?',['Sur la 4e case du sol','Sur la 5e case du sol','Sur la 7e case du ré'],'Guitar World.'],
 ['Tablature','Dans une tablature, la ligne du bas est…',['Le mi grave','Le mi aigu','Le la'],'Guitar World.'],
 ['Pression','Comment presser pour ne pas étouffer les voisines ?',['Avec le bout des doigts','Avec le plat du doigt','Avec le pouce'],'Guitar World.']]);
TL('g81','Grattage et changements d’accords',F_GS,[
 ['Le grattage','Selon Guitar World : tiens le médiator entre le pouce et l’index, le pouce dessus. Descente (downstroke) : de la corde la plus grosse vers la plus fine. Gratte légèrement avec la pointe du médiator, seulement les cordes de l’accord, et garde un rythme régulier. Les montées sont notées « V » en tablature. Selon Fender : poignet souple, médiator un peu incliné, force variable pour accentuer ou adoucir. Des motifs alternent bas-haut, ou sont irréguliers (ex. « haut-haut-bas-haut » répété).'],
 ['Changer d’accord','Gestes <b>petits</b> ; garde les doigts qui sont <b>communs</b> aux deux accords (Ré et Ré m partagent une note) ; pour passer de La m à Mi, lève les doigts en gardant la forme de la main ; répète les changements pour gagner en vitesse. Pour le jeu note à note, garde un mouvement de médiator réduit et joue une corde à la fois.']],[
 ['Médiator','Comment tenir le médiator ?',['Entre pouce et index, pouce dessus','Entre majeur et annulaire','À pleine main'],'Guitar World.'],
 ['Descente','Une descente va…',['De la corde la plus grosse vers la plus fine','De la plus fine vers la plus grosse','Sur une corde seulement'],'Guitar World.'],
 ['Montées','Comment note-t-on une montée en tablature ?',['Avec un « V »','Avec un « X »','Avec un « 0 »'],'Guitar World.'],
 ['Changements','Quelle astuce pour changer d’accord ?',['Garder les doigts communs','Tout lever à chaque fois','Changer de médiator'],'Guitar World.']]);
A('gc6','Atelier : bases et grattage',[CI(F_GB,'Bases et grattage','Vérifie ce que tu sais déjà de l’accordage et du grattage.'),
 CH('5e case',F_GB,'Pour accorder à l’oreille, le mi grave à la 5e case se compare à :',['La corde de la à vide','La corde de ré à vide'],[0],'Guitar World.'),
 CH('Tablature',F_GB,'Des chiffres superposés en tablature se jouent :',['Ensemble','Un par un'],[0],'Guitar World.'),
 CH('Changements',F_GS,'Coche les conseils cités pour les changements :',['Gestes petits','Garder les doigts communs','Répéter pour gagner en vitesse','Regarder la main droite'],[0,1,2],'Voir la fiche.',true)]);

TL('g91','Barrés et power chords',F_GBR,[
 ['Le barré','Selon Guitar World : au barré complet, ton <b>index sert de capodastre</b> ; quelques formes permettent de jouer n’importe quel accord, y compris ceux impossibles en position ouverte. Les deux formes sont la <b>forme de Mi</b> et la <b>forme de La</b>, basées sur les accords ouverts de Mi et de La et leurs équivalents mineurs. Monter un accord de Mi ouvert d’une case ne donne <b>pas</b> Fa : les cordes à vide doivent bouger aussi (le texte renvoie aux diagrammes pour les positions).'],
 ['Technique et problèmes','Incline légèrement l’index : le côté du doigt est plus ferme que la pulpe. Si le mi aigu est étouffé, tu peux le laisser de côté. Un barré imparfait est normal au début, car les autres doigts appuient sur les cordes du milieu. Pour des arpèges qui ne sonnent pas, essaie un demi-barré sur les trois ou quatre cordes aiguës. Entraîne-toi aux accords ouverts <b>sans l’index</b> pour apprendre les formes des autres doigts.'],
 ['Power chords','Selon MusicRadar : un power chord compte <b>deux ou trois notes</b>, s’écrit lettre + « 5 » (E5 = mi + si) : la <b>fondamentale</b> et sa <b>quinte</b> ; la version à trois notes ajoute la fondamentale à l’octave. La forme de base n’utilise que <b>deux doigts</b> ; on la fige et on déplace la main d’un bloc sur le manche, le pouce ne traînant pas derrière. Avec une guitare saturée, un accord à six notes peut sonner brouillon et manquer de clarté, alors que le power chord reste net.']],[
 ['Barré','Au barré complet, l’index joue le rôle de…',['Capodastre','Médiator','Pédale'],'Guitar World.'],
 ['Formes','Quelles sont les deux formes de barré ?',['Mi et La','Do et Sol','Ré et Si'],'Guitar World.'],
 ['Montée','Monter un Mi ouvert d’une case donne-t-il Fa ?',['Non : les cordes à vide doivent bouger aussi','Oui, toujours','Seulement en mineur'],'Guitar World.'],
 ['E5','De quoi se compose E5 ?',['Mi et si (fondamentale + quinte)','Mi et sol','Mi et ré'],'MusicRadar.'],
 ['Saturation','Pourquoi les power chords vont avec la saturation ?',['Ils restent nets là où un accord à six notes brouille','Ils sont plus forts','Ils n’ont qu’une corde'],'MusicRadar.'],
 ['Doigts','Combien de doigts pour la forme de base ?',['Deux','Cinq','Aucun'],'MusicRadar.']]);
A('gc8','Atelier : barrés et power chords',[CI(F_GBR,'Barrés et power chords','Trie les faits.'),
 CH('Fondamentale',F_GBR,'Un power chord contient la fondamentale et…',['Sa quinte','Sa tierce'],[0],'MusicRadar.'),
 CH('Index',F_GBR,'Pour presser plus facilement au barré :',['Incliner légèrement l’index','Aplatir tout le doigt'],[0],'Guitar World.'),
 CH('Conseils',F_GBR,'Coche les conseils cités :',['Laisser le mi aigu si étouffé','Demi-barré pour les arpèges','Pouce qui traîne derrière','S’entraîner sans l’index'],[0,1,3],'Voir la fiche.',true)]);

TL('g101','La gamme pentatonique mineure',F_GP,[
 ['Cinq notes','Selon Guitar World : la pentatonique compte <b>cinq notes</b> (« penta »). En Mi mineur : <b>Mi, Sol, La, Si, Ré</b> ; les cordes à vide en forment les notes. Elle sert en rock, blues, country et bluegrass, et l’article la décrit comme « la gamme de guitare la plus importante ».'],
 ['Un seul motif','Méthode de l’article : repère la <b>quarte</b> de la tonalité (La en Mi mineur) comme ancre ; chaque La du manche démarre le motif. Une octave de six notes, de La à La, se joue aux doigts 1-3, 1-3, 1-3 ; la dernière note de chaque groupe déplace la main (1-3, 1-3, 1-1). Partir de la 6e corde donne deux octaves, puis quatre notes jusqu’à la tonique sur la 1re corde. L’approche classique mémorise cinq « boîtes » ; l’article conseille plutôt un motif fluide sur tout le manche.']],[
 ['Notes','Combien de notes compte une pentatonique ?',['Cinq','Sept','Douze'],'Guitar World.'],
 ['Mi mineur','Quelles sont les notes de la pentatonique de Mi mineur ?',['Mi, Sol, La, Si, Ré','Mi, Fa, Sol, La, Si','Mi, Fa#, Sol, La, Si'],'Guitar World.'],
 ['Ancre','Quelle note sert d’ancre en Mi mineur ?',['La (la quarte)','Si','Ré'],'Guitar World.'],
 ['Styles','Où l’emploie-t-on ?',['Rock, blues, country, bluegrass','Seulement en musique baroque','Nulle part'],'Guitar World.']]);
A('gc9','Atelier : ta pentatonique',[CI(F_GP,'Ta pentatonique','Place les notes en Mi mineur.'),
 CH('Notes',F_GP,'Coche les notes de la pentatonique de Mi mineur :',['Mi','Sol','La','Fa'],[0,1,2],'Mi, Sol, La, Si, Ré.',true),
 CH('Ancre',F_GP,'Selon l’article, quelle note sert d’ancre en Mi mineur ?',['La','Fa'],[0],'Guitar World.')]);

TL('g111','Techniques de jeu : liées, slides, bends',F_GT,[
 ['Notes liées et slide','Selon Hello Simply : <b>hammer-on</b> = frapper la corde d’un doigt pour sonner une note plus haute sans la main de médiator ; <b>pull-off</b> = tirer le doigt hors de la corde pour sonner une note plus basse tenue sur la même corde ; <b>slide</b> = glisser un doigt vers la note suivante sans le lever. Distinct du <b>slide guitar</b>, où Yamaha décrit un objet en verre ou en acier glissé sur les cordes.'],
 ['Bend et vibrato','Selon Yamaha, le <b>bend</b> monte la hauteur en poussant la corde parallèlement à la touche : bend complet = <b>un ton</b>, demi-bend = <b>un demi-ton</b> (une case), un bend et demi = trois cases, quart de bend = un quart de ton. En tablature, « b » = bend, « r » = release. Pour le <b>vibrato</b>, on bouge légèrement la corde ; Hello Simply précise qu’il est plus difficile à maîtriser que le bend. Avec le levier de trémolo, le pousser vers le corps baisse la hauteur, le tirer la monte.'],
 ['Étouffés, harmoniques, picking','<b>Palm mute</b> : poser le bord de la main de médiator juste au-dessus du chevalet ; plus de pression = plus d’étouffement, plus près du chevalet = son plus profond. <b>Harmoniques</b> : toucher légèrement une corde au-dessus des cases à repères (à partir de la 3e) puis gratter ; les plus faciles : cases <b>5, 7 et 12</b>. <b>Picking alterné</b> : bas-haut en alternance ; <b>tremolo picking</b> : répéter vite une note ; <b>sweep picking</b> : arpèges en balayant ; <b>fingerpicking</b> : pincer avec les doigts (bluegrass, flamenco, classique).']],[
 ['Hammer-on','Un hammer-on sonne…',['Une note plus haute, en frappant la corde','Une note plus basse','Une harmonique'],'Hello Simply.'],
 ['Pull-off','Un pull-off consiste à…',['Tirer le doigt hors de la corde','Frapper la corde','Glisser un objet'],'Hello Simply.'],
 ['Bend','Un bend complet monte de…',['Un ton','Un demi-ton','Une octave'],'Yamaha.'],
 ['Palm mute','Où poser la main pour un palm mute ?',['Juste au-dessus du chevalet','Près de la tête','Sur la caisse'],'Hello Simply.'],
 ['Harmoniques','Quelles cases donnent les harmoniques les plus faciles ?',['5, 7 et 12','1, 2 et 3','20, 21 et 22'],'Hello Simply.'],
 ['Tablature','En tablature, « r » signifie…',['Release (relâcher le bend)','Rythme','Rapide'],'Yamaha.']]);
A('gc10','Atelier : techniques',[CI(F_GT,'Techniques','Associe geste et effet.'),
 CH('Hammer-on',F_GT,'Note plus haute en frappant la corde :',['Hammer-on','Pull-off'],[0],'Hello Simply.'),
 CH('Demi-bend',F_GT,'Un demi-bend monte de :',['Un demi-ton (une case)','Un ton'],[0],'Yamaha.'),
 CH('Picking',F_GT,'Coche les techniques de médiator citées :',['Picking alterné','Tremolo picking','Sweep picking','Tapping à deux mains'],[0,1,2],'Voir la fiche.',true)]);

TL('g121','Bien s’entraîner',F_GE,[
 ['Méthode de pratique','Selon Fender : pratique de façon régulière en <b>séances courtes</b> ; joue <b>lentement</b> d’abord, puis accélère quand chaque case tombe juste ; répète les exercices pour construire la mémoire musculaire ; étire les doigts en « V » écartés pour augmenter l’envergure. Les gammes, dont celle de <b>Do majeur</b> (« alphabet musical »), aident à connaître le manche, à former l’oreille, et à gagner en vitesse et en dextérité.'],
 ['Pas couvert','Les sources consultées ne détaillent pas : le système CAGED, les cinq boîtes de la pentatonique avec leurs diagrammes, le fingerpicking par motifs, les accords étendus (7e, sus) ni le blues en douze mesures sur le manche.']],[
 ['Séances','Quelle durée de séance conseille Fender ?',['Courtes et régulières','Une seule très longue','Seulement le week-end'],'Fender.'],
 ['Vitesse','Comment travailler la vitesse ?',['Lentement d’abord, puis accélérer','Le plus vite possible dès le début','Sans métronome ni écoute'],'Fender.'],
 ['Gammes','À quoi servent les gammes selon Fender ?',['Connaître le manche, former l’oreille, vitesse et dextérité','À accorder','À changer les cordes'],'Fender.']]);

var F_GC=FD('f-gu12','Guitare : CAGED'), F_GBL=FD('f-gu13','Guitare : blues en douze mesures'), F_GF=FD('f-gu14','Guitare : fingerpicking et Travis'), F_G7=FD('f-gu15','Guitare : accords de 7e et sus'), F_G5=FD('f-gu16','Guitare : les cinq patterns pentatoniques');
TL('g131','Le système CAGED',F_GC,[
 ['Cinq formes mobiles','Selon Guitar World : CAGED repose sur cinq accords ouverts, <b>C, A, G, E, D</b>. Chaque forme peut se jouer comme un <b>accord barré mobile</b>. Exemple : jouer Do ouvert, puis Do en forme de La (barré), puis Do en forme de Sol, etc. : chaque forme partage des notes avec la suivante, donc les accords forment une suite connectée et non cinq formes isolées. On construit ainsi des enchaînements sur <b>tout le manche</b>.'],
 ['Formes simplifiées','Les guitaristes retirent souvent une ou deux cordes des formes difficiles : par exemple C/E vient d’un barré en forme de Sol, et C5 est essentiellement une forme de Ré. Ce que l’article ne couvre pas : une méthode générale pour trouver un accord à partir de sa fondamentale (ses exemples sont tous des accords de Do), l’ordre des formes sur le manche, et l’usage de CAGED pour les gammes ou arpèges.']],[
 ['Formes','Quelles sont les cinq formes de CAGED ?',['C, A, G, E, D','A, B, C, D, E','C, D, E, F, G'],'Guitar World.'],
 ['Mobiles','Chaque forme peut être jouée comme…',['Un accord barré mobile','Un solo','Une gamme chromatique'],'Guitar World.'],
 ['Liens','Les formes successives…',['Partagent des notes avec la suivante','N’ont rien en commun','Se jouent toujours à vide'],'Guitar World.'],
 ['Simplifier','Que font souvent les guitaristes des formes difficiles ?',['Ils retirent une ou deux cordes','Ils les évitent toujours','Ils changent d’accordage'],'Guitar World.']]);
TL('g171','Les cinq patterns de pentatonique mineure',F_G5,[
 ['Cinq patterns, cinq formes CAGED','Selon JustinGuitar : <b>pattern 1</b> = forme de Mi (le plus appris) ; <b>pattern 2</b> = forme de Ré (beaucoup de licks de blues, deuxième à apprendre) ; <b>pattern 3</b> = forme de Do (difficile à solo tant qu’on n’a pas appris de licks) ; <b>pattern 4</b> = forme de La ; <b>pattern 5</b> = forme de Sol (« funky », déroutant au début). La page ne détaille pas ici comment les patterns s’enchaînent sur le manche.'],
 ['Racine et entraînement','La fondamentale (R) du pattern 1 est sur la 6e corde, au doigt 1 ; elle donne son nom à la gamme : doigt 1 à la <b>3e case</b> = Sol mineur pentatonique, à la <b>8e case</b> = Do mineur pentatonique. Conseils : jouer lentement et parfaitement (10 fois sans erreur avant d’accélérer), appuyer avec le bout des doigts, sans barré ; doigtés souples selon le lick ; apprendre les cinq patterns, mais surtout faire de la musique avec.']],[
 ['Pattern 1','Le pattern 1 correspond à quelle forme CAGED ?',['La forme de Mi','La forme de Do','La forme de La'],'JustinGuitar.'],
 ['Pattern 2','Quel pattern a beaucoup de licks de blues ?',['Le 2 (forme de Ré)','Le 5','Aucun'],'JustinGuitar.'],
 ['3e case','Doigt 1 à la 3e case de la 6e corde donne…',['Sol mineur pentatonique','Do mineur pentatonique','Mi mineur pentatonique'],'JustinGuitar.'],
 ['8e case','Et à la 8e case ?',['Do mineur pentatonique','Sol mineur pentatonique','La mineur pentatonique'],'JustinGuitar.'],
 ['Entraînement','Combien de répétitions sans erreur avant d’accélérer ?',['Dix','Deux','Cent'],'JustinGuitar.']]);
A('gc11','Atelier : CAGED et patterns',[CI(F_GC,'CAGED et patterns','Relie formes et patterns.'),
 CH('Formes',F_GC,'Coche les formes de CAGED :',['C','A','G','F'],[0,1,2],'C, A, G, E, D.',true),
 CH('Pattern 1',F_G5,'Le pattern 1 de pentatonique mineure est la forme de :',['Mi','Sol'],[0],'JustinGuitar.'),
 CH('Racine',F_G5,'Doigt 1 à la 8e case de la 6e corde :',['Do mineur pentatonique','Sol mineur pentatonique'],[0],'JustinGuitar.')]);

TL('g141','Le blues en douze mesures',F_GBL,[
 ['La grille','Selon Wikipédia (Twelve-bar blues), en degrés, trois lignes de quatre mesures : <b>I, I, I, I / IV, IV, I, I / V, IV, I, I</b>. La forme originale répétait V à la mesure 12 ; le schéma V–IV–I–I (« shuffle blues ») est devenu standard. Variante <b>quick change</b> : la mesure 2 passe sur IV (I, IV, I, I / IV, IV, I, I / V, IV, I, I). En Mi : I = E, IV = A, V = B.'],
 ['Accords et blues mineur','Les accords de <b>septième de dominante</b> servent généralement sur toute la grille ; d’autres septièmes (mineure, diminuée) se placent souvent juste avant un changement. Le <b>blues mineur</b> en douze mesures : i7, i7, i7, i7 / iv7, iv7, i7, i7 / ♭VI7, V7, i7, i7 (le V peut être majeur ou mineur). Exemples cités : « Equinox » et « Mr. P.C. » de John Coltrane ; des thèmes bebop de forme proche : « Now’s the Time » et « Billie’s Bounce » (Parker), « Tenor Madness » (Rollins).']],[
 ['Mesures 1-4','Quels accords aux mesures 1 à 4 ?',['I, I, I, I','IV, IV, I, I','V, IV, I, I'],'Wikipédia.'],
 ['Mesure 5','Quel accord à la mesure 5 ?',['IV','I','V'],'Wikipédia.'],
 ['Quick change','Dans le quick change, la mesure 2 passe sur…',['IV','V','I'],'Wikipédia.'],
 ['En Mi','Quel est le IV en Mi ?',['La','Si','Ré'],'Déduit des degrés.'],
 ['Septièmes','Quels accords servent généralement sur toute la grille ?',['Septièmes de dominante','Accords de neuvième','Accords sus'],'Wikipédia.'],
 ['Mineur','Le blues mineur commence par…',['i7 sur quatre mesures','V7 sur quatre mesures','IV7 sur quatre mesures'],'Wikipédia.']]);
A('gc12','Atelier : ta grille de blues',[CI(F_GBL,'Ta grille','Écris la grille en degrés puis en accords.'),
 CH('Mesure 9',F_GBL,'Accord de la mesure 9 dans la forme standard :',['V','I'],[0],'Wikipédia.'),
 CH('Mesures 5-6',F_GBL,'Mesures 5-6 :',['IV, IV','I, I'],[0],'Wikipédia.'),
 CH('En La',F_GBL,'En La : I = A, IV = D, V = ?',['E','B'],[0],'Déduit des degrés (V = quinte de La).')]);

TL('g151','Fingerpicking et Travis picking',F_GF,[
 ['Le principe','Selon Fender et Guitar World : le Travis picking porte le nom de Merle Travis, chanteur, auteur et guitariste country américain ; c’est une technique de fingerpicking très répandue. Le <b>pouce alterne des basses</b> sur les cordes graves pour tenir le rythme ; les <b>doigts jouent la mélodie</b> sur les cordes aiguës, souvent en syncope. Le pouce étouffe en palm mute les trois cordes graves et rebondit entre deux basses en croches régulières ; les notes mélodiques tombent sur les mêmes croches ou dans les trous de doubles croches.'],
 ['Exercice de base (Fender)','Sur un accord de <b>Do majeur</b> : 1) le pouce alterne les basses sur les cordes de <b>la</b> (5e) et de <b>ré</b> (4e) ; 2) ajoute le <b>majeur</b> sur la corde de <b>si</b> (2e) ; 3) ajoute l’<b>index</b> sur la corde de <b>sol</b> (3e). Alterne ensuite Do et La m. Si le son n’est pas net, utilise PIMA (méthode qui assigne chaque doigt à des cordes). Commence lentement, n’accélère que quand c’est parfait ; boucle un motif d’une mesure, puis passe aux phrases de deux mesures ; applique-les à un blues en douze mesures.']],[
 ['Origine','Le Travis picking est nommé d’après…',['Merle Travis','Chet Baker','Les Paul'],'Fender.'],
 ['Pouce','Que fait le pouce ?',['Il alterne les basses','Il joue la mélodie aiguë','Il ne joue pas'],'Fender.'],
 ['Cordes','Quelles cordes pour les basses du Do majeur ?',['La et ré','Mi grave et mi aigu','Sol et si'],'Fender.'],
 ['Majeur','Quelle corde joue le majeur dans l’exercice ?',['Si (2e)','Sol (3e)','La (5e)'],'Fender.'],
 ['Rythme','Le pouce rebondit entre deux basses en…',['Croches régulières','Rondes','Triolets lents'],'Guitar World.'],
 ['Vitesse','Quand accélérer ?',['Quand le motif est parfait','Dès le début','Jamais'],'Fender.']]);
A('gc13','Atelier : ton motif Travis',[CI(F_GF,'Ton motif Travis','Assemble pouce, majeur et index.'),
 CH('Pouce',F_GF,'Le pouce joue :',['Des basses alternées','La mélodie'],[0],'Fender.'),
 CH('Index',F_GF,'Dans l’exercice, l’index joue la corde de :',['Sol','Si'],[0],'Fender.'),
 CH('Étapes',F_GF,'Coche ce qui fait partie de l’exercice :',['Basses alternées au pouce','Majeur sur le si','Index sur le sol','Barré complet'],[0,1,2],'Voir la fiche.',true)]);

TL('g161','Accords de septième et sus',F_G7,[
 ['Quatre septièmes','Selon Guitar World, sur la base de Ré : <b>dominante 7</b> (D7 : Ré, Fa#, La, Do ; 1, 3, 5, ♭7 ; « tendu »), <b>majeure 7</b> (Dmaj7 : Ré, Fa#, La, Do# ; « doux »), <b>mineure 7</b> (Dm7 : Ré, Fa, La, Do ; 1, ♭3, 5, ♭7 ; « sombre ») et <b>m7♭5</b> (1, ♭3, ♭5, ♭7 ; « mordant »). D7 s’obtient en baissant d’un demi-ton la septième de Dmaj7 ; Dm7 diffère de D7 par la tierce mineure (Fa au lieu de Fa#). Chaque accord diffère du voisin d’une seule note, donc les formes se ressemblent. Les formes exactes sont dans des images que je n’ai pas pu lire.'],
 ['Accords sus','Selon MusicRadar : un accord majeur utilise les degrés 1, 3 et 5 ; un accord <b>sus</b> remplace la tierce par la <b>seconde</b> (sus2) ou la <b>quarte</b> (sus4). Ni majeur ni mineur : un son aérien, non résolu. Usages : ajouter du mouvement autour d’un accord majeur ou mineur, ou souligner un changement (La – Mi sus4 – Mi), courant dans l’hymne, le rock, la pop et la folk. Cités : « Pinball Wizard » (The Who), « Summer of ’69 » (Bryan Adams), « Tangerine » (Led Zeppelin, qui passe par Am, Asus4, Asus2).']],[
 ['D7','Quelles notes pour D7 ?',['Ré, Fa#, La, Do','Ré, Fa, La, Do','Ré, Fa#, La, Do#'],'Guitar World.'],
 ['Dm7','Dm7 diffère de D7 par…',['La tierce (mineure)','La quinte','La fondamentale'],'Guitar World.'],
 ['Sus2','Un accord sus2 remplace la tierce par…',['La seconde','La quarte','La sixte'],'MusicRadar.'],
 ['Sus4','Un accord sus4 remplace la tierce par…',['La quarte','La seconde','La septième'],'MusicRadar.'],
 ['Son','Les accords sus sonnent…',['Ni majeurs ni mineurs, aériens','Toujours tristes','Toujours saturés'],'MusicRadar.'],
 ['Dmaj7','Comment passer de Dmaj7 à D7 ?',['Baisser la septième d’un demi-ton','Monter la quinte','Retirer la tierce'],'Guitar World.']]);
A('gc14','Atelier : septièmes et sus',[CI(F_G7,'Septièmes et sus','Distingue les couleurs.'),
