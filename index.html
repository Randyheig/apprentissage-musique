LESSONS.m6l6={title:'Harmoniser une mineure',min:6,steps:[
  LEARN(F_HAR,'Harmoniser une mineure','<p class="lead">En La mineur naturelle : <b>La mineur</b> (i), <b>Si diminué</b> (ii°), <b>Do</b> (III), <b>Ré mineur</b> (iv), <b>Mi mineur</b> (v), <b>Fa</b> (VI), <b>Sol</b> (VII).</p><p>Avec la mineure <b>harmonique</b>, le Sol devient Sol♯ : l’accord V devient <b>Mi majeur</b> (Mi – Sol♯ – Si). Il renforce l’attraction vers la tonique.</p>',function(root){

]};
LESSONS.m6p={title:'Ta progression sur la guitare',min:7,steps:[

FX+=`<h2 id="m-6">Module 6 · Harmonie</h2>
<h3 id="f-har">Harmoniser une tonalité</h3>
<p>En tonalité majeure, les triades des degrés sont : I majeur, ii mineur, iii mineur, IV majeur, V majeur, vi mineur, vii° diminué. Majuscules = majeur, minuscules = mineur, ° = diminué. En La mineur naturelle : i, ii°, III, iv, v, VI, VII ; la mineure harmonique rend V majeur (Mi – Sol♯ – Si).</p>
<p>Fonctions : tonique (I), prédominant (IV, ii), dominant (V, V7).</p>
<h3 id="f-cad">Cadences et progressions</h3>
<p>Cadence authentique : V → I. Demi-cadence : s’arrête sur V. Plagale : IV → I. Rompue : V → vi. Les progressions proposées (I-IV-V-I, I-V-vi-IV, ii-V-I, vi-IV-I-V) sont présentées comme des constructions à traduire dans une tonalité, sans affirmation sur leur fréquence d’usage.</p>
<h3>Sources du module 6</h3>
<ol>
<li><a href="https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/" target="_blank" rel="noopener">Open Music Theory : gammes et degrés</a></li>
<li><a href="https://minnstate.pressbooks.pub/firstyearmusictheory/?p=1695" target="_blank" rel="noopener">First Year Music Theory : cadences</a></li>
</ol>
<p>Les triades de chaque degré se déduisent de la gamme (modules 4 et 5).</p>`;

FX+=`<h2 id="m-7">Module 7 · Pentatoniques, blues et modes</h2>
<h3 id="f-pent">Pentatoniques et blues</h3>
<p>Pentatonique mineure : 1 ♭3 4 5 ♭7 (La : La Do Ré Mi Sol ; Mi : Mi Sol La Si Ré). Gamme blues : pentatonique mineure + ♭5 (La blues : La Do Ré Mi♭ Mi Sol). Pentatonique majeure : 1 2 3 5 6 (Do : Do Ré Mi Sol La). Les positions sur le manche sont calculées à partir de l’accordage standard.</p>
<h3 id="f-mod">Les modes</h3>
<p>Par rapport à la gamme majeure : dorien ♭3 ♭7 ; phrygien ♭2 ♭3 ♭6 ♭7 ; lydien ♯4 ; mixolydien ♭7 ; éolien = mineure naturelle ; locrien ♭2 ♭3 ♭5 ♭6 ♭7. Sur les touches blanches : Do ionien, Ré dorien, Mi phrygien, Fa lydien, Sol mixolydien, La éolien, Si locrien. Les sources donnent les noms anglais ; les noms français sont l’usage courant.</p>
<h3>Sources du module 7</h3>
<ol>
<li><a href="https://muted.io/modes-chart" target="_blank" rel="noopener">Muted.io : tableau des modes</a></li>
<li><a href="https://muted.io/scale-formulas-intervals" target="_blank" rel="noopener">Muted.io : formules de gammes</a></li>
</ol>`;

  return {title:'Capo',q:'Tu joues la forme de <span class="hl">'+a[0]+'</span> avec le capo en <span class="hl">case '+sh+'</span>. Quel accord entends-tu ?',options:opts(b[0],NATN.filter(function(x){return x!==b}).map(function(x){return x[0]})),answer:0,explain:'Le capo monte le son de '+sh+' demi-ton'+(sh>1?'s':'')+' : '+a[0]+' → '+b[0]+'.',key:'t2'+a[0]+sh,fiche:F_CAPO};

LESSONS.m8l1={title:'Half-step down et drop D',min:6,steps:[

LESSONS.m8l3={title:'Le principe de la transposition',min:5,steps:[

  Q('C F G +2','Transpose <span class="hl">Do – Fa – Sol</span> de +2 demi-tons.',['Ré – Sol – La','Mi – La – Si','Ré – La – Si'],0,'Do→Ré, Fa→Sol, Sol→La.',F_TRANS),

  Q('E – A – B','Transpose <span class="hl">Mi – La – Si</span> de −2 demi-tons.',['Ré – Sol – La','Ré – Sol – Si','Do – Fa – Sol'],0,'Mi→Ré, La→Sol, Si→La.',F_TRANS),

  Q('Trop grave','Une chanson est <span class="hl">trop grave</span> pour le chanteur. Que faire ?',['La transposer vers le haut','La transposer vers le bas','Changer de guitare'],0,'On monte la tonalité.',F_TRANS),

  Q('Garder les formes','Comment baisser la tonalité sans changer les formes ?',['Accorder la guitare plus bas (half-step down)','Mettre un capo','Changer de corde'],0,'Le half-step down baisse toutes les cordes d’un demi-ton.',F_CAPO)

FX+=`<h2 id="m-8">Module 8 · Accordages et transposition</h2>
<h3 id="f-capo">Capo et accordages graves</h3>
<p>Half-step down : chaque corde est abaissée d’un demi-ton (Mi♭ La♭ Ré♭ Sol♭ Si♭ Mi♭). Drop D : la 6<sup>e</sup> corde passe de Mi à Ré, les autres cordes restent. Capo : il monte le son d’autant de demi-tons que le numéro de la case, en conservant les formes d’accords. Ces effets se déduisent de la définition des accordages et du demi-ton.</p>
<h3 id="f-trans">La transposition</h3>
<p>Transposer, c’est déplacer toutes les notes du même intervalle, ce qui conserve la forme de la mélodie et le chiffrage en degrés. Raisons usuelles : étendue de la voix, confort de jeu, instruments transpositeurs. Ce passage décrit l’usage courant et se vérifie par le calcul en demi-tons.</p>
<h3>Sources du module 8</h3>
<ol>
<li><a href="https://www.fender.com/articles/play/alternate-tuning-drop-d" target="_blank" rel="noopener">Fender : accordage drop D</a></li>
<li><a href="https://muted.io/guitar-tuning-chart" target="_blank" rel="noopener">Muted.io : accordages de la guitare</a></li>
</ol>`;

FX+=`<h2 id="m-9">Module 9 · Styles</h2>
<h3 id="f-punk">Punk et nu-métal</h3>
<p>Punk : tempo souvent supérieur à 150 BPM, morceaux courts, accords saturés (power chords, barrés), peu d’accords, solos minimes. Nu-métal : guitares à sept cordes ou accordées très bas, riffs syncopés, rythme avant les solos, basse inspirée du funk, batterie et chant inspirés du hip-hop.</p>
<h3 id="f-rap">Rap et musique de film</h3>
<p>Rap : boîtes à rythmes comme la Roland TR-808 ; grosse caisse sur le temps 1 d’une phrase ; caisse claire ou clap sur les temps 2 et 4 ; charley en croches ou doubles croches avec un swing léger. Tempos (Berklee) : rap old-school de la côte est environ 100–120 BPM ; côte ouest des débuts 90–100 puis 90–120 ; rap du Sud lisible à 80 ou 160. Musique de film : le leitmotif est une phrase associée à un personnage, un lieu ou une idée (terme issu de Wagner), varié par le rythme, le tempo, la texture, l’orchestration. Marche impériale (Dark Vador) ; le thème du vol d’E.T. commence par une quinte ascendante.</p>
<h3>Sources du module 9</h3>
<ol>
<li><a href="https://themusicstudio.ca/characteristics-of-music-punk/" target="_blank" rel="noopener">The Music Studio : caractéristiques du punk</a></li>
<li><a href="https://www.guitarguitar.co.uk/news/143205/" target="_blank" rel="noopener">guitarguitar : guitaristes et matériel du nu-métal</a></li>
<li><a href="https://www.berklee.edu/berklee-now/news/essential-features-of-hip-hop-production-tempo-instrumentation-rhythmic-feel-and-sonic-density" target="_blank" rel="noopener">Berklee : caractéristiques de la production hip-hop</a></li>
<li><a href="https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/13%3A_Music_in_Film/13.03%3A_Modern_Leitmotivic_Scoring_for_Film-_John_Williams'_Star_Wars" target="_blank" rel="noopener">LibreTexts : leitmotiv et musique de film (Star Wars)</a></li>
</ol>`;

function tabSvg(list){
  var W=70+list.length*44, i, o='', y=function(s){return 14+(5-s)*14};
  for(i=0;i<6;i++) o+='<line x1="40" x2="'+(W-10)+'" y1="'+y(i)+'" y2="'+y(i)+'" stroke="currentColor" stroke-width="1.4"/>';
  ['T','A','B'].forEach(function(c,j){o+='<text x="24" y="'+(y(4-j)+5+0)+'" font-size="13" font-weight="800" text-anchor="middle" fill="var(--accent)">'+c+'</text>'});
  list.forEach(function(n,j){var x=70+j*44; o+='<text x="'+x+'" y="'+(y(n.s)+5)+'" font-size="14" font-weight="800" text-anchor="middle" fill="currentColor" stroke="var(--bg)" stroke-width="5" paint-order="stroke">'+n.f+'</text>'});
  return '<svg class="ssvg" viewBox="0 0 '+W+' 96" role="img" aria-label="Tablature de guitare">'+o+'</svg>';
}

  LEARN(F_TAB,'Le piano roll','<p class="lead">Dans le <span class="hl">piano roll</span> de FL Studio, la <b>hauteur</b> est sur l’axe vertical (les notes graves sont en bas) et le <b>temps</b> sur l’axe horizontal, avec les mesures sur la règle. La grille <b>Snap</b> aligne les notes sur le temps. La <b>vélocité</b> règle la force de la note. Les <b>ghost notes</b> montrent les notes d’autres canaux. Des options mettent en évidence les notes d’une gamme.</p>'),
  MATCH('Les axes','Relie chaque élément du piano roll à son rôle.',[['Axe vertical','Hauteur des notes'],['Axe horizontal','Temps'],['Snap','Aligne les notes sur la grille'],['Vélocité','Force de la note']],F_TAB),
  Q('Graves','Où se trouvent les notes <span class="hl">graves</span> dans le piano roll ?',['En bas','En haut','À gauche'],0,'Hauteur sur l’axe vertical, graves en bas.',F_TAB),
  Q('Ghost notes','À quoi servent les <span class="hl">ghost notes</span> ?',['À voir les notes d’autres canaux','À supprimer des notes','À changer le tempo'],0,'Elles affichent les notes d’autres canaux en transparence.',F_TAB),
  Q('Gamme','À quoi sert la mise en évidence d’une gamme ?',['À repérer les notes de la gamme choisie','À jouer plus vite','À baisser le volume'],0,'Les touches de la gamme sont mises en évidence.',F_TAB)
]};
LESSONS.m10l5={title:'De la tab au piano roll',min:6,steps:[
  LEARN(F_TAB,'De la tab au piano roll','<p class="lead">Pour reporter une tablature dans FL Studio : calcule la note (corde à vide + cases), puis place-la dans le piano roll. Attention à la numérotation des octaves : FL Studio affiche le Do du milieu en <b>Do5</b>, soit une octave de plus que la notation scientifique (Do4).</p><p>Ainsi, la corde de Mi grave à vide (Mi2 en notation scientifique) s’affiche <b>Mi3</b> dans FL Studio.</p>'),
  Q('Mi grave','La corde de Mi grave à vide s’affiche en quelle note dans le piano roll de FL Studio ?',['Mi3','Mi2','Mi4'],0,'Mi2 en notation scientifique, +1 octave : Mi3.',F_TAB),
  Q('Mi aigu','La corde de Mi aigu à vide s’affiche en…',['Mi5','Mi4','Mi3'],0,'Mi4 en notation scientifique, +1 octave : Mi5.',F_TAB),
  Q('La case 3','Corde de La, case 3 : quelle note dans le piano roll ?',['Do4','Do3','Do5'],0,'La2 + 3 demi-tons = Do3 en notation scientifique, soit Do4 dans FL Studio.',F_TAB),

]};

FX+=`<h2 id="m-10">Module 10 · Partition, tablature et piano roll</h2>
<h3 id="f-port">Portée et clé de sol</h3>
<p>La portée a 5 lignes et 4 interlignes. La clé de sol s’enroule autour de la 2<sup>e</sup> ligne (Sol). Lignes, du bas vers le haut : Mi Sol Si Ré Fa ; interlignes : Fa La Do Mi. Le Do du milieu (Do4) est sur une ligne supplémentaire sous la portée.</p>
<h3 id="f-tab">Tablature et piano roll</h3>
<p>Tablature : 6 lignes, la ligne du haut est la corde de Mi aigu ; les nombres sont les cases, 0 est la corde à vide ; elle donne peu d’informations rythmiques. Piano roll (FL Studio) : hauteur sur l’axe vertical (graves en bas), temps sur l’axe horizontal, mesures sur la règle, grille Snap, vélocité, ghost notes, mise en évidence des gammes. Dans FL Studio, le Do du milieu s’affiche Do5 (une octave au-dessus de la notation scientifique) ; les correspondances avec la tablature sont calculées à partir des notes des cordes (Mi2 La2 Ré3 Sol3 Si3 Mi4).</p>
<h3>Sources du module 10</h3>
<ol>
<li><a href="https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" target="_blank" rel="noopener">Open Music Theory : clés et portée</a></li>
<li><a href="https://www.fender.com/articles/techniques/how-to-read-tabs" target="_blank" rel="noopener">Fender : lire une tablature</a></li>
<li><a href="https://www.image-line.com/fl-studio-learning/fl-studio-online-manual/html/pianoroll.htm" target="_blank" rel="noopener">Image-Line : manuel du piano roll de FL Studio</a></li>
</ol>`;

}

function streaks(){

var BPM=90;
var eng={t:null,timers:[],onStop:null};
function stopEngine(){
  if(eng.t){clearInterval(eng.t); eng.t=null}
  eng.timers.forEach(clearTimeout); eng.timers=[];
  if(eng.onStop){var f=eng.onStop; eng.onStop=null; f()}
}
function runEngine(o){
  stopEngine();

  eng.onStop=o.onStop||null;

  function later2(fn,t){eng.timers.push(setTimeout(fn,Math.max(0,(t-c.currentTime)*1000))); if(eng.timers.length>64) eng.timers.shift()}
  eng.t=setInterval(function(){
    while(next<c.currentTime+0.12){
      if(o.max!=null && i>=o.max){
        clearInterval(eng.t); eng.t=null;
        later2(stopEngine,next+0.1); return;
      }
      o.tick(i,next);
      (function(ii,tt){ if(o.ui) later2(function(){o.ui(ii)},tt) })(i,next);
      next+=o.interval(); i++;
    }

}
function env(t,type,f0,f1,g,d){
  var c=ctx, o=c.createOscillator(), gn=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+d*0.6);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t+d+0.02);
}
function clickAt(t,k){
  if(k==='a') env(t,'square',1500,0,0.2,0.05);
  else if(k==='m') env(t,'square',1200,0,0.17,0.05);
  else if(k==='n') env(t,'square',1000,0,0.14,0.05);
  else env(t,'sine',800,0,0.07,0.03);
}
function hitAt(t,r){
  if(r===0) env(t,'sine',150,55,0.9,0.25);
  else if(r===1) env(t,'triangle',330,0,0.55,0.14);
  else env(t,'square',1200,0,0.12,0.06);
}
function hitNow(r){var c=ac(); if(c) hitAt(c.currentTime+0.01,r)}

  clearTimers();

  setProgress(L.passed); foot.className='lfoot'; fb.textContent=''; next.textContent=s.graded?'Valider':'Continuer'; next.disabled=!!s.graded;

'<h3 id="f-noms">Les sept noms de notes</h3>'+
'<p>Deux écritures coexistent. Le système syllabique (Do, Ré, Mi, Fa, Sol, La, Si) est employé en France, en Italie, en Espagne et dans de nombreux autres pays. Le système alphabétique (C, D, E, F, G, A, B) est celui du monde anglophone.</p>'+
'<p><b>Correspondance :</b> Do = C, Ré = D, Mi = E, Fa = F, Sol = G, La = A, Si = B.</p>'+
'<p>Dans les pays germaniques, notre Si s’écrit H et la lettre B désigne le Si bémol.</p>'+
'<h3 id="f-clavier">Dièses, bémols et clavier</h3>'+
'<p>Une octave contient 12 notes : 7 naturelles (touches blanches) et 5 altérées (touches noires). Une touche noire prend le nom de sa voisine : dièse (♯) en partant de la touche blanche à gauche, bémol (♭) en partant de celle à droite.</p>'+
'<p>Sur un instrument accordé en tempérament égal, comme le piano, une même touche noire porte deux noms : Do♯ et Ré♭ désignent la même hauteur.</p>'+
'<h3 id="f-alter">Dièse, bémol, bécarre</h3>'+
'<p>Le dièse (♯) monte une note d’un demi-ton, le bémol (♭) la descend d’un demi-ton, le bécarre (♮) annule une altération.</p>'+
'<p>Deux notes qui sonnent pareil au piano mais s’écrivent différemment sont dites enharmoniques. Exemples : Do♯ et Ré♭, mais aussi Mi♯ et Fa, Si♯ et Do, Fa♭ et Mi, Do♭ et Si.</p>'+
'<h3 id="f-tons">Ton et demi-ton</h3>'+
'<p>Le demi-ton est le plus petit intervalle du système tempéré. Exemples : mi-fa, si-do, sol♯-la, ré-mi♭. Un ton vaut deux demi-tons.</p>'+
'<p class="note">Entre Mi et Fa, comme entre Si et Do, il n’y a pas de touche noire : ces paires sont distantes d’un demi-ton.</p>'+
'<h3 id="f-manche">Le manche et les accordages</h3>'+
'<p>Sur une guitare, passer d’une case à la suivante monte la note d’un demi-ton.</p>'+
'<p><b>Accordage standard</b> (de la corde grave à la plus aiguë) : E2, A2, D3, G3, B3, E4, soit Mi La Ré Sol Si Mi.</p>'+
'<p><b>Half-step down</b> (accordage en Mi♭) : toutes les cordes descendent d’un demi-ton, soit E♭2, A♭2, D♭3, G♭3, B♭3, E♭4.</p>'+
'<p><b>Drop D</b> : seule la corde grave descend d’un ton entier, de Mi à Ré (D2). Les autres cordes ne changent pas.</p>'+
'<h3 id="f-octave">Octaves et fréquences</h3>'+
'<p>Deux notes qui portent le même nom à une octave d’écart ont des fréquences dans le rapport 2 : 220, 440 et 880 Hz pour La3, La4 et La5.</p>'+
'<p>En tempérament égal, l’octave est découpée en 12 demi-tons identiques. Chaque demi-ton multiplie la fréquence par la racine douzième de 2, soit environ 1,0595.</p>'+
'<p>Le La4 à 440 Hz est la référence d’accordage. L’American Standards Association l’a recommandé en 1936, l’ISO l’a repris en 1955 puis normalisé en 1975 (ISO 16). En Europe continentale, on accorde souvent entre 440 et 444 Hz.</p>'+
'<h3 id="f-nommer">Numéroter les octaves</h3>'+
'<p>Dans la notation scientifique (ou internationale), on écrit la lettre suivie d’un numéro d’octave. Le numéro change à chaque Do : le Si juste en dessous de C4 est donc B3.</p>'+
'<p><b>Repères :</b> Do central = C4 ≈ 261,63 Hz = note MIDI 60. La4 = note MIDI 69 = 440 Hz. La note la plus grave d’un piano standard est La0 (27,5 Hz). La corde de Mi grave d’une guitare en accordage standard sonne un Mi2 (E2), environ 82,4 Hz.</p>'+
'<p><b>Les conventions varient.</b> Certains logiciels et claviers (Yamaha, GarageBand) appellent le Do central C3. FL Studio numérote les octaves de 0 à 10 et l’affiche C5. C’est la même note MIDI, seul le nom change. Une note de guitare E2 s’y affiche donc E3.</p>'+
'<p class="note">Les règles de base sont stables. Les conventions des logiciels peuvent évoluer : pour un réglage précis, recoupe avec la source citée.</p>'+
