<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atelier Musique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Concept : une appli de leçons courtes. Un parcours par unité (bannière violette, nœuds en zigzag), un écran = une idée. */
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --tint:#F3F0FA; --line:#E3DFEE; --line-deep:#CFC9E0;
  --fg:#1B1930; --muted:#615C7A;
  --accent:#5340D0; --accent-deep:#34269B; --accent-ink:#FFFFFF; --accent-soft:#E9E5FA; --on-accent-soft:rgba(255,255,255,.22);
  --good:#17804D; --good-soft:#DDF3E6; --bad:#B8342E; --bad-soft:#FBE3E0;
  --gold:#EAC352; --gold-deep:#B3922F; --gold-ink:#3A2C06;
  --kw:#FFFFFF; --kfg:#1B1930; --kline:#B9B3CF; --kb:#2A2740; --kbfg:#F1EFFA; --press:#D9D2F7;
  --keygood:#17804D; --keybad:#B8342E; --tgt:#DCD5F8; --given:#E6E3EF;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121D; --surface:#1E1B2C; --tint:#252238; --line:#383453; --line-deep:#4A4568;
    --fg:#F1EFFA; --muted:#A9A4C2;
    --accent:#8F7DFF; --accent-deep:#5442C9; --accent-ink:#120F26; --accent-soft:#2F2A52; --on-accent-soft:rgba(18,15,38,.16);
    --good:#5FD28F; --good-soft:#18362A; --bad:#FF8C84; --bad-soft:#41211F;
    --kw:#ECE9F7; --kfg:#1B1930; --kline:#6A6585; --kb:#0C0A14; --kbfg:#F1EFFA; --press:#C9C0F5; --tgt:#B9ADF7; --given:#C4C0D4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121D; --surface:#1E1B2C; --tint:#252238; --line:#383453; --line-deep:#4A4568;
  --fg:#F1EFFA; --muted:#A9A4C2;
  --accent:#8F7DFF; --accent-deep:#5442C9; --accent-ink:#120F26; --accent-soft:#2F2A52; --on-accent-soft:rgba(18,15,38,.16);
  --good:#5FD28F; --good-soft:#18362A; --bad:#FF8C84; --bad-soft:#41211F;
  --kw:#ECE9F7; --kfg:#1B1930; --kline:#6A6585; --kb:#0C0A14; --kbfg:#F1EFFA; --press:#C9C0F5; --tgt:#B9ADF7; --given:#C4C0D4;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:8px; padding-bottom:48px;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.app{max-width:720px; margin:0 auto}
.top{display:flex; align-items:center; justify-content:space-between; padding:14px 0 6px}
.brand{display:flex; align-items:center; gap:10px; font:800 1.4rem/1 var(--font-display)}
.brand svg{width:32px; height:32px}
.logo-bg{fill:var(--accent)} .logo-fg{fill:var(--accent-ink)} .logo-st{fill:none; stroke:var(--accent-ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.tag{font:700 .72rem var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1.5px solid var(--line); border-radius:99px; padding:4px 10px}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:10px 2px 14px; scrollbar-width:thin}
.tab{flex:none; font:700 .95rem var(--font-body); border:2px solid var(--line); background:var(--surface); color:var(--fg); padding:9px 16px; border-radius:99px; cursor:pointer; box-shadow:0 3px 0 var(--line); white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 var(--accent-deep)}
.tab.ghost{border-style:dashed; color:var(--muted); box-shadow:none; cursor:default; background:transparent}
.eyebrow{margin:18px 0 0; font:800 .75rem var(--font-body); letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
h1.page{font:800 clamp(2rem,6vw,2.7rem)/1.05 var(--font-display); margin:.15em 0 .3em; text-wrap:balance}
.lede{color:var(--muted); max-width:60ch; margin:0}
.card{border:2px solid var(--line); background:var(--surface); border-radius:20px; padding:18px; margin-top:16px}
.card h2{font:800 1.15rem var(--font-display); margin:0 0 8px}
ul.plain{margin:0; padding-left:1.15em} ul.plain li{margin:.2em 0}
.chips{display:flex; flex-wrap:wrap; gap:8px; list-style:none; padding:0; margin:0}
.chipx{background:var(--accent-soft); border-radius:14px; padding:6px 12px; font-size:.92rem; font-weight:700}
.status{margin-top:18px; color:var(--muted); font-size:.95rem}
.linkbtn{background:none; border:0; color:var(--accent); font:700 .95rem var(--font-body); text-decoration:underline dotted; text-underline-offset:4px; cursor:pointer; padding:6px 2px}
.btn{font:800 1rem var(--font-body); letter-spacing:.05em; text-transform:uppercase; border:0; border-radius:16px; padding:14px 22px; background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 0 var(--accent-deep); cursor:pointer; transition:transform .08s,box-shadow .08s; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:active:not([disabled]){transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep)}
.btn[disabled]{background:var(--line); color:var(--muted); box-shadow:0 4px 0 var(--line-deep); cursor:not-allowed}
.btn.ghost{background:var(--surface); color:var(--accent); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); padding:11px 18px}
.btn.small{padding:9px 14px; font-size:.85rem}
.btn.wide{width:100%}
.row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:12px}

/* Parcours */
.modhead{margin-bottom:6px}
.unit{margin-top:30px}
.ubanner{background:var(--accent); color:var(--accent-ink); border-radius:24px; padding:16px 18px 18px; box-shadow:0 5px 0 var(--accent-deep); display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start}
.ubanner .ue{margin:0; font:800 .72rem var(--font-body); letter-spacing:.1em; text-transform:uppercase; opacity:.85}
.ubanner h2{margin:2px 0 2px; font:800 1.7rem/1.1 var(--font-display)}
.ubanner p.ud{margin:0 0 10px; opacity:.95}
.glyph{width:62px; height:62px; border-radius:18px; background:var(--on-accent-soft); display:grid; place-items:center; font:800 1.7rem var(--font-display)}
.uchip{display:inline-flex; align-items:center; gap:8px; border:0; background:var(--on-accent-soft); color:inherit; border-radius:99px; padding:7px 14px 7px 10px; font:800 .95rem var(--font-body); cursor:pointer}
.uchip svg{width:18px; height:18px; flex:none}
.uchip .chev{transition:transform .2s}
.uchip[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.path{list-style:none; margin:0; padding:30px 0 6px; display:flex; flex-direction:column; gap:22px}
.path li{display:flex; justify-content:center}
.node{display:flex; flex-direction:column; align-items:center; text-align:center; width:min(250px,72vw); background:none; border:0; cursor:pointer; color:var(--fg); transform:translateX(var(--dx,0px)); padding:0}
.disc{width:78px; height:78px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 7px 0 var(--accent-deep); transition:transform .08s,box-shadow .08s}
.disc svg{width:34px; height:34px}
.node.k-quiz .disc{border-radius:26px}
.node.done .disc{background:var(--gold); color:var(--gold-ink); box-shadow:0 7px 0 var(--gold-deep)}
.node:active .disc{transform:translateY(5px); box-shadow:0 2px 0 var(--accent-deep)}
.node.done:active .disc{box-shadow:0 2px 0 var(--gold-deep)}
.nt{font:800 1.05rem/1.2 var(--font-body); margin-top:16px}
.ns{font-weight:700; color:var(--muted); font-size:.9rem}
.mods{list-style:none; padding:0; margin:14px 0 0; display:grid; gap:10px}
.mod{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; border:2px solid var(--line); background:var(--surface); border-radius:18px; padding:14px; opacity:.85}
.num{width:38px; height:38px; border-radius:12px; background:var(--line); color:var(--muted); display:grid; place-items:center; font:800 1.15rem var(--font-display)}
.mod h3{margin:0; font:800 1.1rem/1.2 var(--font-display); color:var(--muted)}
.mod p{margin:.2em 0 0; color:var(--muted); font-size:.92rem}
.soon{font:700 .72rem var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1.5px solid var(--line); border-radius:99px; padding:3px 9px; align-self:center; white-space:nowrap}
.next-h{margin:34px 0 0; font:800 1.3rem var(--font-display)}
.resume{position:fixed; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:10; border-radius:99px; padding:14px 22px 14px 18px}
.resume svg{width:20px; height:20px}
.pbottom{height:84px}

/* Leçon */
.lesson{position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.lhead{display:flex; align-items:center; gap:14px; padding-top:12px; padding-bottom:8px; max-width:720px; width:100%; margin:0 auto}
.icon{width:44px; height:44px; border:0; background:none; color:var(--muted); border-radius:12px; cursor:pointer; display:grid; place-items:center; flex:none}
.track{flex:1; height:16px; border-radius:99px; background:var(--line); overflow:hidden}
.fill{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease}
.count{font:800 .95rem var(--font-body); color:var(--muted); min-width:3.2ch; text-align:right; font-variant-numeric:tabular-nums}
.lbody{flex:1; overflow-y:auto; padding-top:8px; padding-bottom:28px}
.lwrap{max-width:672px; margin:0 auto}
.lesson h2{font:800 clamp(1.7rem,5.5vw,2.3rem)/1.1 var(--font-display); margin:.5em 0 .4em; text-wrap:balance}
.lead{font-size:1.1rem; margin:0 0 .8em}
.hl{color:var(--accent); font-weight:800}
.tip{background:var(--tint); border:2px solid var(--line); border-radius:16px; padding:12px 14px; margin:16px 0}
.lfoot{border-top:2px solid var(--line); background:var(--bg); padding-top:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.lfoot.good{background:var(--good-soft); border-top-color:var(--good)}
.lfoot.bad{background:var(--bad-soft); border-top-color:var(--bad)}
.lfoot-in{max-width:672px; margin:0 auto; display:grid; gap:10px}
.fb{margin:0; font-weight:700}
.fb:empty{display:none}
.lfoot.good .fb{color:var(--good)} .lfoot.bad .fb{color:var(--bad)}
.fiche{margin:24px 0 0; color:var(--muted); font-size:.92rem}
.opts{display:grid; gap:12px; margin-top:18px}
.opt{width:100%; text-align:left; font:700 1.1rem var(--font-body); color:var(--fg); background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 3px 0 var(--accent)}
.opt.good{border-color:var(--good); background:var(--good-soft); color:var(--good); box-shadow:0 3px 0 var(--good)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad); box-shadow:0 3px 0 var(--bad)}
.notes{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin:18px 0}
.nchip{border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 0; display:grid; gap:2px; justify-items:center; cursor:pointer; box-shadow:0 3px 0 var(--line); color:var(--fg); min-width:0}
.nchip .fr{font:800 1.1rem/1.1 var(--font-display)}
.nchip .en{font:800 .95rem var(--font-body); color:var(--accent)}
.nchip.on{border-color:var(--accent); background:var(--accent-soft)}
.demo{display:flex; flex-wrap:wrap; gap:10px; margin:12px 0}
.seg{display:inline-flex; flex-wrap:wrap; border:2px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); margin:6px 0 4px}
.seg button{border:0; background:none; padding:9px 16px; font:800 .9rem var(--font-body); color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.octrow{display:grid; grid-template-columns:8.5em 1fr 4.6em; gap:10px; align-items:center; width:100%; border:2px solid var(--line); background:var(--surface); border-radius:16px; padding:12px; margin-bottom:10px; cursor:pointer; color:var(--fg); box-shadow:0 3px 0 var(--line); text-align:left; font:700 .98rem var(--font-body)}
.octrow.on{border-color:var(--accent); background:var(--accent-soft)}
.o-bar{height:12px; background:var(--line); border-radius:99px; overflow:hidden}
.o-bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.o-hz{text-align:right; font-variant-numeric:tabular-nums}
.score{font:800 4.5rem/1 var(--font-display); color:var(--accent); margin:.2em 0}

/* Clavier */
.kbwrap{margin:18px 0 6px}
.kb{position:relative; display:flex; height:clamp(150px,42vw,210px); user-select:none; -webkit-user-select:none; touch-action:manipulation}
.wk{flex:1; min-width:0; border:1.5px solid var(--kline); background:var(--kw); color:var(--kfg); border-radius:0 0 10px 10px; margin:0 1px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:0 0 10px; gap:2px; cursor:pointer; font:700 .85rem var(--font-body)}
.wk .l1{font-weight:800; font-size:.95rem}
.wk .l2{font-size:.78rem; opacity:.8}
.bk{position:absolute; top:0; height:60%; background:var(--kb); color:var(--kbfg); border:0; border-radius:0 0 8px 8px; z-index:2; cursor:pointer; display:flex; align-items:flex-end; justify-content:center; padding:0 0 6px; font:700 .62rem var(--font-body); box-shadow:0 3px 0 rgba(0,0,0,.25)}
.wk.on{background:var(--press)}
.bk.on{background:var(--accent); color:var(--accent-ink)}
.wk.pick{background:var(--press); border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.bk.pick{background:var(--accent); color:var(--accent-ink)}
.wk.good,.bk.good{background:var(--keygood); color:#fff; border-color:var(--keygood)}
.wk.bad,.bk.bad{background:var(--keybad); color:#fff; border-color:var(--keybad)}
.kbstatus{margin:8px 0 0; min-height:1.6em; font-weight:700; color:var(--muted)}

/* Manche */
.fbwrap{margin:18px 0 6px}
.fretb{display:grid; gap:0; border-radius:12px; overflow:hidden; border:2px solid var(--line); background:var(--surface)}
.frow{display:grid; grid-template-columns:2.6rem repeat(var(--n),minmax(0,1fr)); align-items:stretch}
.sname{display:grid; place-items:center; font:800 .85rem var(--font-body); color:var(--muted); background:var(--tint)}
.cell{height:40px; border:0; border-left:3px solid var(--line-deep); background-color:transparent; background-image:linear-gradient(var(--muted),var(--muted)); background-size:100% 2px; background-position:center; background-repeat:no-repeat; color:var(--fg); cursor:pointer; padding:0; font:800 .72rem var(--font-body); min-width:0}
.cell.open{border-left:0; border-right:5px solid var(--fg)}
.cell span{background:var(--surface); padding:1px 4px; border-radius:6px}
.cell.on{background-color:var(--accent-soft)}
.cell.pick{background-color:var(--accent); color:var(--accent-ink)}
.cell.pick span{background:transparent}
.cell.good{background-color:var(--keygood); color:#fff}
.cell.bad{background-color:var(--keybad); color:#fff}
.cell.good span,.cell.bad span{background:transparent}

/* Exercices variés */
.pool{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
.pchip{border:2px solid var(--line); background:var(--surface); color:var(--fg); border-radius:14px; padding:10px 14px; font:800 1rem var(--font-body); cursor:pointer; box-shadow:0 3px 0 var(--line)}
.pchip.good{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.pchip.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.tray{min-height:60px; border:2px dashed var(--line-deep); border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center}
.tray:empty::before{content:'Touche les éléments dans le bon ordre'; color:var(--muted); font-weight:700; padding:0 6px}
.match{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.mcol{display:grid; gap:10px; align-content:start}
.mbtn{position:relative; text-align:center; font:800 1rem var(--font-body); color:var(--fg); background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:12px 30px 12px 10px; cursor:pointer; box-shadow:0 3px 0 var(--line); min-width:0; overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 3px 0 var(--accent)}
.mbtn.good{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.mbtn.bad{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.bd{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font:800 .75rem/20px var(--font-body); font-style:normal; text-align:center}
.wk.tgt,.bk.tgt{box-shadow:inset 0 0 0 3px var(--accent)}
.bk.tgt{background:var(--accent)}
.wk.tgt{background:var(--tgt)}
.wk.given{background:var(--given)}
.bk.given{background:var(--kb)}
.wk.tgt .l1,.wk.given .l1{color:#1B1930}
.bk.tgt{color:var(--accent-ink)}
.wk.tgt.pick{background:var(--accent); box-shadow:inset 0 0 0 3px var(--accent-deep)}
.wk.tgt.pick .l1{color:var(--accent-ink)}
.bk.tgt.pick{background:var(--accent-deep); box-shadow:0 0 0 3px var(--accent)}
.counter{font-weight:800; color:var(--muted); margin:8px 0 0}
/* Suivi */
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:18px}
.tile{border:2px solid var(--line); background:var(--surface); border-radius:18px; padding:12px 10px; text-align:center}
.tile b{display:block; font:800 2rem/1 var(--font-display); color:var(--accent)}
.tile span{font-size:.82rem; font-weight:700; color:var(--muted)}
.mrow{margin:14px 0 0}
.mtop{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.mtop b{font-weight:800}
.mlvl{font:800 .78rem var(--font-body); color:var(--muted)}
.mbar{height:14px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px}
.mbar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}
.mbar i.ok{background:var(--good)}
.msub{font-size:.82rem; color:var(--muted); margin-top:3px}
.calnav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.calnav strong{font:800 1.15rem var(--font-display); text-transform:capitalize}
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.cal .wd{text-align:center; font:800 .72rem var(--font-body); color:var(--muted); padding:2px 0}
.cd{aspect-ratio:1; border-radius:12px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font:700 .9rem var(--font-body); color:var(--fg); padding:0}
.cd.empty{border:0; background:none}
.cd.l1{background:var(--accent-soft); border-color:var(--accent-soft)}
.cd.l2{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.cd.l3{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff}
.cd.today{outline:3px solid var(--fg); outline-offset:1px}
.legend{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:12px; font-size:.82rem; color:var(--muted); font-weight:700}
.legend i{display:inline-block; width:14px; height:14px; border-radius:5px; vertical-align:-2px; margin-right:4px; border:2px solid var(--line)}
/* Rythme */
.bpmrow{display:flex; align-items:center; justify-content:center; gap:18px; margin:6px 0 4px}
.bpmbox{text-align:center; min-width:6.5rem}
.bpmbox b{display:block; font:800 4rem/1 var(--font-display); color:var(--accent); font-variant-numeric:tabular-nums}
.bpmbox span{font:800 .8rem var(--font-body); letter-spacing:.1em; color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--accent); height:32px; margin:8px 0}
.dots{display:flex; gap:12px; justify-content:center; margin:18px 0 8px; flex-wrap:wrap}
.dot{width:22px; height:22px; border-radius:50%; background:var(--line); transition:transform .08s,background .08s}
.dot.on{background:var(--accent); transform:scale(1.35)}
.dot.a{box-shadow:0 0 0 3px var(--line-deep)}
.inst{margin:14px 0 6px; font:800 .78rem var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.sgrid{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px}
.rc{height:44px; border:2px solid var(--line); background:var(--surface); border-radius:12px; color:var(--muted); font:800 .78rem var(--font-body); cursor:pointer; padding:0; min-width:0}
.rc.beat{border-color:var(--line-deep)}
.rc.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rc.ph{outline:3px solid var(--fg); outline-offset:1px}
.rc.good{background:var(--good); border-color:var(--good); color:#fff}
.rc.bad{background:var(--bad); border-color:var(--bad); color:#fff}
.rc.miss{border-color:var(--bad); color:var(--bad)}
.rmsg{margin:12px 0 0; font-weight:700; min-height:1.5em}
.rmsg.good{color:var(--good)} .rmsg.bad{color:var(--bad)}
/* Modules */
.module{margin-top:44px}
.mhead{border-top:2px solid var(--line); padding-top:16px}
.mhead h2{font:800 clamp(1.7rem,5vw,2.1rem)/1.1 var(--font-display); margin:.1em 0 .25em; text-wrap:balance}
.mchip{background:var(--accent-soft); color:var(--fg)}
.rsvg{width:100%; max-width:560px; height:auto; color:var(--fg); display:block; margin:12px 0}
.ssvg{width:100%; max-width:420px; height:auto; color:var(--fg); display:block; margin:12px 0}
.doc h2{font:800 1.8rem/1.1 var(--font-display); margin:2em 0 .2em; padding-top:.6em; border-top:2px solid var(--line)}
.doc h2:first-child{border-top:0; margin-top:.4em}
.tbl{border-collapse:collapse; width:100%; margin:.8em 0; font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line); padding:6px 8px; text-align:left}
.tbl th{background:var(--tint)}
.doc table{border-collapse:collapse; width:100%; margin:.6em 0; font-size:.95rem}
.doc th,.doc td{border:1px solid var(--line); padding:6px 8px; text-align:left}
.doc th{background:var(--tint)}
.facts{margin:10px 0; padding-left:1.1em} .facts li{margin:.25em 0}
/* Fiche */
.sheet{position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:2px solid var(--line); padding-top:8px; padding-bottom:8px}
.sheet-head strong{font:800 1.15rem var(--font-display)}
.sheet-body{flex:1; overflow-y:auto; padding-top:8px; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.doc{max-width:65ch; margin:0 auto}
.doc h3{font:800 1.4rem/1.15 var(--font-display); margin:1.4em 0 .3em}
.doc p{margin:.5em 0}
.doc a{color:var(--accent); overflow-wrap:anywhere}
.doc ol{padding-left:1.2em}
.doc .note{background:var(--tint); border:2px solid var(--line); border-radius:14px; padding:10px 14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* Clavier vide : place les noms sur les touches repérées */
function NAME(title,q,targets,pool,given,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var locked=false, active=null, got={}, k, chips=h('<div class="pool"></div>');
    function put(m,name,cls){var key=k.keys[m]; key.innerHTML=BLACK.indexOf(m%12)>=0?'<span>'+name+'</span>':'<span class="l1">'+name+'</span>'; if(cls) key.classList.add(cls)}
    function firstFree(){for(var i=0;i<targets.length;i++) if(got[targets[i].m]===undefined) return targets[i].m; return null}
    function setActive(m){if(active!==null) k.unmark(active,'pick'); active=m; if(m!==null) k.mark(m,'pick')}
    k=keyboard({mode:'both',blank:true,onPress:function(n){
      if(locked) return;
      if(targets.some(function(t){return t.m===n})) setActive(n);
    }});
    targets.forEach(function(t){k.mark(t.m,'tgt')});
    Object.keys(given||{}).forEach(function(m){put(+m,given[m],'given')});
    pool.forEach(function(name){
      var b=h('<button type="button" class="pchip">'+name+'</button>');
      b.addEventListener('click',function(){
        if(locked) return;
        var m=active!==null?active:firstFree(); if(m===null) return;
        got[m]=name; put(m,name); setActive(null);
        var f=firstFree();
        if(f!==null){setActive(f); api.unselect()}
        else api.select(validate);
      });
      chips.append(b);
    });
    function validate(){
      locked=true; setActive(null);
      var ok=true;
      targets.forEach(function(t){
        var good=t.ok.indexOf(got[t.m])>=0; k.unmark(t.m,'tgt'); k.mark(t.m,good?'good':'bad');
        if(!good){ok=false; put(t.m,t.ok[0])}
      });
      api.done(ok,'Réponses : '+targets.map(function(t){return t.ok[0]}).join(', ')+'.');
    }
    root.append(k.el,chips);
    k.el.querySelector('.kbstatus').textContent='Choisis le nom de la touche entourée.';
    setActive(firstFree());
  }};
}
/* Associer : relie chaque élément de gauche à celui de droite */
function MATCH(title,q,pairs,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var n=pairs.length, order=shuffle(pairs.map(function(p,i){return i})), link={}, sel=null, locked=false, Lb=[], Rb=[];
    var grid=h('<div class="match"></div>'), cl=h('<div class="mcol"></div>'), cr=h('<div class="mcol"></div>');
    grid.append(cl,cr); root.append(grid);
    function rightOf(r){for(var i in link) if(link[i]===r) return +i; return -1}
    function paint(){
      pairs.forEach(function(p,i){Lb[i].innerHTML=p[0]+(link[i]!==undefined?'<i class="bd">'+(i+1)+'</i>':''); Lb[i].classList.toggle('sel',sel===i)});
      order.forEach(function(r,j){var li=rightOf(r); Rb[j].innerHTML=pairs[r][1]+(li>=0?'<i class="bd">'+(li+1)+'</i>':'')});
    }
    pairs.forEach(function(p,i){
      var b=h('<button type="button" class="mbtn"></button>'); Lb[i]=b; cl.append(b);
      b.addEventListener('click',function(){
        if(locked) return;
        if(link[i]!==undefined){delete link[i]; api.unselect()}
        sel=(sel===i)?null:i; paint();
      });
    });
    order.forEach(function(r,j){
      var b=h('<button type="button" class="mbtn"></button>'); Rb[j]=b; cr.append(b);
      b.addEventListener('click',function(){
        if(locked||sel===null) return;
        var old=rightOf(r); if(old>=0) delete link[old];
        link[sel]=r; sel=null; paint();
        if(Object.keys(link).length===n) api.select(check); else api.unselect();
      });
    });
    function check(){
      locked=true; var ok=true;
      pairs.forEach(function(p,i){
        var good=link[i]===i; if(!good) ok=false;
        Lb[i].classList.add(good?'good':'bad');
        Rb[order.indexOf(link[i])].classList.add(good?'good':'bad');
      });
      api.done(ok,pairs.map(function(p){return p[0]+' = '+p[1]}).join(' ; ')+'.');
    }
    paint();
  }};
}
/* Remettre dans l'ordre */
function ORDER(title,q,items,explain,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var pool, tray=[], locked=false, trayEl=h('<div class="tray"></div>'), poolEl=h('<div class="pool"></div>');
    do{pool=shuffle(items.map(function(t,i){return i}))}while(items.length>1&&pool.every(function(v,i){return v===i}));
    function paint(){
      trayEl.innerHTML=''; poolEl.innerHTML='';
      tray.forEach(function(idx,pos){
        var b=h('<button type="button" class="pchip">'+items[idx]+'</button>');
        b.addEventListener('click',function(){if(locked) return; tray.splice(pos,1); paint(); api.unselect()});
        trayEl.append(b);
      });
      pool.forEach(function(idx){
        if(tray.indexOf(idx)>=0) return;
        var b=h('<button type="button" class="pchip">'+items[idx]+'</button>');
        b.addEventListener('click',function(){if(locked) return; tray.push(idx); paint(); if(tray.length===items.length) api.select(check)});
        poolEl.append(b);
      });
    }
    function check(){
      locked=true; var ok=true;
      trayEl.querySelectorAll('.pchip').forEach(function(b,i){var good=tray[i]===i; if(!good) ok=false; b.classList.add(good?'good':'bad')});
      api.done(ok,explain+' Ordre : '+items.join(' → ')+'.');
    }
    root.append(trayEl,poolEl); paint();
  }};
}
/* Escalier : clique les touches dans l'ordre demandé */
function STAIRS(title,q,seqNotes,explain,fiche,black,unordered){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var picks=[], locked=false, k, cnt=h('<p class="counter"></p>'), reset=h('<button type="button" class="btn ghost small">Effacer</button>');
    function upd(){
      cnt.textContent='Touches jouées : '+picks.length+'/'+seqNotes.length;
      if(picks.length===seqNotes.length) api.select(check); else api.unselect();
    }
    k=keyboard({mode:'both',black:black!==false,onPress:function(n){
      if(locked||picks.length>=seqNotes.length) return;
      picks.push(n); k.mark(n,'pick'); upd();
    }});
    reset.addEventListener('click',function(){
      if(locked) return;
      picks.forEach(function(m){k.unmark(m,'pick')}); picks=[]; upd();
    });
    function check(){
      locked=true; var ok=true;
      picks.forEach(function(m,i){var good=unordered?(seqNotes.indexOf(m)>=0&&picks.indexOf(m)===i):m===seqNotes[i]; if(!good) ok=false; k.unmark(m,'pick'); k.mark(m,good?'good':'bad')});
      if(!ok) seqNotes.forEach(function(m){if(picks.indexOf(m)<0) k.mark(m,'good')});
      api.done(ok,explain);
    }
    var row=h('<div class="row"></div>'); row.append(reset);
    root.append(k.el,cnt,row); upd();
  }};
}

function names(arr,pcs){return pcs.map(function(p){return arr[p]})}
function g1(){
  var t=Math.floor(Math.random()*4), pc, group, others, arr, pcs;
  if(t===2){
    var E=pick([[1,'Do♯','Ré♭'],[3,'Ré♯','Mi♭'],[6,'Fa♯','Sol♭'],[8,'Sol♯','La♭'],[10,'La♯','Si♭']]), flip=Math.random()<.5, from=flip?E[2]:E[1], to=flip?E[1]:E[2];
    var wrong=shuffle(FRS.concat(FRF).filter(function(n){return n!==to&&n!==from&&n!==E[1]&&n!==E[2]&&n.indexOf('♯')+n.indexOf('♭')>-2})).slice(0,2);
    return {title:'Do ou C ?',q:'Quelle note est la <span class="hl">même touche</span> que <span class="hl">'+from+'</span> ?',options:[to].concat(wrong),answer:0,explain:E[1]+' et '+E[2]+' désignent la même touche noire.',fiche:F_CLAV};
  }
  if(t===3){
    var L=['C','D','E','F','G','A','B'], i=Math.floor(Math.random()*7), nx=L[(i+1)%7];
    return {title:'Do ou C ?',q:'Après la lettre <span class="hl">'+L[i]+'</span>, quelle lettre vient dans la suite des notes ?',options:[nx,L[(i+2)%7],L[(i+6)%7]],answer:0,explain:'L’ordre est C D E F G A B, puis on revient à C.'};
  }
  pc=pick(WHITE.concat(BLACK)); group=BLACK.indexOf(pc)>=0?BLACK:WHITE;
  others=shuffle(group.filter(function(p){return p!==pc})).slice(0,2);
  arr=t===0?ENS:FRS; pcs=[pc].concat(others);
  return {title:'Do ou C ?',q:t===0?'Comment écrit-on <span class="hl">'+FRS[pc]+'</span> avec une lettre ?':'Quelle note s’écrit <span class="hl">'+ENS[pc]+'</span> ?',
    options:names(arr,pcs),answer:0,explain:FRS[pc]+' = '+ENS[pc]+'.'};
}
function g2(){
  var pc=Math.floor(Math.random()*12), i;
  if(Math.random()<.25){
    var m=55+Math.floor(Math.random()*12), d=pick([1,2,3]), all=['Un demi-ton','Un ton','Un ton et demi'], nm=all[d-1];
    return {title:'À l’oreille',q:'Écoute ces deux notes. Quelle distance les sépare ?',options:[nm].concat(all.filter(function(x){return x!==nm})),answer:0,
      explain:FRS[m%12]+' → '+FRS[(m+d)%12]+' : '+d+' demi-ton'+(d>1?'s':'')+'.',key:'oreille '+m+' '+d,
      extra:function(root){playBtn(root,[m,m+d],800,'Écouter les deux notes')}};
  }
  if(Math.random()<.35){
    var up=Math.random()<.5, d=up?1:-1, tgt=(pc+2*d+12)%12, mid=(pc+d+12)%12;
    var opts=[FRS[tgt],FRS[mid],FRS[(pc+3*d+12)%12]];
    return {title:'Combien de demi-tons ?',q:'Quelle note est <span class="hl">un ton '+(up?'au-dessus':'au-dessous')+' de '+FRS[pc]+'</span> ?',
      options:opts,answer:0,explain:'Un ton = 2 demi-tons : '+FRS[pc]+' → '+FRS[mid]+' → '+FRS[tgt]+'.'};
  }
  var n=1+Math.floor(Math.random()*7), chain=[];
  for(i=0;i<=n;i++) chain.push(FRS[(pc+i)%12]);
  var cand=[n,n+1,n-1,n+2,n-2].filter(function(v){return v>=1}), seen={}, opts2=[];
  cand.forEach(function(v){ if(!seen[v]&&opts2.length<3){seen[v]=1; opts2.push(String(v))} });
  return {title:'Combien de demi-tons ?',q:'De <span class="hl">'+FRS[pc]+'</span> à <span class="hl">'+FRS[(pc+n)%12]+'</span>, en montant, combien de demi-tons ?',
    options:opts2,answer:0,explain:chain.join(', ')+' : '+n+' demi-ton'+(n>1?'s':'')+'.'};
}
function g3(){
  var t=Math.floor(Math.random()*3), L=pick(['C','D','E','F','G','A','B']), n;
  if(t===0){
    var k=pick([2,3,5,6]), hz=440*Math.pow(2,k-4);
    return {title:'Octave express',q:'Le La4 vibre à 440 Hz. À quelle fréquence vibre le <span class="hl">La'+k+'</span> ?',
      options:[hz+' Hz',(hz*2)+' Hz',(hz/2)+' Hz'],answer:0,explain:'Chaque octave double (ou divise par deux) la fréquence : La'+k+' = '+hz+' Hz.'};
  }
  if(t===1){
    n=pick([2,3,4,5,6]);
    return {title:'Octave express',q:'FL Studio affiche <span class="hl">'+L+n+'</span>. Quel est son nom en notation standard ?',
      options:[L+(n-1),L+n,L+(n-2)],answer:0,explain:'FL Studio compte une octave plus haut : '+L+n+' devient '+L+(n-1)+' en notation standard.',fiche:F_NUM};
  }
  n=pick([1,2,3,4,5]);
  return {title:'Octave express',q:'En notation standard, tu as <span class="hl">'+L+n+'</span>. Comment FL Studio l’affiche-t-il ?',
    options:[L+(n+1),L+n,L+(n+2)],answer:0,explain:'FL Studio compte une octave plus haut : '+L+n+' s’affiche '+L+(n+1)+'.',fiche:F_NUM};
}
var GAMES={
  g1:{title:'Do ou C ?',gen:g1,fiche:F_NOMS},
  g2:{title:'Combien de demi-tons ?',gen:g2,fiche:F_TONS},
  g3:{title:'Octave express',gen:g3,fiche:F_OCT}
};
function gameSteps(id){
  var out=[], seen={}, tries=0;
  while(out.length<10 && tries<200){
    tries++;
    var q=GAMES[id].gen(), key=q.key||q.q; q.fiche=q.fiche||GAMES[id].fiche;
    if(seen[key]) continue;
    seen[key]=1; out.push(quizStep(q));
  }
  return out;
}

var FIG={w:'ronde',h:'blanche',q:'noire',e:'croche',s:'double croche'};
function fmtB(x){var w=Math.floor(x+1e-9), f=x-w, fs=Math.abs(f-.5)<1e-6?'½':Math.abs(f-.25)<1e-6?'¼':Math.abs(f-.75)<1e-6?'¾':''; return (w>0||!fs?String(w):'')+fs}
function tps(x){return fmtB(x)+' temps'}
function RQ(title,q,items,options,answer,explain,fiche,o){
  return quizStep({title:title,q:q,options:options,answer:answer,explain:explain,fiche:fiche,
    extra:function(root){root.insertAdjacentHTML('beforeend',rhythmSvg(items,o))}});
}
function playPattern(arr,bpm){
  var c=ac(); if(!c) return; var t0=c.currentTime+0.1, spb=60/(bpm||80)/2;
  arr.forEach(function(v,i){ if(i%2===0) clickAt(t0+i*spb,'s'); if(v) hitAt(t0+i*spb,1) });
}
function PGRID(title,q,answer,explain,fiche){
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var user=answer.map(function(){return false}), cs=[], locked=false, g=h('<div class="sgrid"></div>');
    function lbl(i){return i%2===0?String(i/2+1):'&'}
    function upd(){ if(user.some(Boolean)) api.select(check); else api.unselect() }
    answer.forEach(function(_,i){
      var c=h('<button type="button" class="rc'+(i%2===0?' beat':'')+'" aria-pressed="false" aria-label="Pas '+(i+1)+'">'+lbl(i)+'</button>');
      c.addEventListener('click',function(){
        if(locked) return;
        user[i]=!user[i]; c.classList.toggle('on',user[i]); c.setAttribute('aria-pressed',String(user[i]));
        if(user[i]) hitNow(1); upd();
      });
      cs.push(c); g.append(c);
    });
    function check(){
      locked=true; var ok=true;
      cs.forEach(function(c,i){
        var good=user[i]===!!answer[i]; if(!good) ok=false;
        if(user[i]) c.classList.add(good?'good':'bad'); else if(answer[i]){c.classList.add('miss'); c.textContent='●'}
      });
      api.done(ok,explain);
    }
    var row=h('<div class="demo"></div>'), pb=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter ma version</button>');
    pb.addEventListener('click',function(){playPattern(user)});
    row.append(pb); root.append(g,row);
  }};
}

    var items=[IT('q'),IT('q'),IT('q'),IT('q')];
    root.insertAdjacentHTML('beforeend',rhythmSvg(items,{ts:[4,4],label:'Quatre noires'}));
    var row=h('<div class="demo"></div>');

FX+=`<h2 id="m-2">Module 2 · Rythme et lecture</h2>
<h3 id="f-val">Durées et silences</h3>
<p>La <b>pulsation</b> est le battement régulier, le <b>tempo</b> sa vitesse en BPM (battements par minute). À 60 BPM, un battement dure une seconde.</p>
<table><tr><th>Figure</th><th>Durée</th><th>Silence</th></tr><tr><td>Ronde</td><td>4 temps</td><td>Pause</td></tr><tr><td>Blanche</td><td>2 temps</td><td>Demi-pause</td></tr><tr><td>Noire</td><td>1 temps</td><td>Soupir</td></tr><tr><td>Croche</td><td>½ temps</td><td>Demi-soupir</td></tr><tr><td>Double croche</td><td>¼ temps</td><td>Quart de soupir</td></tr></table>
<p>Chaque figure dure la moitié de la précédente. Un point après une note ajoute la moitié de sa valeur : blanche pointée = 3 temps, noire pointée = 1½ temps.</p>
<p class="note">Les sources en anglais parlent de whole, half, quarter, eighth et sixteenth notes. Les noms français (ronde, blanche, noire, croche) et les noms de silences sont l'usage courant.</p>
<h3 id="f-mes">Mesures et chiffrage</h3>
<p>Le chiffre du haut donne le nombre de temps par mesure, celui du bas la figure qui vaut un temps (4 = noire, 8 = croche). Exemples : 4/4 = 4 noires, 3/4 = 3 noires, 2/4 = 2 noires.</p>
<p>En mesure <b>composée</b>, chaque temps se divise en trois. Le chiffre du haut compte les divisions : 6/8 = 6 croches = 2 temps, 9/8 = 3 temps, 12/8 = 4 temps. Avec un 8 en bas, le temps est une noire pointée.</p>
<h3 id="f-syn">Syncope, contretemps, triolets</h3>
<p>Un <b>triolet</b> divise un temps (ou une division) en trois parties égales, noté avec un 3. Une <b>syncope</b> déplace l'accent hors du temps : elle peut venir de liaisons, de points ou de silences.</p>
<p class="note">Le contretemps (note placée sur le « et », entre deux temps) est une définition d'usage courant, non reprise mot à mot des sources.</p>
<h3>Sources du module 2</h3>
<ol>
<li><a href="https://www.open.edu/openlearn/history-the-arts/music/an-introduction-music-theory/content-section-3.1" target="_blank" rel="noopener">Open University : valeurs de notes</a></li>
<li><a href="https://users.wfu.edu/carter/chapter1.html" target="_blank" rel="noopener">Wake Forest University, Carter : notation du rythme (points, silences)</a></li>
<li><a href="https://www.uwosh.edu/faculty_staff/atwell/music_theory/Meters1.htm" target="_blank" rel="noopener">UW Oshkosh : mesures et chiffrage</a></li>
<li><a href="https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/" target="_blank" rel="noopener">Open Music Theory : mesures composées</a></li>
<li><a href="https://viva.pressbooks.pub/openmusictheory/chapter/other-rhythmic-essentials/" target="_blank" rel="noopener">Open Music Theory : triolets, syncope</a></li>
</ol>`;

LESSONS.m3l1={title:'Mesurer une distance',min:5,steps:[
  LEARN(F_INT,'Mesurer une distance','<p class="lead">Un <span class="hl">intervalle</span> est la distance entre deux notes. Il a un <span class="hl">numéro</span> et une <span class="hl">qualité</span>. Le numéro se compte en lettres, en comptant la note de départ : Do, Ré, Mi = 3, c’est une <b>tierce</b>. Do à Sol = 5 : une <b>quinte</b>.</p><p>Deux notes jouées l’une après l’autre forment un intervalle <b>mélodique</b>. Jouées ensemble, elles forment un intervalle <b>harmonique</b>.</p>',function(root){
    var k=keyboard({mode:'both'}); root.append(k.el);

  }),
  Q('Compter le numéro','De <span class="hl">Sol</span> à <span class="hl">Si</span>, quel est le numéro de l’intervalle ?',['Tierce','Seconde','Quarte'],0,'Sol, La, Si : trois notes comptées, donc une tierce.',F_INT),

]};
LESSONS.m3l2={title:'Justes, majeurs et mineurs',min:6,steps:[
  LEARN(F_INT,'Justes, majeurs et mineurs','<p class="lead">Les <span class="hl">secondes, tierces, sixtes et septièmes</span> sont <b>majeures</b> ou <b>mineures</b> : la mineure a un demi-ton de moins. Les <span class="hl">quartes, quintes et octaves</span> sont <b>justes</b>, jamais majeures ni mineures.</p><table class="tbl"><tr><th>Intervalle</th><th>Demi-tons</th></tr><tr><td>Seconde mineure / majeure</td><td>1 / 2</td></tr><tr><td>Tierce mineure / majeure</td><td>3 / 4</td></tr><tr><td>Quarte juste</td><td>5</td></tr><tr><td>Triton</td><td>6</td></tr><tr><td>Quinte juste</td><td>7</td></tr><tr><td>Sixte mineure / majeure</td><td>8 / 9</td></tr><tr><td>Septième mineure / majeure</td><td>10 / 11</td></tr><tr><td>Octave</td><td>12</td></tr></table><p>Un intervalle juste ou majeur monté d’un demi-ton devient <b>augmenté</b>. Un intervalle mineur ou juste descendu d’un demi-ton devient <b>diminué</b>. Le <b>triton</b> (6 demi-tons) est une quarte augmentée ou une quinte diminuée.</p>',function(root){

  Q('Quarte','Une quarte peut être…',['juste','majeure','mineure'],0,'Les quartes, quintes et octaves sont justes (ou augmentées / diminuées), jamais majeures ni mineures.',F_INT),

]};
LESSONS.m3l4={title:'Les intervalles sur le manche',min:6,steps:[
  LEARN(F_INT,'Les intervalles sur le manche','<p class="lead">Sur une même corde, <span class="hl">chaque case ajoute un demi-ton</span>. Entre deux cordes voisines à vide, l’écart est une <span class="hl">quarte juste</span> (5 demi-tons), sauf entre Sol et Si : une <span class="hl">tierce majeure</span> (4 demi-tons).</p><p>Conséquence : la case 5 d’une corde donne la note de la corde voisine à vide. Entre Sol et Si, c’est la case 4.</p>',function(root){

  Q('Cordes voisines','Entre deux cordes voisines à vide (sauf Sol–Si), l’intervalle est…',['une quarte juste','une quinte juste','une tierce mineure'],0,'Mi → La, La → Ré, Ré → Sol et Si → Mi : 5 demi-tons.',F_INT),
  FR('Quinte sur la corde','Sur la corde de Mi grave, clique la case qui donne une <span class="hl">quinte juste</span> au-dessus de la corde à vide.',{s:0,f:7},'7 demi-tons : case 7, qui donne Si.',F_INT),
  FR('Tierce sur la corde','Sur la corde de Ré, clique la case qui donne une <span class="hl">tierce majeure</span> au-dessus de la corde à vide.',{s:2,f:4},'4 demi-tons : case 4, qui donne Fa♯.',F_INT)
]};
LESSONS.m3l5={title:'Reconnaître à l’oreille',min:5,steps:[

    demos(root,[['Seconde mineure',[60,61],800],['Tierce mineure',[60,63],800],['Tierce majeure',[60,64],800],['Quinte juste',[60,67],800],['Octave',[60,72],800]]);

  EAR('Quel intervalle ?','Écoute ces deux notes. Quel intervalle les sépare ?',[60,64],['Tierce majeure','Tierce mineure','Quinte juste'],0,'Do → Mi : 4 demi-tons, une tierce majeure.',F_INT),

]};
LESSONS.m3p={title:'Tes intervalles sur la guitare',min:7,steps:[
  LEARN(F_INT,'Tes intervalles sur la guitare','<p class="lead">Tu connais maintenant la règle du manche : <span class="hl">une case = un demi-ton</span>. Elle te permet de retrouver n’importe quel intervalle à partir d’une corde à vide.</p><p>Par exemple, depuis la corde de La à vide : une tierce majeure se trouve à la case 4, une quinte juste à la case 7.</p>',function(root){

  Q('Case 5','À la case 5 de la corde de <span class="hl">La</span>, quelle corde à vide retrouves-tu ?',['Ré','Sol','Mi'],0,'La + 5 demi-tons = Ré, la corde voisine à vide.',F_INT),

  FR('Quarte','Sur la corde de Ré, clique la case qui donne une <span class="hl">quarte juste</span> au-dessus de la corde à vide.',{s:2,f:5},'5 demi-tons : case 5, qui donne Sol.',F_INT),
  FR('Tierce mineure','Sur la corde de Sol, clique la case qui donne une <span class="hl">tierce mineure</span> au-dessus de la corde à vide.',{s:3,f:3},'3 demi-tons : case 3, qui donne Si♭.',F_INT),
  FR('Quinte','Sur la corde de Si, clique la case qui donne une <span class="hl">quinte juste</span> au-dessus de la corde à vide.',{s:4,f:7},'7 demi-tons : case 7, qui donne Fa♯.',F_INT)
]};
FX+=`<h2 id="m-3">Module 3 · Intervalles</h2>
<h3 id="f-int">Les intervalles</h3>
<p>Un intervalle est la distance entre deux notes. Il a une <b>quantité</b> (le numéro : seconde, tierce…) et une <b>qualité</b> (majeur, mineur, juste, augmenté, diminué). Joué note après note, il est mélodique ; joué ensemble, harmonique.</p>
<p>Le numéro se compte en lettres, en incluant la note de départ : Do–Mi = 3 (tierce), Do–Sol = 5 (quinte).</p>
<table><tr><th>Intervalle</th><th>Abrév.</th><th>Demi-tons</th></tr>
<tr><td>Seconde mineure</td><td>m2</td><td>1</td></tr><tr><td>Seconde majeure</td><td>M2</td><td>2</td></tr><tr><td>Tierce mineure</td><td>m3</td><td>3</td></tr><tr><td>Tierce majeure</td><td>M3</td><td>4</td></tr><tr><td>Quarte juste</td><td>P4</td><td>5</td></tr><tr><td>Triton</td><td>A4 / d5</td><td>6</td></tr><tr><td>Quinte juste</td><td>P5</td><td>7</td></tr><tr><td>Sixte mineure</td><td>m6</td><td>8</td></tr><tr><td>Sixte majeure</td><td>M6</td><td>9</td></tr><tr><td>Septième mineure</td><td>m7</td><td>10</td></tr><tr><td>Septième majeure</td><td>M7</td><td>11</td></tr><tr><td>Octave</td><td>P8</td><td>12</td></tr></table>
<p><b>Règles de qualité :</b> 4tes, 5tes, unissons et octaves sont justes (jamais majeurs ni mineurs). 2ndes, 3ces, 6tes et 7es sont majeures ou mineures. Un intervalle majeur ou juste monté d'un demi-ton devient augmenté. Un intervalle majeur descendu d'un demi-ton devient mineur. Un intervalle mineur ou juste descendu d'un demi-ton devient diminué.</p>
<p><b>Sur la guitare (accordage standard)</b> : une case = un demi-ton. Les cordes à vide voisines sont à 5 demi-tons (quarte juste), sauf Sol–Si à 4 demi-tons (tierce majeure). Cela se déduit des notes des cordes : E2 A2 D3 G3 B3 E4.</p>
<h3>Sources du module 3</h3>
<ol>
<li><a href="https://muted.io/intervals-chart" target="_blank" rel="noopener">Muted.io : tableau des intervalles</a></li>
<li><a href="https://www.uwosh.edu/faculty_staff/atwell/music_theory/Intervals1.htm" target="_blank" rel="noopener">UW Oshkosh : intervalles mélodiques et harmoniques</a></li>
<li><a href="https://www.uwosh.edu/faculty_staff/atwell/music_theory/Intervals2.htm" target="_blank" rel="noopener">UW Oshkosh : qualité des intervalles</a></li>
</ol>`;

function SAFE(g){return function(){var r,i;for(i=0;i<60;i++){r=g(); var o=r.options.join('|'); if(!/[𝄪𝄫]/.test(o+r.q)&&o.indexOf('?')<0&&r.options.length>=3&&new Set(r.options).size===r.options.length) return r} return r}}
GAMES.m3g1.gen=SAFE(g_m3g1); GAMES.m3g2.gen=SAFE(g_m3g2);
function lst(a){return a.join(' – ')}
function minRoot(r){return RT((r.l+5)%7,(r.s+9)%12)}
var DEG=['tonique','sus-tonique','médiante','sous-dominante','dominante','sus-dominante','sensible'];
function keyLabel(r,minor){return r.fr+(minor?' mineur':' majeur')}
function accCount(sc){var n=0,sh=0,fl=0;sc.forEach(function(x){if(x.indexOf('♯')>=0)sh++;if(x.indexOf('♭')>=0)fl++});return {sh:sh,fl:fl}}
function accText(c){return c.sh?c.sh+(c.sh>1?' dièses':' dièse'):c.fl?c.fl+(c.fl>1?' bémols':' bémol'):'aucune altération'}
var ACCPOOL=['aucune altération','1 dièse','2 dièses','3 dièses','4 dièses','5 dièses','6 dièses','1 bémol','2 bémols','3 bémols','4 bémols','5 bémols'];

/* =================== MODULE 4 : GAMMES =================== */
function g_m4g1(){
  var t=Math.floor(Math.random()*4), r=pick(KEYS), sc=scaleOf(r,MAJ), n=1+Math.floor(Math.random()*6);
  if(t===0){var note=sc[n];
    return {title:'Quelle note ?',q:'Dans la gamme de <span class="hl">'+keyLabel(r)+'</span>, quelle est la note du <span class="hl">'+(n+1)+'<sup>e</sup> degré</span> ?',options:opts(note,sc.filter(function(x){return x!==note}).concat([nm(r.l+n,r.s+MAJ[n]+1),nm(r.l+n,r.s+MAJ[n]-1)]),4),answer:0,explain:keyLabel(r)+' : '+lst(sc)+'.',key:'deg'+r.fr+n,fiche:F_GAM};}
  if(t===1){var miss=sc[n], shown=sc.map(function(x,i){return i===n?'…':x});
    return {title:'Note manquante',q:'Complète la gamme de <span class="hl">'+keyLabel(r)+'</span> : '+lst(shown),options:opts(miss,[nm(r.l+n,r.s+MAJ[n]+1),nm(r.l+n,r.s+MAJ[n]-1),sc[(n+1)%7]],4),answer:0,explain:keyLabel(r)+' : '+lst(sc)+'.',key:'miss'+r.fr+n,fiche:F_GAM};}
  if(t===2){var note2=sc[n];
    return {title:'Quelle note ?',q:'Dans la gamme de <span class="hl">'+keyLabel(r)+'</span>, quelle note est la <span class="hl">'+DEG[n]+'</span> ?',options:opts(note2,sc.filter(function(x){return x!==note2})),answer:0,explain:'La '+DEG[n]+' est le '+(n+1)+'<sup>e</sup> degré : '+note2+'.',key:'dn'+r.fr+n,fiche:F_GAM};}
  return {title:'Quel degré ?',q:'Dans la gamme de <span class="hl">'+keyLabel(r)+'</span>, quel est le nom du degré de <span class="hl">'+sc[n]+'</span> ?',options:opts(DEG[n],DEG.filter(function(x,i){return i!==n&&i!==0})),answer:0,explain:sc[n]+' est le '+(n+1)+'<sup>e</sup> degré de '+keyLabel(r)+' : la '+DEG[n]+'.',key:'nd'+r.fr+n,fiche:F_GAM};
}
GAMES.m4g1={title:'Gammes majeures',gen:SAFE(g_m4g1),fiche:F_GAM};
function g_m4g2(){
  var t=Math.floor(Math.random()*5), r=pick(KEYS), sc=scaleOf(r,MAJ), c=accCount(sc);
  if(t===0) return {title:'Armure',q:'Combien d’altérations compte la gamme de <span class="hl">'+keyLabel(r)+'</span> ?',options:opts(accText(c),ACCPOOL),answer:0,explain:keyLabel(r)+' : '+accText(c)+'.',fiche:F_ARM};
  if(t===1){var others=KEYS.filter(function(k){return k!==r}).map(function(k){return keyLabel(k)});
    return {title:'Quelle tonalité ?',q:'Quelle tonalité majeure a <span class="hl">'+accText(c)+'</span> ?',options:opts(keyLabel(r),others),answer:0,explain:keyLabel(r)+' : '+accText(c)+'.',key:'ton'+r.fr,fiche:F_ARM};}
  if(t===2){var mr=minRoot(r);
    return {title:'Relatif mineur',q:'Quel est le <span class="hl">relatif mineur</span> de '+keyLabel(r)+' ?',options:opts(keyLabel(mr,1),KEYS.filter(function(k){return k!==r}).map(function(k){return keyLabel(minRoot(k),1)})),answer:0,explain:'Le relatif mineur part du 6<sup>e</sup> degré : '+keyLabel(mr,1)+'.',key:'rel'+r.fr,fiche:F_MIN};}
  if(t===3){var mr2=minRoot(r);
    return {title:'Relatif majeur',q:'Quel est le <span class="hl">relatif majeur</span> de '+keyLabel(mr2,1)+' ?',options:opts(keyLabel(r),KEYS.filter(function(k){return k!==r}).map(function(k){return keyLabel(k)})),answer:0,explain:keyLabel(mr2,1)+' et '+keyLabel(r)+' ont la même armure.',key:'relM'+r.fr,fiche:F_MIN};}
  var mr3=minRoot(r), nat=scaleOf(mr3,NMIN), har=scaleOf(mr3,HMIN);
  return {title:'Mineure harmonique',q:'Quelle note est <span class="hl">altérée</span> dans la gamme de '+keyLabel(mr3,1)+' harmonique, par rapport à la naturelle ?',options:opts(har[6],[nat[6],nat[5],har[5],nat[1]]),answer:0,explain:'La mineure harmonique monte le 7<sup>e</sup> degré : '+nat[6]+' devient '+har[6]+'.',key:'har'+mr3.fr,fiche:F_MIN};
}
GAMES.m4g2={title:'Armures et mineures',gen:SAFE(g_m4g2),fiche:F_ARM};
LESSONS.m4l1={title:'La gamme majeure',min:5,steps:[
  LEARN(F_GAM,'La gamme majeure','<p class="lead">Une <span class="hl">gamme</span> est une suite de notes rangées de la plus grave à la plus aiguë. La gamme majeure suit toujours le même modèle : <b>ton – ton – demi-ton – ton – ton – ton – demi-ton</b>.</p><p>Les deux demi-tons tombent entre les degrés <b>3 et 4</b>, puis <b>7 et 8</b>. Sur les touches blanches, la gamme de Do majeur suit ce modèle.</p>',function(root){
    var k=keyboard({mode:'both'}); root.append(k.el);
    demoRow(root,k,[['Écouter Do majeur',[60,62,64,65,67,69,71,72]]],450);
  }),
  Q('Les demi-tons','Entre quels degrés de la gamme majeure trouve-t-on les <span class="hl">demi-tons</span> ?',['3–4 et 7–8','1–2 et 5–6','2–3 et 6–7'],0,'Modèle : T T ½ T T T ½. Les demi-tons sont entre les degrés 3–4 et 7–8.',F_GAM),
  Q('Compter','Combien de tons et de demi-tons contient une gamme majeure ?',['5 tons et 2 demi-tons','4 tons et 3 demi-tons','6 tons et 1 demi-ton'],0,'T T ½ T T T ½ : 5 tons et 2 demi-tons, soit 12 demi-tons en tout.',F_GAM),
  STAIRS('Joue Do majeur','Clique, dans l’ordre, les 8 notes de la gamme de <span class="hl">Do majeur</span> : de Do à Do.',[60,62,64,65,67,69,71,72],'Do majeur n’utilise que les touches blanches.',F_GAM,false),
  K('Le demi-ton','Clique sur la note qui est à un <span class="hl">demi-ton</span> sous le Do aigu dans la gamme de Do majeur.',[71],'Le dernier demi-ton est entre le 7<sup>e</sup> degré et l’octave : Si – Do.',F_GAM,false)
]};
LESSONS.m4l2={title:'Construire une gamme',min:6,steps:[
  LEARN(F_GAM,'Construire une gamme','<p class="lead">Pour construire une gamme majeure sur n’importe quelle note, on applique le modèle <b>T T ½ T T T ½</b> et on utilise <span class="hl">chaque lettre une seule fois</span>.</p><p><b>Sol majeur</b> : Sol La Si Do Ré Mi <b>Fa♯</b>. Le Fa doit être monté pour retrouver un demi-ton entre le 7<sup>e</sup> degré et l’octave.</p><p><b>Fa majeur</b> : Fa Sol La <b>Si♭</b> Do Ré Mi. Le Si est baissé pour garder un demi-ton entre le 3<sup>e</sup> et le 4<sup>e</sup> degré.</p>',function(root){
    demos(root,[['Sol majeur',[67,69,71,72,74,76,78,79],450],['Fa majeur',[65,67,69,70,72,74,76,77],450]]);
  }),
  ORDER('Sol majeur','Remets dans l’ordre les notes de la gamme de <span class="hl">Sol majeur</span>.',['Sol','La','Si','Do','Ré','Mi','Fa♯'],'Sol majeur : Sol La Si Do Ré Mi Fa♯.',F_GAM),
  ORDER('Fa majeur','Remets dans l’ordre les notes de la gamme de <span class="hl">Fa majeur</span>.',['Fa','Sol','La','Si♭','Do','Ré','Mi'],'Fa majeur : Fa Sol La Si♭ Do Ré Mi.',F_GAM),
  Q('Ré majeur','Quelles notes sont altérées dans la gamme de <span class="hl">Ré majeur</span> ?',['Fa♯ et Do♯','Si♭ et Mi♭','Fa♯ seulement'],0,'Ré majeur : Ré Mi Fa♯ Sol La Si Do♯.',F_GAM),
  Q('Une lettre par degré','Pourquoi écrit-on Si♭ et non La♯ dans la gamme de Fa majeur ?',['Pour utiliser chaque lettre une seule fois','Parce que La♯ n’existe pas','Parce que Si♭ est plus aigu'],0,'La gamme suit les lettres dans l’ordre : Fa Sol La Si Do Ré Mi. Le 4<sup>e</sup> degré porte donc la lettre Si.',F_GAM)
]};
LESSONS.m4l3={title:'Les degrés',min:5,steps:[
  LEARN(F_GAM,'Les degrés','<p class="lead">Chaque note de la gamme a un numéro (de 1 à 7) et un nom de fonction : <b>tonique</b> (1), <b>sus-tonique</b> (2), <b>médiante</b> (3), <b>sous-dominante</b> (4), <b>dominante</b> (5), <b>sus-dominante</b> (6) et <b>sensible</b> (7).</p><p>En Do majeur : Do est la tonique, Sol la dominante, Si la sensible. La <b>tonique</b> donne son nom à la tonalité.</p>'),
  MATCH('Les noms des degrés','Relie chaque degré à son nom.',[['1<sup>er</sup> degré','Tonique'],['4<sup>e</sup> degré','Sous-dominante'],['5<sup>e</sup> degré','Dominante'],['7<sup>e</sup> degré','Sensible']],F_GAM),
  Q('Dominante','En Do majeur, quelle note est la <span class="hl">dominante</span> ?',['Sol','Fa','Mi'],0,'La dominante est le 5<sup>e</sup> degré : Do Ré Mi Fa Sol.',F_GAM),
  Q('Sensible','En Ré majeur, quelle note est la <span class="hl">sensible</span> ?',['Do♯','Do','Ré'],0,'Le 7<sup>e</sup> degré de Ré majeur est Do♯, à un demi-ton sous la tonique.',F_GAM),
  Q('Médiante','Quel est le nom du <span class="hl">3<sup>e</sup> degré</span> ?',['Médiante','Sous-dominante','Sensible'],0,'1 tonique, 2 sus-tonique, 3 médiante.',F_GAM)
]};
LESSONS.m4l4={title:'Armures et cercle des quintes',min:7,steps:[
  LEARN(F_ARM,'Armures et cercle des quintes','<p class="lead">L’<span class="hl">armure</span> regroupe au début de la portée les altérations d’une tonalité. Les dièses s’ajoutent dans l’ordre <b>Fa Do Sol Ré La Mi Si</b>. Les bémols s’ajoutent dans l’ordre inverse : <b>Si Mi La Ré Sol Do Fa</b>.</p><p>Do majeur n’a aucune altération. Fa majeur a 1 bémol. En montant de quinte, on ajoute un dièse : Sol (1), Ré (2), La (3), Mi (4)… C’est le <span class="hl">cercle des quintes</span>.</p><p>Astuce pour les dièses : la tonique est un demi-ton au-dessus du dernier dièse. Pour les bémols : la tonique est l’avant-dernier bémol.</p>'),
  ORDER('Ordre des dièses','Remets dans l’ordre les dièses de l’armure.',['Fa','Do','Sol','Ré','La','Mi','Si'],'Fa Do Sol Ré La Mi Si.',F_ARM),
  Q('2 dièses','Quelle tonalité majeure a <span class="hl">2 dièses</span> (Fa♯ et Do♯) ?',['Ré majeur','La majeur','Sol majeur'],0,'Ré majeur : Fa♯ et Do♯.',F_ARM),
  Q('Dernier dièse','L’armure a pour dièses Fa♯, Do♯, Sol♯. Quelle est la tonique majeure ?',['La','Sol','Si'],0,'La tonique est un demi-ton au-dessus du dernier dièse : Sol♯ → La.',F_ARM),
  Q('Bémols','Quelle tonalité majeure a <span class="hl">3 bémols</span> (Si♭, Mi♭, La♭) ?',['Mi♭ majeur','Si♭ majeur','La♭ majeur'],0,'L’avant-dernier bémol est la tonique : Mi♭.',F_ARM),
  Q('Cercle des quintes','En montant d’une quinte (de Do à Sol), que se passe-t-il dans l’armure ?',['On ajoute un dièse','On ajoute un bémol','Rien'],0,'Do : 0, Sol : 1 dièse, Ré : 2 dièses…',F_ARM)
]};
LESSONS.m4l5={title:'La gamme mineure naturelle',min:6,steps:[
  LEARN(F_MIN,'La gamme mineure naturelle','<p class="lead">La gamme mineure naturelle suit le modèle <b>T ½ T T ½ T T</b>. La Mineur n’utilise que les touches blanches : La Si Do Ré Mi Fa Sol.</p><p>Chaque tonalité majeure a un <span class="hl">relatif mineur</span> : même armure, mais on part du <b>6<sup>e</sup> degré</b> (une tierce mineure plus bas). Do majeur et La mineur sont relatifs.</p><p>La mineure <b>parallèle</b> part de la même tonique : Do mineur diffère de Do majeur par 3 altérations (Mi♭, La♭, Si♭).</p>',function(root){
    demos(root,[['La mineur',[57,59,60,62,64,65,67,69],450],['Do mineur',[60,62,63,65,67,68,70,72],450]]);
  }),
  Q('Relatif mineur','Quel est le relatif mineur de <span class="hl">Do majeur</span> ?',['La mineur','Mi mineur','Ré mineur'],0,'Le 6<sup>e</sup> degré de Do majeur est La.',F_MIN),
  Q('Relatif mineur','Quel est le relatif mineur de <span class="hl">Sol majeur</span> ?',['Mi mineur','Si mineur','La mineur'],0,'Sol La Si Do Ré Mi : le 6<sup>e</sup> degré est Mi.',F_MIN),
  ORDER('La mineur','Remets dans l’ordre la gamme de <span class="hl">La mineur naturelle</span>.',['La','Si','Do','Ré','Mi','Fa','Sol'],'La mineur naturelle : La Si Do Ré Mi Fa Sol.',F_MIN),
  Q('Parallèle','Do mineur est le … de Do majeur.',['parallèle','relatif','dominant'],0,'Même tonique, mode différent : c’est la tonalité parallèle.',F_MIN)
]};
LESSONS.m4l6={title:'Mineure harmonique et mélodique',min:6,steps:[
  LEARN(F_MIN,'Mineure harmonique et mélodique','<p class="lead">La <b>mineure harmonique</b> monte le 7<sup>e</sup> degré : en La mineur, Sol devient Sol♯. Entre le 6<sup>e</sup> et le 7<sup>e</sup> degré, il y a alors 3 demi-tons.</p><p>La <b>mineure mélodique</b>, en montant, monte les 6<sup>e</sup> et 7<sup>e</sup> degrés : La Si Do Ré Mi Fa♯ Sol♯ La. En descendant, elle redevient la naturelle.</p>',function(root){
    demos(root,[['Harmonique',[57,59,60,62,64,65,68,69],450],['Mélodique montante',[57,59,60,62,64,66,68,69],450]]);
  }),
  Q('Harmonique','Dans <span class="hl">La mineur harmonique</span>, quelle note est montée d’un demi-ton ?',['Sol → Sol♯','Fa → Fa♯','Si → Si♯'],0,'Le 7<sup>e</sup> degré est monté : Sol♯.',F_MIN),
  Q('Mélodique','En montant, la mineure mélodique monte…',['les 6<sup>e</sup> et 7<sup>e</sup> degrés','seulement le 7<sup>e</sup> degré','les 3<sup>e</sup> et 4<sup>e</sup> degrés'],0,'Montée : 6<sup>e</sup> et 7<sup>e</sup> degrés. Descente : naturelle.',F_MIN),
  ORDER('La mélodique','Remets dans l’ordre <span class="hl">La mineur mélodique</span> (montante).',['La','Si','Do','Ré','Mi','Fa♯','Sol♯'],'La Si Do Ré Mi Fa♯ Sol♯.',F_MIN),
  Q('Mi mineur harmonique','Dans <span class="hl">Mi mineur harmonique</span>, quelle note est altérée ?',['Ré♯','Do♯','Fa♯'],0,'Mi mineur naturelle : Mi Fa♯ Sol La Si Do Ré. Le 7<sup>e</sup> degré Ré devient Ré♯.',F_MIN)
]};
LESSONS.m4p={title:'Tes gammes sur le manche',min:7,steps:[
  LEARN(F_GAM,'Tes gammes sur le manche','<p class="lead">Sur le manche, une gamme majeure suit le même modèle : <b>T T ½ T T T ½</b>, avec 2 cases pour un ton et 1 case pour un demi-ton.</p><p>Repère la tonique, puis avance case après case. Sur la corde de La, Do se trouve à la case 3.</p>',function(root){
    var fbd=fretboard({labels:true,frets:8}); root.append(fbd.el);
  }),
  FR('Do sur la corde de La','Clique la case de <span class="hl">Do</span> sur la corde de La.',{s:1,f:3},'La + 3 demi-tons = Do.',F_GAM),
  FR('Sensible en Sol','Dans Sol majeur, la sensible est Fa♯. Clique-la sur la corde de Mi grave.',{s:0,f:2},'Mi + 2 demi-tons = Fa♯.',F_GAM),
  FR('Sol♯ en La mineur','Dans La mineur harmonique, la note ajoutée est Sol♯. Clique-la sur la corde de Mi aigu.',{s:5,f:4},'Mi aigu + 4 demi-tons = Sol♯.',F_MIN),
  Q('Armure de Sol','Combien d’altérations pour Sol majeur ?',['1 dièse','1 bémol','2 dièses'],0,'Sol majeur : Fa♯.',F_ARM),
  Q('Relatif','Quel relatif mineur partage l’armure de Sol majeur ?',['Mi mineur','Ré mineur','La mineur'],0,'Le 6<sup>e</sup> degré de Sol majeur est Mi.',F_MIN)
]};
FX+=`<h2 id="m-4">Module 4 · Gammes</h2>
<h3 id="f-gam">La gamme majeure</h3>
<p>Modèle : ton – ton – demi-ton – ton – ton – ton – demi-ton. Chaque lettre est utilisée une fois. Do majeur : Do Ré Mi Fa Sol La Si ; Sol majeur : Fa♯ ; Fa majeur : Si♭.</p>
<p>Degrés : tonique, sus-tonique (supertonic), médiante, sous-dominante, dominante, sus-dominante (submediant), sensible (leading tone). Les sources vérifiées donnent les termes anglais ; les noms français sont l’usage courant.</p>
<h3 id="f-arm">Armures et cercle des quintes</h3>
<p>Ordre des dièses : Fa Do Sol Ré La Mi Si. Ordre des bémols : l’inverse. Dièses : la tonique est un demi-ton au-dessus du dernier dièse. Bémols : la tonique est l’avant-dernier bémol (sauf Fa majeur, 1 bémol). Dans le cercle des quintes, monter d’une quinte ajoute un dièse.</p>
<h3 id="f-min">Gammes mineures</h3>
<p>Naturelle : T ½ T T ½ T T. Harmonique : 7<sup>e</sup> degré monté (3 demi-tons entre les degrés 6 et 7). Mélodique : en montant, 6<sup>e</sup> et 7<sup>e</sup> degrés montés ; en descendant, naturelle. Le relatif mineur part du 6<sup>e</sup> degré et partage l’armure ; le parallèle part de la même tonique (3 altérations de différence).</p>
<h3>Sources du module 4</h3>
<ol>
<li><a href="https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/" target="_blank" rel="noopener">Open Music Theory : gammes majeures, degrés et armures</a></li>
<li><a href="https://uh.edu/~tkoozin/theory1/circle_of_fifths/circle_of_fifths_all.html" target="_blank" rel="noopener">Université de Houston : cercle des quintes (majeur et mineur)</a></li>
</ol>`;

/* =================== MODULE 5 : ACCORDS =================== */
function strList(a){return a.join(' – ')}
function g_m5g1(){
  var t=Math.floor(Math.random()*3), r=pick(KEYSEASY), q=pick(['maj','min','dim','aug']), qn={maj:'majeur',min:'mineur',dim:'diminué',aug:'augmenté'}, notes=chordOf(r,q);
  if(t===0){var wrong=['maj','min','dim','aug'].filter(function(x){return x!==q}).map(function(x){return strList(chordOf(r,x))});
    return {title:'Notes de l’accord',q:'Quelles sont les notes de l’accord de <span class="hl">'+r.fr+' '+qn[q]+'</span> ?',options:opts(strList(notes),wrong),answer:0,explain:r.fr+' '+qn[q]+' : '+strList(notes)+'.',key:'cn'+r.fr+q,fiche:F_TRI};}
  if(t===1){var qs=['maj','min','dim','aug'].map(function(x){return 'Accord '+qn[x]});
    return {title:'Quelle qualité ?',q:'Que forme <span class="hl">'+strList(notes)+'</span> ?',options:opts('Accord '+qn[q],qs),answer:0,explain:strList(notes)+' : tierce et quinte donnent un accord '+qn[q]+'.',key:'cq'+r.fr+q,fiche:F_TRI};}
  var f={maj:'0 – 4 – 7',min:'0 – 3 – 7',dim:'0 – 3 – 6',aug:'0 – 4 – 8'};
  return {title:'Formule',q:'Quelle formule (en demi-tons depuis la fondamentale) donne un accord <span class="hl">'+qn[q]+'</span> ?',options:opts(f[q],['maj','min','dim','aug'].map(function(x){return f[x]})),answer:0,explain:'Accord '+qn[q]+' : '+f[q]+'.',key:'cf'+q,fiche:F_TRI};
}
GAMES.m5g1={title:'Triades',gen:SAFE(g_m5g1),fiche:F_TRI};
function g_m5g2(){
  var t=Math.floor(Math.random()*3), r=pick(KEYSEASY);
  if(t===0){var q=pick(['M7','d7','m7','hd']), names={M7:'Maj7',d7:'7 (dominante)',m7:'m7',hd:'m7♭5'}, notes=chordOf(r,q);
    var wrong=['M7','d7','m7','hd'].filter(function(x){return x!==q}).map(function(x){return strList(chordOf(r,x))});
    return {title:'Accord de septième',q:'Quelles sont les notes de <span class="hl">'+r.fr+names[q].replace(' (dominante)','')+'</span> ?'.replace('?','?'),options:opts(strList(notes),wrong),answer:0,explain:r.fr+CSUF[q]+' : '+strList(notes)+'.',key:'s7'+r.fr+q,fiche:F_SEPT};}
  if(t===1){var q2=pick(['sus2','sus4','add9']), notes2=chordOf(r,q2), nms={sus2:'sus2',sus4:'sus4',add9:'add9'};
    return {title:'Sus et add9',q:'Quelles sont les notes de <span class="hl">'+r.fr+nms[q2]+'</span> ?',options:opts(strList(notes2),['sus2','sus4','add9','maj'].filter(function(x){return x!==q2}).map(function(x){return strList(chordOf(r,x))})),answer:0,explain:r.fr+nms[q2]+' : '+strList(notes2)+'.',key:'su'+r.fr+q2,fiche:F_SEPT};}
  var rr=pick(KEYS);
  return {title:'Power chord',q:'Quelles notes forment le power chord de <span class="hl">'+rr.fr+'5</span> ?',options:opts(rr.fr+' – '+nm(rr.l+4,rr.s+7),[rr.fr+' – '+nm(rr.l+2,rr.s+4),rr.fr+' – '+nm(rr.l+2,rr.s+3),rr.fr+' – '+nm(rr.l+3,rr.s+5)]),answer:0,explain:'Un power chord réunit la fondamentale et la quinte : '+rr.fr+' – '+nm(rr.l+4,rr.s+7)+'.',key:'pw'+rr.fr,fiche:F_POW};
}
GAMES.m5g2={title:'Accords enrichis',gen:SAFE(g_m5g2),fiche:F_SEPT};
LESSONS.m5l1={title:'Les triades',min:5,steps:[
  LEARN(F_TRI,'Les triades','<p class="lead">Une <span class="hl">triade</span> est un accord de trois notes, empilées par tierces : la <b>fondamentale</b>, la <b>tierce</b> et la <b>quinte</b>. Do – Mi – Sol est la triade de Do majeur.</p>',function(root){
    var k=keyboard({mode:'both'}); root.append(k.el);
    demoRow(root,k,[['Do majeur',[60,64,67]],['Do mineur',[60,63,67]]],40);
  }),
  CHORDK('Do majeur','Clique les trois notes de l’accord de <span class="hl">Do majeur</span>.',[60,64,67],'Do majeur : Do – Mi – Sol.',F_TRI),
  CHORDK('Fa majeur','Clique les trois notes de l’accord de <span class="hl">Fa majeur</span>.',[65,69,72],'Fa majeur : Fa – La – Do.',F_TRI),
  Q('Les trois notes','Quelles notes forment une triade ?',['Fondamentale, tierce, quinte','Fondamentale, seconde, sixte','Fondamentale, quarte, septième'],0,'Une triade empile deux tierces : fondamentale, tierce, quinte.',F_TRI),
  Q('Fondamentale','Quelle est la <span class="hl">fondamentale</span> de l’accord Ré – Fa – La ?',['Ré','Fa','La'],0,'La fondamentale est la note la plus grave de l’empilement de tierces.',F_TRI)
]};
LESSONS.m5l2={title:'Les quatre qualités',min:6,steps:[
  LEARN(F_TRI,'Les quatre qualités','<p class="lead">Selon les tierces empilées, une triade est :</p><table class="tbl"><tr><th>Qualité</th><th>Demi-tons</th></tr><tr><td>Majeur</td><td>0 – 4 – 7</td></tr><tr><td>Mineur</td><td>0 – 3 – 7</td></tr><tr><td>Diminué</td><td>0 – 3 – 6</td></tr><tr><td>Augmenté</td><td>0 – 4 – 8</td></tr></table><p>C’est la <b>tierce</b> qui distingue majeur et mineur. La <b>quinte</b> est juste (7), diminuée (6) ou augmentée (8).</p>',function(root){
    demos(root,[['Majeur',[60,64,67],40],['Mineur',[60,63,67],40],['Diminué',[60,63,66],40],['Augmenté',[60,64,68],40]]);
  }),
  MATCH('Qualités','Relie chaque qualité à sa formule en demi-tons.',[['Majeur','0 – 4 – 7'],['Mineur','0 – 3 – 7'],['Diminué','0 – 3 – 6'],['Augmenté','0 – 4 – 8']],F_TRI),
  CHORDK('Do mineur','Clique les notes de l’accord de <span class="hl">Do mineur</span>.',[60,63,67],'Do mineur : Do – Mi♭ – Sol.',F_TRI),
  CHORDK('Ré mineur','Clique les notes de l’accord de <span class="hl">Ré mineur</span>.',[62,65,69],'Ré mineur : Ré – Fa – La.',F_TRI),
  CHORDK('Do augmenté','Clique les notes de l’accord de <span class="hl">Do augmenté</span>.',[60,64,68],'Do augmenté : Do – Mi – Sol♯.',F_TRI),
  Q('Qualité','Que forme Do – Mi♭ – Sol♭ ?',['Un accord diminué','Un accord mineur','Un accord augmenté'],0,'0 – 3 – 6 : tierce mineure et quinte diminuée.',F_TRI)
]};
LESSONS.m5l3={title:'Les renversements',min:5,steps:[
  LEARN(F_TRI,'Les renversements','<p class="lead">On peut mettre une autre note de l’accord à la basse. Cela s’appelle un <span class="hl">renversement</span>.</p><ul><li><b>État fondamental</b> : la fondamentale est à la basse (Do – Mi – Sol).</li><li><b>1<sup>er</sup> renversement</b> : la tierce est à la basse (Mi – Sol – Do).</li><li><b>2<sup>e</sup> renversement</b> : la quinte est à la basse (Sol – Do – Mi).</li></ul>',function(root){
    demos(root,[['Fondamental',[60,64,67],40],['1<sup>er</sup> renversement',[64,67,72],40],['2<sup>e</sup> renversement',[55,60,64],40]]);
  }),
  MATCH('Renversements','Relie chaque accord à son état.',[['Do – Mi – Sol','État fondamental'],['Mi – Sol – Do','1<sup>er</sup> renversement'],['Sol – Do – Mi','2<sup>e</sup> renversement']],F_TRI),
  Q('Basse','Dans le <span class="hl">1<sup>er</sup> renversement</span>, quelle note est à la basse ?',['La tierce','La fondamentale','La quinte'],0,'1<sup>er</sup> renversement : tierce à la basse.',F_TRI),
  Q('Do – Mi – Sol avec Sol à la basse','Sol – Do – Mi est quel état de l’accord de Do majeur ?',['2<sup>e</sup> renversement','1<sup>er</sup> renversement','État fondamental'],0,'La quinte (Sol) est à la basse : 2<sup>e</sup> renversement.',F_TRI),
  Q('Combien','Combien de renversements possède une triade ?',['2','1','3'],0,'Trois notes : 1<sup>er</sup> et 2<sup>e</sup> renversements, en plus de l’état fondamental.',F_TRI)
]};
LESSONS.m5l4={title:'Les power chords',min:6,steps:[
  LEARN(F_POW,'Les power chords','<p class="lead">Un <span class="hl">power chord</span> réunit la <b>fondamentale</b> et la <b>quinte</b>. Il n’a pas de tierce : il n’est ni majeur ni mineur. Il reste clair sous la saturation, c’est pourquoi on l’entend beaucoup dans le rock, le punk et le métal.</p><p>Exemples : Mi5 = Mi + Si (corde de Mi grave à vide + corde de La case 2). Ré5 = Ré + La.</p>',function(root){
    var fbd=fretboard({labels:true,frets:8}); root.append(fbd.el);
    demos(root,[['Mi5',[40,47],40],['Ré5',[50,57],40]]);
  }),
  Q('Composition','De quelles notes se compose un <span class="hl">power chord</span> ?',['Fondamentale et quinte','Fondamentale et tierce','Tierce et quinte'],0,'Fondamentale + quinte, rien d’autre.',F_POW),
  Q('Ré5','Quelles notes forment <span class="hl">Ré5</span> ?',['Ré – La','Ré – Fa♯','Ré – Sol'],0,'La quinte de Ré est La.',F_POW),
  FR('Quinte de Mi5','Pour jouer Mi5, la fondamentale est la corde de Mi grave à vide. Clique la case de la quinte sur la corde de La.',{s:1,f:2},'La + 2 demi-tons = Si, la quinte de Mi.',F_POW),
  FR('Quinte de La5','Pour La5, la fondamentale est La (corde de La à vide). Clique la quinte sur la corde de Ré.',{s:2,f:2},'Ré + 2 demi-tons = Mi, la quinte de La.',F_POW),
  Q('Ni majeur ni mineur','Pourquoi un power chord n’est-il ni majeur ni mineur ?',['Il n’a pas de tierce','Il a trop de notes','Il est trop aigu'],0,'La tierce décide du caractère majeur ou mineur ; il n’y en a pas.',F_POW)
]};
LESSONS.m5l5={title:'Les accords de septième',min:7,steps:[
  LEARN(F_SEPT,'Les accords de septième','<p class="lead">On ajoute une quatrième note, la <b>septième</b>, à une triade :</p><table class="tbl"><tr><th>Accord</th><th>Construction</th></tr><tr><td>Maj7</td><td>triade majeure + 7<sup>e</sup> majeure</td></tr><tr><td>7 (dominante)</td><td>triade majeure + 7<sup>e</sup> mineure</td></tr><tr><td>m7</td><td>triade mineure + 7<sup>e</sup> mineure</td></tr><tr><td>m7♭5 (demi-diminué)</td><td>triade diminuée + 7<sup>e</sup> mineure</td></tr><tr><td>dim7</td><td>triade diminuée + 7<sup>e</sup> diminuée</td></tr></table>',function(root){
    demos(root,[['Cmaj7',[60,64,67,71],40],['C7',[60,64,67,70],40],['Cm7',[60,63,67,70],40]]);
  }),
  CHORDK('Do maj7','Clique les notes de <span class="hl">Do maj7</span>.',[60,64,67,71],'Cmaj7 : Do – Mi – Sol – Si.',F_SEPT),
  CHORDK('Do 7','Clique les notes de <span class="hl">Do7</span> (septième de dominante).',[60,64,67,70],'C7 : Do – Mi – Sol – Si♭.',F_SEPT),
  Q('Sol 7','Quelles notes forment <span class="hl">Sol7</span> ?',['Sol – Si – Ré – Fa','Sol – Si – Ré – Fa♯','Sol – Si♭ – Ré – Fa'],0,'Triade de Sol majeur + septième mineure (Fa).',F_SEPT),
  MATCH('Septièmes','Relie chaque accord à sa construction.',[['Maj7','Majeure + 7<sup>e</sup> majeure'],['7','Majeure + 7<sup>e</sup> mineure'],['m7','Mineure + 7<sup>e</sup> mineure'],['m7♭5','Diminuée + 7<sup>e</sup> mineure']],F_SEPT)
]};
LESSONS.m5l6={title:'Sus et add9',min:5,steps:[
  LEARN(F_SEPT,'Sus et add9','<p class="lead">Les accords <b>suspendus</b> remplacent la tierce : <b>sus2</b> = fondamentale, seconde, quinte (Csus2 = Do Ré Sol). <b>sus4</b> = fondamentale, quarte, quinte (Csus4 = Do Fa Sol).</p><p><b>add9</b> ajoute la neuvième à une triade majeure, sans septième : Cadd9 = Do Mi Sol Ré. Un accord de neuvième (C9) contient la septième en plus.</p>',function(root){
    demos(root,[['Csus2',[60,62,67],40],['Csus4',[60,65,67],40],['Cadd9',[60,64,67,74],40]]);
  }),
  CHORDK('Do sus4','Clique les notes de <span class="hl">Csus4</span>.',[60,65,67],'Csus4 : Do – Fa – Sol.',F_SEPT),
  CHORDK('Do sus2','Clique les notes de <span class="hl">Csus2</span>.',[60,62,67],'Csus2 : Do – Ré – Sol.',F_SEPT),

LESSONS.m5p={title:'Tes accords à la guitare',min:7,steps:[

FX+=`<h2 id="m-5">Module 5 · Accords</h2>
<h3 id="f-tri">Triades et renversements</h3>
<p>Une triade empile deux tierces : fondamentale, tierce, quinte. Formules en demi-tons : majeur 0-4-7, mineur 0-3-7, diminué 0-3-6, augmenté 0-4-8. Renversements : état fondamental (fondamentale à la basse), 1<sup>er</sup> (tierce à la basse), 2<sup>e</sup> (quinte à la basse).</p>
<h3 id="f-pow">Power chords</h3>
<p>Un power chord réunit la fondamentale et la quinte (D5 = Ré + La). Il est plus clair que les accords complets sous forte distorsion et s’emploie dans le rock, le punk et le métal. Sur le manche : Mi5 = corde de Mi grave à vide + corde de La case 2 ; en drop D, un barré sur les cordes 6-5-4 donne un power chord (cases calculées à partir des notes des cordes).</p>
<h3 id="f-sept">Septièmes, sus et add9</h3>
<p>Maj7 = triade majeure + 7<sup>e</sup> majeure ; 7 = majeure + 7<sup>e</sup> mineure ; m7 = mineure + 7<sup>e</sup> mineure ; m7♭5 (demi-diminué) = diminuée + 7<sup>e</sup> mineure ; dim7 = diminuée + 7<sup>e</sup> diminuée. sus2 = 1-2-5, sus4 = 1-4-5. add9 = triade majeure + 9<sup>e</sup>, sans septième (Cadd9 = Do Mi Sol Ré) ; C9 contient la septième.</p>
<h3>Sources du module 5</h3>
<ol>
<li><a href="https://www.hooktheory.com/blog/power-chords/" target="_blank" rel="noopener">Hooktheory : power chords</a></li>
<li><a href="https://muted.io/intervals-chart" target="_blank" rel="noopener">Muted.io : intervalles (base des formules en demi-tons)</a></li>
</ol>
<p>Les constructions de triades et de septièmes se déduisent des intervalles du module 3 ; les cases des power chords sont calculées à partir de l’accordage des cordes.</p>`;

LESSONS.m6l1={title:'Harmoniser la gamme majeure',min:6,steps:[
  LEARN(F_HAR,'Harmoniser la gamme majeure','<p class="lead"><span class="hl">Harmoniser</span> une gamme, c’est construire une triade sur chaque degré en n’utilisant que les notes de la gamme. En Do majeur :</p><table class="tbl"><tr><th>Degré</th><th>Accord</th><th>Qualité</th></tr><tr><td>I</td><td>Do</td><td>majeur</td></tr><tr><td>ii</td><td>Ré mineur</td><td>mineur</td></tr><tr><td>iii</td><td>Mi mineur</td><td>mineur</td></tr><tr><td>IV</td><td>Fa</td><td>majeur</td></tr><tr><td>V</td><td>Sol</td><td>majeur</td></tr><tr><td>vi</td><td>La mineur</td><td>mineur</td></tr><tr><td>vii°</td><td>Si diminué</td><td>diminué</td></tr></table>'),
  Q('Accord du IV','Quel accord se construit sur le <span class="hl">4<sup>e</sup> degré</span> de Do majeur ?',['Fa majeur','Ré mineur','Sol majeur'],0,'Fa – La – Do : Fa majeur.',F_HAR),

LESSONS.m6l2={title:'Les chiffres romains',min:5,steps:[
  LEARN(F_HAR,'Les chiffres romains','<p class="lead">On désigne les accords par le <span class="hl">numéro de leur degré</span> en chiffres romains. Les <b>majuscules</b> (I, IV, V) indiquent un accord majeur, les <b>minuscules</b> (ii, iii, vi) un accord mineur, et le signe <b>°</b> un accord diminué (vii°).</p><p>L’avantage : la progression est la même dans toutes les tonalités. I – IV – V donne Do – Fa – Sol en Do majeur et Sol – Do – Ré en Sol majeur.</p>'),
  Q('Majuscule ou minuscule','Quels degrés de la gamme majeure donnent un accord <span class="hl">mineur</span> ?',['ii, iii, vi','I, IV, V','Seulement vii°'],0,'I ii iii IV V vi vii° : mineurs = ii, iii, vi.',F_HAR),
  Q('V en Ré','En Ré majeur, que vaut l’accord <span class="hl">V</span> ?',['La','Sol','Mi'],0,'Ré Mi Fa♯ Sol La : le 5<sup>e</sup> degré est La.',F_HAR),

  Q('Intérêt','Pourquoi utilise-t-on les chiffres romains ?',['La progression reste valable dans toutes les tonalités','Ils sont plus faciles à jouer','Ils changent le tempo'],0,'On transpose facilement en changeant la tonique.',F_HAR)
]};
LESSONS.m6l3={title:'Les fonctions',min:5,steps:[
  LEARN(F_HAR,'Les fonctions','<p class="lead">Les accords jouent des rôles. Trois fonctions principales :</p><ul><li><b>Tonique</b> (I) : le repos, l’arrivée.</li><li><b>Prédominant</b> (IV, ii) : on s’éloigne de la tonique et on prépare la tension.</li><li><b>Dominant</b> (V, V7) : la tension qui appelle un retour à la tonique.</li></ul><p>Le chemin classique : tonique → prédominant → dominant → tonique.</p>'),
  MATCH('Fonctions','Relie chaque accord à sa fonction.',[['I','Tonique'],['IV','Prédominant'],['ii','Prédominant'],['V','Dominant']],F_HAR),
  Q('Tension','Quel accord crée une <span class="hl">tension</span> qui appelle la tonique ?',['V','I','IV'],0,'La fonction dominante est celle du V.',F_HAR),
  Q('Prédominant','Quelle fonction a l’accord <span class="hl">ii</span> ?',['Prédominant','Tonique','Dominant'],0,'ii et IV sont prédominants.',F_HAR),
  ORDER('Le chemin classique','Remets dans l’ordre le chemin classique des fonctions.',['Tonique','Prédominant','Dominant','Tonique'],'Tonique → prédominant → dominant → tonique.',F_HAR)
]};
LESSONS.m6l4={title:'Les cadences',min:6,steps:[
  LEARN(F_CAD,'Les cadences','<p class="lead">Une <span class="hl">cadence</span> est une formule qui termine une phrase musicale, comme une ponctuation.</p><ul><li><b>Authentique</b> : V → I (conclusive).</li><li><b>Demi-cadence</b> : la phrase s’arrête sur V (suspensive).</li><li><b>Plagale</b> : IV → I.</li><li><b>Rompue</b> : V → vi (on attendait I).</li></ul>',function(root){

LESSONS.m6l5={title:'Les progressions',min:6,steps:[
  LEARN(F_CAD,'Les progressions','<p class="lead">Une <span class="hl">progression</span> est un enchaînement d’accords. On la note en chiffres romains, puis on la traduit dans la tonalité voulue.</p><p>Exemples : <b>I – IV – V – I</b>, <b>I – V – vi – IV</b>, <b>ii – V – I</b>.</p>'),
  Q('I – IV – V en Do','Traduis <span class="hl">I – IV – V</span> en Do majeur.',['Do – Fa – Sol','Do – Sol – La','Do – Ré – Mi'],0,'I = Do, IV = Fa, V = Sol.',F_CAD),
  Q('I – V – vi – IV en Sol','Traduis <span class="hl">I – V – vi – IV</span> en Sol majeur.',['Sol – Ré – Mi mineur – Do','Sol – Ré – La mineur – Do','Sol – Do – Mi mineur – Ré'],0,'Sol Ré Mi Do : I = Sol, V = Ré, vi = Mi mineur, IV = Do.',F_CAD),
