var BOXD=[1,2,4,8,16,35];
function revUpdate(id,ok){
  var r=S.rev[id]||(S.rev[id]={box:0,due:'',n:0}); r.n++; r.box=ok?Math.min(r.box+1,5):0;
  r.due=dkey(addDays(new Date(),BOXD[r.box])); saveS();
}
function modDone(n){return UNITS.some(function(u){return u.mod.n===n&&u.nodes.some(function(x){return S.done[x.id]})})}
function dueNuggets(before){
  var today=dkey(new Date());
  return NUGGETS.filter(function(g){
    if(before&&g.mod>=before) return false;
    var r=S.rev[g.nid]; if(r) return r.due<=today; return modDone(g.mod);
  }).sort(function(a,b){var ra=S.rev[a.nid]?S.rev[a.nid].box:-1, rb=S.rev[b.nid]?S.rev[b.nid].box:-1; return ra-rb});
}
function rappelStep(g){return {graded:true,fiche:g.fiche,nid:g.nid,rappel:true,render:function(root,api){g.render(root,api); root.insertAdjacentHTML('afterbegin','<p class="eyebrow">Rappel</p>')}}}
function rappels(before,k){return before<=1?[]:shuffle(dueNuggets(before).slice(0,6)).slice(0,k).map(rappelStep)}
function modOf(id){var u=UNITS.filter(function(u){return u.nodes.some(function(n){return n.id===id})})[0]; return u?u.mod.n:1}
function startReview(){
  stopEngine();
  var steps=shuffle(dueNuggets().slice(0,10)).slice(0,6);
  if(!steps.length) return;
  L={id:'review',kind:'review',steps:steps,retry:false,n:steps.length,total:steps.length,queue:steps.map(function(s,i){return i}),pos:0,score:0,passed:0,tried:{},phase:'steps',validate:null,answered:false,res:[]};
  lesson.hidden=false; document.body.style.overflow='hidden'; renderStep();
}
function startPlacement(){
  stopEngine();
  var steps=[];
  MODULES.filter(function(m){return m.n<=10}).forEach(function(m){
    var ng=shuffle(NUGGETS.filter(function(g){return g.mod===m.n})).slice(0,m.n===1?2:1), pool=[];
    m.units.forEach(function(u){u.nodes.forEach(function(n){if(LESSONS[n.id]) LESSONS[n.id].steps.forEach(function(st){if(st.graded&&st.mc&&st.cfg&&!st.nid) pool.push(st)})})});
    var all=ng.concat(shuffle(pool).slice(0,1));
    all.forEach(function(st){
      var q=quizStep(Object.assign({},st.cfg,{options:st.cfg.options.concat(['Je ne sais pas'])}));
      q.mod=m.n; q.nid=st.nid; steps.push(q);
    });
  });
  L={id:'placement',kind:'placement',steps:steps,retry:false,n:steps.length,total:steps.length,queue:steps.map(function(s,i){return i}),pos:0,score:0,passed:0,tried:{},phase:'steps',validate:null,answered:false,res:[]};
  lesson.hidden=false; document.body.style.overflow='hidden'; renderStep();
}


/* =================== UNITÉ RYTHME (onglet Rythme) =================== */
function playMeter(beats,mid,sub,bpm,bars){
  stopEngine(); var c=ac(); if(!c) return;
  var t0=c.currentTime+.08, n=beats*sub*(bars||2), iv=60/(bpm||90)/sub, i, su, beat;
  for(i=0;i<n;i++){su=i%sub; beat=Math.floor(i/sub)%beats; clickAt(t0+i*iv,su?'s':(beat===0?'a':(mid&&beat===3?'m':'n')))}
}
function fnBtn(root,label,fn){var row=h('<div class="demo"></div>'), b=h('<button type="button" class="btn ghost">'+PLAY+' '+label+'</button>'); b.addEventListener('click',fn); row.append(b); root.append(row)}
function METROQ(title,q,fnPlay,options,explain,fiche){return quizStep({title:title,q:q,options:options,answer:0,explain:explain,fiche:fiche,extra:function(root){fnBtn(root,'Écouter',fnPlay)}})}
function GROOVE(title,q,target,explain,fiche,rows,listen){
  rows=rows||['Grosse caisse','Caisse claire','Charley'];
  return {graded:true,fiche:fiche,render:function(root,api){
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+q+'</p>';
    var st=rows.map(function(){return []}), cells=rows.map(function(){return []}), locked=false, i;
    function upd(){ if(st.some(function(r){return r.some(Boolean)})) api.select(check); else api.unselect() }
    function play(arr){runEngine({max:16,interval:function(){return 60/90/4},tick:function(k,t){var x=k%16; if(x%4===0) clickAt(t,'s'); arr.forEach(function(row,r){if(row[x]) hitAt(t,r)})}})}
    rows.forEach(function(nm,r){
      root.append(h('<p class="inst">'+nm+'</p>'));
      var g=h('<div class="sgrid"></div>');
      for(i=0;i<16;i++){(function(i){
        st[r][i]=false;
        var c=h('<button type="button" class="rc'+(i%4===0?' beat':'')+'" aria-pressed="false" aria-label="'+nm+', pas '+(i+1)+'">'+(i%4===0?String(i/4+1):'')+'</button>');
        c.addEventListener('click',function(){if(locked) return; st[r][i]=!st[r][i]; c.classList.toggle('on',st[r][i]); c.setAttribute('aria-pressed',String(st[r][i])); if(st[r][i]) hitNow(r); upd()});
        cells[r][i]=c; g.append(c);
      })(i)}
      root.append(g);
    });
    var row=h('<div class="row"></div>');
    var mine=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter ma version</button>'); mine.addEventListener('click',function(){play(st)});
    if(listen){var tg=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter le beat</button>'); tg.addEventListener('click',function(){play(rows.map(function(_,r){var a=[]; for(var k=0;k<16;k++) a[k]=target[r].indexOf(k)>=0; return a}))}); row.append(tg)}
    row.append(mine); root.append(row);
    function check(){
      locked=true; var ok=true;
      rows.forEach(function(_,r){for(var k=0;k<16;k++){var want=target[r].indexOf(k)>=0, got=st[r][k]; if(want!==got) ok=false;
        if(got) cells[r][k].classList.add(want?'good':'bad'); else if(want){cells[r][k].classList.add('miss'); cells[r][k].textContent='●'}}});
      api.done(ok,explain);
    }
  }};
}
function HEAR8(pat){
  var base=PGRID('Écoute et reproduis','Écoute le rythme (8 pas), puis reproduis-le dans la grille.',pat,'Chaque pas actif correspond à une frappe.',F_SYN), r0=base.render;
  base.render=function(root,api){r0(root,api); var row=h('<div class="demo"></div>'), b=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter le rythme</button>'); b.addEventListener('click',function(){playPattern(pat)}); row.append(b); root.insertBefore(row,root.querySelector('.sgrid'))};
  return base;
}
LESSONS.r1={title:'Trouver la pulsation',min:4,steps:[

  }),

]};

    fnBtn(root,'6/8',function(){playMeter(2,false,3,70,3)});

]};
LESSONS.r3={title:'Les subdivisions',min:5,steps:[
  LEARN(F_SYN,'Les subdivisions','<p class="lead">On peut diviser chaque temps : en <b>2</b> (croches), en <b>3</b> (triolets) ou en <b>4</b> (doubles croches). Le clic fort donne le temps, les clics faibles donnent les subdivisions.</p>',function(root){

  }),
  METROQ('Quelle subdivision ?','Écoute : comment chaque temps est-il divisé ?',function(){playMeter(4,false,2,70,1)},['En 2 (croches)','En 3 (triolets)','En 4 (doubles croches)'],'Deux clics par temps : des croches.',F_SYN),

  Q('Croches','Combien de croches y a-t-il dans un temps (à la noire) ?',['2','3','4'],0,'Une noire = deux croches.',F_VAL)

LESSONS.r4={title:'Construire un groove',min:7,steps:[
  LEARN(F_SYN,'Construire un groove','<p class="lead">Une grille de <b>16 pas</b> représente 4 temps de 4 pas. Un beat de base utilise la <span class="hl">grosse caisse</span> (grave), la <span class="hl">caisse claire</span> (médium) et le <span class="hl">charley</span> (aigu). Les temps tombent sur les pas 1, 5, 9 et 13.</p>'),
  GROOVE('Une grosse caisse par temps','Place la <b>grosse caisse</b> sur chaque temps : pas 1, 5, 9 et 13.',[[0,4,8,12]],'Les temps tombent tous les 4 pas.',F_SYN,['Grosse caisse']),
  GROOVE('Les contretemps','Place la <b>caisse claire</b> sur les contretemps, entre les temps : pas 3, 7, 11 et 15.',[[2,6,10,14]],'Le contretemps est le demi-temps entre deux temps.',F_SYN,['Caisse claire']),

  Q('Pas de la caisse claire','La caisse claire jouée sur le temps 2 tombe sur quel pas de la grille de 16 ?',['Le pas 5','Le pas 2','Le pas 3'],0,'Temps 1 = pas 1, temps 2 = pas 5.',F_SYN)
]};

var EXTRA={
 l11:[["Pourquoi deux systèmes ?","Les noms Do, Ré, Mi, Fa, Sol, La viennent de syllabes d’un hymne médiéval associé à Guy d’Arezzo (la première syllabe, Ut, a ensuite laissé la place à Do). Le système alphabétique, de A à G, est celui du monde anglophone. En Allemagne, B désigne le Si♭ et H le Si."],["Dans la pratique","Sur les partitions, les tablatures, les accordeurs et dans FL Studio, tu croiseras les deux écritures. Retiens la correspondance Do = C, Ré = D, Mi = E, Fa = F, Sol = G, La = A, Si = B. Les cordes à vide de ta guitare s’écrivent ainsi E A D G B E."]],
 l12:[["Le motif de 12 touches","Le clavier répète toujours le même motif : 7 touches blanches et 5 touches noires, soit 12 touches par octave. Repère les groupes de 2 et de 3 touches noires : le Do se trouve juste à gauche du groupe de 2."],["Quel nom pour une touche noire ?","Chaque touche noire a deux noms : le dièse de la blanche à sa gauche, le bémol de la blanche à sa droite. La touche entre Do et Ré est Do♯ ou Ré♭. Entre Mi et Fa, et entre Si et Do, il n’y a pas de touche noire."]],
 l13:[["Le bécarre","Le bécarre (♮) annule une altération : il ramène la note à sa hauteur naturelle. Si tu lis Fa♯ puis Fa♮, la deuxième note est le Fa de la touche blanche."],["Même touche, deux écritures","Do♯ et Ré♭ désignent la même touche, mais ne s’écrivent pas de la même manière. Selon la tonalité, on choisit l’une ou l’autre : c’est l’enharmonie. Tu verras pourquoi dans le module Gammes."]],
 l21:[["Où est le demi-ton ?","Au clavier, le demi-ton est la plus petite distance entre deux touches voisines, blanches ou noires. Mi–Fa et Si–Do sont des demi-tons, mais aussi Do–Do♯. Sur le manche, c’est une case."],["Compter en demi-tons","Pour mesurer une distance, compte chaque touche, noire comprise. De Do à Sol, il y a 7 demi-tons. Cette méthode te servira pour les intervalles, les gammes et les accords."]],
 l22:[["Un ton, deux demi-tons","Un ton vaut deux demi-tons. Do → Ré est un ton, car la touche Do♯ se trouve entre les deux. Mi → Fa est un demi-ton, pas un ton."],["Sur la guitare","Deux cases font un ton. Sur une même corde, passer de la case 0 à la case 2 monte d’un ton, de la case 0 à la case 1 d’un demi-ton."]],
 l23:[["Une même note, plusieurs endroits","Une même note se joue à plusieurs endroits du manche. Par exemple, le La est la corde de La à vide, mais aussi la case 5 de la corde de Mi grave."],["Le repère de la case 12","À la case 12, chaque corde donne la même note qu’à vide, une octave plus haut. Cette case sert de repère pour retrouver les notes sur tout le manche."]],
 l31:[["Même nom, deux hauteurs","Deux notes séparées par une octave portent le même nom : un Do grave et un Do aigu. La deuxième sonne comme la première, en plus aigu."],["Deux fois plus de vibrations","Monter d’une octave double la fréquence : le nombre de vibrations par seconde (Hz) est multiplié par 2. Descendre d’une octave le divise par 2."]],
 l32:[["Le La4 à 440 Hz","Le La de référence, le La4, vibre à 440 Hz. Les accordeurs et les logiciels s’en servent pour régler toutes les autres notes."],["Les autres La","Une octave plus bas, le La vibre à 220 Hz, une octave plus haut à 880 Hz. Les La successifs sont donc à 110, 220, 440, 880 Hz, chacun double du précédent."]],
 l33:[["Numéroter les octaves","La notation scientifique accole un numéro à chaque note. Le Do du milieu du clavier est le Do4. Le numéro change au Do : après le Si3 vient le Do4."],["Et ta guitare ?","Les cordes à vide de la guitare s’écrivent en notation scientifique : Mi2, La2, Ré3, Sol3, Si3, Mi4. La corde de Mi grave est donc deux octaves sous la corde de Mi aigu."]],
 l34:[["Une octave de décalage","Dans FL Studio, le Do du milieu s’affiche Do5, une octave au-dessus de la notation scientifique (Do4). Ce n’est pas une erreur : c’est la convention du logiciel."],["Passer de l’un à l’autre","Pour convertir : numéro dans FL Studio = numéro scientifique + 1. La corde de Mi grave (Mi2) s’affiche donc Mi3 dans le piano roll."]],
 p1:[["Méthode","Pour trouver une note sur le manche, pars de la corde à vide, puis ajoute une case par demi-ton. Pour la placer dans FL Studio, ajoute une octave au numéro de la notation scientifique."]],
 m2l1:[["Le BPM","Le tempo se mesure en BPM : battements par minute. À 60 BPM, il y a un battement par seconde, à 120 BPM deux battements par seconde."],["Ressentir le tempo","Un tempo lent laisse de la place à chaque note. Un tempo rapide demande de la précision. Habitue-toi avec le métronome de l’onglet Rythme."]],
 m2l2:[["Chaque figure divise la précédente","Si la noire vaut un temps : la ronde vaut 4 temps, la blanche 2, la noire 1, la croche un demi-temps et la double croche un quart de temps."],["Reconnaître les figures","La ronde est vide et sans hampe. La blanche est vide avec une hampe. La noire est pleine. La croche a un crochet, la double croche en a deux."]],
 m2l3:[["Un silence compte autant qu’une note","À chaque figure correspond un silence de même durée : pause (4 temps), demi-pause (2), soupir (1), demi-soupir (½). Le silence fait partie du rythme."],["Le point","Un point ajoute la moitié de la durée de la note. Blanche pointée : 2 + 1 = 3 temps. Noire pointée : 1 + ½ = 1,5 temps."]],
 m2l4:[["Lire le chiffrage","Le chiffre du haut donne le nombre de temps par mesure, celui du bas la figure qui vaut un temps (4 = la noire). En 3/4, une mesure contient trois noires."],["Les mesures courantes","4/4 (quatre temps), 3/4 (trois temps, comme une valse) et 2/4 (deux temps). Le premier temps de chaque mesure est accentué."]],
 m2l5:[["Un temps divisé en trois","Dans une mesure composée, chaque temps se divise en trois. Le temps est une noire pointée : le 6/8 compte 2 temps, le 9/8 en compte 3 et le 12/8 en compte 4."],["Simple ou composée ?","Mesure simple : le temps se divise en deux (4/4, 3/4). Mesure composée : le temps se divise en trois (6/8, 9/8, 12/8). Compare-les avec le métronome de l’onglet Rythme."]],
 m2l6:[["La syncope","Une syncope déplace l’accent : une note commence sur un temps faible ou entre les temps et se prolonge sur le temps fort suivant, par une liaison, un point ou un silence."],["Contretemps et triolets","Le contretemps est une note placée entre les temps, avec un silence sur le temps. Le triolet fait tenir trois notes dans la durée de deux."]],
 m2p:[["Lire de gauche à droite","Compte 1-2-3-4 à voix haute et place chaque frappe sur le temps ou le contretemps indiqué. Un silence est un temps où tu ne frappes pas, mais que tu comptes quand même."]],
 m3l1:[["Compter en lettres","Pour trouver le numéro d’un intervalle, compte les lettres en incluant la note de départ : Do-Ré-Mi = 3, une tierce. Deux fois la même note forment un unisson."],["Mélodique et harmonique","Un intervalle mélodique se joue note après note, comme dans une mélodie. Un intervalle harmonique se joue notes ensemble, comme dans un accord."]],
 m3l2:[["Majeur ou mineur ?","Seconde, tierce, sixte et septième sont majeures ou mineures, la mineure ayant un demi-ton de moins. Tierce mineure : 3 demi-tons, tierce majeure : 4 demi-tons."],["Augmenté et diminué","Monter d’un demi-ton un intervalle majeur ou juste le rend augmenté. Baisser d’un demi-ton un intervalle mineur ou juste le rend diminué. Le triton est une quarte augmentée ou une quinte diminuée."]],
 m3l3:[["Lire un intervalle au clavier","Au clavier, un intervalle se lit en demi-tons : tierce mineure 3, tierce majeure 4, quinte juste 7, octave 12. Compte chaque touche, blanche ou noire."],["Le triton","De Fa à Si, il y a 6 demi-tons : c’est un triton, l’intervalle qui coupe l’octave en deux parties égales."]],
 m3l4:[["Entre cordes voisines","Entre deux cordes à vide voisines, l’écart est d’une quarte juste (5 demi-tons), sauf entre Sol et Si : une tierce majeure (4 demi-tons)."],["À quoi ça sert","La case 5 d’une corde donne la note de la corde à vide voisine (case 4 entre Sol et Si). C’est la base d’une méthode d’accordage et un bon repère pour trouver les notes."]],
 m3l5:[["S’entraîner à l’oreille","Réécoute chaque intervalle plusieurs fois et compare-les par paires : la seconde mineure est très serrée, l’octave très ouverte, la tierce mineure plus sombre que la tierce majeure."],["Avec ta guitare","Joue deux cordes à vide voisines : tu entends une quarte juste. Joue Sol puis Si : une tierce majeure. Joue la même note sur deux cordes, à 12 cases d’écart : une octave."]],
 m3p:[["Méthode","Pour jouer un intervalle donné, retrouve d’abord son nombre de demi-tons, puis avance du même nombre de cases sur la corde. Vérifie avec la corde voisine à vide."]],
 m4l1:[["Le modèle T T ½ T T T ½","Ton, ton, demi-ton, ton, ton, ton, demi-ton : 5 tons et 2 demi-tons, soit 12 demi-tons en tout. Ce modèle donne n’importe quelle gamme majeure, quelle que soit la tonique."],["Sur le clavier","Do majeur n’utilise que les touches blanches, parce que les demi-tons Mi–Fa et Si–Do tombent exactement entre les degrés 3–4 et 7–8."]],
 m4l2:[["Une lettre par degré","Chaque lettre apparaît une seule fois : Fa majeur s’écrit Fa Sol La Si♭ Do Ré Mi, et non Fa Sol La La♯ Do Ré Mi."],["La méthode","Écris les sept lettres à partir de la tonique, puis ajoute les altérations qu’il faut pour respecter le modèle T T ½ T T T ½."]],
 m4l3:[["Noms et numéros","Tonique (1), sus-tonique (2), médiante (3), sous-dominante (4), dominante (5), sus-dominante (6), sensible (7). La tonique donne son nom à la tonalité."],["Le rôle de la sensible","La sensible est à un demi-ton sous la tonique : elle appelle la tonique. En Do majeur, c’est Si, juste avant Do."]],
 m4l4:[["L’ordre des altérations","Dièses : Fa Do Sol Ré La Mi Si. Bémols, dans l’ordre inverse : Si Mi La Ré Sol Do Fa. L’armure se place au début de la portée."],["Deux astuces","Armure à dièses : la tonique est un demi-ton au-dessus du dernier dièse. Armure à bémols : la tonique est l’avant-dernier bémol (Fa majeur, avec un seul bémol, fait exception)."]],
 m4l5:[["Le relatif mineur","Chaque tonalité majeure a un relatif mineur, une tierce mineure plus bas, qui partage son armure. Do majeur et La mineur, Sol majeur et Mi mineur."],["La tonalité parallèle","La tonalité parallèle part de la même tonique : Do mineur diffère de Do majeur par trois altérations (Mi♭, La♭ et Si♭)."]],
 m4l6:[["Pourquoi l’harmonique ?","En mineur naturelle, le 7<sup>e</sup> degré est à un ton de la tonique. La mineure harmonique le monte d’un demi-ton pour créer une sensible : en La mineur, Sol♯. Entre le 6<sup>e</sup> et le 7<sup>e</sup> degré, il y a alors 3 demi-tons."],["La mélodique","En montant, la mineure mélodique monte les 6<sup>e</sup> et 7<sup>e</sup> degrés. En descendant, elle redevient la mineure naturelle."]],
 m4p:[["Trouver une gamme sur le manche","Place la tonique sur une corde, puis avance de 2 cases pour un ton et d’une case pour un demi-ton, en suivant le modèle de la gamme."]],
 m5l1:[["Empiler des tierces","Une triade s’obtient en empilant deux tierces : Do – Mi – Sol est Do, plus une tierce, plus une tierce. Le nom de l’accord est celui de sa fondamentale."],["Majeur ou mineur ?","La tierce décide du caractère : 4 demi-tons au-dessus de la fondamentale, l’accord est majeur ; 3 demi-tons, il est mineur."]],
 m5l2:[["Diminué et augmenté","L’accord diminué (0-3-6) empile deux tierces mineures. L’accord augmenté (0-4-8) empile deux tierces majeures."],["Les entendre","Écoute les quatre accords avec les boutons : majeur et mineur sonnent stables, diminué et augmenté sonnent tendus."]],
 m5l3:[["Mêmes notes, basse différente","Un renversement garde les mêmes notes mais change la plus grave. Do – Mi – Sol, Mi – Sol – Do et Sol – Do – Mi sont trois états du même accord."],["Pourquoi renverser ?","Les renversements permettent d’enchaîner les accords avec des déplacements de basse plus courts."]],
 m5l4:[["Fondamentale et quinte","Un power chord réunit la fondamentale et la quinte, parfois doublées à l’octave. Comme il n’a pas de tierce, il n’est ni majeur ni mineur."],["Sous la saturation","Avec de la distorsion, les accords complets deviennent brouillons, alors que la quinte reste claire. C’est pourquoi on l’utilise dans le rock, le punk et le métal."]],
 m5l5:[["Une quatrième note","On ajoute la septième au-dessus de la triade : Do – Mi – Sol – Si pour Cmaj7. La qualité de la septième (majeure ou mineure) donne son nom à l’accord."],["Les cinq familles","Maj7, 7 (dominante), m7, m7♭5 (demi-diminué) et dim7. Pour chacun, retiens la triade de départ et la qualité de la septième."]],
 m5l6:[["Suspendre la tierce","Dans sus2 et sus4, la tierce est remplacée par la seconde ou la quarte. L’accord n’est alors ni majeur ni mineur."],["add9","add9 ajoute la neuvième (la seconde, une octave plus haut) à une triade majeure, sans la septième : Cadd9 = Do Mi Sol Ré."]],
 m5p:[["Le drop D","En drop D, la 6<sup>e</sup> corde est descendue d’un ton, en Ré. Un seul doigt posé à la même case sur les cordes 6, 5 et 4 donne un power chord."]],
 m6l1:[["Harmoniser, c’est empiler","Sur chaque degré de la gamme, on empile deux tierces en restant dans la gamme. On obtient sept triades, une par degré."],["Les qualités","En tonalité majeure : I, IV et V sont majeurs ; ii, iii et vi sont mineurs ; vii° est diminué."]],
 m6l2:[["Le code","Une majuscule indique un accord majeur (I, IV, V), une minuscule un accord mineur (ii, iii, vi), et le signe ° un accord diminué (vii°)."],["Un langage universel","En chiffres romains, I – IV – V donne Do – Fa – Sol en Do majeur et Sol – Do – Ré en Sol majeur : seule la tonalité change."]],
 m6l3:[["Trois fonctions","Tonique (le repos, I), prédominant (IV, ii) et dominant (V, V7). Le dominant crée une tension qui se résout sur la tonique."],["Le chemin","Un enchaînement classique va de la tonique au prédominant, puis au dominant, puis revient à la tonique, par exemple I – IV – V – I."]],
 m6l4:[["Ponctuer une phrase","Une cadence termine une phrase musicale comme un signe de ponctuation. La cadence authentique (V → I) est conclusive, la demi-cadence (qui finit sur V) est suspensive."],["Plagale et rompue","La cadence plagale enchaîne IV → I. La cadence rompue enchaîne V → vi : on attend I, mais on arrive sur vi."]],
 m6l5:[["Lire une progression","Une progression s’écrit en chiffres romains. Pour la jouer, traduis chaque degré dans la tonalité choisie."],["Un exemple complet","I – V – vi – IV en Sol majeur : Sol – Ré – Mi mineur – Do. En Do majeur, la même progression donne Do – Sol – La mineur – Fa."]],
 m6l6:[["La mineure harmonisée","En La mineur naturelle : i (La mineur), ii° (Si diminué), III (Do), iv (Ré mineur), v (Mi mineur), VI (Fa) et VII (Sol)."],["Le V majeur","Avec la mineure harmonique, le Sol devient Sol♯ : le V devient Mi majeur (Mi – Sol♯ – Si), qui tire plus fortement vers la tonique."]],
 m6p:[["Sur le manche","Avec des power chords, suis les degrés sur la corde de Mi grave : en Mi, I est la case 0, IV la case 5 et V la case 7."]],
 m7l1:[["Cinq notes","La pentatonique mineure retire deux degrés à la mineure naturelle (le 2<sup>e</sup> et le 6<sup>e</sup>). Il reste 1, ♭3, 4, 5 et ♭7."],["En La et en Mi","En La : La Do Ré Mi Sol. En Mi : Mi Sol La Si Ré. Cette gamme est très utilisée au rock et au blues, et se joue facilement sur le manche."]],
 m7l2:[["La note bleue","La gamme blues ajoute à la pentatonique mineure la quinte diminuée (♭5). En La : La Do Ré Mi♭ Mi Sol."],["Note de passage","On joue souvent le ♭5 comme note de passage entre la quarte et la quinte : en La, Ré, puis Mi♭, puis Mi."]],
 m7l3:[["La pentatonique majeure","La pentatonique majeure retire le 4<sup>e</sup> et le 7<sup>e</sup> degré de la gamme majeure. Il reste 1, 2, 3, 5 et 6."],["Le lien avec la mineure","La pentatonique mineure de La (La Do Ré Mi Sol) et la pentatonique majeure de Do (Do Ré Mi Sol La) contiennent exactement les mêmes notes."]],
 m7l4:[["Une gamme décalée","Un mode est la gamme majeure jouée en partant d’un autre degré. Sur les touches blanches, de Ré à Ré, tu obtiens Ré dorien."],["Le nom des modes","Ionien (la gamme majeure), dorien, phrygien, lydien, mixolydien, éolien (la mineure naturelle) et locrien."]],
 m7l5:[["Construire par altérations","Pour construire un mode, pars de la gamme majeure de sa tonique puis applique ses altérations : La dorien est La majeur avec ♭3 et ♭7."],["Comparer les modes","Mixolydien : majeur avec ♭7. Lydien : majeur avec ♯4. Dorien : mineur naturel avec le 6<sup>e</sup> degré majeur."]],
 m7p:[["Dans la position","La position de base de la pentatonique mineure de La se joue de la case 5 à la case 8, comme tu peux le vérifier en calculant les notes des cordes."]],
 m8l1:[["Baisser toutes les cordes","En half-step down, chaque corde descend d’un demi-ton. Le son est plus grave, mais les formes de doigts restent les mêmes."],["Le drop D","En drop D, seule la 6<sup>e</sup> corde descend, de Mi à Ré. Les trois cordes graves (Ré – La – Ré) forment une quinte puis une quarte, ce qui permet de jouer un power chord d’un seul doigt."]],
 m8l2:[["Le capo","Le capo bloque toutes les cordes à une case : le son monte d’autant de demi-tons que le numéro de la case."],["Garder ses formes","Capo en case 2 : la forme de Sol sonne La. Tu gardes tes doigtés, mais tu changes de tonalité."]],
 m8l3:[["Mêmes intervalles","Transposer, c’est déplacer toutes les notes du même intervalle. Les distances entre les notes restent identiques, seule la hauteur change."],["Pourquoi transposer ?","Pour adapter la tonalité à la voix, faciliter le jeu à l’instrument ou jouer sur un instrument transpositeur."]],
 m8l4:[["Décaler chaque fondamentale","Pour transposer une grille, décale chaque fondamentale du même nombre de demi-tons et garde la qualité : La mineur + 2 demi-tons = Si mineur."],["Avec les degrés","Si la grille est notée en chiffres romains, il suffit de la traduire dans la nouvelle tonalité."]],
 m8l5:[["Trouver sa tonalité","Si la mélodie est trop aiguë pour le chanteur, descends la tonalité. Si elle est trop grave, monte-la."],["Les outils","Le capo permet de monter en gardant les formes d’accords. Le half-step down permet de descendre d’un demi-ton."]],
 m8p:[["Noms et cases","En half-step down, les cases ne changent pas : seuls les noms des notes baissent d’un demi-ton."]],
 m9l1:[["Vitesse et simplicité","Le punk privilégie un tempo rapide, des morceaux courts et peu d’accords."],["Le son","Les accords sont saturés (power chords ou barrés) et les solos sont minimes. Tu peux déjà jouer dans ce style avec ce que tu as appris."]],
 m9l2:[["Guitares graves","Le nu-métal utilise des guitares à sept cordes ou accordées très bas, pour obtenir des riffs lourds."],["Rythme et influences","Riffs syncopés, rythme avant les solos, basse inspirée du funk, batterie et chant inspirés du hip-hop."]],
 m9l3:[["Boîte à rythmes","La Roland TR-808 est emblématique du rap. La grosse caisse tombe sur le temps 1 d’une phrase, la caisse claire ou le clap sur les temps 2 et 4."],["Charley et tempo","Le charley joue en croches ou doubles croches avec un léger swing."]],
 m9l4:[["Le leitmotif","Un leitmotif est une courte phrase musicale liée à un personnage, un lieu ou une idée. Le terme vient de l’opéra de Wagner."],["Varier un thème","On fait varier un thème par le rythme, le tempo, la texture ou l’orchestration, sans qu’on cesse de le reconnaître."]],
 m9p:[["Choisir","Pour un titre : décide d’abord du tempo, puis du rythme de batterie, puis de l’accordage de la guitare."]],
 m10l1:[["La clé de sol","La clé de sol s’enroule autour de la 2<sup>e</sup> ligne de la portée, qui devient la ligne du Sol. C’est elle qui donne leur nom à toutes les autres notes."],["Les lignes supplémentaires","Pour les notes hors de la portée, on ajoute de petits traits : le Do du milieu (Do4) se place sur une ligne supplémentaire sous la portée."]],
 m10l2:[["Compter à partir du Sol","Repère la ligne du Sol (2<sup>e</sup> ligne), puis avance d’une ligne ou d’un interligne par note."],["Monter d’un cran","Passer d’une ligne à l’interligne suivant monte d’une note : Mi (ligne), Fa (interligne), Sol (ligne)."]],
 m10l3:[["Six lignes","Chaque ligne de la tablature est une corde : en haut, la corde de Mi aigu ; en bas, la corde de Mi grave."],["Une limite","La tablature indique les cases, pas la durée des notes. Pour le rythme, appuie-toi sur la partition ou sur l’oreille."]],
 m10l4:[["Deux axes","Dans le piano roll, la hauteur est sur l’axe vertical (les notes graves en bas) et le temps sur l’axe horizontal, avec les mesures sur la règle."],["Les outils","Snap : grille d’alignement des notes. Vélocité : force de la note. Ghost notes : notes des autres canaux affichées en transparence. La mise en évidence d’une gamme aide à repérer les notes de la tonalité."]],
 m10l5:[["Calculer la note","Note jouée = corde à vide + nombre de cases en demi-tons. Corde de La, case 3 : La + 3 demi-tons = Do."],["La convention de FL Studio","FL Studio affiche une octave de plus que la notation scientifique : La2 + 3 demi-tons = Do3, affiché Do4 dans le piano roll."]],
 m10p:[["Démarche","Lis la tablature, calcule chaque note, puis place-la dans le piano roll à la bonne hauteur et au bon moment."]],
 r1:[["Sentir la pulsation","Tape du pied à chaque clic du métronome : c’est la pulsation. Le tempo, en BPM, dit à quelle vitesse elle bat."],["Choisir un tempo","Commence lentement (60–80 BPM) pour être précis, puis accélère. À 120 BPM, il y a 2 battements par seconde."]],
 r2:[["L’accent","Dans le métronome, le premier clic de chaque mesure est plus fort. C’est lui qui te fait entendre la mesure : 2, 3 ou 4 temps."],["Le 6/8","En 6/8, six croches se regroupent en deux temps de trois : 1-2-3, 4-5-6."]],
 r3:[["Diviser le temps","Chaque temps peut se diviser en 2 (croches), en 3 (triolets) ou en 4 (doubles croches)."],["Comment compter","Croches : « 1 et 2 et ». Doubles croches : « 1 e et a 2 e et a ». Triolets : « 1 la li 2 la li »."]],
 r4:[["Les trois voix du beat","La grosse caisse (grave) donne les appuis, la caisse claire (médium) les accents, le charley (aigu) la régularité."],["Les 16 pas","Il y a quatre pas par temps : temps 1 = pas 1, temps 2 = pas 5, temps 3 = pas 9, temps 4 = pas 13."]],
 r5:[["Numéroter les pas","En doubles croches, on compte « 1 e et a 2 e et a ». Le « et » tombe sur le 3<sup>e</sup> pas de chaque temps."],["Dans FL Studio","Le séquenceur de pas de FL Studio fonctionne de la même façon : 16 pas, soit 4 pas par temps."]],
 rp:[["Le beat de rap","Grosse caisse sur le temps 1, caisse claire ou clap sur les temps 2 et 4, charley en croches."]]
};
function addExtras(){
  Object.keys(EXTRA).forEach(function(id){
    var Ls=LESSONS[id], st=Ls.steps, fiche=st[0].fiche, gi=[], ex=EXTRA[id], pos, k;
    st.forEach(function(x,i){if(x.graded) gi.push(i)});
    for(k=ex.length-1;k>=0;k--) st.splice(gi[0],0,LEARN(fiche,ex[k][0],'<p class="lead">'+ex[k][1]+'</p>'));
    Ls.min+=ex.length;
  });
}
addExtras();

/* =================== ATELIERS CRÉATIFS (validation d’unité) =================== */
var PCN=['Do','Do♯/Ré♭','Ré','Ré♯/Mi♭','Mi','Fa','Fa♯/Sol♭','Sol','Sol♯/La♭','La','La♯/Si♭','Si'];
function pcShort(p){return PCN[((p%12)+12)%12].split('/')[0]}
function creRun(root,api,cons,get,hint,exTxt){
  var box=h('<div><ul class="chk">'+cons.map(function(c){return '<li>• '+c.t+'</li>'}).join('')+'</ul></div>'), lis=box.querySelectorAll('li'), exBtn=null, hp=null;
  root.append(box);
  function run(){
    var st=get(), ok=true;

/* =================== ATELIERS CRÉATIFS (suite) + leçons « pour aller plus loin » =================== */
/* --- Choix dans une liste --- */
function CHOOSE(title,fiche,gen){
  return {graded:true,fiche:fiche,render:function(root,api){
    var g=gen(), sel=[];
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+g.brief+'</p>';
    var run=creRun(root,api,g.cons,function(){return sel.slice().sort(function(a,b){return a-b})},g.hint,g.exampleText);
    var pal=h('<div class="cpal"></div>'), btns=[], act=h('<div class="demo"></div>');
    function refresh(){btns.forEach(function(b,i){var on=sel.indexOf(i)>=0; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on))}); if(sel.length) api.select(run); else api.unselect()}
    g.values.forEach(function(lb,i){var b=palBtn(lb); b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){var k=sel.indexOf(i); if(g.multi){if(k>=0) sel.splice(k,1); else sel.push(i)} else sel=[i]; if(g.midi) tone(g.midi(i),0,.8); refresh()}); btns.push(b); pal.append(b)});
    root.append(pal);
    if(g.midi){var pb=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter ma sélection</button>'); pb.addEventListener('click',function(){sel.slice().sort(function(a,b){return a-b}).forEach(function(i,k){tone(g.midi(i),k*0.7,0.9)})}); act.append(pb); root.append(act)}
    refresh();
    root._solve=function(){sel=g.example.slice(); refresh()}; root._run=run;
  }};
}
/* --- Manche : une case par corde --- */
function FRETB(title,fiche,gen){
  return {graded:true,fiche:fiche,render:function(root,api){
    var g, tries=0; do{g=gen(); tries++}while(!g.exampleFrets&&tries<80);
    var T=g.tuning, st=[null,null,null,null,null,null], NF=8;
    root.innerHTML='<h2>'+title+'</h2><p class="lead">'+g.brief+'</p>';
    var run=creRun(root,api,g.cons,function(){return st.slice()},g.hint,g.exampleText);
    var tb=h('<div class="ftab" role="group" aria-label="Manche"></div>'), cells=[];
    for(var s=5;s>=0;s--){(function(s){
      var row=h('<div class="ftrow"><span class="ftn">'+pcShort(T[s]%12)+'</span></div>'); cells[s]=[];
      for(var f=0;f<NF;f++){(function(f){
        var c=h('<button type="button" class="fc" aria-label="Corde '+(6-s)+', case '+f+'">'+f+'</button>');
        c.addEventListener('click',function(){st[s]=(st[s]===f?null:f); if(st[s]!==null) tone(T[s]+f,0,.9); refresh()});
        cells[s][f]=c; row.append(c);
      })(f)}
      tb.append(row);
    })(s)}
    function refresh(){cells.forEach(function(r,s){r.forEach(function(c,f){var on=st[s]===f; c.classList.toggle('on',on); c.setAttribute('aria-pressed',String(on))})}); if(st.some(function(x){return x!==null})) api.select(run); else api.unselect()}
    var pb=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter l’accord</button>');
    pb.addEventListener('click',function(){st.forEach(function(f,s){if(f!==null) tone(T[s]+f,s*0.06,1.4)})});
    var cl=h('<button type="button" class="linkbtn">Tout effacer</button>'); cl.addEventListener('click',function(){st=[null,null,null,null,null,null]; refresh()});
    var act=h('<div class="demo"></div>'); act.append(pb,cl);
    root.append(h('<p class="small">Corde de Mi grave en bas. Une case par corde ; une corde sans case choisie reste muette. Case 0 = corde à vide.</p>'),tb,act); refresh();
    root._solve=function(){st=g.exampleFrets.slice(); refresh()}; root._run=run;
  }};
}
function fbSearch(T,cons){
  var st=[null,null,null,null,null,null], res=null;
  (function rec(s){ if(res) return; if(s===6){ if(st.some(function(x){return x!==null})&&cons.every(function(c){return c.f(st)})) res=st.slice(); return}
    for(var f=-1;f<8&&!res;f++){st[s]=f<0?null:f; rec(s+1)} st[s]=null })(0);
  return res;
}
function fbPcs(T,st){return st.map(function(f,s){return f===null?null:(T[s]+f)%12})}
var TUN=[{n:'standard',T:STD},{n:'drop D',T:DROPD},{n:'half-step down',T:HSD}];
function gFret(){
  var tn=pick(TUN), ch=pick([['Do',[0,4,7]],['Sol',[7,11,2]],['Ré',[2,6,9]],['Mi mineur',[4,7,11]],['La mineur',[9,0,4]],['Ré mineur',[2,5,9]]]), pcs=ch[1], T=tn.T;
  var cons=[{t:'Au moins 4 cordes jouées',f:function(st){return st.filter(function(x){return x!==null}).length>=4}},
    {t:'Toutes les notes appartiennent à l’accord de '+ch[0]+' ('+ch[2]+')',f:function(st){return fbPcs(T,st).every(function(p){return p===null||pcs.indexOf(p)>=0})}},
    {t:'Les trois notes de l’accord sont présentes',f:function(st){var p=fbPcs(T,st); return pcs.every(function(x){return p.indexOf(x)>=0})}},
    {t:'La note la plus grave est la fondamentale',f:function(st){var p=fbPcs(T,st), i=0; while(p[i]===null) i++; return p[i]===pcs[0]}}];
  var names=ch[0]==='Do'?'Do Mi Sol':ch[0]==='Sol'?'Sol Si Ré':ch[0]==='Ré'?'Ré Fa♯ La':ch[0]==='Mi mineur'?'Mi Sol Si':ch[0]==='La mineur'?'La Do Mi':'Ré Fa La';
  cons[1].t=cons[1].t.replace('('+undefined+')','('+names+')');
  var ex=fbSearch(T,cons);
  return {tuning:T,brief:'Ton accordage : <b>'+tn.n+'</b>. Place un accord de <b>'+ch[0]+'</b> sur le manche, en choisissant toi-même les cases (cases 0 à 7).',cons:cons,
    hint:'Les cordes à vide sont '+T.map(function(m){return pcShort(m%12)}).join(' ')+' (de la plus grave à la plus aiguë). Chaque case ajoute un demi-ton.',exampleFrets:ex,exampleText:ex?'cases '+ex.map(function(f){return f===null?'×':f}).join(' ')+' (de la corde grave à l’aiguë).':''};
}
function gPower(){
  var T=DROPD, r=pick([['Ré',2],['Mi',4],['Fa',5],['Sol',7],['La',9]]), pcs=[r[1],(r[1]+7)%12];
  var cons=[{t:'Les 3 cordes graves sont jouées, les trois aiguës restent muettes',f:function(st){return st[0]!==null&&st[1]!==null&&st[2]!==null&&st[3]===null&&st[4]===null&&st[5]===null}},
    {t:'Les 3 cordes sont jouées à la même case (un seul doigt en barré, ou à vide)',f:function(st){return st[0]===st[1]&&st[1]===st[2]}},
    {t:'Les notes sont la fondamentale '+r[0]+' et sa quinte',f:function(st){return fbPcs(T,st).every(function(p){return p===null||pcs.indexOf(p)>=0})&&fbPcs(T,st).indexOf(pcs[1])>=0}},
    {t:'La note la plus grave est '+r[0],f:function(st){return fbPcs(T,st)[0]===pcs[0]}}];
  var ex=fbSearch(T,cons);
  return {tuning:T,brief:'Accordage <b>drop D</b> (6<sup>e</sup> corde en Ré). Joue un power chord de <b>'+r[0]+'</b> d’un seul doigt (cases 0 à 7).',cons:cons,hint:'En drop D, les trois cordes graves (Ré, La, Ré) sont une quinte, puis une quarte : un même doigt posé à la même case sur les trois donne un power chord.',exampleFrets:ex,exampleText:ex?'case '+ex[0]+' sur les trois cordes graves.':''};
}
/* --- Mini piano roll --- */
function PRB(title,fiche,o){
  var ROWS=[['La3',57],['Do4',60],['Ré4',62],['Mi4',64],['Sol4',67],['La4',69],['Do5',72],['Ré5',74]], NC=8;
  return {graded:true,fiche:fiche,render:function(root,api){
    var st=[],i; for(i=0;i<NC;i++) st.push(null);

    var grid=h('<div class="proll" role="group" aria-label="Piano roll"></div>'), cells=[];
    for(var r=ROWS.length-1;r>=0;r--){(function(r){

        cells[r][c]=b; row.append(b);
      })(c)}
      grid.append(row);
    })(r)}
    function refresh(){cells.forEach(function(rw,r){rw.forEach(function(b,c){var on=st[c]===r; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on))})}); if(st.some(function(x){return x!==null})) api.select(run); else api.unselect()}
    var pb=h('<button type="button" class="btn ghost small">'+PLAY+' Écouter ma phrase</button>'); pb.addEventListener('click',function(){st.forEach(function(r,c){if(r!==null) tone(ROWS[r][1],c*0.3,0.7)})});
    var cl=h('<button type="button" class="linkbtn">Tout effacer</button>'); cl.addEventListener('click',function(){st=st.map(function(){return null}); refresh()});
    var act=h('<div class="demo"></div>'); act.append(pb,cl);
    root.append(grid,act); refresh();

function XL(id,title,f,screens,qs){
  var st=[LEARN(f,screens[0][0],'<p class="lead">'+screens[0][1]+'</p>')];
  for(var i=1;i<screens.length;i++) st.push(LEARN(f,screens[i][0],'<p class="lead">'+screens[i][1]+'</p>'));

function streaks(){
  var today=new Date(), cur=0, d=S.days[dkey(today)]?today:addDays(today,-1);
  while(S.days[dkey(d)]){cur++; d=addDays(d,-1)}
  var keys=Object.keys(S.days).filter(function(k){return S.days[k]>0}).sort(), best=0, run=0, prev=null;

    run=(prev&&dkey(addDays(prev,1))===k)?run+1:1; prev=dt; if(run>best) best=run;
  });

}

/* ---------- Rythme : moteur audio précis, métronome, séquenceur, défi ---------- */
var BPM=90;
var eng={t:null,timers:[],onStop:null};
function stopEngine(){
  if(eng.t){clearInterval(eng.t); eng.t=null}
  eng.timers.forEach(clearTimeout); eng.timers=[];
  if(eng.onStop){var f=eng.onStop; eng.onStop=null; f()}
}
function runEngine(o){
  stopEngine();
  var c=ac(); if(!c) return;
  eng.onStop=o.onStop||null;
  var i=0, next=c.currentTime+0.08;
  function later2(fn,t){eng.timers.push(setTimeout(fn,Math.max(0,(t-c.currentTime)*1000))); if(eng.timers.length>64) eng.timers.shift()}
  eng.t=setInterval(function(){
    while(next<c.currentTime+0.12){
      if(o.max!=null && i>=o.max){
        clearInterval(eng.t); eng.t=null;
        later2(stopEngine,next+0.1); return;
      }
      o.tick(i,next);
      (function(ii,tt){ if(o.ui) later2(function(){o.ui(ii)},tt) })(i,next);
      next+=o.interval(); i++;
    }
  },25);
}
function env(t,type,f0,f1,g,d){
  var c=ctx, o=c.createOscillator(), gn=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+d*0.6);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t+d+0.02);
}
function clickAt(t,k){
  if(k==='a') env(t,'square',1500,0,0.2,0.05);
  else if(k==='m') env(t,'square',1200,0,0.17,0.05);
  else if(k==='n') env(t,'square',1000,0,0.14,0.05);
  else env(t,'sine',800,0,0.07,0.03);
}
function hitAt(t,r){
  if(r===0) env(t,'sine',150,55,0.9,0.25);
  else if(r===1) env(t,'triangle',330,0,0.55,0.14);
  else env(t,'square',1200,0,0.12,0.06);
}
function hitNow(r){var c=ac(); if(c) hitAt(c.currentTime+0.01,r)}
function setBpm(v){
  BPM=Math.max(40,Math.min(220,Math.round(v)));
  var b=$('#bpm'), r=$('#bpmr'); if(b) b.textContent=BPM; if(r) r.value=BPM;
}

var lesson=$('#lesson'), stage=$('#stage'), fill=$('#fill'), countEl=$('#count'), next=$('#next'), fb=$('#fb'), foot=$('#lfoot'), track=$('#track');
var L=null;
function setProgress(n){fill.style.width=(L.n?n/L.n*100:0)+'%'; countEl.textContent=n+'/'+L.n; track.setAttribute('aria-valuenow',String(n)); track.setAttribute('aria-valuemax',String(L.n))}
function startNode(id){
  stopEngine();
  var nd=NODES[id], steps, retry;
  if(!nd) return;
  if(nd.kind==='quiz'){steps=quizSteps(id).concat(rappels(modOf(id),2)); retry=false}
  else if(nd.kind==='game'){steps=gameSteps(id); retry=false}
  else if(nd.kind==='create'){steps=LESSONS[id].steps.slice(); retry=false}
  else {steps=rappels(modOf(id),1).concat(LESSONS[id].steps); retry=true}
  L={id:id,kind:nd.kind,steps:steps,retry:retry,n:steps.length,total:steps.filter(function(s){return s.graded&&!s.rappel}).length,res:[],
     queue:steps.map(function(s,i){return i}),pos:0,score:0,passed:0,tried:{},phase:'steps',validate:null,answered:false};
  lesson.hidden=false; document.body.style.overflow='hidden';
  renderStep();
}
function renderStep(){
  clearTimers();
  var cur=L.queue[L.pos], s=L.steps[cur], retry=!!L.tried[cur];
  setProgress(L.passed); foot.className='lfoot'; fb.textContent=''; next.textContent=s.graded?'Valider':'Continuer'; next.disabled=!!s.graded;
  L.validate=null; L.answered=false;
  stage.innerHTML=''; var root=h('<div class="step"></div>'); stage.append(root);
  var answered=false;
  var api={select:function(fn){
    if(answered) return;
    L.validate=fn; next.disabled=false;
  },unselect:function(){
    if(answered) return;
    L.validate=null; next.disabled=true;
  },done:function(ok,msg){
    if(answered) return; answered=true; L.answered=true; L.validate=null;
    var first=!L.tried[cur]; L.tried[cur]=true;
    if(first&&s.fiche) record(s.fiche.id,ok);
    if(first&&s.nid) revUpdate(s.nid,ok);
    if(L.kind==='placement') L.res.push({mod:s.mod,ok:ok});
    touchDay();
    if(ok){ if(first&&!s.rappel) L.score++; L.passed++; setProgress(L.passed); }
    else if(L.retry){ L.queue.push(cur); }
    else { L.passed++; setProgress(L.passed); }
    foot.className='lfoot '+(ok?'good':'bad');
    fb.textContent=ok ? 'Bien joué ! '+msg : 'Pas tout à fait. '+msg;
    next.textContent='Continuer'; next.disabled=false;
    try{next.focus({preventScroll:true})}catch(e){}
  }};
  s.render(root,api);
  if(retry) root.insertAdjacentHTML('afterbegin','<p class="eyebrow">Question à refaire</p>');
  if(s.fiche) root.append(h('<p class="fiche">Fiche de théorie : <button type="button" class="linkbtn" data-f="'+s.fiche.id+'">'+s.fiche.label+'</button></p>'));
  document.querySelector('.lbody').scrollTop=0;
}
function showResults(){
  clearTimers(); L.phase='results'; L.passed=L.n; setProgress(L.n);
  var big, lead, title;
  if(L.kind==='placement'||L.kind==='review'){
    touchDay(); foot.className='lfoot good'; fb.textContent=''; next.disabled=false; next.textContent='Retour au parcours';
    if(L.kind==='review'){
      stage.innerHTML='<h2>Révision terminée</h2><div class="score">'+L.score+'/'+L.total+'</div><p class="lead">Les notions ratées reviendront bientôt, les réussies plus tard.</p>';
      saveS(); return;
    }
    var by={}; L.res.forEach(function(r){var b=by[r.mod]||(by[r.mod]={ok:0,n:0}); b.n++; if(r.ok) b.ok++});
    var start=0, rows='';
    MODULES.forEach(function(m){var b=by[m.n]||{ok:0,n:0}; if(!start&&b.ok<b.n) start=m.n;
      rows+='<li><span>Module '+m.n+' · '+m.title+'</span><b>'+b.ok+'/'+b.n+'</b></li>'});
    var full=!start; if(!start) start=1;
    S.placement={t:Date.now(),start:start,res:by}; saveS();
    MODULES.forEach(function(m){modOpen[m.n]=(m.n===start)});
    stage.innerHTML='<h2>Test de niveau terminé</h2><div class="score">'+L.score+'/'+L.total+'</div><p class="lead">'+(full?'Tout est acquis. Commence où tu veux, les notions moins basiques reviendront en rappel.':'Point de départ conseillé : <b>module '+start+' · '+MODULES[start-1].title+'</b>. Les notions ratées reviendront en rappel dans les leçons et les révisions.')+'</p><ul class="plres">'+rows+'</ul>';
    return;
  }
  S.done[L.id]=true;
  if(L.kind==='quiz'){
    var pct=Math.round(100*L.score/L.total);
    S.best[L.id]=Math.max(pct,S.best[L.id]||0);
    title='Quiz terminé'; big=pct+' %';
    lead=(pct>=80?'Quiz réussi. ':'Seuil de réussite : 80 %. Relis les leçons de l’unité, puis retente. ')+'Meilleur score : '+S.best[L.id]+' %.';
  }else if(L.kind==='game'){
    S.best[L.id]=Math.max(L.score,S.best[L.id]||0);
    title='Exercice terminé'; big=L.score+'/'+L.total;
    lead='Record : '+S.best[L.id]+'/'+L.total+'.';
  }else{
    if(L.kind==='create'){title='Atelier terminé'; big=L.score+'/'+L.total; lead='Exercices dont toutes les consignes sont respectées. '+(L.score===L.total?'Bravo, tu peux refaire l’atelier : les tonalités et les consignes changent.':'Relis la fiche de théorie si besoin, puis refais l’atelier.')}
    else{title=L.kind==='project'?'Application terminée':'Leçon terminée'; big=L.score+'/'+L.total;
    lead='Réponses justes du premier coup. '+(L.score===L.total?'Aucune erreur.':'Relis la fiche de théorie si besoin, puis refais la leçon pour améliorer ton score.');}
  }
  saveS();
  foot.className='lfoot good'; fb.textContent=''; next.disabled=false; next.textContent='Retour au parcours';
  stage.innerHTML='<h2>'+title+'</h2>'+(L.total?'<div class="score">'+big+'</div>':'')+'<p class="lead">'+lead+'</p>'+
    '<div class="row"><button type="button" class="btn ghost" id="redo">Refaire</button><button type="button" class="linkbtn" data-f="f-noms">Ouvrir la fiche de théorie</button></div>';
  var id=L.id; stage.querySelector('#redo').addEventListener('click',function(){startNode(id)});
}
function closeLesson(){
  clearTimers(); lesson.hidden=true; document.body.style.overflow='';
  renderTheory(); renderSuivi(); renderRythme(); renderAllTabs();
}
next.addEventListener('click',function(){
  if(!L) return;
  if(L.phase==='results'){closeLesson(); return}
  var g=L.steps[L.queue[L.pos]].graded;
  if(g && !L.answered){ if(L.validate) L.validate(); return }
  if(!g){L.passed++; touchDay()}
  if(L.pos<L.queue.length-1){L.pos++; renderStep()} else showResults();
});
$('#lclose').addEventListener('click',closeLesson);

var FICHE='<h2 id="m-1">Module 1 · Les bases</h2>'+
'<h3 id="f-noms">Les sept noms de notes</h3>'+
'<p>Deux écritures coexistent. Le système syllabique (Do, Ré, Mi, Fa, Sol, La, Si) est employé en France, en Italie, en Espagne et dans de nombreux autres pays. Le système alphabétique (C, D, E, F, G, A, B) est celui du monde anglophone.</p>'+
'<p><b>Correspondance :</b> Do = C, Ré = D, Mi = E, Fa = F, Sol = G, La = A, Si = B.</p>'+
'<p>Dans les pays germaniques, notre Si s’écrit H et la lettre B désigne le Si bémol.</p>'+
'<h3 id="f-clavier">Dièses, bémols et clavier</h3>'+
'<p>Une octave contient 12 notes : 7 naturelles (touches blanches) et 5 altérées (touches noires). Une touche noire prend le nom de sa voisine : dièse (♯) en partant de la touche blanche à gauche, bémol (♭) en partant de celle à droite.</p>'+
'<p>Sur un instrument accordé en tempérament égal, comme le piano, une même touche noire porte deux noms : Do♯ et Ré♭ désignent la même hauteur.</p>'+
'<h3 id="f-alter">Dièse, bémol, bécarre</h3>'+
'<p>Le dièse (♯) monte une note d’un demi-ton, le bémol (♭) la descend d’un demi-ton, le bécarre (♮) annule une altération.</p>'+
'<p>Deux notes qui sonnent pareil au piano mais s’écrivent différemment sont dites enharmoniques. Exemples : Do♯ et Ré♭, mais aussi Mi♯ et Fa, Si♯ et Do, Fa♭ et Mi, Do♭ et Si.</p>'+
'<h3 id="f-tons">Ton et demi-ton</h3>'+
'<p>Le demi-ton est le plus petit intervalle du système tempéré. Exemples : mi-fa, si-do, sol♯-la, ré-mi♭. Un ton vaut deux demi-tons.</p>'+
'<p class="note">Entre Mi et Fa, comme entre Si et Do, il n’y a pas de touche noire : ces paires sont distantes d’un demi-ton.</p>'+
'<h3 id="f-manche">Le manche et les accordages</h3>'+
'<p>Sur une guitare, passer d’une case à la suivante monte la note d’un demi-ton.</p>'+
'<p><b>Accordage standard</b> (de la corde grave à la plus aiguë) : E2, A2, D3, G3, B3, E4, soit Mi La Ré Sol Si Mi.</p>'+
'<p><b>Half-step down</b> (accordage en Mi♭) : toutes les cordes descendent d’un demi-ton, soit E♭2, A♭2, D♭3, G♭3, B♭3, E♭4.</p>'+
'<p><b>Drop D</b> : seule la corde grave descend d’un ton entier, de Mi à Ré (D2). Les autres cordes ne changent pas.</p>'+
'<h3 id="f-octave">Octaves et fréquences</h3>'+
'<p>Deux notes qui portent le même nom à une octave d’écart ont des fréquences dans le rapport 2 : 220, 440 et 880 Hz pour La3, La4 et La5.</p>'+
'<p>En tempérament égal, l’octave est découpée en 12 demi-tons identiques. Chaque demi-ton multiplie la fréquence par la racine douzième de 2, soit environ 1,0595.</p>'+
'<p>Le La4 à 440 Hz est la référence d’accordage. L’American Standards Association l’a recommandé en 1936, l’ISO l’a repris en 1955 puis normalisé en 1975 (ISO 16). En Europe continentale, on accorde souvent entre 440 et 444 Hz.</p>'+
'<h3 id="f-nommer">Numéroter les octaves</h3>'+
'<p>Dans la notation scientifique (ou internationale), on écrit la lettre suivie d’un numéro d’octave. Le numéro change à chaque Do : le Si juste en dessous de C4 est donc B3.</p>'+
'<p><b>Repères :</b> Do central = C4 ≈ 261,63 Hz = note MIDI 60. La4 = note MIDI 69 = 440 Hz. La note la plus grave d’un piano standard est La0 (27,5 Hz). La corde de Mi grave d’une guitare en accordage standard sonne un Mi2 (E2), environ 82,4 Hz.</p>'+
'<p><b>Les conventions varient.</b> Certains logiciels et claviers (Yamaha, GarageBand) appellent le Do central C3. FL Studio numérote les octaves de 0 à 10 et l’affiche C5. C’est la même note MIDI, seul le nom change. Une note de guitare E2 s’y affiche donc E3.</p>'+
'<p class="note">Les règles de base sont stables. Les conventions des logiciels peuvent évoluer : pour un réglage précis, recoupe avec la source citée.</p>'+

'<li><a href="https://en.wikipedia.org/wiki/Scientific_pitch_notation" target="_blank" rel="noopener">Wikipedia : Scientific pitch notation</a></li>'+

function TL(id,title,f,screens,qs,extra){

function UNITDEF(u){
  var nodes=u.lessons.map(function(i){return {id:i,kind:'lesson'}});
  if(u.lessons.length) nodes.push({id:'q'+u.id,kind:'quiz',pool:u.lessons.slice()});
  (u.create||[]).forEach(function(c){nodes.push({id:c,kind:'create'})});
  return {id:u.id,title:u.title,desc:u.desc,glyph:u.glyph,nodes:nodes};
}
function regTab(id,def){

 ['1979 : un premier tube','<i>Rapper’s Delight</i> sort en <b>1979</b> sur Sugar Hill, un label indépendant dirigé par des cadres afro-américains. Britannica en fait un phénomène en tête des classements, qui a donné son nom à un genre de musique pop.'],
 ['Le sample','En 1981, <i>The Adventures of Grandmaster Flash on the Wheels of Steel</i> échantillonne des passages de <i>Good Times</i> (1979), selon Britannica. Un <b>sample</b> est un extrait d’enregistrement réutilisé dans un nouveau morceau.']],[
 ['Année','En quelle année sort <i>Rapper’s Delight</i> ?',['1979','1964','2001'],'Britannica : 1979, sur Sugar Hill.'],
 ['Label','Rapper’s Delight sort sur…',['Un label indépendant, Sugar Hill','Un label d’orchestre classique','Aucun label'],'Sugar Hill était indépendant.'],
 ['Sample','Qu’est-ce qu’un sample ?',['Un extrait d’enregistrement réutilisé','Un accord de septième','Une mesure à 6/8'],'On réutilise un extrait existant.'],
 ['Good Times','Quel titre de 1979 est échantillonné par Grandmaster Flash en 1981 ?',['Good Times','Planet Rock','Anarchy in the U.K.'],'Selon Britannica.']]);
TL('h23','La Roland TR-808',F_H2,[
 ['Une boîte à rythmes ratée…','La TR-808, conçue par une équipe de Roland dirigée par Tadao Kikumoto, imite des claps, des basses et des batteries par <b>synthèse analogique</b>. Chère (1 200 dollars au prix catalogue) et critiquée parce que ses sons ne ressemblaient pas à de vraies batteries, elle s’arrête après environ 12 000 exemplaires vendus.'],
 ['…devenue emblème du rap','Vers le milieu des années 1980, les exemplaires d’occasion tombent à 100 dollars ou moins, ce qui les rend accessibles aux jeunes musiciens. Arthur Baker l’utilise pour <i>Planet Rock</i> (1982) d’Afrika Bambaataa et Soul Sonic Force, qui a aidé à lancer le premier âge d’or du hip-hop. Elle sert aussi dans <i>Sexual Healing</i> de Marvin Gaye (1982). Sa grosse caisse et sa basse sont devenues omniprésentes dans le rap du Sud.']],[
 ['Synthèse','Comment la TR-808 produit-elle ses sons ?',['Par synthèse analogique','Avec de vrais enregistrements','Par un orchestre'],'Smithsonian : analog synthesis.'],
 ['Prix','Pourquoi les 808 d’occasion se sont-elles répandues chez les jeunes musiciens ?',['Leur prix est tombé à 100 dollars ou moins','Elles étaient offertes','Elles étaient très légères'],'Un échec commercial a rendu l’occasion abordable.'],
 ['Planet Rock','Quel titre de 1982, produit avec une 808, a inspiré le premier âge d’or du hip-hop ?',['Planet Rock','Anarchy in the U.K.','Hybrid Theory'],'<i>Planet Rock</i> d’Afrika Bambaataa et Soul Sonic Force.'],
 ['Son','Quel élément de la 808 est devenu emblématique ?',['La grosse caisse et la basse','Les cordes','Le piano'],'Son « thundering bass ».']]);
TL('h31','Origines du nu-métal',F_H3,[
 ['Californie, milieu des années 1990','Le nu-métal naît en Californie au milieu des années 1990. Korn est souvent cité comme pionnier avec son premier album de <b>1994</b>, considéré comme le premier album nu-métal ; la démo <i>Neidermayer’s Mind</i> date de 1993. Pantera, Helmet et Faith No More font partie des influences de la fin des années 1980 et du début des années 1990.'],
 ['Une frise','1995 : <i>Adrenaline</i> de Deftones. 1997 : <i>Three Dollar Bill, Y’all</i> de Limp Bizkit. 1998 : <i>Follow the Leader</i> de Korn, n° 1 du Billboard 200. 1999 : premier album de Slipknot. 2000–2001 : <i>Hybrid Theory</i> de Linkin Park, sommet commercial du genre.']],[
 ['Pionnier','Quel groupe est souvent cité comme pionnier du nu-métal avec son album de 1994 ?',['Korn','Les Ramones','Deftones'],'Le premier album de Korn (1994).'],
 ['Sommet','Quel album est présenté comme le sommet commercial du genre (2000–2001) ?',['Hybrid Theory, de Linkin Park','Nuggets','Rapper’s Delight'],'Selon Wikipédia.'],
 ['N°1','Quel album de Korn a atteint la première place du Billboard 200 en 1998 ?',['Follow the Leader','Life Is Peachy','Adrenaline'],'<i>Follow the Leader</i>.'],
 ['Lieu','Où le nu-métal est-il né ?',['En Californie','À Londres','Au Mali'],'Mi-années 1990, Californie.']]);
TL('h32','Le son du nu-métal',F_H3,[
 ['Guitares et rythme','Les guitaristes utilisent souvent des guitares à <b>sept cordes accordées plus bas</b> pour un son plus lourd. Les riffs sont « heavily syncopated » (très syncopés) : le rythme prime sur la complexité ou la mélodie. Les solos sont rares, et les blast beats et la double grosse caisse peu fréquents.'],
 ['Hip-hop, DJ et voix','Des DJ apparaissent parfois pour échantillonner, scratcher ou ajouter des fonds électroniques. Les voix chantent, rappent, crient ou grognent, souvent de manière rythmique et influencée par le hip-hop. La basse s’inspire du funk, et la batterie du hip-hop. Les morceaux suivent souvent une structure couplet – refrain – pont.']],[
 ['Guitares','Quelles guitares le nu-métal emploie-t-il souvent ?',['À sept cordes, accordées plus bas','À douze cordes, très aiguës','Classiques, en nylon'],'Pour un son plus lourd.'],
 ['Riffs','Comment décrit-on les riffs du nu-métal ?',['Très syncopés','Sans rythme','Toujours en 3/4'],'« Heavily syncopated ».'],
 ['Voix','Les voix du nu-métal sont souvent…',['Rythmiques et influencées par le hip-hop','Uniquement lyriques','Sans paroles'],'Chant, rap, cris, grognements.'],
 ['Solos','Que dit-on des solos de guitare dans ce genre ?',['Ils sont rares','Ils durent des minutes','Ils sont obligatoires'],'Le rythme prime.']]);
TL('h41','Max Steiner et King Kong',F_H4,[
 ['Une musique « nécessaire mal »','Quand RKO engage Max Steiner en 1929, la musique de film se limite souvent au générique de début et de fin. Dans les années 1920, les cinéastes la voient comme un « mal nécessaire ». Steiner écrira plus de 300 partitions.'],
 ['King Kong (1933)','Le studio le laisse ajouter de la musique à <i>King Kong</i> en espérant qu’elle aide des effets spéciaux fragiles. Steiner paie lui-même un orchestre de 80 musiciens. Il emploie des accords dissonants pour le suspense, des mélodies lyriques pour l’héroïne et une musique « tribale » pour la scène du sacrifice.']],[
 ['Année','En quelle année Max Steiner est-il engagé par RKO ?',['1929','1950','1977'],'D’après LibreTexts : 1929.'],
 ['Avant','Comment les cinéastes des années 1920 voyaient-ils la musique de film ?',['Comme un mal nécessaire','Comme l’élément principal','Comme un luxe obligatoire'],'« Necessary evil ».'],
 ['Orchestre','Combien de musiciens compte l’orchestre que Steiner finance lui-même ?',['80','8','300'],'Un orchestre de 80 musiciens.'],
 ['Héroïne','Que Steiner associe-t-il à l’héroïne de <i>King Kong</i> ?',['Des mélodies lyriques','Une musique tribale','Du silence'],'Lyrique pour l’héroïne, tribal pour le sacrifice.']]);
TL('h42','Leitmotiv et Star Wars',F_H4,[
 ['Un thème par personnage','Steiner s’inspire des opéras de Wagner : pour lui, « every character needs a theme » (chaque personnage a besoin d’un thème). Le thème de Kong commence par <b>trois notes descendantes</b>. Violent au début, il devient lyrique quand il reflète les sentiments de Kong pour Ann Darrow, et revient sous sa forme sentimentale à sa mort.'],
 ['Star Wars (1977)','John Williams compose et dirige la musique de <i>Star Wars</i> (1977), jouée par le <b>London Symphony Orchestra</b> en huit séances aux studios Anvil de Denham, en mars 1977. Elle reçoit l’Oscar de la meilleure musique originale et, en 1978, des Grammys dont celui de la meilleure composition instrumentale pour le « Main Title ».']],[
 ['Kong','Par quoi commence le thème de Kong ?',['Trois notes descendantes','Un accord de Do majeur','Un solo de batterie'],'Selon LibreTexts.'],
 ['Wagner','De quel compositeur Steiner s’inspire-t-il pour les thèmes liés aux personnages ?',['Wagner','Bach','Debussy'],'Il s’inspire des opéras de Wagner.'],
 ['Orchestre','Quel orchestre joue la musique de Star Wars (1977) ?',['Le London Symphony Orchestra','L’Orchestre de Paris','Un groupe de rock'],'Selon Wikipédia.'],
 ['Transformation','Que devient le thème de Kong à sa mort ?',['Il revient sous une forme sentimentale','Il disparaît','Il devient une chanson de rap'],'Transformation du thème : une technique courante du leitmotiv.']]);

var F_G1=FD('f-gu1','Guitare : le manche et l’accordage'), F_G2=FD('f-gu2','Guitare : les micros'), F_G3=FD('f-gu3','Guitare : saturation');
TL('g11','Cordes, frettes et accordage',F_G1,[
 ['Six cordes, une accordée standard','Selon Britannica, l’accordage standard de la guitare à six cordes est <b>E–A–D–G–B–E′</b> (Mi–La–Ré–Sol–Si–Mi). Sur ta guitare, chaque case ajoute un demi-ton : c’est la distance mesurée dans l’unité Tons et demi-tons.'],
 ['Des frettes pour les notes','Britannica précise que les frettes en boyau attachées des premières guitares ont été remplacées au XVIIIᵉ siècle par des frettes d’ivoire ou de métal fixées dans le manche. La guitare classique est montée avec trois cordes en boyau et trois cordes métalliques (le boyau a ensuite été remplacé par du nylon).']],[
 ['Accordage','Quel est l’accordage standard de la guitare à six cordes (Britannica) ?',['E–A–D–G–B–E','C–G–D–A–E–B','D–A–D–G–B–E'],'Britannica : « E–A–D–G–B–E′ ».'],
 ['Frettes','Au XVIIIᵉ siècle, les frettes attachées en boyau ont été remplacées par…',['Des frettes d’ivoire ou de métal fixées','Des frettes en plastique moulé','Des frettes en bois'],'Britannica.'],
 ['Case','Combien de demi-tons ajoute une case de plus sur le manche ?',['Un','Un ton entier','Une octave'],'Une case = un demi-ton.'],
 ['Guitare classique','Comment est montée une guitare classique, selon Britannica ?',['Trois cordes en boyau et trois métalliques','Six cordes en acier','Douze cordes en nylon'],'Le boyau a ensuite été remplacé par du nylon.']]);
TL('g12','Tes accordages',F_G1,[
 ['Half-step down','L’accordage <b>half-step down</b> (Mi♭) baisse chaque corde d’un demi-ton : de la 6ᵉ à la 1ʳᵉ, les cordes sont <b>Mi♭, La♭, Ré♭, Sol♭, Si♭, Mi♭</b> (source : StringsDirect). L’article cite parmi ses raisons des cordes plus grosses avec une tension réduite, ce qui rend les bends plus faciles.'],
 ['Drop D','En <b>drop D</b>, seule la 6ᵉ corde change : elle descend d’un ton pour passer de Mi à Ré (source : Fender, voir fiche). Les trois cordes graves Ré–La–Ré forment alors une quinte puis une quarte, ce qui permet les power chords d’un seul doigt.']],[
 ['Mi♭','Quelle est la 6ᵉ corde en half-step down ?',['Mi♭','Ré','Mi'],'Chaque corde baisse d’un demi-ton : Mi devient Mi♭.'],
 ['Tension','Pourquoi certains guitaristes accordent-ils en Mi♭, selon StringsDirect ?',['Pour utiliser des cordes plus grosses avec une tension réduite','Pour jouer plus aigu','Pour supprimer le bruit'],'Les bends sont plus faciles.'],
 ['Drop D','En drop D, quelle corde est modifiée ?',['La 6ᵉ, de Mi à Ré','La 1ʳᵉ, de Mi à Ré','Les six cordes'],'Seule la corde grave change.'],
 ['Power chord','Pourquoi le drop D facilite-t-il les power chords ?',['Les trois cordes graves se barrent d’un seul doigt','Il supprime la quinte','Il rend les cordes plus fines'],'Ré–La–Ré : quinte puis quarte, à la même case.']]);
TL('g21','Comment fonctionne un micro',F_G2,[
 ['Aimant, bobine, vibration','Selon StewMac, un micro est un transducteur qui transforme un mouvement en électricité. Un aimant crée un champ magnétique stable autour des cordes. Quand une corde vibre, elle <b>perturbe ce champ</b> ; la bobine transforme cette variation en petite tension, qui part vers l’ampli.'],
 ['Cordes magnétiques','Les cordes doivent être ferromagnétiques : acier ou nickel-acier. Pour une corde bronze d’acoustique, le micro ne « lit » que l’âme en acier.']],[
 ['Rôle','Que fait un micro magnétique ?',['Il transforme le mouvement des cordes en signal électrique','Il amplifie le son sans électricité','Il accorde la guitare'],'StewMac : transducteur.'],
 ['Champ','Que fait une corde qui vibre dans le champ magnétique ?',['Elle perturbe ce champ','Elle l’éteint','Elle le double'],'La variation est convertie en tension par la bobine.'],
 ['Cordes','Quelles cordes sont lues par un micro magnétique ?',['Ferromagnétiques : acier ou nickel-acier','Uniquement le nylon','Toutes, sans exception'],'Le nylon n’a pas de réponse magnétique.'],
 ['Chaîne','Où va le signal du micro ?',['Vers l’ampli','Vers l’accordeur seul','Vers le chevalet'],'Vers l’ampli.']]);
TL('g22','Single-coil et humbucker',F_G2,[
 ['Single-coil','Un single-coil utilise <b>une bobine</b>. Selon StewMac, il a un son clair et brillant avec une attaque rapide, mais il est sujet aux interférences, notamment le <b>bourdonnement à 60 Hz</b> des lumières et appareils électroniques. Fender le décrit comme plus clair, avec plus d’aigus.'],
 ['Humbucker','Un humbucker réunit <b>deux bobines</b> montées en opposition (polarité magnétique et bobinage inversés). Cela annule le bourdonnement tout en gardant le signal des cordes. Le son est plus épais, plus chaud et de plus fort niveau. Ta Stratocaster en a trois à une bobine : voir l’unité suivante.']],[
 ['Bobines','Combien de bobines a un humbucker ?',['Deux','Une','Trois'],'Deux bobines en opposition.'],
 ['Hum','Quel est l’avantage d’un humbucker ?',['Il annule le bourdonnement','Il supprime les aigus','Il fonctionne sans cordes métalliques'],'D’où son nom.'],
 ['Son','Comment le son d’un single-coil est-il décrit ?',['Clair et brillant','Épais et sombre','Muet'],'Plus d’aigus.'],
 ['Défaut','Quel défaut courant du single-coil est cité ?',['Il capte le bourdonnement','Il ne capte pas les cordes graves','Il coûte toujours plus cher'],'Bourdonnement à 60 Hz selon StewMac.']]);
TL('g31','Ta Stratocaster',F_G2,[
 ['Une guitare de 1954','Britannica attribue la Stratocaster à l’inventeur et fabricant américain <b>Leo Fender</b> et la date de <b>1954</b>. Elle est reconnaissable à son « élégant » design et à ses deux cornes. Elle est associée à des musiciens comme Eric Clapton et Bob Dylan, d’après l’article.'],
 ['Pourquoi c’est utile à savoir','Savoir comment ton instrument est conçu t’aide à comprendre son son : le nombre de bobines de tes micros (une ou deux) influe sur le son, comme vu dans la leçon précédente. Les caractéristiques exactes de ta guitare dépendent du modèle : vérifie la fiche technique du fabricant.']],[
 ['Inventeur','Qui a créé la Stratocaster ?',['Leo Fender','Les Paul','Jimi Hendrix'],'Britannica.'],
 ['Année','En quelle année ?',['1954','1928','1985'],'Britannica : 1954.'],
 ['Corps','Quel signe distinctif Britannica cite-t-il pour le corps ?',['Les deux cornes','Un trou rond central','Un corps creux'],'Les deux cornes.'],
 ['Fiche','Où vérifier le détail de ta propre guitare ?',['Dans la fiche technique du fabricant','Sur une partition','Dans le chiffrage de mesure'],'Les modèles varient.']]);
TL('g41','Overdrive, distorsion et fuzz',F_G3,[
 ['Trois mots, trois effets','Selon MasterClass : l’<b>overdrive</b> est le son d’un ampli à lampes poussé à sa limite ; la <b>distorsion</b> est l’effet qui rend le signal plus rugueux (plus épais, plus de sustain, plus d’harmoniques) ; le <b>fuzz</b> est une distorsion où les harmoniques dominent.'],
 ['Le point commun','Les trois créent leur son par <b>écrêtage</b> (clipping) du signal, qui ajoute de la saturation harmonique. Les pédales de distorsion sont en général plus agressives que celles d’overdrive.']],[
 ['Overdrive','Que désigne l’overdrive, selon MasterClass ?',['Un ampli à lampes poussé à sa limite','Un écho','Une réverbération'],'Définition citée.'],
 ['Fuzz','Dans le fuzz, quoi domine ?',['Les harmoniques','Les graves purs','Le silence'],'Fuzz : distorsion où les harmoniques dominent.'],
 ['Écrêtage','Comment les trois effets créent-ils leur son ?',['Par écrêtage du signal','Par un filtre passe-haut','Par un changement d’accordage'],'Audio clipping.'],
 ['Agressivité','Lesquelles sont en général plus dures ?',['Les pédales de distorsion','Les pédales d’overdrive','Aucune différence'],'Distortion pedals are generally harsher.']]);
A('gc1','Atelier : ton accord',[CI(F_G1,'Ton accord','Choisis toi-même les cases pour former un accord sur ton accordage.'),FRETB('Accord sur ton accordage',F_G1,gFret),FRETB('Un autre accord',F_G1,gFret)]);
A('gc2','Atelier : ton choix de micro',[CI(F_G2,'Ton choix de micro','Applique ce que disent les sources : bobine, bourdonnement, caractère.'),
 CH('Le son clair et brillant',F_G2,'Tu veux un son <b>clair et plus riche en aigus</b>, en acceptant un peu de bourdonnement. Quel micro ?',['Single-coil','Humbucker'],[0],'Voir la fiche.'),
 CH('Éliminer le bourdonnement',F_G2,'Tu veux <b>annuler le bourdonnement</b> avec un son plus épais. Quel micro ?',['Single-coil','Humbucker'],[1],'Deux bobines en opposition.'),
 CH('Les bons faits',F_G2,'Coche les affirmations <b>vraies</b> d’après les sources :',['Un humbucker a deux bobines','Un single-coil annule le bourdonnement','Les cordes en nylon sont lues par un micro magnétique','Un micro magnétique lit des cordes en acier ou nickel-acier'],[0,3],'Revois les leçons.',true)]);
A('gc3','Atelier : ton riff saturé',[CI(F_G3,'Ton riff saturé','Compose un petit riff de power chords en drop D ou de notes, comme avec une saturation.'),FRETB('Power chord en drop D',F_G3,gPower),NOTESB('Un riff court',F_G3,gPent({min:4,max:6,ends:true,brief:'Compose un riff de <b>4 à 6 notes</b> dans la <b>pentatonique mineure de %R</b>.'}))]);

FXT+='<h2 id="t-guitare">Onglet Guitare</h2>'+
'<h3 id="f-gu1">Le manche et l’accordage</h3><p>Accordage standard et frettes : Britannica. Half-step down : StringsDirect. Drop D : Fender (article déjà cité dans la fiche Capodastre).</p>'+SRC([['https://www.britannica.com/art/guitar','Britannica : guitar'],['https://www.stringsdirect.co.uk/blogs/blog/getting-started-with-eb-tuning','StringsDirect : getting started with Eb tuning'],['https://www.fender.com/articles/play/alternate-tuning-drop-d','Fender : accordage drop D']])+
'<h3 id="f-gu2">Les micros</h3><p>Fonctionnement : StewMac. Single-coil et humbucker : StewMac et Fender. Stratocaster : Britannica.</p>'+SRC([['https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics-and-wiring/understanding-guitar-wiring-part-1-how-a-magnetic-pickup-works/','StewMac : how a magnetic pickup works'],['https://www.fender.com/articles/play/electric-guitar-pickup-types-how-to-choose-your-pickup','Fender : electric guitar pickup types'],['https://www.britannica.com/art/Fender-Stratocaster','Britannica : Fender Stratocaster']])+
'<h3 id="f-gu3">Saturation</h3><p>Définitions d’overdrive, distorsion et fuzz : MasterClass.</p>'+SRC([['https://www.masterclass.com/articles/guitar-101-what-is-the-difference-between-overdrive-distortion-and-fuzz','MasterClass : overdrive, distortion et fuzz']]);

/* ---------- FL STUDIO ---------- */
var F_FL1=FD('f-fl1','FL Studio : prise en main'), F_FL2=FD('f-fl2','FL Studio : Channel Rack et mixeur'), F_FL3=FD('f-fl3','FL Studio : organiser un projet');
TL('fl11','Les quatre fenêtres',F_FL1,[
 ['Qui fait quoi','D’après le manuel d’Image-Line : le <b>Channel Rack</b> contient les instruments (plugins) qui créent le son ; le <b>Piano roll</b> édite les notes d’un instrument ; la <b>Playlist</b> « séquence tous les éléments du projet » pour faire la chanson ; le <b>Mixer</b> règle les niveaux et ajoute les effets.'],
 ['Les patterns','Un <b>pattern</b> est un groupe de notes que tu sélectionnes et modifies. Le manuel indique que 999 patterns uniques peuvent être créés. Chaque Channel envoie son audio vers une piste du Mixer.']],[
 ['Channel Rack','Que contient le Channel Rack ?',['Les instruments qui créent le son','Les effets de mastering','La partition imprimée'],'Manuel Image-Line.'],
 ['Piano roll','À quoi sert le Piano roll ?',['À éditer les notes d’un instrument','À mixer les niveaux','À exporter en MP3'],'Il contient les notes de l’instrument associé.'],
 ['Playlist','Que fait la Playlist ?',['Elle séquence les éléments du projet pour faire la chanson','Elle crée les sons','Elle accorde la guitare'],'Playlist = arrangement.'],
 ['Patterns','Combien de patterns uniques peut-on créer, selon le manuel ?',['999','16','12'],'999 unique patterns.']]);
TL('fl12','Step sequencer et mixeur',F_FL2,[
 ['Le séquenceur en 16 pas','Le Step Sequencer est un séquenceur à grille pour les boucles de batterie et les mélodies simples. Chaque pas représente une <b>double croche</b> ; par défaut, 4 temps × 4 mesures = <b>16 pas</b>. Clic gauche pour activer un pas, clic droit pour le désactiver. Maximum : 512 pas.'],
 ['Vers le mixeur','L’audio de chaque Channel est envoyé vers une piste du Mixer pour les effets et les niveaux. Par défaut, les nouveaux instruments sont routés vers la piste <b>Master</b>. C’est le même séquenceur à 16 pas que celui de l’unité Rythme.']],[
 ['Pas','Que représente un pas du séquenceur ?',['Une double croche','Une ronde','Un triolet'],'Each step is a 16th note.'],
 ['Défaut','Combien de pas par défaut ?',['16','8','32'],'4 temps × 4 mesures.'],
 ['Routage','Où sont routés par défaut les nouveaux instruments ?',['Vers la piste Master','Vers la Playlist','Vers le Piano roll'],'Master Mixer track.'],
 ['Maximum','Quel est le nombre maximum de pas ?',['512','64','16'],'Manuel.']]);
TL('fl21','Garder un projet lisible',F_FL3,[
 ['Couleurs et regroupements','D’après MusicTech, de petits repères visuels comme la <b>couleur</b> et le <b>regroupement</b> sont essentiels pour garder la main sur ses créations. On range les pistes par catégories et on garde l’automation avec les pistes qu’elle affecte.'],
 ['Une méthode simple','Une façon de procéder (méthode, pas une règle officielle) : nommer chaque instrument, colorer ensemble les éléments d’une même famille (batterie, basse, voix…), et envoyer chaque Channel vers sa propre piste de Mixer plutôt que tout sur Master.']],[
 ['Repères','Quels repères visuels MusicTech cite-t-il ?',['La couleur et le regroupement','Le chiffrage de mesure','Les accords'],'Colouring and grouping.'],
 ['Automation','Où garder les clips d’automation ?',['Avec les pistes qu’ils affectent','Dans un dossier à part, sans lien','Sur la piste Master seulement'],'Automation grouped with the tracks.'],
 ['Catégories','Comment ranger les pistes ?',['Par catégories','Dans l’ordre alphabétique des artistes','Au hasard'],'Categorise tracks.'],
 ['Routage','Pourquoi router chaque Channel vers sa piste ?',['Pour régler niveaux et effets séparément','Pour réduire le tempo','Pour ouvrir le Piano roll'],'Le mixeur sert aux effets et niveaux.']]);
A('flc1','Atelier : ton beat 16 pas',[CI(F_FL2,'Ton beat 16 pas','Comme dans le Step Sequencer : 16 pas, une double croche chacun.'),BEATB('Beat en 16 pas',F_FL2,{vars:[{brief:'Compose un beat sur <b>16 pas</b> (une double croche par pas).',cons:[{t:'Grosse caisse sur le pas 1',f:function(s){return s[0][0]}},{t:'Caisse claire sur les pas 5 et 13',f:function(s){return hasAll(s[1],[4,12])}},{t:'Au moins 4 frappes de charley',f:function(s){return cnt(s[2])>=4}}],hint:'Le pas 1 est le premier temps, le pas 5 le deuxième, le pas 13 le quatrième.',example:[[0,8],[4,12],[0,2,4,6,8,10,12,14]],exampleText:'grosse caisse 1 et 9, claire 5 et 13, charley sur un pas sur deux.'}]})]);
A('flc2','Atelier : organise ton projet',[CI(F_FL3,'Organise ton projet','Choisis les bons réflexes d’organisation d’après la fiche.'),
 CH('Les bons repères',F_FL3,'Coche ce que MusicTech cite pour <b>rester organisé</b> :',['Colorer','Regrouper','Supprimer les couleurs','Mélanger toutes les pistes'],[0,1],'Couleur et regroupement.',true),
 CH('Le routage',F_FL1,'Où l’audio de chaque Channel est-il envoyé ?',['Vers une piste du Mixer','Vers le Piano roll','Vers la partition'],[0],'Voir la fiche.')]);
regTab('fl-studio',{label:'FL Studio',h:'FL Studio',fiche:'t-fl',intro:'Tu enregistres et tu crées des sons. On passe en revue les fenêtres principales, le séquenceur et l’organisation d’un projet, d’après le manuel officiel.',
  units:[
   {id:'fu1',title:'Prise en main',desc:'Channel Rack, Piano roll, Playlist, Mixer.',glyph:'▦',lessons:['fl11','fl12'],create:['flc1']},
