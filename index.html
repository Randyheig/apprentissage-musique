TL('h51','Chant, notation et polyphonie',F_A1,[
 ['Le chant et son écriture','Selon un manuel de l’université du Wisconsin, le Moyen Âge court de <b>450 à 1450</b>. Le chant chrétien est <b>monophonique</b>, chanté a cappella ; sa codification date du IVe au IXe siècle. Britannica ajoute que l’évêque Ambroise, au IVe siècle à Milan, fut le premier à tenter de codifier le répertoire de chants. Dès <b>vers 800</b>, la musique occidentale est notée dans un système encore déchiffrable. Au XIe siècle, <b>Guido d’Arezzo</b> affine la notation et met au point le solfège.'],
 ['La polyphonie','La <b>polyphonie</b> (deux lignes mélodiques indépendantes ou plus) se développe au XIIIe siècle. L’<b>organum</b>, polyphonie liturgique, apparaît à Paris à la fin du XIIe et au XIIIe siècle : à deux voix au début, puis trois et quatre. Les cadences se résolvent sur des intervalles « parfaits » (quartes, quintes, octaves). La cathédrale Notre-Dame de Paris est construite vers 1163–1240 ; le manuel relie la complexité croissante de la musique à celle de l’architecture gothique.']],[
 ['Dates','Quelle période couvre le Moyen Âge dans cette source ?',['450 à 1450','1600 à 1750','1750 à 1820'],'Manuel du Wisconsin.'],
 ['Chant','Le chant chrétien du Moyen Âge est…',['Monophonique et a cappella','À quatre voix avec orchestre','Électronique'],'Manuel du Wisconsin.'],
 ['Guido','Qui affine la notation et met au point le solfège au XIe siècle ?',['Guido d’Arezzo','Bach','Chopin'],'Manuel du Wisconsin.'],
 ['Organum','Que désigne l’organum ?',['Une polyphonie liturgique née à Paris','Un instrument électrique','Une danse'],'Manuel du Wisconsin.']]);
TL('h52','Machaut et la musique profane',F_A1,[
 ['Guillaume de Machaut','<b>Guillaume de Machaut</b> (vers 1300–1377) est le poète et compositeur le plus important de son siècle en France. Sa <i>Messe de Nostre Dame</i> (vers 1364) est l’une des premières à mettre en musique d’un seul tenant les cinq mouvements de l’ordinaire de la messe. Son Agnus Dei emploie quatre voix, une mesure ternaire et des intervalles parfaits. Le rythme est affiné au XIVe siècle.'],
 ['Chants de cour','La musique profane existe aussi : des poètes-compositeurs de cour écrivent sur l’amour courtois, la Vierge Marie ou l’actualité. Les <i>Cantigas de Santa Maria</i> (vers 1275), commandées par le roi Alphonse le Sage, comptent plus de <b>400 chants</b>. Ces chants sont souvent dansants et parfois accompagnés d’instruments. Hildegard de Bingen (1098–1179) appartient à cette période. La peste noire (1346–1353) la traverse aussi.']],[
 ['Messe','Qu’a de particulier la <i>Messe de Nostre Dame</i> de Machaut ?',['Elle met en musique d’un seul tenant les cinq mouvements de l’ordinaire','Elle est jouée à la guitare électrique','Elle n’a qu’une note'],'Manuel du Wisconsin.'],
 ['Cantigas','Combien de chants contiennent les <i>Cantigas de Santa Maria</i> ?',['Plus de 400','12','Environ 20'],'Manuel du Wisconsin.'],
 ['Hildegard','Quelles sont les dates de Hildegard de Bingen ?',['1098–1179','1305–1377','1685–1750'],'Manuel du Wisconsin.']]);
TL('h61','Le baroque (vers 1600–1750)',F_A2,[
 ['Un nouveau langage','Selon Wikipédia, le baroque couvre à peu près <b>1600–1750</b>. Il s’organise autour d’une <b>tonalité</b> (une tonique de référence), alors que la Renaissance reposait sur la modalité. La <b>basse continue</b> : un groupe grave (viole, violoncelle, contrebasse) joue la ligne de basse, et un clavier ou un luth improvise les accords à partir d’une <b>basse chiffrée</b>. Les chanteurs et instrumentistes improvisent de nombreux ornements (trilles, mordants). Le mot « baroque » est appliqué à la musique pour la première fois en 1734, de façon critique.'],
 ['Genres et noms','Naissent ou s’installent : l’<b>opéra</b> (<i>Dafne</i> et <i>L’Euridice</i> de Jacopo Peri), l’<b>oratorio</b> et la <b>cantate</b> (années 1630), le <b>concerto</b> (concerto grosso, développé par Corelli), la <b>sonate</b> et la <b>suite de danses</b> (allemande, courante, sarabande, gigue). Noms : Monteverdi (<i>L’Orfeo</i>), Lully (compositeur de cour de Louis XIV), Corelli, Vivaldi, Bach et Haendel. Les grandes formations à cordes de l’opera seria ont contribué à créer l’orchestre moderne. Le clavecin est le clavier domestique principal, plus tard remplacé par le piano-forte, perfectionné par Cristofori vers 1700.']],[
 ['Dates','Quelles années couvre le baroque ?',['Vers 1600–1750','Vers 800–1400','Vers 1900–2000'],'Wikipédia.'],
 ['Basse continue','Dans la basse continue, que fait le clavier ou le luth ?',['Il improvise des accords à partir d’une basse chiffrée','Il joue seulement la mélodie','Il se tait'],'Wikipédia.'],
 ['Opéra','Quelles œuvres marquent le début de l’opéra ?',['<i>Dafne</i> et <i>L’Euridice</i> de Peri','Les Quatre Saisons','La Messe de Nostre Dame'],'Wikipédia.'],
 ['Suite','Quelles danses compose la suite typique ?',['Allemande, courante, sarabande, gigue','Valse, polka, mazurka','Rock, funk, disco'],'Wikipédia.'],
 ['Tonalité','Autour de quoi les compositeurs baroques organisent-ils la musique ?',['D’une tonalité (tonique de référence)','Du hasard','D’un seul mode'],'Wikipédia.']]);
TL('h71','L’époque classique (vers 1750–1820)',F_A3,[
 ['Clarté et équilibre','Selon un cours en ligne (Lumen), l’époque classique va d’environ <b>1750 à 1820</b>. Idéal : clarté, ordre, simplicité. Vienne est au centre : Mozart, Haydn, Salieri et Beethoven y travaillent. La texture devient <b>homophonique</b> (une mélodie sur un accompagnement d’accords), au lieu de la polyphonie baroque. Mélodies plus courtes, phrases claires, cadences marquées, sections équilibrées ; plus de contrastes de tonalités, d’ambiances et de timbres. Nouvelles indications : crescendo, diminuendo, sforzando.'],
 ['Genres et orchestre','Genres principaux : la <b>symphonie</b> (créditée à Haydn), le <b>quatuor à cordes</b>, la <b>sonate</b> (la <b>forme sonate</b> devient la structure majeure, surtout pour les premiers mouvements), le <b>concerto</b> (du concerto grosso vers le concerto soliste). Le piano (fortepiano) remplace le clavecin comme clavier soliste ; les orchestres grossissent et les bois forment une section à part entière. La noblesse est la principale mécène de la musique instrumentale ; il faut de la musique nouvelle en permanence, souvent jouable après une seule répétition.']],[
 ['Dates','Quelle période couvre l’époque classique ?',['Vers 1750–1820','Vers 1600–1750','Vers 1850–1900'],'Cours Lumen.'],
 ['Texture','Quelle texture domine ?',['Homophonique','Seulement polyphonique','Aucune'],'Cours Lumen.'],
 ['Ville','Quelle ville est au centre de cette époque ?',['Vienne','New York','Los Angeles'],'Cours Lumen.'],
 ['Forme','Quelle structure devient la plus importante ?',['La forme sonate','Le blues de 12 mesures','Le sample'],'Cours Lumen.'],
 ['Clavier','Quel clavier remplace le clavecin ?',['Le piano (fortepiano)','L’orgue seulement','Le synthé'],'Cours Lumen.']]);
TL('h81','Le romantisme',F_A4,[
 ['Individualité et émotion','Selon Britannica, le romantisme musical met en avant l’<b>originalité</b>, l’<b>individualité</b> et l’<b>expression personnelle</b> des émotions. Il laisse une grande liberté de forme et s’inspire de poèmes, de légendes et de contes populaires. Beethoven et Schubert font le pont : ils emploient surtout des techniques classiques mais leur sentiment personnel inspirera les romantiques. Les romantiques élargissent l’harmonie à toute l’échelle <b>chromatique</b>.'],
 ['Noms, formes, nations','Début : Berlioz, Chopin, Mendelssohn, Liszt. Milieu : Dvořák, Grieg, Tchaikovsky. Fin : Mahler, Richard Strauss, Elgar, Sibelius. La <b>musique à programme</b> lie musique et texte. Nouvelles formes : lied, nocturne, intermezzo, caprice, prélude, mazurka. Le <b>nationalisme</b> pousse des compositeurs (Dvořák, Smetana, russes, français, scandinaves) à exprimer l’identité nationale. Opéra : Weber lance l’opéra romantique allemand et Wagner l’amène à son sommet ; en Italie, Verdi le porte à son apogée.']],[
 ['Valeurs','Quelles valeurs le romantisme met-il en avant ?',['Originalité, individualité, expression personnelle','Ordre et simplicité absolus','Impersonnalité'],'Britannica.'],
 ['Pont','Quels compositeurs font le pont entre classique et romantique ?',['Beethoven et Schubert','Lully et Corelli','Kraftwerk et Moog'],'Britannica.'],
 ['Programme','Que lie la musique à programme ?',['La musique et un texte ou un récit','Deux tempos','Deux guitares'],'Britannica.'],
 ['Forme','Laquelle est une forme romantique citée ?',['Le nocturne','Le concerto grosso','L’organum'],'Britannica.'],
 ['Opéra','Qui amène l’opéra romantique allemand à son sommet ?',['Wagner','Peri','Haydn'],'Britannica.']]);
TL('h91','La musique savante du XXe siècle',F_A5,[
 ['Impressionnisme et rupture','Selon un cours Lumen : <b>Debussy</b> mène l’impressionnisme en France (il n’aimait pas l’étiquette) ; Ravel y est souvent associé. Dans les années 1900, des compositeurs <b>rompent avec la tonalité</b>. <b>Schoenberg</b>, à Vienne, développe l’atonalité puis la technique <b>dodécaphonique</b> ; Berg et Webern sont ses disciples, Boulez prolonge la méthode. Après la Première Guerre mondiale, le <b>néoclassicisme</b> (Stravinsky, Prokofiev, Ravel, Hindemith) reprend des formes anciennes. <i>Le Sacre du printemps</i> de Stravinsky est cité comme exemple de primitivisme.'],
 ['Expériences et jazz','La <b>musique concrète</b> naît dans les années 1940–1950 avec Pierre Schaeffer. Dès le début des années 1950, <b>John Cage</b> introduit le hasard (il invente l’expression « musique expérimentale »). Stockhausen et Steve Reich explorent la « musique de processus » (<i>Clapping Music</i>). Gershwin, Bernstein et Milhaud (<i>La création du monde</i>) montrent l’influence du jazz ; Ives et Carpenter contribuent à un style classique américain.']],[
 ['Impressionnisme','Qui mène l’impressionnisme en France ?',['Debussy','Schoenberg','Cage'],'Cours Lumen.'],
 ['Dodécaphonisme','Qui développe l’atonalité puis la technique dodécaphonique ?',['Schoenberg','Mozart','Lully'],'Cours Lumen.'],
 ['Concrète','Qui dirige la musique concrète ?',['Pierre Schaeffer','Wagner','Vivaldi'],'Cours Lumen.'],
 ['Hasard','Qui introduit le hasard dans sa musique dès les années 1950 ?',['John Cage','Haydn','Chopin'],'Cours Lumen.'],
 ['Jazz','Quelle œuvre de Milhaud montre l’influence du jazz ?',['<i>La création du monde</i>','<i>Le Sacre du printemps</i>','<i>L’Orfeo</i>'],'Cours Lumen.']]);
TL('h101','Des compositrices écartées du canon',F_A6,[
 ['Pourquoi si peu connues','Selon l’Open University, le <b>canon classique</b> s’est formé au XIXe siècle, quand les femmes avaient peu de droits et de vie publique : elles en ont été exclues, même si elles composaient. Le canon s’est transmis par les concerts, les livres d’histoire et l’enseignement, si bien que beaucoup d’auditeurs n’ont jamais entendu leurs œuvres. Obstacles cités : pression familiale (Fanny Hensel), opposition d’un père (le père de Clara Schumann s’opposa à son mariage et le couple dut aller au tribunal), mari qui limite les concerts (Amy Beach : un récital par an), critiques sexistes (Chaminade jugée trop « virile »). Les femmes n’ont pu concourir au Prix de Rome qu’à partir de 1903.'],
 ['Quelques parcours','<b>Fanny Hensel</b> (1805–1847) : près de 500 œuvres. <b>Clara Schumann</b> (1819–1896) : pianiste et compositrice, huit enfants. <b>Louise Farrenc</b> (1804–1875) : trois symphonies, professeure de piano au Conservatoire de Paris en 1842, elle se bat pour l’égalité de salaire. <b>Ethel Smyth</b> (1858–1944) : six opéras, suffragiste. <b>Amy Beach</b> (1867–1944) : débute avec le Boston Symphony Orchestra en 1883, à 15 ans. <b>Lili Boulanger</b> (1893–1918) : première femme à gagner le Prix de Rome, en 1913.']],[
 ['Canon','Quand s’est formé le canon classique ?',['Au XIXe siècle','Au Moyen Âge','Dans les années 1990'],'Open University.'],
 ['Prix de Rome','Depuis quand les femmes peuvent-elles concourir au Prix de Rome ?',['1903','1750','1990'],'Open University.'],
 ['Boulanger','Qui est la première femme à gagner le Prix de Rome (1913) ?',['Lili Boulanger','Fanny Hensel','Clara Schumann'],'Open University.'],
 ['Farrenc','Pour quoi Louise Farrenc s’est-elle battue ?',['L’égalité de salaire','La création du jazz','La guitare électrique'],'Open University.'],
 ['Hensel','Combien d’œuvres Fanny Hensel a-t-elle composées environ ?',['Près de 500','12','Environ 3'],'Open University.']]);
TL('h111','Enregistrer le son : de l’Edison au MP3',F_A7,[
 ['Les premiers supports','Selon <i>Classical Music</i> : <b>1877</b>, Thomas Edison brevète le phonographe, qui grave le son dans un cylindre de papier d’étain avec un stylet (il passera ensuite à la cire). <b>1895</b> : Emile Berliner présente le gramophone : disques estampés sur caoutchouc dur, tournant à environ 70 tours/min ; le shellac remplace vite le caoutchouc. Années <b>1920</b> : l’enregistrement électrique, avec microphone, remplace les méthodes acoustiques.'],
 ['Du microsillon au numérique','<b>1931</b> : Columbia réalise le premier disque longue durée de 33 tours 1/3 (LP) ; RCA Victor commence à utiliser le vinyle. <b>1963</b> : Philips présente la cassette audio compacte. <b>1982</b> : les CD sont lancés commercialement, avec le lecteur CDP-101 de Sony. <b>1997</b> : le Listen Up est annoncé comme premier lecteur MP3 portable.']],[
 ['1877','Qui brevète le phonographe en 1877 ?',['Thomas Edison','Emile Berliner','Philips'],'Classical Music.'],
 ['Gramophone','Qui présente le gramophone en 1895 ?',['Emile Berliner','Thomas Edison','Sony'],'Classical Music.'],
 ['LP','Que lance Columbia en 1931 ?',['Le premier LP à 33⅓ tours','Le CD','Le MP3'],'Classical Music.'],
 ['CD','Quand le CD est-il lancé commercialement ?',['1982','1931','1877'],'Classical Music.'],
 ['Électrique','Que remplace l’enregistrement électrique des années 1920 ?',['Les méthodes acoustiques','Le vinyle','Le piano'],'Classical Music.']]);
TL('h121','Aux racines du jazz',F_A8,[
 ['Un mélange de sources','Selon Britannica, le jazz sort d’une « matrice composite » de sources populaires : <b>chants de champs</b> des plantations de coton, chants de travail (chemins de fer, fleuves, digues), hymnes, <b>spirituals</b>, fanfares, processions funéraires, musique de danse et tradition du <b>banjo</b> (depuis les années 1840). Le <b>blues</b> et le <b>ragtime</b> fleurissent à la fin du XIXe siècle ; le ragtime est devenu la musique populaire de danse des États-Unis vers 1900. Le ragtime était entièrement écrit, surtout pour piano, et joué toujours pareil ; le jazz devient largement instrumental et <b>improvisé</b>. Tous deux utilisent des mélodies syncopées sur un accompagnement régulier à 2/4 ou 4/4.'],
 ['La Nouvelle-Orléans','De 1905 à 1915, beaucoup de musiciens noirs, sans accès au travail classique, jouent du ragtime et embellissent les airs à l’oreille, ce qui mène à l’improvisation. Vers 1910–1915, un style d’ensemble collectif se forme à <b>La Nouvelle-Orléans</b>, chaque instrument ayant un rôle distinct. <b>Jelly Roll Morton</b> est décrit comme le premier grand compositeur de jazz, mêlant blues et ragtime. Le quartier de Storyville, qui employait beaucoup de musiciens, ferme en <b>1917</b> ; ils partent alors vers les bateaux à aubes et Chicago.']],[
 ['Racines','Laquelle est une source du jazz citée par Britannica ?',['Les chants de champs','Le synthétiseur','Le MIDI'],'Britannica.'],
 ['Ragtime','Le ragtime est…',['Entièrement écrit, surtout pour piano','Entièrement improvisé','Joué sans rythme'],'Britannica.'],
 ['Ville','Où se forme le style d’ensemble collectif vers 1910–1915 ?',['La Nouvelle-Orléans','Berlin','Vienne'],'Britannica.'],
 ['Morton','Qui est décrit comme le premier grand compositeur de jazz ?',['Jelly Roll Morton','Debussy','Kraftwerk'],'Britannica.'],
 ['Storyville','Que se passe-t-il à Storyville en 1917 ?',['Le quartier ferme','Il ouvre','Il brûle'],'Britannica.']]);
TL('h131','Rock’n’roll, guitare électrique et ségrégation',F_A9,[
 ['Les racines','Selon EBSCO, le rock’n’roll puise surtout dans les styles afro-américains : <b>rhythm and blues</b>, <b>blues électrique</b>, <b>jump blues</b> ; le hillbilly et le western swing ajoutent des styles de guitare et de chant. <b>Chuck Berry</b> signe chez Chess Records (par Muddy Waters) et place « Maybellene » dans le top 10 en 1955. <b>Elvis Presley</b> enregistre chez Sun Records en 1953, puis son contrat passe à RCA en 1955. <b>Little Richard</b> a son premier tube en 1956 (« Tutti Frutti »). Le DJ Alan Freed passe ces musiques dès 1951 ; le nom « rock and roll » lui est attribué après un procès perdu en 1954.'],
 ['Technique et société','Les guitares électriques à corps plein (Les Paul, Leo Fender) et des amplis plus puissants encouragent un jeu plus fort ; les 45 tours remplacent les 78 tours ; la radio à transistors (1954) rend la musique portable. Côté Fender (site de la marque) : la <b>Broadcaster</b> (1950, devenue Telecaster en 1951), la basse <b>Precision Bass</b> (1951) et la <b>Stratocaster</b> (1954, trois micros et vibrato). La <b>ségrégation</b> sépare le marché : des artistes blancs enregistrent des reprises de morceaux noirs, jugées plus acceptables par le public blanc ; <i>American Bandstand</i> de Dick Clark intègre ses artistes.']],[
 ['Racines','Quel style est une racine du rock’n’roll ?',['Le rhythm and blues','La musique concrète','Le baroque'],'EBSCO.'],
 ['Freed','À qui attribue-t-on le nom « rock and roll » ?',['Alan Freed','Edison','Machaut'],'EBSCO.'],
 ['Strat','Quand la Stratocaster débute-t-elle ?',['1954','1931','1982'],'Fender.'],
 ['Telecaster','Quel était le premier nom de la Telecaster ?',['Broadcaster','Precision','Stratocaster'],'Fender.'],
 ['Ségrégation','Que faisaient souvent les artistes blancs ?',['Des reprises de morceaux d’artistes noirs','Rien','De la musique baroque'],'EBSCO.']]);
TL('h141','Naissance du heavy metal',F_A10,[
 ['Des années 1960 aux années 1970','Selon Britannica, des groupes britanniques du milieu des années 1960 (Cream, Yardbirds, Jeff Beck Group) et Jimi Hendrix développent batterie, basse et guitare distordue plus lourdes que le rock fondé sur le blues. Le mot apparaît dans la chanson « Born to Be Wild » de Steppenwolf (1968). Dans les années 1970, <b>Led Zeppelin, Deep Purple et Black Sabbath</b> codifient le son : gros riffs, power chords distordus, paroles mystiques. Black Sabbath avec <i>Paranoid</i>, Led Zeppelin avec <i>Led Zeppelin II</i>.'],
 ['NWOBHM et thrash','Années 1980 : Def Leppard, Iron Maiden et Saxon mènent la « nouvelle vague du heavy metal britannique ». Metallica, Megadeth, Anthrax et Slayer inventent le <b>thrash</b> : tempos rapides, timbres durs, agressivité, paroles critiques. Le genre se fragmente en sous-genres ; sa cohérence s’effondre vers 1990 et de nombreux fans passent au rap. Caractéristiques : guitare électrique distordue, gros riffs, power chords, solos de guitare et de batterie, virtuosité.']],[
 ['Terme','Quelle chanson de 1968 emploie l’expression « heavy metal » ?',['« Born to Be Wild » de Steppenwolf','« Smells Like Teen Spirit »','« Anarchy in the U.K. »'],'Britannica.'],
 ['Trio','Quels groupes codifient le son dans les années 1970 ?',['Led Zeppelin, Deep Purple, Black Sabbath','Ramones, Clash, Sex Pistols','Mozart, Haydn, Beethoven'],'Britannica.'],
 ['Thrash','Quels groupes sont cités pour le thrash ?',['Metallica, Megadeth, Anthrax, Slayer','Cream, Yardbirds','Kraftwerk'],'Britannica.'],
 ['NWOBHM','Que désigne la NWOBHM ?',['La nouvelle vague du heavy metal britannique','Une danse','Un instrument'],'Britannica.']]);
TL('h151','Histoire de la musique électronique',F_A11,[
 ['Des instruments pionniers','Selon MusicRadar : le Telharmonium de Thaddeus Cahill (fin du XIXe siècle) synthétise déjà du son ; le <b>thérémine</b> apparaît dans les années 1920. Années 1950 : Pierre Schaeffer et la musique concrète. Années 1960 : Don Buchla et <b>Robert Moog</b> développent des synthés modulaires commandés en tension ; <i>Switched-On Bach</i> de Wendy Carlos popularise le Moog. <b>1974</b> : <i>Autobahn</i> de Kraftwerk met en avant synthés, vocodeur et percussions électroniques.'],
 ['Vers la house et la techno','Années 1980 : Roland, Yamaha et Korg commercialisent des synthés moins chers, et le Yamaha DX7 inaugure les synthés numériques. En <b>1983</b>, la Roland TB-303 apparaît ; les TR-808 et TR-909 seront adoptées par les producteurs de dance. Milieu et fin des années 1980 : la <b>house</b> (Chicago), la <b>techno</b> (Detroit) et l’acid house naissent avec du matériel d’occasion bon marché. À partir des années 2000, des synthés logiciels comme Massive et Serum se généralisent.']],[
 ['Moog','Qui développe des synthés modulaires dans les années 1960, avec Buchla ?',['Robert Moog','Edison','Wagner'],'MusicRadar.'],
 ['Kraftwerk','Quel album de Kraftwerk (1974) met en avant synthés et vocodeur ?',['<i>Autobahn</i>','<i>Paranoid</i>','<i>Nuggets</i>'],'MusicRadar.'],
 ['House','Dans quelle ville naît la house ?',['Chicago','Detroit','Vienne'],'MusicRadar.'],
 ['Techno','Dans quelle ville naît la techno ?',['Detroit','Chicago','Paris'],'MusicRadar.'],
 ['TB-303','En quelle année apparaît la Roland TB-303 ?',['1983','1877','1954'],'MusicRadar.']]);

var F_RA=FD('f-ra','Rythme avancé : swing et polyrythmie');
TL('ra11','Le swing',F_RA,[
 ['Croches inégales','Selon Open Music Theory, les croches « swing » sont jouées comme des croches inégales dans un rythme quasi-triolet. La proportion passe de 1:1 à environ <b>2:1</b> : la première croche dure à peu près deux fois la seconde.'],
 ['On l’écrit droit','Les croches swing sont toujours écrites comme des croches droites : l’interprète sait qu’il doit les swinguer. Le rapport exact varie d’un morceau et d’un interprète à l’autre ; les tempos rapides tendent à être plus droits, les tempos lents à swinguer davantage. Le studio de beats plus bas te laisse régler ce rapport à l’oreille.']],[
 ['Proportion','Quelle proportion approximative entre les deux croches swing ?',['2:1','1:1','5:1'],'Open Music Theory : « roughly 2:1 ».'],
 ['Écriture','Comment écrit-on les croches swing ?',['Comme des croches droites','Avec des triolets obligatoires','On ne peut pas les écrire'],'Always written as straight eighth notes.'],
 ['Variation','Le rapport exact de swing…',['Varie selon les morceaux et les interprètes','Est toujours de 2:1 exactement','N’existe pas'],'Varies from piece to piece.'],
 ['Tempo','Les tempos rapides tendent à être…',['Plus droits','Plus swingués','Impossibles'],'Faster tempos tend to be straighter.']]);
TL('ra12','La polyrythmie',F_RA,[
 ['Définition','Selon Britannica, la polyrythmie est « la combinaison simultanée de rythmes contrastés dans une composition ». Les contre-rythmes peuvent apparaître au sein d’une seule mesure. L’exemple donné : deux croches contre un triolet de croches.'],
 ['Où l’entendre','Britannica la dit répandue dans le jazz américain et les phénomènes afro-américains apparentés, y compris le rock, et dans de nombreuses formes non occidentales (le gamelan indonésien est cité). Le lecteur ci-dessous joue <b>3 contre 2</b> : trois frappes régulières contre deux, sur la même durée.']],[
 ['Définition','Qu’est-ce que la polyrythmie ?',['Des rythmes contrastés joués simultanément','Un seul rythme très rapide','Une mesure sans pulsation'],'Britannica.'],
 ['Exemple','Quel exemple Britannica donne-t-il ?',['Deux croches contre un triolet de croches','Une ronde contre une pause','Un solo sans tempo'],'Two eighth notes against triplet eighths.'],
 ['Gamelan','Quelle forme non occidentale est citée ?',['Le gamelan indonésien','La fanfare militaire','Le chant grégorien'],'Britannica.'],
 ['3 contre 2','Dans un 3 contre 2, combien de frappes sur la même durée ?',['Trois d’un côté, deux de l’autre','Cinq de chaque côté','Une seule'],'Trois frappes régulières contre deux.']]);
A('rac1','Atelier : swing et syncope',[CI(F_RA,'Swing et syncope','Compose un beat, puis écoute-le avec du swing dans le studio de beats.'),LESSONS.cr.steps[1],
 CH('Les bons faits sur le swing',F_RA,'Coche les affirmations <b>vraies</b> d’après Open Music Theory :',['Les croches swing s’écrivent droites','Le rapport est environ 2:1','Le rapport est identique pour tous les interprètes','Les tempos lents tendent à swinguer davantage'],[0,1,3],'Voir la fiche.',true)]);

/* ---------- Unités verrouillées jusqu'à la fin de la précédente ---------- */
function unitDone(u){return u.nodes.every(function(n){return S.done[n.id]})}
function lockSeqs(){
  var seqs=[UNITS.slice(), [RUNIT].concat(TABU.rythme2?TABU.rythme2.units:[])];
  Object.keys(TABU).forEach(function(k){if(k!=='rythme2') seqs.push(TABU[k].units)});
  return seqs;
}
function lockedSet(){
  var L={};
  lockSeqs().forEach(function(sq){var ok=true;
    sq.forEach(function(u){
      L[u.id]=!ok;
      var sat=unitDone(u)||(u.mod&&S.placement&&u.mod.n<S.placement.start);
      if(!sat) ok=false;
    });
  });
  return L;
}
function applyLocks(){
  var L=lockedSet();
  Object.keys(L).forEach(function(id){
    if(!L[id]) return;
    var ul=document.getElementById('path-'+id); if(!ul) return;
    var un=ul.closest('.unit'); if(!un) return;
    un.classList.add('locked'); ul.hidden=true;
    var chip=un.querySelector('.uchip[data-u]'); if(chip){chip.disabled=true; chip.setAttribute('aria-expanded','false'); chip.innerHTML='🔒 Verrouillée'}
    var ud=un.querySelector('.ud'); if(ud) ud.insertAdjacentHTML('afterend','<p class="small" style="margin:6px 0 0;color:inherit">Termine l’unité précédente pour la débloquer.</p>');
    ul.querySelectorAll('.node').forEach(function(b){b.disabled=true});
  });
}
(function(){
  var rt=renderTheory, ra=renderAllTabs, sn=startNode;
  renderTheory=function(){rt(); applyLocks()};
  renderAllTabs=function(){ra(); applyLocks()};
  startNode=function(id){
    var L=lockedSet(), bad=false;
    lockSeqs().forEach(function(sq){sq.forEach(function(u){if(L[u.id]&&u.nodes.some(function(n){return n.id===id})) bad=true})});
    if(!bad) sn(id);
  };
})();

var F15=F_EAR;
function earStep(k,pool){
  return {graded:true,fiche:F_EAR,render:function(root,api){
    var d=EAR[k], ans=pick(pool), base=48+Math.floor(Math.random()*10);
    var play=function(){
      if(k==='int'){tone(base,0,1);tone(base+ans,0.9,1.2)}
      else if(k==='ch'){var o=CQ[ans].map(function(x){return base+x}); playChord(o,0,1.6); o.forEach(function(m,i){tone(m,2+i*.35,1)})}
      else{EARC[ans].forEach(function(c,i){playChord(c.map(function(x){return base+x}),i*1.2,1.2)})}
    };
    root.innerHTML='<h2>À l’oreille</h2><p class="lead">Écoute, puis nomme ce que tu entends.</p><p><button type="button" class="btn small" id="ep">▶ Écouter</button></p>';
    root.querySelector('#ep').addEventListener('click',play);
    var uniq=pool.filter(function(x,i,a){return a.indexOf(x)===i&&String(x)!==String(ans)});
    var opts=shuffle([ans].concat(shuffle(uniq).slice(0,3)));
    var box=h('<div class="opts"></div>'); root.append(box); var locked=false;
    opts.forEach(function(x){
      var b=h('<button type="button" class="opt" aria-pressed="false">'+d.nm[x]+'</button>');
      b.addEventListener('click',function(){
        if(locked) return;
        box.querySelectorAll('.opt').forEach(function(c){c.classList.remove('sel'); c.setAttribute('aria-pressed','false')});
        b.classList.add('sel'); b.setAttribute('aria-pressed','true');
        api.select(function(){
          locked=true; b.classList.remove('sel');
          var ok=String(x)===String(ans); b.classList.add(ok?'good':'bad');
          if(!ok) box.querySelectorAll('.opt').forEach(function(c){if(c.textContent===d.nm[ans]) c.classList.add('good')});
          api.done(ok,ok?'':'C’était : '+d.nm[ans]+'.');
        });
      });
      box.append(b);
    });
    setTimeout(function(){try{play()}catch(e){}},250);
  }};
}
function EARL(id,title,k,pool,txt){
  var st=[LEARN(F_EAR,title,'<p class="lead">'+txt+'</p>')];
  for(var i=0;i<6;i++) st.push(earStep(k,pool));
  LESSONS[id]={title:title,min:4,steps:st};
}
